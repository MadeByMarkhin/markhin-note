<script>
(function(){
'use strict';

/* ---------- small utilities ---------- */
function mu_norm(s){ return (typeof normalizeText==='function') ? normalizeText(s) : String(s||'').toLowerCase(); }

function mu_lev(a,b){
    a=a||''; b=b||'';
    if(a===b) return 0;
    const al=a.length, bl=b.length;
    if(!al) return bl;
    if(!bl) return al;
    if(Math.abs(al-bl) > 8) return 99;
    let prev = new Array(bl+1);
    for(let j=0;j<=bl;j++) prev[j]=j;
    for(let i=1;i<=al;i++){
        const cur=[i];
        for(let j=1;j<=bl;j++){
            const cost = a[i-1]===b[j-1] ? 0 : 1;
            cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
        }
        prev=cur;
    }
    return prev[bl];
}

function mu_termScore(hay, term){
    if(!term) return 0;
    if(hay.includes(term)) return term.length>=4 ? 4 : 3;
    const words = hay.split(/\s+/);
    let best = 0;
    for(const w of words){
        if(!w) continue;
        if(w.length>=3 && (w.startsWith(term) || term.startsWith(w))){ best=Math.max(best,2); continue; }
        const tol = term.length<=4 ? 1 : (term.length<=7 ? 2 : 3);
        const dist = mu_lev(w, term);
        if(dist<=tol) best = Math.max(best, 2 - dist*0.4);
    }
    return best;
}

function mu_fieldScore(text, terms, weight){
    const hay = mu_norm(text||'');
    if(!hay) return 0;
    let s=0;
    terms.forEach(term=>{ s += mu_termScore(hay, term); });
    return s*weight;
}

function mu_parseQuery(raw){
    const tokens = String(raw||'').trim().split(/\s+/).filter(Boolean);
    const filters=[]; const textTerms=[];
    tokens.forEach(tok=>{
        let m;
        if((m=tok.match(/^tag:(.+)$/i))) filters.push({type:'tag', val:mu_norm(m[1])});
        else if((m=tok.match(/^folder:(.+)$/i))) filters.push({type:'folder', val:mu_norm(m[1])});
        else if((m=tok.match(/^is:(pinned|favorite|fav|locked)$/i))) filters.push({type:'is', val:(m[1].toLowerCase()==='fav'?'favorite':m[1].toLowerCase())});
        else textTerms.push(mu_norm(tok));
    });
    return {filters, textTerms};
}

function mu_matchesFilters(item, filters){
    return filters.every(f=>{
        if(f.type==='tag') return (item.tags||[]).some(t=>mu_norm(t).includes(f.val));
        if(f.type==='folder') return mu_norm(item.folder||'').includes(f.val);
        if(f.type==='is'){
            if(f.val==='pinned') return !!item.pinned;
            if(f.val==='favorite') return !!item.favorite;
            if(f.val==='locked') return !!isNoteLocked(item);
        }
        return true;
    });
}

function mu_scoreItem(item, textTerms){
    if(!textTerms.length) return 1;
    let score=0;
    score += mu_fieldScore(item.name, textTerms, 6);
    score += mu_fieldScore((item.tags||[]).join(' '), textTerms, 4);
    score += mu_fieldScore(item.folder, textTerms, 2);
    if(!isNoteLocked(item)) score += mu_fieldScore(item.text||item.html||'', textTerms, 1);
    return score;
}

function mu_buildFuzzyRegexSource(term){
    term = String(term||'').trim(); if(!term) return '';
    const map = { 'ی':'[یيى]','ي':'[یيى]','ى':'[یيى]','ک':'[کك]','ك':'[کك]','ه':'[هة]','ة':'[هة]' };
    let out='';
    for(const ch of term){
        if(/\s/.test(ch)){ out += '\\s+'; continue; }
        const esc = ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        out += map[ch] || esc;
    }
    return out;
}

function mu_highlightInNode(root, terms){
    if(!root || !terms || !terms.length) return null;
    root.querySelectorAll('mark.markhin-hit').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
    const parts = terms.map(mu_buildFuzzyRegexSource).filter(Boolean);
    if(!parts.length) return null;
    let regex;
    try{ regex = new RegExp('('+parts.join('|')+')','gi'); }catch(e){ return null; }
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    let firstMark=null;
    nodes.forEach(node=>{
        const text = node.nodeValue;
        regex.lastIndex=0;
        if(!regex.test(text)) return;
        regex.lastIndex=0;
        const frag = document.createDocumentFragment();
        let last=0, m;
        while((m=regex.exec(text))){
            if(m.index>last) frag.appendChild(document.createTextNode(text.slice(last,m.index)));
            const mark=document.createElement('mark'); mark.className='markhin-hit'; mark.textContent=m[0];
            frag.appendChild(mark);
            if(!firstMark) firstMark=mark;
            last=m.index+m[0].length;
            if(m.index===regex.lastIndex) regex.lastIndex++;
        }
        if(last<text.length) frag.appendChild(document.createTextNode(text.slice(last)));
        node.parentNode.replaceChild(frag,node);
    });
    return firstMark;
}

function mu_highlightPlain(text, terms){
    let safe = escapeHtml(text||'');
    if(!terms || !terms.length) return safe;
    const parts = terms.map(mu_buildFuzzyRegexSource).filter(Boolean);
    if(!parts.length) return safe;
    try{ const re=new RegExp('('+parts.join('|')+')','gi'); safe = safe.replace(re,'<mark class="markhin-hit">$1</mark>'); }catch(e){}
    return safe;
}

function mu_queryTerms(raw){
    return String(raw||'').trim().split(/\s+/).filter(t=>t && !/^(tag|folder|is):/i.test(t)).map(mu_norm);
}

/* ---------- force-open a note (respects password, never toggles closed) ---------- */
window.mu_forceOpenNote = mu_forceOpenNote;
async function mu_forceOpenNote(id){
    const item = categories.find(c=>c.id===id);
    if(!item) return false;
    // Search used to be able to open a Time Capsule note before its unlock
    // time, bypassing the lock entirely. Enforce it here too.
    if(item.unlockAt && Date.now() < Number(item.unlockAt)){
        const left = Math.ceil((Number(item.unlockAt)-Date.now())/60000);
        showToast(currentLang==='fa'?`⏳ این Note هنوز قفل زمانی است. ${left} دقیقه مانده.`:`⏳ Time Capsule locked. ${left} minutes left.`);
        return false;
    }
    if(item.unlockAt && Date.now() >= Number(item.unlockAt)){ item.unlockAt=''; saveToLocalStorage(); }
    if(isNoteLocked(item)){
        const pass = await promptNotePassword(item);
        if(pass===null) return false;
        item.isDecoy = !(await unlockNote(item, pass.trim()));
    } else {
        item.isDecoy = false;
    }
    activeOpenId = id;
    renderApp(id);
    return !item.isDecoy;
}

async function mu_openAndHighlight(id, terms){
    const ok = await mu_forceOpenNote(id);
    if(!ok) return;
    setTimeout(()=>{
        const container = document.getElementById('container-'+id);
        if(container) container.scrollIntoView({behavior:'smooth', block:'start'});
        if(terms && terms.length){
            const textEl = document.getElementById('text-'+id);
            if(textEl){
                const mark = mu_highlightInNode(textEl, terms);
                if(mark) setTimeout(()=>mark.scrollIntoView({behavior:'smooth', block:'center'}), 260);
            }
        }
    }, 90);
}
window.mu_openAndHighlight = mu_openAndHighlight;

/* ---------- FINAL search override: fuzzy ranking + operators ---------- */
window.getVisibleCategories = function(){
    categories.forEach(c=>{ if(!Array.isArray(c.tags)) c.tags=[]; });
    let visible;
    if(currentFolder==='__FAVORITES__') visible = categories.filter(c=>!!c.favorite);
    else visible = (currentFolder===DEFAULT_FOLDER) ? categories.slice() : categories.filter(c=>c.folder===currentFolder || String(c.folder||'').startsWith(currentFolder+'/'));
    if(typeof isArchived==='function') visible = visible.filter(c=>!isArchived(c));

    const raw = (document.getElementById('searchInput')||{}).value || '';
    const {filters, textTerms} = mu_parseQuery(raw);
    if(filters.length) visible = visible.filter(item=>mu_matchesFilters(item, filters));
    if(!textTerms.length){ categories.forEach(c=>{ c.__mScore=0; }); return visible; }

    const scored = visible.map(item=>({item, score: mu_scoreItem(item, textTerms)}));
    scored.forEach(x=>{ x.item.__mScore = x.score; });
    return scored.filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.item);
};

/* ---------- FINAL note-list render: relevance order while searching + delete mode ---------- */
window.MarkhinNoteDeleteMode = false;
window.renderButtons = function(filtered){
    const c = document.getElementById('buttonsContainer'); if(!c) return;
    c.innerHTML = '';
    c.classList.toggle('note-delete-mode', !!window.MarkhinNoteDeleteMode);
    const list = filtered || getVisibleCategories();
    const t = i18n[currentLang];
    if(!list.length){ c.innerHTML = '<div class="no-result-msg">'+t.noResult+'</div>'; return; }

    const rawQuery = (document.getElementById('searchInput')||{}).value || '';
    const searching = !!rawQuery.trim();
    const ordered = searching ? list.slice() : [...list].sort((a,b)=>(Number(b.pinned)-Number(a.pinned))||(Number(b.favorite)-Number(a.favorite))||((Number(a.order)||0)-(Number(b.order)||0)));

    ordered.forEach((item, idx)=>{
        if(!Array.isArray(item.tags)) item.tags=[];
        const wrap = document.createElement('div'); wrap.className='note-btn-wrap'; wrap.dataset.id=item.id;
        const b = document.createElement('button');
        b.className = 'custom-btn '+(activeOpenId===item.id?'active-btn ':'')+(item.pinned?'note-pinned ':'')+(item.favorite?'note-favorite ':'');
        b.setAttribute('aria-expanded', activeOpenId===item.id ? 'true':'false');
        if(window.MarkhinNoteDeleteMode) b.style.animationDelay = '0s';
        b.innerHTML = escapeHtml((isNoteLocked(item)?'🔒 ':'')+(item.pinned?'📌 ':'')+(item.favorite?'⭐ ':'')+(item.fakeContent?'🎭 ':'')+String(item.name||''));
        b.onclick = ()=>{
            if(searching){ mu_openAndHighlight(item.id, mu_queryTerms(rawQuery)); }
            else { handleCategoryClick(item.id); }
        };
        wrap.appendChild(b);
        if(window.MarkhinNoteDeleteMode){
            const x = document.createElement('button');
            x.type='button'; x.className='close-folder-btn note-del-x'; x.textContent='✖';
            x.title = currentLang==='fa' ? 'حذف این یادداشت' : 'Delete this note';
            x.onclick = (e)=>{ e.stopPropagation(); deleteCategory(item.id); };
            wrap.appendChild(x);
        }
        c.appendChild(wrap);
    });
};

/* ---------------------------------------------------------------
   Scroll black-flash fix — companion to the body.mu-scrolling CSS
   rule near the top of the stylesheet. Toggles that class on <body>
   for the duration of any scroll and clears it ~150ms after
   scrolling actually stops, which pauses/un-blurs the heavy themed
   background layers for that window instead of repainting them on
   every scroll frame. A native 'scroll' event fires the same way
   whether the page moved because the person swiped OR because the
   drag-reorder code below called window.scrollBy() during auto-
   scroll, so this one listener covers both cases with no extra
   wiring needed on the drag code's side. rAF-throttled so it's at
   most one class toggle per frame, never per raw scroll event
   (which can fire many times per frame on some devices/browsers).
   --------------------------------------------------------------- */
(function(){
    let scrollEndTimer = null;
    let ticking = false;
    function onScrollFrame(){
        ticking = false;
        document.body.classList.add('mu-scrolling');
        clearTimeout(scrollEndTimer);
        scrollEndTimer = setTimeout(() => { document.body.classList.remove('mu-scrolling'); }, 150);
    }
    window.addEventListener('scroll', function(){
        if(ticking) return;
        ticking = true;
        requestAnimationFrame(onScrollFrame);
    }, {passive:true});
})();

/* ---------------------------------------------------------------
   Rubber-band bounce fix. The overscroll-behavior-y/-x:none rules near the
   top of the stylesheet stops the bounce-and-reveal-html's-background
   flash on browsers that honor overscroll-behavior for the document's
   own root scroller — but Telegram's iOS in-app browser is a WKWebView
   that, on a lot of iOS versions, simply doesn't apply it there (it
   still works fine for scrollable divs, just not the page itself).
   Without that, flinging the page hard enough to hit the top or
   bottom edge still bounces past it for an instant, during which
   what's actually on screen is <html>'s own background (near-black)
   peeking out from behind the page — which reads exactly as "a black
   flash that shows up and cuts off", especially on a fast top-of-page
   fling. This only ever intervenes for a single-finger drag that
   would push scroll position past 0 or past the document's max, and
   it explicitly steps aside for anything with its own genuine inner
   scroll area (modals, the horizontal toolbar rows, etc.) plus the
   note drag-reorder flow (which already drives scrolling deliberately
   via window.scrollBy) — every ordinary scroll, including inside
   those areas, is completely unaffected.
   --------------------------------------------------------------- */
(function(){
    let startY = 0;
    document.addEventListener('touchstart', function(e){
        if(e.touches.length !== 1) return;
        startY = e.touches[0].clientY;
    }, {passive:true});
    document.addEventListener('touchmove', function(e){
        if(e.touches.length !== 1) return;
        if(document.body.classList.contains('markhin-dragging-active')) return;
        let node = e.target;
        while(node && node !== document.body){
            if(node.nodeType === 1){
                const cs = getComputedStyle(node);
                const canScrollY = (cs.overflowY === 'auto' || cs.overflowY === 'scroll') && node.scrollHeight > node.clientHeight;
                const canScrollX = (cs.overflowX === 'auto' || cs.overflowX === 'scroll') && node.scrollWidth > node.clientWidth;
                if(canScrollY || canScrollX) return;
            }
            node = node.parentNode;
        }
        const dy = e.touches[0].clientY - startY;
        const doc = document.documentElement;
        const atTop = window.scrollY <= 0;
        const atBottom = Math.ceil(window.scrollY + window.innerHeight) >= doc.scrollHeight;
        if((atTop && dy > 0) || (atBottom && dy < 0)) e.preventDefault();
    }, {passive:false});
})();

/* ---------------------------------------------------------------
   Reordering notes/folders: holding a finger down on a note or folder
   (instead of the old press-and-hold drag) pops up a small floating
   menu with ◀ ▶ buttons next to it — tap one to move that item one
   spot over. Nothing can be moved by an accidental drag anymore.
   moveNoteOrder() and moveFolderOrder() below do the actual reordering
   and persistence; the long-press-to-open-menu behavior is wired up
   further down, right after these two.
   --------------------------------------------------------------- */
window.moveNoteOrder = function(id, dir){
    const rawQuery = (document.getElementById('searchInput')||{}).value || '';
    if(rawQuery.trim()) return; // ordering only applies to the plain, unfiltered list
    const ordered = [...getVisibleCategories()].sort((a,b)=>(Number(b.pinned)-Number(a.pinned))||(Number(b.favorite)-Number(a.favorite))||((Number(a.order)||0)-(Number(b.order)||0)));
    const idx = ordered.findIndex(x=>x.id===id);
    const swapIdx = idx + dir;
    if(idx===-1 || swapIdx<0 || swapIdx>=ordered.length) return;
    const tmp = ordered[idx];
    ordered[idx] = ordered[swapIdx];
    ordered[swapIdx] = tmp;
    ordered.forEach((it,i)=>{ it.order = i; }); // ensureItem() isn't reachable from here (it's scoped to a different IIFE) — order is the only field this needs to touch anyway
    saveToLocalStorage();
    renderButtons();
};

window.moveFolderOrder = function(name, dir){
    const idx = folders.indexOf(name);
    const swapIdx = idx + dir;
    if(idx<=0 || swapIdx<=0 || swapIdx>=folders.length) return; // root folder (index 0) stays pinned first
    const tmp = folders[idx];
    folders[idx] = folders[swapIdx];
    folders[swapIdx] = tmp;
    saveFoldersToLocalStorage();
    renderFolders();
};

/* Press-and-hold -> floating move menu. Pointer Events cover touch, mouse
   and pen in one code path. A short hold is required before the menu opens,
   so an ordinary tap-to-open or a finger-scroll is never mistaken for it. */
(function(){
    const HOLD_MS = 350;
    const MOVE_CANCEL_PX = 10;
    let menuEl = null;
    let suppressClickUntil = 0;

    function closeMenu(){
        if(menuEl){ menuEl.remove(); menuEl = null; }
        document.removeEventListener('pointerdown', onOutsidePointerDown, true);
        window.removeEventListener('scroll', closeMenu, true);
    }
    function onOutsidePointerDown(e){
        if(menuEl && !menuEl.contains(e.target)) closeMenu();
    }

    function openMenu(wrap, onMoveRight, onMoveLeft){
        if(!wrap) return;
        closeMenu();
        const r = wrap.getBoundingClientRect();
        const menu = document.createElement('div');
        menu.className = 'markhin-move-menu';
        document.body.appendChild(menu); // measure after mount so offsetWidth is real
        const above = r.top > 70;

        const bUp = document.createElement('button');
        bUp.type='button'; bUp.className='markhin-move-menu-btn'; bUp.textContent='▲';
        bUp.title = currentLang==='fa' ? 'جابجایی به بالا' : 'Move up';
        bUp.onclick = (e)=>{ e.stopPropagation(); onMoveRight(); closeMenu(); };

        const bDown = document.createElement('button');
        bDown.type='button'; bDown.className='markhin-move-menu-btn'; bDown.textContent='▼';
        bDown.title = currentLang==='fa' ? 'جابجایی به پایین' : 'Move down';
        bDown.onclick = (e)=>{ e.stopPropagation(); onMoveLeft(); closeMenu(); };

        menu.appendChild(bUp); menu.appendChild(bDown);
        const mw = menu.offsetWidth || 44;
        menu.style.left = Math.max(8, Math.min(window.innerWidth - mw - 8, r.left + r.width/2 - mw/2)) + 'px';
        menu.style.top = (above ? (r.top - 94) : (r.bottom + 6)) + 'px';
        menuEl = menu;

        setTimeout(()=>{ document.addEventListener('pointerdown', onOutsidePointerDown, true); }, 0);
        window.addEventListener('scroll', closeMenu, true);
    }

    function makeLongPress(opts){
        let holdTimer = null;
        let heldEl = null;   // the pressed element, kept only to position the menu
        let heldKey = null;  // its stable id/name, captured immediately — never re-read later
        let startX = 0, startY = 0;

        document.addEventListener('pointerdown', function(e){
            const w = e.target.closest('#'+opts.containerId+' '+opts.itemSelector);
            if(!w) return;
            if(opts.isBlocked && opts.isBlocked()) return;
            if(opts.isBlockedTarget && e.target.closest(opts.isBlockedTarget)) return;
            if(opts.isItemBlocked && opts.isItemBlocked(w)) return;
            if(opts.respectSearch){
                const rawQuery = (document.getElementById('searchInput')||{}).value || '';
                if(rawQuery.trim()) return; // reordering only applies to the plain, unfiltered list
            }
            const key = opts.getKey(w);
            if(!key) return;
            heldEl = w; heldKey = key;
            startX = e.clientX; startY = e.clientY;
            clearTimeout(holdTimer);
            holdTimer = setTimeout(()=>{
                if(!heldEl || !heldKey) return;
                if(!document.body.contains(heldEl)) { heldEl = null; heldKey = null; return; } // list re-rendered mid-hold
                const el = heldEl, key = heldKey;
                suppressClickUntil = Date.now() + 400;
                if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(_){} }
                openMenu(el, ()=>opts.onMove(key, -1), ()=>opts.onMove(key, 1));
                heldEl = null; heldKey = null;
            }, HOLD_MS);
        }, {passive:true});

        document.addEventListener('pointermove', function(e){
            if(!heldEl) return;
            if(Math.abs(e.clientX-startX) > MOVE_CANCEL_PX || Math.abs(e.clientY-startY) > MOVE_CANCEL_PX){
                clearTimeout(holdTimer); heldEl = null; heldKey = null;
            }
        }, {passive:true});

        document.addEventListener('pointerup', function(){ clearTimeout(holdTimer); heldEl = null; heldKey = null; });
        document.addEventListener('pointercancel', function(){ clearTimeout(holdTimer); heldEl = null; heldKey = null; });
        window.addEventListener('blur', function(){ clearTimeout(holdTimer); heldEl = null; heldKey = null; });

        // Swallow the click that would otherwise follow opening the menu, so
        // the long-press doesn't also open/toggle the note or folder.
        document.addEventListener('click', function(e){
            if(Date.now() < suppressClickUntil && e.target.closest('#'+opts.containerId+' '+opts.itemSelector)){
                e.stopPropagation();
                e.preventDefault();
            }
        }, true);
    }

    // Notes.
    makeLongPress({
        containerId: 'buttonsContainer',
        itemSelector: '.note-btn-wrap',
        respectSearch: true,
        isBlocked: ()=> window.MarkhinNoteDeleteMode, // delete mode already has its own tap target
        isBlockedTarget: '.note-del-x',
        getKey: (w)=> w.dataset.id,
        onMove: (id, dir) => moveNoteOrder(id, dir)
    });

    // Folders. The "All/همه" root folder always stays pinned first and isn't
    // reorderable, matching the fact that it can't be deleted either.
    makeLongPress({
        containerId: 'foldersContainer',
        itemSelector: '.folder-wrapper',
        respectSearch: false,
        isBlocked: ()=> typeof isDeleteFolderMode !== 'undefined' && isDeleteFolderMode,
        isBlockedTarget: '.close-folder-btn',
        isItemBlocked: (w)=> w.dataset.folder === DEFAULT_FOLDER,
        getKey: (w)=> w.dataset.folder,
        onMove: (name, dir) => moveFolderOrder(name, dir)
    });
})();

/* ================= AI LAYER ================= */
/* Multi-provider AI layer.
   - Built-in presets: OpenAI, Anthropic, OpenRouter (OpenRouter ships with a
     default Base URL so it works with just an API key + model — no more
     forced "Base URL is required" for it).
   - Plus an open-ended list of user-added custom providers: any name, any
     Base URL, any API key, any model, in either "OpenAI-compatible" or
     "Anthropic-style" request format. Add as many as you want; each is
     saved and stays selectable from the Provider dropdown.
*/
const MU_AI_BUILTINS = {
    openai:     { label:'OpenAI',     format:'openai',    defaultBaseUrl:'https://api.openai.com/v1',    defaultModel:'gpt-5-mini' },
    anthropic:  { label:'Anthropic',  format:'anthropic', defaultBaseUrl:'https://api.anthropic.com',    defaultModel:'claude-haiku-4-5-20251001' },
    openrouter: { label:'OpenRouter', format:'openai',    defaultBaseUrl:'https://openrouter.ai/api/v1', defaultModel:'openai/gpt-4o-mini' }
};

const MarkhinAI = window.MarkhinAI = {
    KEY:'markhin_ai_settings_v2',
    OLD_KEY:'markhin_ai_settings_v1',

    _migrateOld(){
        // Bring forward anyone's existing single-provider setup from the old
        // flat format so nobody's saved key silently disappears.
        try{
            const old = safeParseJSON(localStorage.getItem(this.OLD_KEY)||'null', null);
            if(!old || !old.apiKey) return null;
            const s = { activeId:'openai', builtins:{}, customProviders:[] };
            if(old.provider === 'anthropic'){
                s.activeId = 'anthropic';
                s.builtins.anthropic = { apiKey:old.apiKey, model:old.model||'', baseUrl:old.baseUrl||'' };
            } else if(old.provider === 'custom'){
                const id = 'm'+Date.now();
                s.customProviders.push({ id, name:'Custom', format:'openai', apiKey:old.apiKey, model:old.model||'', baseUrl:old.baseUrl||'' });
                s.activeId = 'custom:'+id;
            } else {
                s.activeId = 'openai';
                s.builtins.openai = { apiKey:old.apiKey, model:old.model||'', baseUrl:old.baseUrl||'' };
            }
            this.saveSettings(s);
            return s;
        }catch(e){ return null; }
    },

    getSettings(){
        let s = safeParseJSON(localStorage.getItem(this.KEY)||'null', null);
        if(!s) s = this._migrateOld() || { activeId:'openai', builtins:{}, customProviders:[] };
        if(!s.builtins) s.builtins = {};
        if(!Array.isArray(s.customProviders)) s.customProviders = [];
        if(!s.activeId) s.activeId = 'openai';
        return s;
    },
    saveSettings(s){ try{ localStorage.setItem(this.KEY, JSON.stringify(s)); }catch(e){} },
    clear(){ try{ localStorage.removeItem(this.KEY); localStorage.removeItem(this.OLD_KEY); }catch(e){} },

    listProviders(){
        const s = this.getSettings();
        const list = Object.keys(MU_AI_BUILTINS).map(id=>({ id, name:MU_AI_BUILTINS[id].label, builtin:true }));
        s.customProviders.forEach(p=> list.push({ id:'custom:'+p.id, name:p.name||'Custom', builtin:false }));
        return list;
    },

    // Resolves the currently-active provider into one flat, ready-to-use config.
    getActiveProvider(s){
        s = s || this.getSettings();
        const id = s.activeId || 'openai';
        if(id.indexOf('custom:') === 0){
            const cp = s.customProviders.find(p => 'custom:'+p.id === id);
            if(!cp) return null;
            return { id, name:cp.name, format:cp.format||'openai', baseUrl:(cp.baseUrl||'').trim(), apiKey:cp.apiKey||'', model:cp.model||'' };
        }
        const preset = MU_AI_BUILTINS[id] || MU_AI_BUILTINS.openai;
        const stored = s.builtins[id] || {};
        return {
            id,
            name: preset.label,
            format: preset.format,
            baseUrl: (stored.baseUrl||'').trim() || preset.defaultBaseUrl,
            apiKey: stored.apiKey || '',
            model: stored.model || preset.defaultModel || ''
        };
    },

    getProviderFields(id){
        // Used by the settings UI to populate the form for whichever
        // provider the person picks from the dropdown.
        const s = this.getSettings();
        if(id.indexOf('custom:') === 0){
            const cp = s.customProviders.find(p => 'custom:'+p.id === id);
            return cp ? { name:cp.name||'', format:cp.format||'openai', apiKey:cp.apiKey||'', model:cp.model||'', baseUrl:cp.baseUrl||'' } : null;
        }
        const preset = MU_AI_BUILTINS[id] || MU_AI_BUILTINS.openai;
        const stored = s.builtins[id] || {};
        return { name:preset.label, format:preset.format, apiKey:stored.apiKey||'', model:stored.model||'', baseUrl:stored.baseUrl||'' };
    },

    // Saves the settings-form fields back for whichever provider is
    // currently selected (a builtin preset or one specific custom entry).
    saveProviderFields(id, fields){
        const s = this.getSettings();
        if(id.indexOf('custom:') === 0){
            const cid = id.slice(7);
            const cp = s.customProviders.find(p => p.id === cid);
            if(cp){
                cp.name = fields.name || cp.name;
                cp.format = fields.format || cp.format || 'openai';
                cp.apiKey = fields.apiKey || '';
                cp.model = fields.model || '';
                cp.baseUrl = fields.baseUrl || '';
            }
        } else {
            s.builtins[id] = { apiKey:fields.apiKey||'', model:fields.model||'', baseUrl:fields.baseUrl||'' };
        }
        s.activeId = id;
        this.saveSettings(s);
    },

    // Adds a brand-new custom provider (any name / any Base URL / any key)
    // and makes it the active one. This is the "add whatever I want" path.
    addCustomProvider(fields){
        const s = this.getSettings();
        const id = 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
        s.customProviders.push({
            id,
            name: (fields.name||'').trim() || ('Custom '+(s.customProviders.length+1)),
            format: fields.format === 'anthropic' ? 'anthropic' : 'openai',
            apiKey: fields.apiKey||'',
            model: fields.model||'',
            baseUrl: (fields.baseUrl||'').trim()
        });
        s.activeId = 'custom:'+id;
        this.saveSettings(s);
        return 'custom:'+id;
    },

    removeCustomProvider(id){
        const s = this.getSettings();
        const cid = id.slice(7);
        s.customProviders = s.customProviders.filter(p => p.id !== cid);
        if(s.activeId === id) s.activeId = 'openai';
        this.saveSettings(s);
    },

    isConfigured(){ const p=this.getActiveProvider(); return !!(p && p.apiKey); },

    async chat(messages, opts){
        opts = opts||{};
        const p = this.getActiveProvider();
        const fa = currentLang==='fa';
        if(!p) throw new Error(fa ? 'ارائه‌دهنده انتخاب‌شده پیدا نشد.' : 'Selected provider was not found.');
        if(!p.apiKey) throw new Error(fa ? 'کلید API تنظیم نشده است.' : 'API key is not set.');
        const maxTokens = opts.maxTokens || 500;

        if(p.format === 'anthropic'){
            const sysMsg = messages.find(m=>m.role==='system');
            const rest = messages.filter(m=>m.role!=='system');
            const res = await fetch((p.baseUrl||'https://api.anthropic.com').replace(/\/+$/,'')+'/v1/messages', {
                method:'POST',
                headers:{
                    'Content-Type':'application/json',
                    'x-api-key': p.apiKey,
                    'anthropic-version':'2023-06-01',
                    'anthropic-dangerous-direct-browser-access':'true'
                },
                body: JSON.stringify({
                    model: p.model || 'claude-haiku-4-5-20251001',
                    max_tokens: maxTokens,
                    system: sysMsg ? sysMsg.content : undefined,
                    messages: rest.map(m=>({role: m.role==='assistant'?'assistant':'user', content:m.content}))
                })
            });
            if(!res.ok){ const tx=await res.text().catch(()=> ''); throw new Error('Anthropic: '+res.status+' '+tx.slice(0,220)); }
            const data = await res.json();
            return (data.content||[]).map(bk=>bk.text||'').join('\n').trim();
        }

        // OpenAI-compatible format — covers OpenAI, OpenRouter, and any
        // custom provider the person added (Groq, Together, DeepSeek,
        // local Ollama servers, etc. all speak this same /chat/completions shape).
        if(!p.baseUrl){
            throw new Error(fa ? 'Base URL برای این ارائه‌دهنده الزامی است.' : 'Base URL is required for this provider.');
        }
        const headers = { 'Content-Type':'application/json', 'Authorization':'Bearer '+p.apiKey };
        if(p.id === 'openrouter'){
            // Recommended (not required) by OpenRouter for attribution — harmless to send.
            headers['HTTP-Referer'] = (typeof location!=='undefined' && location.origin) || 'https://localhost';
            headers['X-Title'] = 'Markhin';
        }
        const res = await fetch(p.baseUrl.replace(/\/+$/,'')+'/chat/completions', {
            method:'POST',
            headers,
            body: JSON.stringify({ model: p.model || 'gpt-5-mini', max_tokens:maxTokens, messages })
        });
        if(!res.ok){ const tx=await res.text().catch(()=> ''); throw new Error('API: '+res.status+' '+tx.slice(0,220)); }
        const data = await res.json();
        return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
    }
};

function mu_allSearchableItems(){
    return categories.filter(c=> (typeof isArchived!=='function' || !isArchived(c)));

function mu_snippet(item, terms){
    if(isNoteLocked(item)) return currentLang==='fa' ? '🔒 یادداشت قفل‌شده' : '🔒 Locked note';
    const plain = (item.text || (item.html ? item.html.replace(/<[^>]+>/g,' ') : '') || '').replace(/\s+/g,' ').trim();
    if(!plain) return '';
    const normPlain = mu_norm(plain);
    let idx=-1;
    for(const term of (terms||[])){ const i=normPlain.indexOf(term); if(i>=0){ idx=i; break; } }
    const start = idx>=0 ? Math.max(0, idx-40) : 0;
    let snippet = plain.slice(start, start+140);
    if(start>0) snippet = '…'+snippet;
    if(start+140<plain.length) snippet += '…';
    return snippet;
}
window.mu_snippet = mu_snippet;

function mu_renderSmartResults(query){
    const box = document.getElementById('muSmartResults'); if(!box) return;
    const {filters, textTerms} = mu_parseQuery(query);
    let items = mu_allSearchableItems();
    if(filters.length) items = items.filter(it=>mu_matchesFilters(it, filters));
    let scored;
    if(textTerms.length) scored = items.map(it=>({item:it, score:mu_scoreItem(it, textTerms)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
    else scored = items.map(it=>({item:it, score:1}));

    if(!scored.length){ box.innerHTML = '<div class="markhin-smart-empty">'+(currentLang==='fa'?'چیزی پیدا نشد.':'Nothing found.')+'</div>'; return; }

    box.innerHTML = scored.slice(0,40).map(({item})=>{
        const snip = mu_snippet(item, textTerms);
        return `<div class="markhin-smart-item" data-id="${escapeHtml(item.id)}">
            <b>${isNoteLocked(item)?'🔒 ':''}${mu_highlightPlain(item.name, textTerms)}</b>
            <div class="snippet">${mu_highlightPlain(snip, textTerms)}</div>
        </div>`;
    }).join('');

    box.querySelectorAll('.markhin-smart-item').forEach(el=>{
        el.onclick = ()=>{ const id=el.dataset.id; closeAdvancedModal(); mu_openAndHighlight(id, textTerms); };
    });
}

/* ---------- Ask (Q&A) section: AI-only ----------
   Pressing "پرسش" now always asks the AI directly — the local, non-AI
   keyword/synonym matching that used to answer here (with or without an
   AI connected) has been removed completely per request. If no AI
   provider is configured yet, this opens AI settings instead of silently
   doing nothing or falling back to keyword matching. */
window.askQuestion = function(){

async function mu_askAI(){
    const qEl = document.getElementById('qaInput');
    const query = qEl ? qEl.value.trim() : '';
    const resBox = document.getElementById('qaResponse');
    if(!resBox) return;
    if(!query){
        resBox.style.display = 'none';
        return;
    }
    if(!MarkhinAI.isConfigured()){
        mu_openAiSettingsModal();
        return;
    }
    const fa = currentLang==='fa';
    const notes = categories.filter(c=>!c.isDecoy && (!isNoteLocked(c) || unlockedQaIds.includes(c.id)));
    /* Locked notes are excluded from the AI's context unless unlocked via the
       🔒 button next to Ask. That used to happen silently — the person had no
       way to tell a locked note was left out of the answer. Now, whenever at
       least one locked note is being skipped, a small notice is shown above
       the answer saying so and pointing at the 🔒 button. */
    const excludedLockedCount = categories.filter(c=>!c.isDecoy && isNoteLocked(c) && !unlockedQaIds.includes(c.id)).length;
    const lockNotice = excludedLockedCount > 0
        ? `<div class="markhin-ai-lock-notice">🔒 ${fa
            ? `${excludedLockedCount} یادداشت قفل در این جستجو لحاظ نشد — فقط بین یادداشت‌های بدون رمز جستجو شد. برای اینکه یک یادداشت قفل هم در پاسخ AI لحاظ بشه، از دکمه 🔒 کنار «پرسش» بازش کن.`
            : `${excludedLockedCount} locked note(s) were skipped — only unlocked notes were searched. To include a locked note in AI answers, unlock it with the 🔒 button next to Ask.`}</div>`
        : '';
    resBox.style.display = 'block';
    resBox.innerHTML = lockNotice + `<div class="markhin-ai-loading">🤖 ${fa?'در حال پرسیدن از AI...':'Asking AI...'}</div>`;
    const context = notes.map(n=>'### '+n.name+'\n'+(n.text||'').slice(0,800)).join('\n\n').slice(0,9000);
    const sys = fa
        ? 'فقط بر اساس یادداشت‌های زیر به سوال کاربر پاسخ بده. اگر پاسخ در یادداشت‌ها نبود، بگو اطلاعات کافی در یادداشت‌ها پیدا نشد. از دانش عمومی خودت استفاده نکن و مختصر پاسخ بده.'
        : 'Answer the user only using the notes below. If the answer is not present, say the notes do not contain enough information. Do not use outside knowledge; answer concisely.';
    try{
        const reply = await MarkhinAI.chat([{role:'system',content:sys},{role:'user',content:'Notes:\n'+context+'\n\nQuestion: '+query}], {maxTokens:400});
        resBox.innerHTML = lockNotice + `🤖 <b>${fa?'پاسخ AI':'AI answer'}:</b> ${escapeHtml(reply)}`;
    }catch(err){
        resBox.innerHTML = lockNotice + `⚠️ ${fa?'خطا در دریافت پاسخ AI: ':'AI error: '}${escapeHtml(err.message||String(err))}`;
    }
}

function mu_addAiToolsToNote(item, box){

/* Small language-picker modal for AI Translate. Resolves with 'en' or 'fa',
   or null if the user closes it without choosing. Relies on the same
   showAdvanced/closeAdvancedModal modal used by AI Summary/AI Tags. */
function mu_pickAiTranslateTarget() {
    return new Promise((resolve) => {
        const fa = currentLang === 'fa';
        window.__muAiTranslateResolve = resolve;
        showAdvanced(`<div class="advanced-head"><h3>🌐 ${fa?'ترجمه AI':'AI Translate'}</h3><button class="btn-main" onclick="mu_resolveAiTranslateTarget(null)">✕</button></div>
            <p style="line-height:2">${fa?'متن به کدام زبان ترجمه شود؟':'Which language should the text be translated into?'}</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
                <button class="btn-main" onclick="mu_resolveAiTranslateTarget('en')">${fa?'انگلیسی':'English'}</button>
                <button class="btn-main" onclick="mu_resolveAiTranslateTarget('fa')">${fa?'فارسی':'Persian'}</button>
            </div>`);
    });
}
window.mu_resolveAiTranslateTarget = function(target) {
    closeAdvancedModal();
    if (window.__muAiTranslateResolve) {
        window.__muAiTranslateResolve(target);
        window.__muAiTranslateResolve = null;
    }
};

/* AI-powered translation of a whole note, using the same configured AI
   provider/API key as AI Summary and AI Tags. Rewrites the note as plain
   translated text (same tradeoff as the existing Google-translate buttons)
   and registers a "Revert to Original" backup the same way they do. */
async function mu_aiTranslateNote(id) {
    const item = categories.find(c => c.id === id); if (!item) return;
    const fa = currentLang === 'fa';
    if (!MarkhinAI.isConfigured()) { mu_openAiSettingsModal(); return; }
    if (isNoteLocked(item) && !unlockedQaIds.includes(id)) { showToast(fa?'ابتدا این یادداشت را از بخش پرسش آنلاک کن.':'Unlock this note from the Ask section first.'); return; }
    const textEl = document.getElementById('text-' + id);
    if (!textEl) return;
    const sourceText = mu_notePlainText(item).slice(0, 8000);
    if (!sourceText) { showToast(fa?'این یادداشت متنی برای ترجمه ندارد.':'This note has no text to translate.'); return; }

    const target = await mu_pickAiTranslateTarget();
    if (!target) return;

    if (textEl.querySelector('img,audio,canvas,table,a')) {
        const warnMsg = fa
            ? 'ترجمه، تصاویر/صدا/جدول/لینک داخل این یادداشت را حذف می‌کند و فقط متن ساده‌ی ترجمه‌شده باقی می‌ماند. ادامه می‌دهید؟'
            : 'Translating will remove any images, audio, tables, or links in this note, leaving only the translated plain text. Continue?';
        if (!confirm(warnMsg)) return;
    }

    const preTranslateHtml = textEl.innerHTML;
    // Checkpoint the pre-translation state right away, same as regular
    // translate — so Undo reliably steps back to exactly this.
    mu_historyInit(id, preTranslateHtml);
    mu_historyPush(id, preTranslateHtml);
    textEl.innerText = fa ? 'در حال ترجمه با AI... لطفاً شکیبا باشید.' : 'Translating with AI... please wait.';

    const sys = target === 'fa'
        ? 'متن زیر را دقیق و روان به فارسی ترجمه کن. فقط متن ترجمه‌شده را برگردان، بدون هیچ توضیح یا مقدمه‌ای.'
        : 'Translate the following text into fluent, accurate English. Return only the translated text, with no explanation or preamble.';
    try {
        const reply = await MarkhinAI.chat([{role:'system',content:sys},{role:'user',content:sourceText}], {maxTokens:1200});
        if (!reply || !reply.trim()) {
            textEl.innerHTML = preTranslateHtml;
            showToast(fa?'ترجمه‌ای دریافت نشد.':'No translation received.');
            return;
        }
        textEl.innerText = reply.trim();
        item.html = textEl.innerHTML;
        item.text = textWithVisualSpacing(textEl).replace(/\u00a0/g, ' ');
        item.lastEdited = new Date().toUTCString();
        saveToLocalStorage();

        mu_historyPush(id, textEl.innerHTML);
        showToast(fa?'ترجمه با AI انجام شد.':'AI translation done.');
    } catch (err) {
        textEl.innerHTML = preTranslateHtml;
        showToast('⚠️ ' + (err.message || String(err)), 3200);
    }
}

function mu_notePlainText(item){
    return (item.text || (item.html ? item.html.replace(/<[^>]+>/g,' ') : '') || '').trim();
}

async function mu_summarizeNote(id){
    const item = categories.find(c=>c.id===id); if(!item) return;
    const fa = currentLang==='fa';
    if(!MarkhinAI.isConfigured()){ mu_openAiSettingsModal(); return; }
    if(isNoteLocked(item) && !unlockedQaIds.includes(id)){ showToast(fa?'ابتدا این یادداشت را از بخش پرسش آنلاک کن.':'Unlock this note from the Ask section first.'); return; }
    showToast(fa?'در حال خلاصه‌سازی...':'Summarizing...');
    try{
        const plain = mu_notePlainText(item).slice(0,6000);
        if(!plain){ showToast(fa?'این یادداشت متنی برای خلاصه‌سازی ندارد.':'This note has no text to summarize.'); return; }
        const sys = fa ? 'یک خلاصه کوتاه و دقیق (حداکثر ۵ جمله) از متن زیر به فارسی بنویس.' : 'Write a short, precise summary (max 5 sentences) of the following note.';
        const reply = await MarkhinAI.chat([{role:'system',content:sys},{role:'user',content:plain}], {maxTokens:300});
        window.__muLastSummary = reply;
        showAdvanced(`<div class="advanced-head"><h3>🧠 ${fa?'خلاصه AI':'AI Summary'} — ${escapeHtml(item.name)}</h3><button class="btn-main" onclick="closeAdvancedModal()">✕</button></div><p style="line-height:2">${escapeHtml(reply)}</p><button class="btn-main" onclick="mu_insertSummary('${id}')">➕ ${fa?'افزودن به یادداشت':'Insert into note'}</button>`);
    }catch(err){ showToast('⚠️ '+(err.message||String(err)), 3200); }
}
window.mu_insertSummary = function(id){
    const item = categories.find(c=>c.id===id);
    if(!item || !window.__muLastSummary) return;
    const textEl = document.getElementById('text-'+id);
    const fa = currentLang==='fa';
    const block = `<blockquote><b>🧠 ${fa?'خلاصه AI':'AI Summary'}:</b> ${escapeHtml(window.__muLastSummary)}</blockquote>`;
    if(textEl){ textEl.insertAdjacentHTML('afterbegin', block); saveCategory(id); }
    closeAdvancedModal();
    showToast(fa?'خلاصه به یادداشت اضافه شد.':'Summary inserted.');
};

async function mu_suggestTags(id){
    const item = categories.find(c=>c.id===id); if(!item) return;
    const fa = currentLang==='fa';
    if(!MarkhinAI.isConfigured()){ mu_openAiSettingsModal(); return; }
    if(isNoteLocked(item) && !unlockedQaIds.includes(id)){ showToast(fa?'ابتدا این یادداشت را از بخش پرسش آنلاک کن.':'Unlock this note from the Ask section first.'); return; }
    showToast(fa?'در حال پیشنهاد برچسب...':'Suggesting tags...');
    try{
        const plain = mu_notePlainText(item).slice(0,4000);
        if(!plain){ showToast(fa?'این یادداشت متنی برای برچسب‌گذاری ندارد.':'This note has no text to tag.'); return; }
        const sys = fa ? 'حداکثر ۶ برچسب کوتاه (یک یا دو کلمه) مرتبط با متن زیر پیشنهاد بده. فقط یک لیست جدا شده با کاما برگردان، بدون توضیح اضافه.' : 'Suggest up to 6 short (1-2 word) tags for the note below. Return only a comma-separated list, no explanation.';
        const reply = await MarkhinAI.chat([{role:'system',content:sys},{role:'user',content:plain}], {maxTokens:80});
        const suggested = reply.split(/[,،\n]/).map(s=>s.trim()).filter(Boolean).slice(0,8);
        if(!suggested.length){ showToast(fa?'برچسبی پیشنهاد نشد.':'No tags suggested.'); return; }
        showAdvanced(`<div class="advanced-head"><h3>🏷️ ${fa?'برچسب‌های پیشنهادی':'Suggested Tags'}</h3><button class="btn-main" onclick="closeAdvancedModal()">✕</button></div><div style="line-height:2.6">${suggested.map(tg=>`<button class="btn-main" style="margin:3px" onclick="mu_addTag('${id}',this.dataset.tag);this.disabled=true;this.style.opacity=.4" data-tag="${escapeHtml(tg)}">#${escapeHtml(tg)} ➕</button>`).join('')}</div>`);
    }catch(err){ showToast('⚠️ '+(err.message||String(err)), 3200); }
}
window.mu_addTag = function(id, tag){
    const item = categories.find(c=>c.id===id); if(!item || !tag) return;
    if(!Array.isArray(item.tags)) item.tags=[];
    if(!item.tags.some(t=>mu_norm(t)===mu_norm(tag))) item.tags.push(tag);
    saveToLocalStorage();
    renderApp(id);
    showToast(currentLang==='fa'?'برچسب اضافه شد.':'Tag added.');
};

window.applyLanguageUI = function(){

/* Fallback only: the main startup handler (earlier in the file) now calls
   mu_injectUiControls() itself as part of its single consolidated render,
   right after addTopControls(). This listener stays registered purely as
   a safety net for the (normally impossible) case where DOMContentLoaded
   already fired before this script block ran; mu_injectUiControls() is
   idempotent (it checks for #muAiSettingsBtn before adding it), so this
   never double-inserts the gear button. */
document.addEventListener('DOMContentLoaded', mu_injectUiControls);
document.addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); mu_openSmartSearchModal(); } });

})();

<script>
(function(){

/* =========================================================================
   1) SAFE TRANSLATE
   Only the plain text of the note is sent to Google Translate and replaced.
   Images and audio (.img-drag-wrapper / .audio-wrapper) are left completely
   untouched, in their original spot, instead of being wiped out.
   ========================================================================= */
function mu2_isPreservedMedia(node){
    return node.nodeType === 1 && (
        node.classList?.contains('img-drag-wrapper') ||
        node.classList?.contains('audio-wrapper')
    );
}

window.translateText = async function(id, sourceLang, targetLang){
    const t = i18n[currentLang];
    const fa = currentLang === 'fa';
    const textEl = document.getElementById(`text-${id}`);
    if (!textEl) return;

    const children = Array.from(textEl.childNodes);
    const hasMedia = children.some(mu2_isPreservedMedia);

    // Group the note into runs: media nodes stand alone (never touched),
    // everything else is grouped into consecutive "translatable" runs.
    const runs = [];
    let cur = null;
    children.forEach(node => {
        if (mu2_isPreservedMedia(node)) {
            runs.push({ preserve: true, node });
            cur = null;
        } else {
            if (!cur) { cur = { preserve: false, nodes: [] }; runs.push(cur); }
            cur.nodes.push(node);
        }
    });

    const textRuns = runs.filter(r => !r.preserve);
    textRuns.forEach(run => {
        const tmp = document.createElement('div');
        run.nodes.forEach(n => tmp.appendChild(n.cloneNode(true)));
        run.sourceText = tmp.textContent.trim();
    });

    const anyText = textRuns.some(r => r.sourceText);
    if (!anyText) {
        alert(t.noTextToTranslate);
        return;
    }

    if (hasMedia) {
        const warnMsg = fa
            ? 'فقط متن این یادداشت ترجمه می‌شود؛ تصاویر و صداهای داخل آن دست‌نخورده و سرجایشان باقی می‌مانند. ادامه می‌دهید؟'
            : 'Only the text of this note will be translated; any images or audio inside it stay untouched and in place. Continue?';
        if (!confirm(warnMsg)) return;
    }

    showToast(t.translating, 2500);

    try {
        for (const run of textRuns) {
            if (!run.sourceText) { run.translated = ''; continue; }
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(run.sourceText)}`;
            const response = await fetch(url);
            const data = await response.json();
            if (!data || !data[0]) throw new Error('bad-response');
            run.translated = data[0].map(item => item[0]).join('');
        }

        // Apply translations in place; media runs are skipped entirely.
        runs.forEach(run => {
            if (run.preserve || !run.nodes.length) return;
            const anchor = run.nodes[0];
            const parent = anchor.parentNode;
            if (!parent) return;
            parent.insertBefore(document.createTextNode(run.translated || ''), anchor);
            run.nodes.forEach(n => n.remove());
        });

        const item = categories.find(c => c.id === id);
        if (item) {
            item.html = textEl.innerHTML;
            item.text = textWithVisualSpacing(textEl).replace(/\u00a0/g, ' ');
            item.lastEdited = new Date().toUTCString();
            saveToLocalStorage();
        }
        showToast(fa ? '✅ ترجمه انجام شد.' : '✅ Translation complete.', 1800);
    } catch (err) {
        alert(t.serverError);
    }
};

/* =========================================================================
   2) MOVE IMAGE WITHIN / BETWEEN NOTES
   Dropping an image inside the SAME note now repositions it at the drop
   point instead of being ignored; dropping into another note still moves
   it there as before.
   ========================================================================= */
function mu2_dropTarget(container, clientY){
    const kids = Array.from(container.children);
    for (const child of kids){
        const rect = child.getBoundingClientRect();
        if (clientY < rect.top + rect.height / 2) return child;
    }
    return null;
}

window.dropImage = function(ev, categoryId){
    ev.preventDefault();
    const draggedId = ev.dataTransfer.getData('text/plain');
    const draggedEl = document.getElementById(draggedId);
    const textBox = document.getElementById(`text-${categoryId}`);
    if (!draggedEl || !textBox) return;

    const sourceBox = draggedEl.closest('.text-box');
    const sameBox = sourceBox === textBox;
    const target = mu2_dropTarget(textBox, ev.clientY);

    if (target === draggedEl) return;
    if (target) textBox.insertBefore(draggedEl, target);
    else textBox.appendChild(draggedEl);

    if (!sameBox) {
        const sourceId = sourceBox?.id?.startsWith('text-') ? sourceBox.id.slice(5) : null;
        if (sourceId) autosaveCategory(sourceId);
    }
    saveCategory(categoryId);
};

/* =========================================================================
   3) RESIZE + CROP TOOLS FOR IMAGES
   Resize sets the <img width> attribute (already preserved by sanitizeHtml
   and by CSS updated to honor it), so it survives save/reload. A
   ResizeObserver also picks up manual corner-drag resizing (desktop) and
   syncs it back into that same attribute so it persists the same way.
   ========================================================================= */
const MU2_MIN_W = 60, MU2_MAX_W = 1000;

function mu2_currentWidth(img, wrapper){
    const attr = parseInt(img.getAttribute('width') || '', 10);
    if (attr > 0) return attr;
    const rect = wrapper.getBoundingClientRect();
    return rect.width || 260;
}

function mu2_applyWidth(wrapper, img, w){
    w = Math.max(MU2_MIN_W, Math.min(MU2_MAX_W, Math.round(w)));
    img.setAttribute('width', String(w));
}

function mu2_resizeImage(wrapperId, categoryId, factor){
    const wrapper = document.getElementById(wrapperId);
    const img = wrapper?.querySelector('img');
    if (!img) return;
    mu2_applyWidth(wrapper, img, mu2_currentWidth(img, wrapper) * factor);
    if (categoryId) autosaveCategory(categoryId);
}

function mu2_observeResize(wrapper, categoryId){
    if (wrapper.__mu2Observed || typeof ResizeObserver === 'undefined') return;
    wrapper.__mu2Observed = true;
    const img = wrapper.querySelector('img');
    if (!img) return;
    const ro = new ResizeObserver(() => {
        const w = wrapper.clientWidth;
        if (!w) return;
        const attr = parseInt(img.getAttribute('width') || '', 10);
        if (Math.abs((attr || 0) - w) < 3) return; // ignore our own writes / no real change
        img.setAttribute('width', String(Math.max(MU2_MIN_W, Math.min(MU2_MAX_W, Math.round(w)))));
        clearTimeout(wrapper.__mu2SaveT);
        wrapper.__mu2SaveT = setTimeout(() => { if (categoryId) autosaveCategory(categoryId); }, 500);
    });
    ro.observe(wrapper);
}

let mu2CropperInstance = null;

window.mu2_openCrop = function(wrapperId, categoryId){
    const wrapper = document.getElementById(wrapperId);
    const img = wrapper?.querySelector('img');
    if (!img || typeof Cropper === 'undefined') return;
    const fa = currentLang === 'fa';

    showAdvanced(`
        <div class="advanced-head"><h3>✂️ ${fa ? 'برش عکس' : 'Crop Image'}</h3><button class="btn-main" onclick="mu2_cancelCrop()">✕</button></div>
        <div style="max-height:56vh; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.25); border-radius:10px; overflow:hidden;">
            <img id="mu2CropImg" src="${img.src}" style="max-width:100%; display:block;">
        </div>
        <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
            <button class="btn-main" onclick="mu2_setCropAspect(0)">${fa ? 'آزاد' : 'Free'}</button>
            <button class="btn-main" onclick="mu2_setCropAspect(1)">1:1</button>
            <button class="btn-main" onclick="mu2_setCropAspect(1.777)">16:9</button>
            <button class="btn-main" onclick="mu2_setCropAspect(1.333)">4:3</button>
        </div>
        <div style="display:flex; gap:8px; margin-top:12px;">
            <button class="btn-main btn-save-prominent" onclick="mu2_confirmCrop('${wrapperId}','${categoryId}')">✅ ${fa ? 'اعمال برش' : 'Apply Crop'}</button>
            <button class="btn-main" onclick="mu2_cancelCrop()">↩ ${fa ? 'انصراف' : 'Cancel'}</button>
        </div>
    `);
    document.getElementById('advancedCard')?.classList.add('kg-wide');

    setTimeout(() => {
        const cropImg = document.getElementById('mu2CropImg');
        if (!cropImg) return;
        if (mu2CropperInstance) mu2CropperInstance.destroy();
        mu2CropperInstance = new Cropper(cropImg, { viewMode: 1, autoCropArea: 0.9, background: false });
    }, 60);
};

window.mu2_setCropAspect = function(ratio){
    mu2CropperInstance?.setAspectRatio(ratio || NaN);
};

window.mu2_cancelCrop = function(){
    mu2CropperInstance?.destroy();
    mu2CropperInstance = null;
    closeAdvancedModal();
};

window.mu2_confirmCrop = function(wrapperId, categoryId){
    if (!mu2CropperInstance) return;
    const canvas = mu2CropperInstance.getCroppedCanvas({ maxWidth: 2000, maxHeight: 2000 });
    if (canvas) {
        const wrapper = document.getElementById(wrapperId);
        const img = wrapper?.querySelector('img');
        if (img) {
            img.src = canvas.toDataURL('image/png');
            img.removeAttribute('width');
        }
        if (categoryId) saveCategory(categoryId);
        showToast(currentLang === 'fa' ? '✅ برش اعمال شد.' : '✅ Crop applied.', 1800);
    }
    mu2CropperInstance.destroy();
    mu2CropperInstance = null;
    closeAdvancedModal();
};

/* =========================================================================
   4) WIRE THE NEW TOOLBAR BUTTONS INTO EVERY IMAGE WRAPPER
   Wraps the two functions that build/re-attach an image's toolbar so the
   new buttons (and the drag-start fix, and the resize observer) are added
   consistently whether the image was just uploaded or is being re-rendered
   after a save/reload.
   ========================================================================= */
function mu2_enhanceWrapper(wrapper, categoryId){
    if (!wrapper || wrapper.__mu2Enhanced) { mu2_observeResize(wrapper, categoryId); return; }
    wrapper.__mu2Enhanced = true;
    const fa = currentLang === 'fa';
    const img = wrapper.querySelector('img');
    const toolbar = wrapper.querySelector('.img-toolbar');
    if (!img || !toolbar) return;

    wrapper.title = fa ? 'برای جابجا کردن بکِش' : 'Drag to move';

    // Fix the drag handle: it's a JS property, not an HTML attribute, so it
    // must be re-set every time the note is rendered from saved HTML.
    wrapper.setAttribute('draggable', 'true');
    wrapper.ondragstart = (e) => e.dataTransfer.setData('text/plain', wrapper.id);

    // Make sure "download" always grabs the live image (important after a crop).
    const existingDownloadBtn = toolbar.querySelector('button');
    if (existingDownloadBtn) {
        existingDownloadBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); downloadImage(img.src); };
    }

    const smallerBtn = document.createElement('button');
    smallerBtn.type = 'button'; smallerBtn.className = 'img-btn';
    smallerBtn.innerHTML = '➖';
    smallerBtn.title = fa ? 'کوچک‌تر' : 'Smaller';
    smallerBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); mu2_resizeImage(wrapper.id, categoryId, 0.85); };

    const biggerBtn = document.createElement('button');
    biggerBtn.type = 'button'; biggerBtn.className = 'img-btn';
    biggerBtn.innerHTML = '➕';
    biggerBtn.title = fa ? 'بزرگ‌تر' : 'Bigger';
    biggerBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); mu2_resizeImage(wrapper.id, categoryId, 1.15); };

    const cropBtn = document.createElement('button');
    cropBtn.type = 'button'; cropBtn.className = 'img-btn';
    cropBtn.innerHTML = '✂️';
    cropBtn.title = fa ? 'برش عکس' : 'Crop';
    cropBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); mu2_openCrop(wrapper.id, categoryId); };

    toolbar.appendChild(smallerBtn);
    toolbar.appendChild(biggerBtn);
    toolbar.appendChild(cropBtn);

    mu2_observeResize(wrapper, categoryId);
}

const mu2_baseCreateDraggableImageElement = window.createDraggableImageElement;
window.createDraggableImageElement = function(imgSrc, categoryId){
    const wrapper = mu2_baseCreateDraggableImageElement(imgSrc, categoryId);
    mu2_enhanceWrapper(wrapper, categoryId);
    return wrapper;
};

const mu2_baseAttachWrapperEvents = window.attachWrapperEvents;
window.attachWrapperEvents = function(categoryId){
    mu2_baseAttachWrapperEvents(categoryId);
    const textBox = document.getElementById(`text-${categoryId}`);
    textBox?.querySelectorAll('.img-drag-wrapper').forEach(wrapper => {
        wrapper.__mu2Enhanced = false; // toolbar was just rebuilt by the base function
        mu2_enhanceWrapper(wrapper, categoryId);
    });
};

})();
</script>

<script>
/* =========================================================================
   5) PASTE-AS-PLAIN-TEXT FOR NOTE TEXT BOXES
   Pasting from outside (Word, a website, another app) brings along the
   source's own inline styles — color:#000, a tiny font-size, a different
   font-family — which override the theme's color/font on the .text-box
   and make the pasted chunk unreadable (black text, wrong size) even
   though everything typed by hand looks fine. This strips that inline
   styling on paste so pasted text always matches the current theme,
   exactly like text typed directly into the note.
   ========================================================================= */
(function(){
    function mu3_handleTextBoxPaste(e){
        const box = e.target && e.target.closest && e.target.closest('.text-box[contenteditable="true"]');
        if (!box) return;
        const cd = e.clipboardData || window.clipboardData;
        if (!cd) return;
        const text = cd.getData('text/plain');
        // No text on the clipboard (e.g. a copied screenshot/image) — let the
        // browser's normal paste handle that case untouched.
        if (!text) return;

        e.preventDefault();

        if (document.queryCommandSupported && document.queryCommandSupported('insertText')) {
            document.execCommand('insertText', false, text);
        } else {
            const sel = window.getSelection();
            if (!sel || !sel.rangeCount) return;
            const range = sel.getRangeAt(0);
            range.deleteContents();
            range.insertNode(document.createTextNode(text));
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
            box.dispatchEvent(new Event('input', { bubbles: true }));
        }
    }
    document.addEventListener('paste', mu3_handleTextBoxPaste);
})();
</script>

<!-- =========================================================================
     MARKHIN AI — full-screen general-purpose chat page.
     Opens directly into the conversation (never an API-key gate first).
     Provider / API-key selection lives inside this page, behind the ⚙️
     button, reusing the existing MarkhinAI provider system (any OpenAI-
     compatible service, Anthropic-style, or a fully custom endpoint).
     ========================================================================= -->
<div id="markhinAiChatOverlay" class="markhin-ai-chat-overlay">
    <div class="mAi-header">
        <div class="mAi-header-title">
            <div class="mAi-orb">🤖</div>
            <div class="mAi-header-text">
                <div class="mAi-header-name">MARKHIN AI</div>
                <div class="mAi-header-sub" id="markhinAiChatSub" onclick="mu_openAiSettingsModal()">…</div>
            </div>
        </div>
        <div class="mAi-header-actions">
            <button class="mAi-icon-btn" onclick="mu_openAiSettingsModal()" title="تنظیمات هوش مصنوعی" aria-label="تنظیمات">⚙️</button>
            <button class="mAi-icon-btn" onclick="markhinAiChat_clear()" title="پاک کردن گفتگو" aria-label="پاک کردن">🗑️</button>
            <button class="mAi-icon-btn mAi-close-btn" onclick="closeMarkhinAIChat()" title="بستن" aria-label="بستن">✕</button>
        </div>
    </div>

    <div id="markhinAiChatMessages" class="mAi-messages"></div>

    <div class="mAi-inputbar">
        <textarea id="markhinAiChatInput" class="mAi-input" rows="1"
                  placeholder="پیام خود را بنویس..."
                  oninput="markhinAiChat_autosize(this)"
                  onkeydown="markhinAiChat_onKeydown(event)"></textarea>
        <button class="mAi-send-btn" id="markhinAiChatSendBtn" onclick="markhinAiChat_send()" title="ارسال" aria-label="ارسال">➤</button>
    </div>
</div>

<script>
(function(){
    /* ---------------------------------------------------------------
       State: a plain general-purpose conversation, independent of the
       notes/QA assistant above. Persisted locally so the conversation
       survives closing/reopening the page (not tied to any one note).
       --------------------------------------------------------------- */
    const MAI_HISTORY_KEY = 'markhinAiChatHistory_v1';
    let mAiHistory = [];
    try { mAiHistory = JSON.parse(localStorage.getItem(MAI_HISTORY_KEY) || '[]'); if(!Array.isArray(mAiHistory)) mAiHistory = []; } catch(e){ mAiHistory = []; }

    function mAiSave(){
        try { localStorage.setItem(MAI_HISTORY_KEY, JSON.stringify(mAiHistory.slice(-60))); } catch(e){}
    }

    function mAiFormat(t){
        let s = escapeHtml(t == null ? '' : String(t));
        s = s.replace(/```([\s\S]*?)```/g, (m, c) => '<span class="mAi-code">' + c.replace(/\n/g, '<br>') + '</span>');
        s = s.replace(/`([^`\n]+)`/g, '<code class="mAi-inline-code">$1</code>');
        s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
        s = s.replace(/\n/g, '<br>');
        return s;
    }

    function mAiUpdateSub(){
        const el = document.getElementById('markhinAiChatSub');
        if(!el) return;
        const fa = currentLang === 'fa';
        if(MarkhinAI.isConfigured()){
            const p = MarkhinAI.getActiveProvider();
            el.textContent = (fa ? '🟢 متصل به ' : '🟢 Connected to ') + (p ? p.name : '');
            el.classList.remove('mAi-sub-off');
        } else {
            el.textContent = fa ? '⚠️ برای شروع، کلید API را تنظیم کن' : '⚠️ Tap to set your API key';
            el.classList.add('mAi-sub-off');
        }
    }
    window.markhinAiChat_updateSub = mAiUpdateSub;

    function mAiRender(){
        const box = document.getElementById('markhinAiChatMessages');
        if(!box) return;
        const fa = currentLang === 'fa';
        if(!mAiHistory.length){
            box.innerHTML =
                '<div class="mAi-welcome">' +
                    '<div class="mAi-welcome-orb">🤖</div>' +
                    '<div class="mAi-welcome-title">MARKHIN AI</div>' +
                    '<div class="mAi-welcome-text">' + (fa
                        ? 'یک دستیار هوش مصنوعی واقعی و مستقل از یادداشت‌هایت — بر پایه دانش عمومی، متصل به هر ارائه‌دهنده‌ای که خودت انتخاب کنی. هر سوالی داری همینجا بپرس.'
                        : 'A real general-purpose AI assistant, unrelated to your notes — powered by whichever provider you connect. Ask me anything.') + '</div>' +
                '</div>';
            return;
        }
        box.innerHTML = mAiHistory.map(function(m){
            const cls = m.role === 'user' ? 'mAi-user' : 'mAi-assistant';
            return '<div class="mAi-msg ' + cls + '"><div class="mAi-bubble">' + mAiFormat(m.content) + '</div></div>';
        }).join('');
        box.scrollTop = box.scrollHeight;
    }

    window.openMarkhinAIChat = function(){
        const ov = document.getElementById('markhinAiChatOverlay');
        if(!ov) return;
        ov.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        mAiUpdateSub();
        mAiRender();
        mAiSyncViewport();
        // Deliberately NOT auto-focusing the input here: focusing it would pop
        // the mobile keyboard open the instant the chat page opens. The keyboard
        // should only appear once the person actually taps the input themselves.
    };

    /* ---------------------------------------------------------------
       Keep the chat page glued to the real visible area, not the
       device's full height. Mobile keyboards don't resize the page —
       they just cover the bottom of it — so without this, a fixed
       "100vh" chat page ends up with its input bar (and the tail of
       the messages) hidden behind the keyboard, or the keyboard
       visibly overlapping the last message. window.visualViewport
       reports the space actually left after the keyboard opens, so we
       resize/reposition the overlay to match it live.
       --------------------------------------------------------------- */
    function mAiSyncViewport(){
        const ov = document.getElementById('markhinAiChatOverlay');
        if(!ov || ov.style.display === 'none' || !window.visualViewport) return;
        const vv = window.visualViewport;
        ov.style.height = vv.height + 'px';
        ov.style.top = vv.offsetTop + 'px';
        const box = document.getElementById('markhinAiChatMessages');
        if(box) box.scrollTop = box.scrollHeight;
    }
    if(window.visualViewport){
        window.visualViewport.addEventListener('resize', mAiSyncViewport);
        window.visualViewport.addEventListener('scroll', mAiSyncViewport);
    }

    window.closeMarkhinAIChat = function(){
        const ov = document.getElementById('markhinAiChatOverlay');
        if(ov){
            ov.style.display = 'none';
            // Clear the inline height/top set by mAiSyncViewport so the overlay
            // goes back to filling the full screen next time it's opened.
            ov.style.height = '';
            ov.style.top = '';
        }
        document.body.style.overflow = '';
    };

    window.markhinAiChat_clear = function(){
        const fa = currentLang === 'fa';
        if(mAiHistory.length && !confirm(fa ? 'کل گفتگو پاک شود؟' : 'Clear the entire conversation?')) return;
        mAiHistory = [];
        mAiSave();
        mAiRender();
    };

    window.markhinAiChat_autosize = function(el){
        if(!el) return;
        el.style.height = 'auto';
        el.style.height = Math.min(140, el.scrollHeight) + 'px';
    };

    window.markhinAiChat_onKeydown = function(e){
        if(e.key === 'Enter' && !e.shiftKey){
            e.preventDefault();
            markhinAiChat_send();
        }
    };

    window.markhinAiChat_send = async function(){
        const input = document.getElementById('markhinAiChatInput');
        const btn = document.getElementById('markhinAiChatSendBtn');
        const box = document.getElementById('markhinAiChatMessages');
        const fa = currentLang === 'fa';
        const text = input ? input.value.trim() : '';
        if(!text) return;

        if(!MarkhinAI.isConfigured()){
            mAiHistory.push({ role: 'assistant', content: fa
                ? '⚠️ برای شروع گفتگو، اول یک کلید API وارد کن. روی ⚙️ بالای صفحه بزن و هر ارائه‌دهنده‌ای که دوست داری (OpenAI، Anthropic، OpenRouter یا هر سرویس سازگار دیگر) رو انتخاب و کلیدشو وارد کن.'
                : '⚠️ To start chatting, set up an API key first. Tap ⚙️ above and add whichever provider you like — OpenAI, Anthropic, OpenRouter, or any compatible service.' });
            mAiSave();
            mAiRender();
            return;
        }

        mAiHistory.push({ role: 'user', content: text });
        mAiSave();
        mAiRender();
        input.value = '';
        markhinAiChat_autosize(input);
        // Drop the keyboard right after sending. It must not reopen on its own —
        // only an explicit tap on the input should bring it back.
        input.blur();

        if(btn) btn.disabled = true;
        const typingEl = document.createElement('div');
        typingEl.className = 'mAi-msg mAi-assistant';
        typingEl.innerHTML = '<div class="mAi-bubble mAi-typing"><span></span><span></span><span></span></div>';
        if(box){ box.appendChild(typingEl); box.scrollTop = box.scrollHeight; }

        const sys = fa
            ? 'تو MARKHIN AI هستی، یک دستیار هوش مصنوعی عمومی، دوستانه و دقیق. با استفاده از دانش عمومی‌ات، واضح و مفید به زبانی که کاربر می‌نویسد پاسخ بده. تو داخل یک برنامه یادداشت‌برداری قرار داری، اما این گفتگوی خاص هیچ ربطی به یادداشت‌های کاربر ندارد؛ فقط یک چت‌بات هوش مصنوعی عمومی هستی، نه دستیار یادداشت‌ها.'
            : 'You are MARKHIN AI, a friendly, knowledgeable general-purpose AI assistant. Answer clearly and helpfully using your general knowledge, in whichever language the user writes in. You are embedded inside a note-taking app, but this particular conversation has nothing to do with the user\'s notes — you are simply a general-purpose AI chatbot, not a notes assistant.';

        const convo = [{ role: 'system', content: sys }].concat(
            mAiHistory.slice(-20).map(function(m){ return { role: m.role, content: m.content }; })
        );

        try {
            const reply = await MarkhinAI.chat(convo, { maxTokens: 900 });
            typingEl.remove();
            mAiHistory.push({ role: 'assistant', content: reply || (fa ? '(پاسخ خالی دریافت شد)' : '(received an empty response)') });
            mAiSave();
            mAiRender();
        } catch(err){
            typingEl.remove();
            mAiHistory.push({ role: 'assistant', content: '⚠️ ' + (fa ? 'خطا: ' : 'Error: ') + (err && err.message || String(err)) });
            mAiSave();
            mAiRender();
        } finally {
            if(btn) btn.disabled = false;
            // No re-focus here on purpose — see the blur() above; the keyboard
            // should stay down until the person taps the input themselves.
        }
    };

    /* Keep the header subtitle in sync whenever the provider/API key is
       changed from the shared AI settings modal (whether opened from
       here or from the notes "Ask" section). */
    if(typeof window.mu_saveAiSettings === 'function'){
        const mAiBaseSave = window.mu_saveAiSettings;
        window.mu_saveAiSettings = function(){ mAiBaseSave(); mAiUpdateSub(); };
    }
    if(typeof window.mu_clearAiSettings === 'function'){
        const mAiBaseClear = window.mu_clearAiSettings;
        window.mu_clearAiSettings = function(){ mAiBaseClear(); mAiUpdateSub(); };
    }
})();
</script>

</body>
</html>
