<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مدیریت اطلاعات و حساب‌ها</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/cyberpunk');
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=Orbitron:wght@700&family=Cinzel:wght@700&family=Share+Tech+Mono&family=Creepster&family=Poller+One&family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&family=Pacifico&display=swap');

        :root {
            --bg-gradient: radial-gradient(circle at top, #002b49 0%, #000814 100%);
            --panel-bg: rgba(0, 180, 216, 0.03);
            --panel-border: rgba(72, 202, 228, 0.12);
            --card-bg: rgba(3, 25, 44, 0.8);
            --text-color: #90e0ef;
            --btn-bg-fallback: rgba(255, 255, 255, 0.05);
            --transition-smooth: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            --border-radius-main: 14px;
            --border-radius-sm: 8px;
            --spacing-xs: 8px;
            --spacing-sm: 12px;
            --spacing-md: 16px;
            --spacing-lg: 20px;
        }

        /* Themes with Enhanced Aesthetics & Animations */
        body.theme-oceanic {
            --bg-gradient: radial-gradient(circle at top, #002b49 0%, #000814 100%) !important;
            --panel-bg: rgba(0, 180, 216, 0.04) !important;
            --panel-border: rgba(72, 202, 228, 0.18) !important;
            --card-bg: rgba(3, 25, 44, 0.85) !important;
            --text-color: #90e0ef !important;
        }
        body.theme-oceanic::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: repeating-linear-gradient(0deg, rgba(0, 119, 182, 0.02), rgba(0, 119, 182, 0.02) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            z-index: -1;
        }

        body.theme-spider {
            --bg-gradient: radial-gradient(circle, #1a001d 0%, #050008 100%) !important;
            --panel-bg: rgba(186, 85, 211, 0.04) !important;
            --panel-border: rgba(186, 85, 211, 0.22) !important;
            --card-bg: rgba(10, 2, 15, 0.85) !important;
            --text-color: #e066ff !important;
        }

        body.theme-galaxy {
            --bg-gradient: radial-gradient(ellipse at bottom, #0d1d31 0%, #0c0d13 100%) !important;
            --panel-bg: rgba(255, 232, 31, 0.025) !important;
            --panel-border: rgba(255, 232, 31, 0.18) !important;
            --card-bg: rgba(5, 10, 20, 0.85) !important;
            --text-color: #ffe81f !important;
        }

        body.theme-cloudy {
            --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%) !important;
            --panel-bg: rgba(203, 213, 225, 0.04) !important;
            --panel-border: rgba(148, 163, 184, 0.18) !important;
            --card-bg: rgba(15, 23, 42, 0.85) !important;
            --text-color: #cbd5e1 !important;
        }

        body.theme-dreamy {
            --bg-gradient: linear-gradient(135deg, #2b1055 0%, #7597de 100%) !important;
            --panel-bg: rgba(255, 255, 255, 0.05) !important;
            --panel-border: rgba(255, 192, 203, 0.25) !important;
            --card-bg: rgba(25, 15, 45, 0.85) !important;
            --text-color: #ffc0cb !important;
        }

        body.theme-cyberpunk {
            --bg-gradient: linear-gradient(135deg, #0a0015 0%, #15002b 100%) !important;
            --panel-bg: rgba(0, 240, 255, 0.04) !important;
            --panel-border: rgba(0, 240, 255, 0.25) !important;
            --card-bg: rgba(5, 0, 15, 0.85) !important;
            --text-color: #00f0ff !important;
        }

        body.theme-love {
            --bg-gradient: radial-gradient(circle, #3a0010 0%, #0f0004 100%) !important;
            --panel-bg: rgba(255, 77, 109, 0.04) !important;
            --panel-border: rgba(255, 77, 109, 0.22) !important;
            --card-bg: rgba(20, 2, 7, 0.85) !important;
            --text-color: #ff758f !important;
        }

        body.theme-snowy {
            --bg-gradient: radial-gradient(circle, #0f172a 0%, #020617 100%) !important;
            --panel-bg: rgba(224, 242, 254, 0.04) !important;
            --panel-border: rgba(186, 230, 253, 0.18) !important;
            --card-bg: rgba(8, 14, 26, 0.85) !important;
            --text-color: #bae6fd !important;
        }

        body.theme-rainy {
            --bg-gradient: linear-gradient(180deg, #0b1325 0%, #030712 100%) !important;
            --panel-bg: rgba(148, 163, 184, 0.035) !important;
            --panel-border: rgba(148, 163, 184, 0.18) !important;
            --card-bg: rgba(15, 23, 42, 0.85) !important;
            --text-color: #38bdf8 !important;
        }

        body.theme-autumn {
            --bg-gradient: radial-gradient(circle, #2b1200 0%, #0d0500 100%) !important;
            --panel-bg: rgba(234, 88, 12, 0.04) !important;
            --panel-border: rgba(249, 115, 22, 0.18) !important;
            --card-bg: rgba(20, 8, 2, 0.85) !important;
            --text-color: #f97316 !important;
        }

        body.theme-anonymous {
            --bg-gradient: #0c0c0c !important;
            --panel-bg: rgba(255, 255, 255, 0.015) !important;
            --panel-border: rgba(255, 255, 255, 0.08) !important;
            --card-bg: rgba(20, 20, 20, 0.85) !important;
            --text-color: #ffffff !important;
        }

        body.theme-terminal {
            --bg-gradient: radial-gradient(circle at center, #051605 0%, #000000 100%) !important;
            --panel-bg: rgba(0, 255, 65, 0.025) !important;
            --panel-border: rgba(0, 255, 65, 0.18) !important;
            --card-bg: rgba(0, 10, 2, 0.85) !important;
            --text-color: #00ff41 !important;
        }

        body.theme-darkweb {
            --bg-gradient: radial-gradient(circle, #150000 0%, #020000 100%) !important;
            --panel-bg: rgba(255, 0, 0, 0.025) !important;
            --panel-border: rgba(255, 0, 0, 0.18) !important;
            --card-bg: rgba(10, 0, 0, 0.9) !important;
            --text-color: #ff3333 !important;
        }

        body.theme-acid {
            --bg-gradient: #020a02 !important;
            --panel-bg: rgba(204, 255, 0, 0.025) !important;
            --panel-border: rgba(204, 255, 0, 0.18) !important;
            --card-bg: rgba(3, 15, 3, 0.85) !important;
            --text-color: #ccff00 !important;
        }

        /* New: Aurora — a soft northern-lights palette with a slow-drifting glow. */
        body.theme-aurora {
            --bg-gradient: linear-gradient(160deg, #04121a 0%, #061a2b 45%, #041014 100%) !important;
            --panel-bg: rgba(94, 255, 200, 0.035) !important;
            --panel-border: rgba(120, 255, 214, 0.2) !important;
            --card-bg: rgba(4, 20, 24, 0.85) !important;
            --text-color: #7dffd0 !important;
        }
        body.theme-aurora::before {
            content: "";
            position: fixed;
            top: -20%; left: -20%; right: -20%; bottom: -20%;
            background:
                radial-gradient(ellipse 60% 40% at 20% 15%, rgba(125, 255, 208, 0.16) 0%, transparent 60%),
                radial-gradient(ellipse 50% 35% at 80% 25%, rgba(140, 120, 255, 0.14) 0%, transparent 60%),
                radial-gradient(ellipse 55% 30% at 50% 85%, rgba(80, 200, 255, 0.1) 0%, transparent 60%);
            filter: blur(6px);
            pointer-events: none;
            z-index: -1;
            animation: auroraDrift 16s ease-in-out infinite alternate;
        }
        @keyframes auroraDrift {
            0%   { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); opacity: 0.85; }
            50%  { transform: translate3d(2%, -3%, 0) rotate(2deg) scale(1.06); opacity: 1; }
            100% { transform: translate3d(-2%, 2%, 0) rotate(-1deg) scale(1.02); opacity: 0.9; }
        }

        body.theme-phantom {
            --bg-gradient: radial-gradient(circle at 50% 10%, #21103b 0%, #05020a 55%, #000 100%) !important;
            --panel-bg: rgba(168, 85, 247, 0.035) !important;
            --panel-border: rgba(192, 132, 252, 0.22) !important;
            --card-bg: rgba(12, 5, 22, 0.9) !important;
            --text-color: #d8b4fe !important;
        }
        body.theme-phantom::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.08), transparent 28%),
                radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.06), transparent 25%);
            z-index: -1;
        }

        /* Static dark fallback so the very first paint (before any JS runs)
           never shows the browser's default white. Real browsers repaint
           this to match the active theme exactly via mu_syncHtmlBg() below,
           but this covers the gap before that JS executes. */
        html {
            background: #000814;
            min-height: 100%;
        }

        html, body {
            /* Without this, a mobile rubber-band overscroll bounce at the
               top/bottom of the page reveals whatever is behind the
               document — here, <html>'s background — for the duration of
               the bounce. That's the "white flash at the bottom + theme
               jump" bug: disabling the bounce removes the visible gap
               entirely instead of just trying to color-match it. */
            overscroll-behavior-y: none;
        }

        body {
            font-family: 'Share Tech Mono', sans-serif;
            /* Base spacing plus the device's safe-area insets (notch, Dynamic Island,
               home-indicator, and — inside Telegram — its own edge chrome), so fixed/near-edge
               UI (corner controls, toast, modals) never sits under them. viewport-fit=cover
               above is what makes env(safe-area-inset-*) resolve to a real value instead of 0. */
            padding: calc(var(--spacing-sm) + env(safe-area-inset-top))
                     calc(var(--spacing-sm) + env(safe-area-inset-right))
                     calc(var(--spacing-sm) + env(safe-area-inset-bottom))
                     calc(var(--spacing-sm) + env(safe-area-inset-left));
            background: var(--bg-gradient);
            color: var(--text-color);
            /* 100vh is unreliable inside Telegram's in-app WebView (it changes as Telegram's
               own header/keyboard show or hide, leaving dead space or clipped content).
               --app-1vh is kept in sync with Telegram's real usable height by mu_setAppVh()
               below; plain 100vh is just the pre-JS/non-Telegram fallback. */
            min-height: 100vh;
            min-height: calc(var(--app-1vh, 1vh) * 100);
            text-align: center;
            box-sizing: border-box;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        p, span, h1, h2, h3, label, input, select, option, textarea, button, div {
            color: var(--text-color);
        }

        option {
            background-color: #111 !important;
            color: var(--text-color) !important;
        }

        input[type="color"] {
            cursor: pointer;
            height: 26px;
            width: 36px;
            padding: 0;
            border: 1px solid var(--panel-border);
            border-radius: var(--border-radius-sm);
            background: transparent;
            vertical-align: middle;
            transition: var(--transition-smooth);
        }
        
        input[type="color"]:hover { transform: scale(1.05); }

        /* Responsive Header Navigation */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
            padding: var(--spacing-xs) var(--spacing-sm);
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            direction: ltr !important;
            background: var(--panel-bg);
            border-radius: var(--border-radius-main);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .brand-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
        }

        .brand-logo {
            font-family: 'Share Tech Mono', monospace;
            padding: 2px 5px;
            user-select: none;
            unicode-bidi: bidi-override;
            direction: ltr;
            /* Was `transition: var(--transition-smooth)` (all 0.35s), which meant the
               logo's *color* animated in over 350ms on every theme change while the
               rest of the page (body's color has no transition) switched instantly —
               making the logo visibly lag behind. Scope the transition to just the
               properties the hover/typing effects use, so color changes instantly
               with everything else. */
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1),
                        text-shadow 0.35s cubic-bezier(0.25, 0.8, 0.25, 1),
                        font-size 0.35s cubic-bezier(0.25, 0.8, 0.25, 1),
                        letter-spacing 0.35s cubic-bezier(0.25, 0.8, 0.25, 1),
                        padding 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            white-space: nowrap;
            width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            box-sizing: border-box;
            font-size: 20px;
            font-weight: bold;
            text-align: left;
            letter-spacing: 1.5px;
        }

        .brand-logo:hover {
            transform: scale(1.02);
            text-shadow: 0 0 12px var(--text-color);
        }

        .brand-logo.typing {
            font-size: clamp(9px, 1.7vw, 13px) !important;
            letter-spacing: 0.4px !important;
            padding: 2px 3px !important;
            text-shadow: 0 0 8px var(--text-color);
            animation: markhinLogoTypingGlow 1.6s ease-in-out infinite;
        }

        .brand-logo.typing::after {
            content: '|';
            animation: blink 0.7s infinite;
            margin-left: 2px;
            color: var(--text-color);
        }

        .brand-logo.typing-out {
            animation: markhinLogoFadeSwap 0.4s ease;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes markhinLogoTypingGlow {
            0%, 100% { text-shadow: 0 0 6px var(--text-color); }
            50% { text-shadow: 0 0 14px var(--text-color); }
        }
        @keyframes markhinLogoFadeSwap {
            0% { opacity: 1; transform: translateY(0); }
            50% { opacity: 0; transform: translateY(-3px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .arcade-trigger-btn {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--panel-border);
            padding: 5px 10px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition-smooth);
            backdrop-filter: blur(4px);
        }

        .arcade-trigger-btn:hover {
            background: rgba(255,255,255,0.07);
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.18);
        }

        .arcade-trigger-btn:active {
            transform: translateY(0) scale(0.95);
            transition: transform 0.1s ease;
        }

        .top-right-controls {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 10020;
            display: flex;
            flex-direction: row;
            gap: 6px;
            align-items: center;
            padding: 5px;
            border: 1px solid var(--panel-border);
            border-radius: 11px;
            background: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 5px 18px rgba(0,0,0,.18);
        }

        .top-btn {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--panel-border);
            padding: 7px 12px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .top-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.18);
        }

        .top-btn:active {
            transform: translateY(0) scale(0.94);
            transition: transform 0.1s ease;
        }

        h2 {
            margin-top: 0;
            margin-bottom: var(--spacing-md);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .control-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: var(--spacing-md);
            border-radius: var(--border-radius-main);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
            margin-bottom: var(--spacing-md);
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid var(--panel-border);
            transition: var(--transition-smooth);
            position: relative;
            z-index: 1;
            box-sizing: border-box;
        }

        .search-box {
            width: min(100%, 390px);
            max-width: 390px;
            padding: 10px 18px;
            border-radius: 28px;
            border: 1px solid var(--panel-border);
            background: rgba(0, 0, 0, 0.22);
            font-size: 13px;
            outline: none;
            box-sizing: border-box;
            margin: 0 auto 16px;
            transition: var(--transition-smooth);
            text-align: center;
            font-family: inherit;
            text-overflow: ellipsis;
        }

        .search-tools-row{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:nowrap;margin-bottom:4px;width:100%}
        .search-tools-row .search-box{margin:0;flex:1 1 auto;width:auto;max-width:none;min-width:0}
        .search-tools-row #btnSmartSearch{flex:0 0 auto;min-width:145px;position:static;z-index:5;white-space:nowrap}

        @media (max-width: 520px){.search-tools-row{gap:8px}.search-tools-row #btnSmartSearch{min-width:0;padding:10px 12px;font-size:12px}.search-tools-row .search-box{padding:10px 12px;font-size:12px}}

        .search-box:focus {
            box-shadow: 0 0 18px rgba(255,255,255,0.04);
            transform: scale(1.01);
            background: rgba(0, 0, 0, 0.35);
            border-color: var(--text-color);
        }

        .search-box::placeholder { color: rgba(255,255,255,0.3); }

        .toolbar-section-box {
            background: rgba(0, 0, 0, 0.12);
            border-radius: var(--border-radius-main);
            border: 1px solid var(--panel-border);
            padding: var(--spacing-sm);
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
            transition: var(--transition-smooth);
        }
        
        .toolbar-section-box:hover { background: rgba(0, 0, 0, 0.22); }

        .toolbar-section-title {
            font-size: 11px;
            font-weight: 700;
            opacity: 0.7;
            text-align: right;
            margin-right: 4px;
        }
        
        html[dir="ltr"] .toolbar-section-title { text-align: left; margin-left: 4px; margin-right: 0; }

        .qa-box {
            display: flex;
            flex-wrap: nowrap;
            gap: 6px;
            justify-content: flex-start;
            width: 100%;
            align-items: center;
            box-sizing: border-box;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 4px 2px 6px;
            margin: -4px -2px -4px;
            -webkit-overflow-scrolling: touch;
        }
        .qa-box::-webkit-scrollbar { height: 4px; }

        .qa-input {
            flex: 1 1 90px;
            min-width: 60px;
            padding: 8px 12px;
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--panel-border);
            background: rgba(0, 0, 0, 0.28);
            font-size: 12px;
            font-family: inherit;
            outline: none;
            text-align: center;
            box-sizing: border-box;
            transition: var(--transition-smooth);
        }
        
        .qa-input:focus { border-color: var(--text-color); background: rgba(0,0,0,0.45); }

        .qa-lock-btn {
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--panel-border);
            border-radius: var(--border-radius-sm);
            padding: 8px 11px;
            cursor: pointer;
            font-size: 13px;
            transition: var(--transition-smooth);
            flex: 0 0 auto;
        }
        .qa-lock-btn:hover { background: rgba(255,255,255,0.09); transform: scale(1.05); }

        /* Keep the whole AI/Ask row — input, lock, Ask, settings gear — on one compact
           line instead of stretching or wrapping; it scrolls sideways only in the rare
           case a screen is too narrow to fit everything. */
        .qa-box .btn-main {
            flex: 0 0 auto;
            min-width: 0;
            padding: 8px 12px;
            font-size: 11px;
            white-space: nowrap;
        }
        @media (max-width: 420px) {
            .qa-box { gap: 5px; }
            .qa-box .qa-input { font-size: 11px; padding: 7px 8px; }
            .qa-box .qa-lock-btn { padding: 6px 8px; font-size: 12px; }
            .qa-box .btn-main { padding: 6px 8px; font-size: 10px; }
        }

        .qa-response-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--panel-border);
            border-radius: var(--border-radius-sm);
            padding: 14px;
            margin-top: 4px;
            width: 100%;
            font-size: 12px;
            display: none;
            text-align: right;
            line-height: 1.7;
            box-sizing: border-box;
            word-break: break-word;
            animation: slideDown 0.28s ease-out;
            backdrop-filter: blur(5px);
        }
        
        @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

        html[dir="ltr"] .qa-response-box { text-align: left; direction: ltr; }

        .toolbar-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }

        /* Keep Add/Delete Note + Add/Delete Folder on a single compact row instead of
           stacking: buttons shrink to their content (no flex-stretch/min-width) and the
           row scrolls horizontally only in the rare case a screen is too narrow to fit. */
        .toolbar-group-oneline {
            flex-wrap: nowrap;
            justify-content: flex-start;
            gap: 6px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 2px;
            -webkit-overflow-scrolling: touch;
        }
        .toolbar-group-oneline::-webkit-scrollbar { height: 4px; }
        .toolbar-group-oneline .btn-main {
            flex: 0 0 auto;
            min-width: 0;
            padding: 6px 10px;
            font-size: 11px;
            white-space: nowrap;
        }
        @media (max-width: 420px) {
            .toolbar-group-oneline .btn-main { padding: 5px 8px; font-size: 10px; gap: 3px; }
        }

        /* Compact single-line “structure management” layout: two pill-grouped
           clusters (note controls / folder controls) with a divider between them.
           The row keeps extra top/bottom padding so the hover-lift / active-press
           transform on the buttons never gets clipped by the scroll container’s
           overflow — previously it was cut off right at the top edge. */

<body class="theme-oceanic">
<script>
// Apply the saved theme class immediately, before the rest of the page renders.
// Previously the whole app (and the theme with it) only initialized on
// window.onload, which waits for every external resource (web fonts, CDN
// scripts) to finish loading. On a slow connection that could take seconds,
// during which the page sat in the default Oceanic theme and then visibly
// snapped to the user's real theme once everything finished loading.
// Keeps <html>'s background pixel-matched to <body>'s active theme
// gradient. Custom properties like --bg-gradient are set on body per
// theme class, and they only cascade DOWN to body's descendants — never
// up to html, body's own ancestor — so html can't just read the same
// variable. Instead we copy body's resolved (computed) background onto
// html directly, right after every theme switch.
window.mu_syncHtmlBg = function(){
    try{
        requestAnimationFrame(function(){
            var cs = getComputedStyle(document.body);
            document.documentElement.style.backgroundImage = cs.backgroundImage;
            document.documentElement.style.backgroundColor = cs.backgroundColor;
        });
    }catch(e){}
};

(function(){
    try{
        var saved = localStorage.getItem('app_theme_index_v13');
        if (saved === null) return;
        var idx = parseInt(saved, 10);
        if (!Number.isFinite(idx) || idx < 0) return;
        var classes = ['theme-oceanic','theme-phantom','theme-aurora','theme-spider','theme-galaxy','theme-cloudy','theme-dreamy','theme-cyberpunk','theme-love','theme-snowy','theme-rainy','theme-autumn','theme-anonymous','theme-terminal','theme-darkweb','theme-acid'];
        var cls = classes[idx];
        if (cls && cls !== 'theme-oceanic') {
            document.body.classList.remove('theme-oceanic');
            document.body.classList.add(cls);
        }
    }catch(e){}
    window.mu_syncHtmlBg();
})();
</script>

        // ... (بقیه کد جاوااسکریپت بدون تغییر باقی می‌ماند)
        // تمام فانکشن‌ها و منطق برنامه کاملاً حفظ شده‌اند

        /* =====================================================================
           TELEGRAM MINI APP — DOWNLOAD FIX
           ---------------------------------------------------------------------
           Telegram's in-app browser (the WebView Telegram itself renders Mini
           Apps in — on Android/iOS, not Telegram Desktop) silently swallows most
           normal download methods: clicking an <a download> on a blob:/data: URL
           fires no error at all, it just doesn't save anything. window.open() and
           Telegram.WebApp.openLink() are also restricted to real http(s) URLs —
           Telegram blocks blob:/data: there too, by design (see Telegram's own
           bug tracker: non-http(s) schemes don't work in anchor href, window.open,
           or openLink inside Mini Apps).
           Since this app has no backend to host generated files at a real URL,
           the two things that DO reliably work here are:
             1) navigator.share() — the native OS share sheet. This is a real
                browser API (not a Telegram link handler), so it works fine on
                native Telegram for iOS/Android.
             2) Reopening THIS SAME PAGE in the user's system browser (Chrome/
                Safari) via Telegram.WebApp.openLink(), with the file's data
                packed into the URL's hash fragment. Because it's a genuine
                https:// URL (just with extra data after the #), Telegram allows
                it — and once that page loads in a *real* browser tab, a normal
                download works exactly the way it always has, because the tab is
                no longer restricted by Telegram's WebView.
           robustDownload() below tries these first whenever we detect we're
           inside Telegram, before falling back to the older methods (which are
           kept as a last resort for Telegram Desktop, where the WebView is more
           capable and this often isn't even necessary).
           ===================================================================== */
        const TG = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
        const IS_TELEGRAM = !!TG || /Telegram/i.test(navigator.userAgent || '');
        try { TG && TG.ready && TG.ready(); TG && TG.expand && TG.expand(); } catch (_) {}

        /* ---- real usable viewport height (fixes wasted/clipped space in Telegram) ----
           Plain 100vh inside Telegram's in-app WebView is unreliable: it doesn't track
           Telegram's own collapsing header, safe areas, or the keyboard, so the page can
           either leave blank space at the bottom or get cut off. TG.viewportStableHeight
           (when available) is Telegram's own answer to "how tall is my usable area right
           now" — we mirror it into a CSS var every time it changes, and body/#gameModal
           above consume that var instead of vh. Outside Telegram this just tracks
           window.innerHeight, which also happens to fix the classic mobile-browser
           address-bar 100vh jump for free. */
        function mu_setAppVh(){
            try{
                const h = (TG && TG.viewportStableHeight) ? TG.viewportStableHeight : window.innerHeight;
                document.documentElement.style.setProperty('--app-1vh', (h * 0.01) + 'px');
            }catch(_){}
        }
        mu_setAppVh();
        window.addEventListener('resize', mu_setAppVh);
        try { TG && TG.onEvent && TG.onEvent('viewportChanged', mu_setAppVh); } catch (_) {}

        /* ---- blend Telegram's native header/background with the app instead of leaving
           it on Telegram's default (often light) color, which otherwise shows as a
           mismatched bar above the app on first load. Every theme in this app is a dark
           navy/black gradient, so one dark approximation is enough to blend all of them —
           this isn't meant to track theme switches pixel-for-pixel. */
        try {
            if (TG) {
                const bg = '#03101c';
                TG.setHeaderColor && TG.setHeaderColor(bg);
                TG.setBackgroundColor && TG.setBackgroundColor(bg);
            }
        } catch (_) {}

        // Cap on how much file data we'll try to hand off through the URL hash.
        // There's no hard spec limit, but very long URLs risk being truncated or
        // rejected by the OS-level "open externally" call, so we stay well under
        // where that starts becoming a real risk.
        const TG_BRIDGE_MAX_BLOB_BYTES = 3 * 1024 * 1024;

        // Reopens this page in the user's real browser with `blob` waiting to be
        // downloaded there. Returns true if the handoff was launched (not a
        // guarantee the user completed it), false if it couldn't be attempted.
        async function tgOpenInSystemBrowser(blob, filename, mime) {
            if (!IS_TELEGRAM || !blob) return false;
            if (blob.size > TG_BRIDGE_MAX_BLOB_BYTES) return false;
            try {
                const dataUrl = await new Promise((resolve, reject) => {
                    const r = new FileReader();
                    r.onload = () => resolve(r.result);
                    r.onerror = reject;
                    r.readAsDataURL(blob);
                });
                const base = location.href.split('#')[0];
                const bridgeUrl = base + '#tgdl=' + encodeURIComponent(dataUrl) + '&tgname=' + encodeURIComponent(filename || 'download');
                if (TG && TG.openLink) {
                    TG.openLink(bridgeUrl, { try_instant_view: false });
                } else {
                    window.open(bridgeUrl, '_blank');
                }
                return true;
            } catch (e) {
                console.warn('Telegram system-browser bridge failed', e);
                return false;
            }
        }

        // If this page was just reopened by the bridge above — i.e. it's now
        // running in a normal browser tab outside Telegram — immediately deliver
        // the waiting file for real and show a small confirmation screen.
        (function tgHandleIncomingDownload() {
            const hash = location.hash || '';
            const m = /[#&]tgdl=([^&]+)/.exec(hash);
            if (!m) return;
            try {
                const dataUrl = decodeURIComponent(m[1]);
                const nameMatch = /[#&]tgname=([^&]+)/.exec(hash);
                const name = nameMatch ? decodeURIComponent(nameMatch[1]) : 'download';
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = name;
                document.body.appendChild(a);
                a.click();
                a.remove();
                try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
                const fa = !/^en/i.test(navigator.language || '');
                const box = document.createElement('div');
                box.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#03192c;color:#90e0ef;font-family:Tahoma,sans-serif;text-align:center;padding:24px;direction:' + (fa ? 'rtl' : 'ltr') + ';';
                const safeName = String(name).replace(/[<>&]/g, '');
                box.innerHTML = '<div><div style="font-size:40px;margin-bottom:12px">✅</div><div style="font-size:16px;line-height:1.9">' +
                    (fa ? ('دانلود فایل «' + safeName + '» شروع شد.<br>حالا می‌توانید این تب را ببندید و به تلگرام برگردید.')
                         : ('The download for “' + safeName + '” has started.<br>You can close this tab and go back to Telegram now.')) +
                    '</div></div>';
                document.body.appendChild(box);
            } catch (e) { console.warn('Incoming Telegram download bridge failed', e); }
        })();

        /* =====================================================================
           TELEGRAM CLOUD STORAGE — cross-device text backup
           ---------------------------------------------------------------------
           Right now every note lives only in this browser's localStorage — tied
           to one device, and gone if Telegram ever clears WebView storage.
           Telegram.WebApp.CloudStorage keeps small pieces of data attached to
           the user's account and synced across every device they open this
           Mini App from. Its hard limits: at most 1024 keys, each value up to
           4096 characters — nowhere near enough for embedded base64 images (a
           single photo can be hundreds of KB), so this backs up note TEXT and
           metadata only; images always stay local-only on the device that has
           them. The JSON payload is split across as many small `mk_c{n}` keys
           as needed, with an `mk_meta` key describing how many chunks exist.
           This is a manual backup/restore via Dashboard → ☁️ Cloud Backup, not
           silent auto-merging — so it can never quietly overwrite a newer local
           edit with a stale cloud copy. Auto-backup (scheduleCloudBackup) only
           ever *pushes* the latest data up; pulling back down always requires
           the person to tap Restore and confirm.
           ===================================================================== */
        const hasCloudStorage = !!(TG && TG.CloudStorage);
        const CLOUD_CHUNK_SIZE = 3500; // safely under Telegram's 4096-char/value limit
        const CLOUD_META_KEY = 'mk_meta';
        const CLOUD_CHUNK_PREFIX = 'mk_c';

        function cloudGetItem(key) {
            return new Promise((resolve) => {
                try { TG.CloudStorage.getItem(key, (err, val) => resolve(err ? null : val)); }
                catch (e) { resolve(null); }
            });
        }
        function cloudGetItems(keys) {
            return new Promise((resolve) => {
                if (!keys.length) { resolve({}); return; }
                try { TG.CloudStorage.getItems(keys, (err, vals) => resolve(err ? {} : (vals || {}))); }
                catch (e) { resolve({}); }
            });
        }
        function cloudSetItem(key, value) {
            return new Promise((resolve) => {
                try { TG.CloudStorage.setItem(key, value, (err, ok) => resolve(!err && ok !== false)); }
                catch (e) { resolve(false); }
            });
        }
        function cloudRemoveItems(keys) {
            return new Promise((resolve) => {
                if (!keys.length) { resolve(true); return; }
                try { TG.CloudStorage.removeItems(keys, (err, ok) => resolve(!err)); }
                catch (e) { resolve(false); }
            });
        }

        // Strips embedded <img> markup (the one thing that can make a note huge)
        // so the rest of its text/metadata has a real shot at fitting the cloud
        // budget. Images are never part of the cloud backup — only a placeholder
        // note that one lived in this spot, so restoring text elsewhere doesn't
        // silently lose the fact that an image used to be there.
        function cloudStripImages(html) {
            const placeholder = currentLang === 'fa' ? '[تصویر — فقط روی همین دستگاه]' : '[image — this device only]';
            return String(html || '')
                .replace(/<div class="img-drag-wrapper"[\s\S]*?<\/div>\s*(<\/div>)?/g, placeholder)
                .replace(/<img[^>]*>/g, placeholder);
        }

        async function cloudBuildPayload() {
            // Most-recently-edited notes first, so if we run out of budget it's
            // the oldest/least-touched notes left out, not the one being worked on.
            const sorted = categories.slice().sort((a, b) => (Date.parse(b.lastEdited) || 0) - (Date.parse(a.lastEdited) || 0));
            let included = sorted.map(item => ({
                id: item.id, name: item.name, folder: item.folder,
                text: item.text, html: cloudStripImages(item.html),
                tags: item.tags, pinned: item.pinned, favorite: item.favorite,
                lastEdited: item.lastEdited
            }));
            const totalNotes = included.length;
            const customFolders = folders.filter(f => f !== DEFAULT_FOLDER);
            let skipped = 0;
            let json = JSON.stringify({ v: 1, ts: Date.now(), folders: customFolders, notes: included });
            const budget = CLOUD_CHUNK_SIZE * 900; // stay well under Telegram's 1024-key ceiling
            while (json.length > budget && included.length > 1) {
                included = included.slice(0, -1);
                skipped++;
                json = JSON.stringify({ v: 1, ts: Date.now(), folders: customFolders, notes: included });
            }
            return { json, skipped, totalNotes };
        }

        let __cloudBackupTimer = null;
        function scheduleCloudBackup() {
            if (!IS_TELEGRAM || !hasCloudStorage) return;
            clearTimeout(__cloudBackupTimer);
            __cloudBackupTimer = setTimeout(() => { cloudBackupNow().catch(e => console.warn('Cloud backup failed', e)); }, 3000);
        }

        async function cloudBackupNow() {
            if (!hasCloudStorage) return { ok: false, reason: 'unavailable' };
            const { json, skipped, totalNotes } = await cloudBuildPayload();
            const chunks = [];
            for (let i = 0; i < json.length; i += CLOUD_CHUNK_SIZE) chunks.push(json.slice(i, i + CLOUD_CHUNK_SIZE));

            const prevMetaRaw = await cloudGetItem(CLOUD_META_KEY);
            const prevMeta = prevMetaRaw ? safeParseJSON(prevMetaRaw, null) : null;
            const prevCount = (prevMeta && prevMeta.n) || 0;

            for (let i = 0; i < chunks.length; i++) {
                const ok = await cloudSetItem(CLOUD_CHUNK_PREFIX + i, chunks[i]);
                if (!ok) return { ok: false, reason: 'write-failed' };
            }
            // Clean up leftover chunk keys from a previous, larger backup.
            if (prevCount > chunks.length) {
                const stale = [];
                for (let i = chunks.length; i < prevCount; i++) stale.push(CLOUD_CHUNK_PREFIX + i);
                await cloudRemoveItems(stale);
            }
            const meta = { n: chunks.length, ts: Date.now(), notes: totalNotes - skipped, skipped };
            await cloudSetItem(CLOUD_META_KEY, JSON.stringify(meta));
            return { ok: true, meta };
        }

        async function cloudRestore() {
            if (!hasCloudStorage) return null;
            const metaRaw = await cloudGetItem(CLOUD_META_KEY);
            const meta = metaRaw ? safeParseJSON(metaRaw, null) : null;
            if (!meta || !meta.n) return null;
            const keys = []; for (let i = 0; i < meta.n; i++) keys.push(CLOUD_CHUNK_PREFIX + i);
            const parts = await cloudGetItems(keys);
            const json = keys.map(k => parts[k] || '').join('');
            const data = safeParseJSON(json, null);
            if (!data || !Array.isArray(data.notes)) return null;
            return { meta, data };
        }

         * on a note (base fields + Tags/Pin/Favorite/Fake Note/Font/Size + advanced-system

         */
        function normalizeCategory(item, index) {
            const src = item && typeof item === 'object' ? item : {};
            return {
                id: String(src.id ?? `${Date.now()}_${index}_${Math.random().toString(36).slice(2,7)}`),
                name: String(src.name ?? `Note ${index + 1}`),
                folder: typeof src.folder === 'string' ? src.folder : '',

                password: typeof src.password === 'string' ? src.password : '',
                hint: typeof src.hint === 'string' ? src.hint : '',
                isDecoy: false,
                // Advanced-system fields (Time Capsule / Ghost Note / Decay).
                // These now live directly on the note itself instead of a second
                // localStorage key that had to be kept in sync by hand — one source
                // of truth, and any backup/snapshot/import that carries the note
                // automatically carries these too.
                unlockAt: src.unlockAt ?? '',
                ghostUntil: src.ghostUntil ?? '',
                decayLevel: Number(src.decayLevel || 0),
                decayManual: !!src.decayManual,
                // Feature-pack fields: Tags / Pin / Favorite / Fake Note / Font / Size.
                tags: Array.isArray(src.tags) ? src.tags.filter(Boolean).map(String) : [],
                pinned: !!src.pinned,
                favorite: !!src.favorite,
                fakeContent: typeof src.fakeContent === 'string' ? src.fakeContent : '',
                fontFamily: typeof src.fontFamily === 'string' ? src.fontFamily : '',

        function promptUnlockQa() {
            const lockedItems = categories.filter(item => item.password);
            if (lockedItems.length === 0) {
                alert("هیچ یادداشت رمزگذاری‌شده‌ای وجود ندارد.");
                return;

            let promptStr = "وضعیت قفل یادداشت‌ها برای بخش پرسش:\n";
            lockedItems.forEach((item, index) => {
                const isUnlocked = unlockedQaIds.includes(item.id);
                promptStr += `${index + 1}: ${item.name} [${isUnlocked ? 'باز 🔓' : 'قفل 🔒'}]\n`;
            });
            promptStr += "\nشماره یادداشتی که می‌خواهید وضعیت قفل آن را تغییر دهید وارد کنید:";

            const userChoice = prompt(promptStr);
            if (!userChoice) return;

            let targetItem = null;
            const choiceNum = parseInt(userChoice, 10);
            if (!isNaN(choiceNum) && choiceNum > 0 && choiceNum <= lockedItems.length) {
                targetItem = lockedItems[choiceNum - 1];
            } else {
                targetItem = lockedItems.find(i => i.name.toLowerCase() === userChoice.trim().toLowerCase());
            }

            if (!targetItem) {
                alert("مورد یافت نشد.");
                return;
            }

            if (unlockedQaIds.includes(targetItem.id)) {
                if (confirm(`آیا می‌خواهید قفل یادداشت "${targetItem.name}" را برای پرسش دوباره ببندید؟`)) {

            } else {

                if (pass && pass.trim().toLowerCase() === 'hint') {

                    return;

                if (pass === targetItem.password) {

            updateLockBtnState();
        }

        function askQuestion() {
            const query = normalizeText(document.getElementById('qaInput').value);
            const resBox = document.getElementById('qaResponse');
            const t = i18n[currentLang];

            if (!query) {
                resBox.style.display = 'none';
                return;
            }

            const stopWords = ["من", "چند", "سالمه", "چیست", "کجا", "کی", "است", "چه", "را", "در", "و", "از", "با", "آن", "این", "how", "what", "where", "who", "is", "am", "are", "my", "old", "the", "a", "an", "in", "on", "at", "to", "for"];
            const rawKeywords = query.split(/\s+/).filter(w => w.length > 1 && !stopWords.includes(w));

            const synonymMap = {
                "password": ["رمز", "پسورد", "کلمه عبور", "pass"],
                "رمز": ["password", "pass", "code"],
                "email": ["ایمیل", "پست الکترونیکی", "mail"],
                "ایمیل": ["email", "mail"],
                "phone": ["تلفن", "شماره", "موبایل", "call"],
                "تلفن": ["phone", "mobile", "number"],
                "name": ["نام", "اسم"],
                "نام": ["name"],
                "address": ["آدرس", "نشانی"],
                "آدرس": ["address"]
            };

            let expandedKeywords = [...rawKeywords];
            rawKeywords.forEach(kw => {
                if (synonymMap[kw]) {
                    expandedKeywords.push(...synonymMap[kw]);
                }
            });

            let bestMatch = null;
            let highestScore = 0;
            let matchingSentence = "";

            categories.forEach(item => {
                if (item.password && !unlockedQaIds.includes(item.id)) return;
                if (item.isDecoy) return;

                const textContent = normalizeText(item.text || '');
                const nameContent = normalizeText(item.name);
                const sentences = textContent.split(/[.\n!؟?]+/);

                sentences.forEach(sentence => {
                    let score = 0;
                    expandedKeywords.forEach(kw => {
                        const normalizedKw = normalizeText(kw);
                        if (normalizedKw && sentence.includes(normalizedKw)) {
                            score += normalizedKw === query ? 3 : 1;
                        }
                    });

                    if (nameContent.includes(query)) score += 3;

                    if (score > highestScore) {
                        highestScore = score;
                        bestMatch = item;
                        matchingSentence = sentence.trim();
                    }
                });
            });

            if (bestMatch && highestScore > 0 && matchingSentence) {
                resBox.innerHTML = `💡 <b>پاسخ:</b> با توجه به یادداشت «<b>${escapeHtml(bestMatch.name)}</b>»:\n"${escapeHtml(matchingSentence)}"`;
                resBox.style.display = 'block';
            } else {
                let foundItem = categories.find(c => (!c.password || unlockedQaIds.includes(c.id)) && !c.isDecoy && (c.text || "").toLowerCase().includes(query));
                if (foundItem) {
                    resBox.innerHTML = `💡 <b>پاسخ:</b> با توجه به یادداشت «<b>${escapeHtml(foundItem.name)}</b>»:\n"${escapeHtml(foundItem.text)}"`;
                    resBox.style.display = 'block';
                } else {
                    resBox.innerHTML = `❓ ${t.noQaAnswer}`;
                    resBox.style.display = 'block';
                }
            }
        }

        function escapeHtml(string) {
            return String(string || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function normalizeText(value) {
            return String(value ?? '')
                .toLocaleLowerCase('fa')
                .replace(/[يى]/g, 'ی')
                .replace(/ك/g, 'ک')
                .replace(/ۀ/g, 'ه')
                .replace(/‌/g, ' ')
                .replace(/[۰-۹]/g, d => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))
                .replace(/\s+/g, ' ')
                .trim();
        }

        function showToast(message, duration = 1800) {

            showToast.timer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        function safeParseJSON(value, fallback) {
            try {
                const parsed = JSON.parse(value);
                return parsed ?? fallback;
            } catch (_) {
                return fallback;
            }
        }

        function sanitizeHtml(html) {
            const template = document.createElement('template');
            template.innerHTML = String(html ?? '');
            const allowedTags = new Set(['B','STRONG','I','EM','U','S','BR','P','DIV','SPAN','UL','OL','LI','BLOCKQUOTE','PRE','CODE','A','IMG','AUDIO','BUTTON']);
            const walker = document.createTreeWalker(template.content, NodeFilter.SHOW_ELEMENT);
            const elements = [];
            while (walker.nextNode()) elements.push(walker.currentNode);

            elements.forEach(el => {
                if (!allowedTags.has(el.tagName)) {
                    el.replaceWith(document.createTextNode(el.textContent || ''));
                    return;
                }
                [...el.attributes].forEach(attr => {
                    const name = attr.name.toLowerCase();
                    const value = attr.value.trim();
                    const common = ['class','id','contenteditable','draggable','aria-label'];
                    const keep = common.includes(name) ||
                        (el.tagName === 'A' && ['href','target','rel'].includes(name)) ||
                        (el.tagName === 'IMG' && ['src','alt','width','height'].includes(name)) ||
                        (el.tagName === 'AUDIO' && ['src','controls'].includes(name)) ||
                        (el.tagName === 'BUTTON' && name === 'type');
                    if (name.startsWith('on') || !keep) el.removeAttribute(attr.name);
                    if (name === 'href' && !/^(https?:|mailto:)/i.test(value)) el.removeAttribute(attr.name);
                    if (name === 'src' && !/^(https?:|data:image\/|data:audio\/)/i.test(value)) el.removeAttribute(attr.name);
                });
                if (el.tagName === 'A') {
                    el.setAttribute('target', '_blank');
                    el.setAttribute('rel', 'noopener noreferrer');
                }
                if (el.tagName === 'IMG') {
                    el.setAttribute('draggable', 'true');
                }
            });
            return template.innerHTML;
        }

        function getVisibleCategories() {
            const query = getSearchQuery();

                ? categories.filter(c => !!c.favorite)

                    ? categories

            if (!query) return visible;
            return visible.filter(item =>

        async function toggleAudioRecording(id) {
            if (activeRecId && activeRecId !== id) {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                return;
            }
            if (activeRecId === id) {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
                return;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('دستگاه/مرورگر شما از ضبط صدا پشتیبانی نمی‌کند.');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                const mimeCandidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
                const mimeType = mimeCandidates.find(type => window.MediaRecorder?.isTypeSupported?.(type));
                mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
                activeRecId = id;
                renderContents();

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder?.mimeType || 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        insertAudioToNote(id, e.target.result);
                    };
                    reader.readAsDataURL(audioBlob);
                    
                    stream.getTracks().forEach(track => track.stop());
                    activeRecId = null;
                    renderContents();
                };

                mediaRecorder.start();
            } catch (err) {
                alert('دسترسی به میکروفون داده نشد.');
            }
        }

        function startNeonSnake() {
            document.getElementById('gameSelectMenu').style.display = 'none';
            document.getElementById('gamePlayArea').style.display = 'block';
            document.getElementById('gameTitleActive').innerText = 'NEON SNAKE';
            document.getElementById('gameDescActive').innerText = 'با کلیدهای جهت‌نما یا لمس صفحه (کشیدن دست) مار را هدایت کنید!';

            clearGameEvents();
            const canvas = document.getElementById('cyberCanvas');
            const ctx = canvas.getContext('2d');
            const gridSize = 15;
            let snake = [{x: 150, y: 150}, {x: 135, y: 150}, {x: 120, y: 150}];
            let dx = gridSize, dy = 0;
            let nextDx = dx, nextDy = dy;
            let food = {x: 0, y: 0};
            gameScore = 0;
            document.getElementById('gameScore').innerText = 'امتیاز: ' + gameScore;

            function spawnFood() {
                const cellsX = Math.floor(canvas.width / gridSize);
                const cellsY = Math.floor(canvas.height / gridSize);
                let attempts = 0;
                do {
                    food.x = Math.floor(Math.random() * cellsX) * gridSize;
                    food.y = Math.floor(Math.random() * cellsY) * gridSize;
                    attempts++;
                } while (snake.some(part => part.x === food.x && part.y === food.y) && attempts < 100);
            }
            spawnFood();

            window.addEventListener('keydown', (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
                if (e.key === 'ArrowUp' && dy === 0) { nextDx = 0; nextDy = -gridSize; }
                if (e.key === 'ArrowDown' && dy === 0) { nextDx = 0; nextDy = gridSize; }
                if (e.key === 'ArrowLeft' && dx === 0) { nextDx = -gridSize; nextDy = 0; }
                if (e.key === 'ArrowRight' && dx === 0) { nextDx = gridSize; nextDy = 0; }
            }, { signal: gameAborter.signal });

            let touchStartX = null, touchStartY = null;
            
            canvas.addEventListener('touchstart', e => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                e.preventDefault(); 
            }, { passive: false, signal: gameAborter.signal });
            
            canvas.addEventListener('touchmove', e => {
                if (!touchStartX || !touchStartY) return;
                let diffX = e.touches[0].clientX - touchStartX;
                let diffY = e.touches[0].clientY - touchStartY;
                
                if (Math.abs(diffX) > 20 || Math.abs(diffY) > 20) {
                    if (Math.abs(diffX) > Math.abs(diffY)) {
                        if (diffX > 0 && dx === 0) { nextDx = gridSize; nextDy = 0; }
                        else if (diffX < 0 && dx === 0) { nextDx = -gridSize; nextDy = 0; }
                    } else {
                        if (diffY > 0 && dy === 0) { nextDx = 0; nextDy = gridSize; }
                        else if (diffY < 0 && dy === 0) { nextDx = 0; nextDy = -gridSize; }
                    }
                    touchStartX = null; 
                    touchStartY = null;
                }
                e.preventDefault(); 
            }, { passive: false, signal: gameAborter.signal });

            currentGameInterval = setInterval(() => {
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                dx = nextDx; dy = nextDy;
                let head = {x: snake[0].x + dx, y: snake[0].y + dy};

                if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                    if (currentGameInterval) {
                        backToGameMenu();
                        alert('بازی تمام شد! امتیاز شما: ' + gameScore);
                    }
                    return;
                }

                const ateFood = (head.x === food.x && head.y === food.y);
                // If the snake isn't eating this tick, its tail is about to move
                // away (see snake.pop() below), so the cell the tail currently
                // occupies is not actually a collision — exclude it from the check.
                // Eating keeps the tail in place, so then it's checked like any
                // other body segment.
                const bodyToCheck = ateFood ? snake : snake.slice(0, -1);
                for (let i = 0; i < bodyToCheck.length; i++) {
                    if (head.x === bodyToCheck[i].x && head.y === bodyToCheck[i].y) {
                        backToGameMenu();
                        alert('بازی تمام شد! امتیاز شما: ' + gameScore);
                        return;
                    }
                }

                snake.unshift(head);

                if (ateFood) {
                    gameScore += 10;
                    document.getElementById('gameScore').innerText = 'امتیاز: ' + gameScore;
                    spawnFood();
                } else {
                    snake.pop();
                }

                ctx.fillStyle = '#ff0055';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0055';
                ctx.fillRect(food.x, food.y, gridSize - 2, gridSize - 2);

                ctx.fillStyle = '#00f0ff';
                ctx.shadowColor = '#00f0ff';
                snake.forEach((part, index) => {
                    ctx.fillRect(part.x, part.y, gridSize - 2, gridSize - 2);
                });
                ctx.shadowBlur = 0;
            }, 100);
        }

        function startCyberFlappy() {
            document.getElementById('gameSelectMenu').style.display = 'none';
            document.getElementById('gamePlayArea').style.display = 'block';
            document.getElementById('gameTitleActive').innerText = 'CYBER FLAPPY';
            document.getElementById('gameDescActive').innerText = 'برای پرش روی صفحه لمس کنید یا کلید Space را فشار دهید!';

            clearGameEvents();
            const canvas = document.getElementById('cyberCanvas');
            const ctx = canvas.getContext('2d');
            
            let birdY = 150, birdVy = 0, gravity = 0.6, jump = -8;
            let pipes = [];
            let gameOver = false;
            let frame = 0;
            gameScore = 0;
            document.getElementById('gameScore').innerText = 'امتیاز: ' + gameScore;

            function triggerJump() {
                birdVy = jump;
            }

            window.addEventListener('keydown', (e) => { 
                if (e.code === 'Space') { 
                    triggerJump(); 
                    e.preventDefault(); 
                } 
            }, { signal: gameAborter.signal });
            
            canvas.addEventListener('mousedown', (e) => { 
                triggerJump(); 
                e.preventDefault(); 
            }, { signal: gameAborter.signal });

            canvas.addEventListener('touchstart', (e) => {
                triggerJump();
                e.preventDefault();
            }, { passive: false, signal: gameAborter.signal });

            currentGameInterval = setInterval(() => {
                frame++;
                birdVy += gravity;
                birdY += birdVy;

                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (frame % 90 === 0) {
                    let gapH = 100;
                    let topH = Math.floor(Math.random() * (canvas.height - gapH - 80)) + 40;
                    pipes.push({ x: canvas.width, top: topH, bottom: canvas.height - topH - gapH, passed: false });
                }

                ctx.fillStyle = '#00ff66';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#00ff66';
                pipes.forEach(p => {
                    p.x -= 3;
                    ctx.fillRect(p.x, 0, 35, p.top);
                    ctx.fillRect(p.x, canvas.height - p.bottom, 35, p.bottom);

                    if (!p.passed && p.x < 50) {
                        p.passed = true;
                        gameScore += 5;
                        document.getElementById('gameScore').innerText = 'امتیاز: ' + gameScore;
                    }

                    if (50 + 15 > p.x && 50 - 15 < p.x + 35) {
                        if (birdY - 10 < p.top || birdY + 10 > canvas.height - p.bottom) {
                            if (gameOver) return;
                            gameOver = true;
                            backToGameMenu();
                            alert('باختید! امتیاز شما: ' + gameScore);
                        }
                    }
                });
                ctx.shadowBlur = 0;

                pipes = pipes.filter(p => p.x > -40);

                if (birdY > canvas.height || birdY < 0) {
                    if (!gameOver) {
                        gameOver = true;
                        backToGameMenu();
                        alert('باختید! امتیاز شما: ' + gameScore);
                    }
                }

                ctx.beginPath();
                ctx.arc(50, birdY, 12, 0, Math.PI * 2);
                ctx.fillStyle = '#00f0ff';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#00f0ff';
                ctx.fill();
                ctx.shadowBlur = 0;

            }, 30);
        }

        function initCanvas(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            if (canvas.dataset.ready !== '1') {
                canvasStates[id] = {
                    isDrawing: false,
                    startX: 0,
                    startY: 0,
                    snapshot: null,
                    history: [],
                    maxHistory: 20
                };
                canvas.dataset.ready = '1';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                saveCanvasState(id);
            }

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function startDraw(e) {
                const st = canvasStates[id];
                st.isDrawing = true;
                const pos = getPos(e);
                st.startX = pos.x;
                st.startY = pos.y;

                ctx.beginPath();
                ctx.moveTo(st.startX, st.startY);
                st.snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            }

            function moveDraw(e) {
                const st = canvasStates[id];
                if (!st.isDrawing) return;
                const pos = getPos(e);

                const modeEl = document.getElementById(`draw-mode-${id}`);
                const colorEl = document.getElementById(`draw-color-${id}`);
                const sizeEl = document.getElementById(`draw-size-${id}`);
                const mode = modeEl?.value || 'draw';
                const color = colorEl?.value || '#000000';
                const size = Math.max(1, Math.min(100, parseInt(sizeEl?.value, 10) || 3));

                ctx.lineWidth = size;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (mode === 'draw') {
                    ctx.strokeStyle = color;
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                } else if (mode === 'eraser') {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                } else if (mode === 'rect' || mode === 'circle') {
                    ctx.putImageData(st.snapshot, 0, 0);
                    ctx.strokeStyle = color;
                    ctx.beginPath();

                    if (mode === 'rect') {
                        ctx.strokeRect(st.startX, st.startY, pos.x - st.startX, pos.y - st.startY);
                    } else if (mode === 'circle') {
                        const radius = Math.sqrt(Math.pow(pos.x - st.startX, 2) + Math.pow(pos.y - st.startY, 2));
                        ctx.arc(st.startX, st.startY, radius, 0, 2 * Math.PI);
                        ctx.stroke();
                    }
                }
            }

            function stopDraw() {
                const st = canvasStates[id];
                if (st && st.isDrawing) {
                    st.isDrawing = false;
                    ctx.closePath();
                    saveCanvasState(id);
                }
            }

            canvas.onmousedown = startDraw;
            canvas.onmousemove = moveDraw;
            canvas.onmouseup = stopDraw;
            canvas.onmouseleave = stopDraw;

            canvas.ontouchstart = (e) => { e.preventDefault(); startDraw(e); };
            canvas.ontouchmove = (e) => { e.preventDefault(); moveDraw(e); };
            canvas.ontouchend = (e) => { e.preventDefault(); stopDraw(); };
            canvas.ontouchcancel = (e) => { e.preventDefault(); stopDraw(); };
        }

        function saveCanvasState(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const st = canvasStates[id];
            if (!st) return;

            if (st.history.length >= st.maxHistory) st.history.shift();
            st.history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        }

        function undoCanvas(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const st = canvasStates[id];

            if (st && st.history.length > 1) {
                st.history.pop();
                ctx.putImageData(st.history[st.history.length - 1], 0, 0);
            }
        }

        function clearCanvas(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            if (canvas) {
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                saveCanvasState(id);
            }
        }

        function resizeCanvas(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            const wInput = document.getElementById(`draw-w-${id}`);
            const hInput = document.getElementById(`draw-h-${id}`);

            const oldWidth = canvas.width;
            const oldHeight = canvas.height;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = oldWidth;
            tempCanvas.height = oldHeight;
            tempCanvas.getContext('2d').drawImage(canvas, 0, 0);

            const width = Math.max(120, Math.min(1200, parseInt(wInput?.value, 10) || 350));
            const height = Math.max(80, Math.min(900, parseInt(hInput?.value, 10) || 180));
            if (wInput) wInput.value = width;
            if (hInput) hInput.value = height;
            canvas.width = width;
            canvas.height = height;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(tempCanvas, 0, 0, oldWidth, oldHeight, 0, 0, width, height);

            const st = canvasStates[id];
            if (st) st.history = [];
            saveCanvasState(id);
        }

        async function translateText(id, sourceLang, targetLang) {
            const t = i18n[currentLang];
            const textEl = document.getElementById(`text-${id}`);
            if (!textEl) return;

            const sourceText = textEl.textContent.trim();
            if (!sourceText) {
                alert(t.noTextToTranslate);
                return;
            }

            // Translating rewrites the note as plain translated text, so anything that
            // isn't plain text — images, audio, drawings, tables, links — would be lost
            // in the process. Only ask when the note actually has any of that.
            if (textEl.querySelector('img,audio,canvas,table,a')) {
                const warnMsg = currentLang === 'fa'
                    ? 'ترجمه، تصاویر/صدا/جدول/لینک داخل این یادداشت را حذف می‌کند و فقط متن ساده‌ی ترجمه‌شده باقی می‌ماند. ادامه می‌دهید؟'
                    : 'Translating will remove any images, audio, tables, or links in this note, leaving only the translated plain text. Continue?';
                if (!confirm(warnMsg)) return;
            }

            const originalContent = textEl.innerHTML;
            textEl.innerText = t.translating;

            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(sourceText)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data && data[0]) {
                    let translatedText = data[0].map(item => item[0]).join('');
                    textEl.innerText = translatedText;
                    
                    const item = categories.find(c => c.id === id);
                    if (item) {
                        item.html = textEl.innerHTML;
                        // textContent drops <br> line breaks entirely; use the same
                        // attached-clone extraction as everywhere else so the saved
                        // text keeps the translated line breaks.
                        item.text = textWithVisualSpacing(textEl).replace(/\u00a0/g, ' ');

                        item.lastEdited = new Date().toUTCString();

                        saveToLocalStorage();
                    }
                } else {
                    alert(t.translationError);
                    textEl.innerHTML = originalContent;
                }
            } catch (error) {
                alert(t.serverError);
                textEl.innerHTML = originalContent;
            }
        }

            try {

            // rendered, so its innerText silently collapses blank lines and <br>s.
