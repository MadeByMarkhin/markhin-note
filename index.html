        // Extract text for TXT export while preserving real line breaks and whitespace.
        // textContent collapses structural breaks between div/p elements, so innerText is
        // preferred when the note is currently rendered in the editor.
        //
        // NOTE: this used to also approximate the note editor's cosmetic
        // letter-spacing (.text-box's default 0.15px) by inserting a real
        // Unicode hair-space character between every single character of
        // the text, so the exported file would "look" equally spaced out.
        // That's removed. No feature in this app ever sets a deliberate,
        // meaningful letter-spacing on real note content — the only things
        // that had non-zero letter-spacing were tiny cosmetic UI defaults —
        // so it never preserved anything users actually asked for, while
        // corrupting every export: inserting any character between two
        // letters breaks Arabic/Persian's cursive joining forms, so joined
        // Persian/Farsi text came out as isolated, disconnected letters,
        // and note text with a bigger incidental letter-spacing (e.g. a
        // masked/placeholder style) came out completely scrambled.
        function textWithVisualSpacing(root) {
            const clone = root.cloneNode(true);
            clone.querySelectorAll('.img-toolbar, .audio-wrapper button').forEach(el => el.remove());

            // innerText only reproduces real line breaks (Enter → new line, a
            // second Enter → blank line, Shift+Enter → soft break) when the
            // element is actually rendered with layout. A detached clone is
            // NOT rendered, so browsers quietly fall back to something close
            // to textContent instead — which drops every blank line and <br>,
            // exactly the "line breaks/spacing not preserved" bug reported.
            // Fix: mount the clone off-screen but still attached + laid out,
            // so innerText (and getComputedStyle below) match the editor
            // exactly, then tear the host down again.
            const liveStyle = getComputedStyle(root);
            const host = document.createElement('div');
            // NOTE: do not set visibility:hidden here. innerText (used below)
            // returns an empty string for any element inside a
            // visibility:hidden ancestor in real browsers, even though the
            // element is still laid out. Positioning far off-screen keeps it
            // invisible to the user without breaking innerText — this was
            // the actual cause of TXT exports coming out empty.
            host.style.cssText = 'position:fixed;left:-99999px;top:0;pointer-events:none;z-index:-1;';
            host.style.width = (root.clientWidth || root.offsetWidth || 600) + 'px';
            host.style.whiteSpace = liveStyle.whiteSpace || 'pre-wrap';
            host.style.fontSize = liveStyle.fontSize;
            host.style.fontFamily = liveStyle.fontFamily;
            host.style.lineHeight = liveStyle.lineHeight;
            host.style.direction = liveStyle.direction;
            host.appendChild(clone);
            document.body.appendChild(host);

            try {
                return clone.innerText ?? clone.textContent ?? '';
            } finally {
                host.remove();
            }
        }

        // Converts saved note HTML to plain text without depending on the
        // note being live-rendered on screen. Deliberately simple (no
        // computed-style/letter-spacing work, which only makes sense for an
        // element actually laid out in the page) so it can't throw and turn
        // an export into a failed download.
        function htmlToPlainText(html) {
            try {
                const container = document.createElement('div');
                container.innerHTML = sanitizeHtml(html || '');
                container.querySelectorAll('br').forEach(el => el.replaceWith('\n'));
                container.querySelectorAll('p,div,li,blockquote,tr,h1,h2,h3,h4,h5,h6').forEach(el => {
                    el.insertAdjacentText('afterend', '\n');
                });
                const raw = container.textContent || '';
                return raw
                    .replace(/\u00a0/g, ' ')
                    .replace(/[ \t]+\n/g, '\n')
                    .replace(/\n{3,}/g, '\n\n')
                    .trim();
            } catch (e) {
                // Absolute last resort: strip tags with a regex so a
                // rendering hiccup never blocks the download entirely.
                console.warn('htmlToPlainText fallback used:', e);
                return String(html || '')
                    .replace(/<(br|\/p|\/div|\/li)[^>]*>/gi, '\n')
                    .replace(/<[^>]*>/g, ' ')
                    .replace(/[ \t]+/g, ' ')
                    .replace(/\n{3,}/g, '\n\n')
                    .trim();
            }
        }

        function getTxtContent(id, item) {
            const textEl = document.getElementById(`text-${id}`);
            if (textEl) {
                try {
                    return textWithVisualSpacing(textEl)
                        .replace(/\u00a0/g, ' ')
                        .replace(/\r\n/g, '\n')
                        .replace(/\r/g, '\n');
                } catch (e) {
                    console.warn('Live text extraction failed, falling back to saved HTML:', e);
                }
            }
            // The note isn't currently open (no live DOM element for it —
            // only the open note is rendered), or the live extraction above
            // failed. Build the text straight from the saved HTML instead of
            // falling back to item.text, which is only kept in sync while a
            // note is open and edited — for every closed note it's
            // stale/empty, which is why bulk/bundle TXT exports previously
            // contained only the titles.
            const html = item?.html;
            if (html) return htmlToPlainText(html);
            return String(item?.text ?? '');
        }

        async function downloadAsTxt(id) {

        async function downloadAllAsTxt() {
            if (categories.length === 0) return;

            let mergedContent = '';
            categories.forEach((item, index) => {
                if (item.isDecoy) return;

                const folderName = item.folder ? ` [Folder: ${item.folder}]` : '';
                const itemHeader = `========================================\n${index + 1}. ${item.name}${folderName}\n========================================\n`;
                const content = getTxtContent(item.id, item);

                mergedContent += itemHeader + content.replace(/\n+$/g, '') + '\n\n\n';
            });

            if (!mergedContent.trim()) return;

            const chosenName = await promptFilename('Markhin_Note_All_Texts', 'txt', {
                desc: currentLang === 'fa' ? 'نام فایل متنی شامل همه یادداشت‌ها.' : 'Name for the text file containing all notes.'
            });
            if (chosenName === null) return;
            const fileName = `${chosenName}.txt`;
            try {
                await triggerDownload(mergedContent, fileName, 'text/plain;charset=utf-8');
                showToast(currentLang === 'fa' ? 'فایل متنی همه یادداشت‌ها آماده شد.' : 'Text file with all notes is ready.');
            } catch (err) {
                console.error(err);
                alert(currentLang === 'fa' ? 'دانلود فایل متنی انجام نشد. دوباره امتحان کن.' : 'The text download failed. Please try again.');
            }
        }

        function getExportableCategories() {
            // A password-protected note must not be exportable just because it exists —
            // it needs to have actually been unlocked this session, either via the
            // Ask/Q&A unlock (unlockedQaIds — the same signal the offline AI search
            // already relies on for this) or by being the note currently open with the
            // correct password. Without this, every export path (TXT/CSV/JSON/MD/PDF/
            // DOCX/image/bundle) — including the export picker, which lists every note
            // as a clickable card without requiring it to be opened first — could dump
            // a locked note's real content without ever asking for its password.
            return categories.filter(item => item && !item.isDecoy &&
                (!item.password || unlockedQaIds.includes(item.id) || activeOpenId === item.id));
        }

        function buildExportText(item) {
            const content = getTxtContent(item.id, item);
            const folder = item.folder ? `\n[Folder: ${item.folder}]` : '';
            return `${item.name}${folder}\n\n${content}`.trim();
        }

        function sanitizeFilename(name) {
            return String(name || 'Markhin_Note').replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim().slice(0, 120) || 'Markhin_Note';
        }

        // Shared text-analysis helper used by both the tiny live counter under the
        // editor and the Note DNA panel, so the two always agree on the same numbers.
        // Persian/Arabic-script letters are detected via the Arabic Unicode block,
        // with Persian/Arabic-Indic digit code points excluded so they land in
        // `digits` instead of `faLetters`. A "word" counts as Persian/English only
        // when it contains letters from that script and none from the other —
        // mixed or purely numeric words are left out of both those two counts.
        function computeTextStats(raw) {
            const text = String(raw || '');
            const charsWithSpace = text.length;
            const spaces = (text.match(/\s/g) || []).length;
            const charsNoSpace = charsWithSpace - spaces;
            const digitRe = /[0-9\u06F0-\u06F9\u0660-\u0669]/;
            const digits = (text.match(new RegExp(digitRe.source, 'g')) || []).length;
            const trimmedText = text.trim();
            const words = trimmedText ? trimmedText.split(/\s+/).length : 0;
            const arabicBlockChars = text.match(/[\u0600-\u06FF\u0750-\u077F]/g) || [];
            const faLetters = arabicBlockChars.filter(ch => !digitRe.test(ch)).length;
            const enLetters = (text.match(/[A-Za-z]/g) || []).length;
            const faLetterRe = /[\u0600-\u06FF\u0750-\u077F]/;
            const enLetterRe = /[A-Za-z]/;
            const digitReG = new RegExp(digitRe.source, 'g');
            let faWords = 0, enWords = 0;
            if (trimmedText) {
                trimmedText.split(/\s+/).forEach(tok => {
                    // Strip digits before checking for Persian letters — Persian/Arabic-Indic
                    // digits share the same Unicode block as Persian letters, so a
                    // pure-number token (e.g. "۴۵۶") would otherwise be miscounted as
                    // a Persian word.
                    const withoutDigits = tok.replace(digitReG, '');
                    const isFa = faLetterRe.test(withoutDigits);
                    const isEn = enLetterRe.test(tok);
                    if (isFa && !isEn) faWords++;
                    else if (isEn && !isFa) enWords++;
                });
            }

            // Emoji, counted separately from the letter/word logic above so faLetters/
            // enLetters/faWords/enWords stay "text-only" — matched via the broad
            // Extended_Pictographic Unicode property, which covers both real emoji and
            // the symbol-style ones this app uses in its own UI (✅ ✂️ ➕ …).
            const emojiRe = /\p{Extended_Pictographic}/gu;
            const emojiMatches = text.match(emojiRe) || [];
            const emojiCount = emojiMatches.length;
            const distinctEmojiCount = new Set(emojiMatches).size;
            // Total characters with neither spaces nor emoji — i.e. charsNoSpace minus
            // whatever of it was emoji. faLetters/enLetters are already emoji-free on
            // their own (letters ranges never overlap emoji), so this is the "کلی" figure.
            const charsNoSpaceNoEmoji = charsNoSpace - emojiCount;

            // A whitespace-separated token made up ONLY of emoji (e.g. a lone "🔥")
            // still counts toward `words` above — it's just a token count. These two
            // split that apart: how many such emoji-only tokens there are, and what
            // the word count would be with them excluded.
            let emojiOnlyWords = 0;
            if (trimmedText) {
                trimmedText.split(/\s+/).forEach(tok => {
                    if (tok && tok.replace(emojiRe, '') === '') emojiOnlyWords++;
                });
            }
            const wordsNoEmoji = words - emojiOnlyWords;

            // Rough extras for the DNA panel — ballpark, not exact linguistics.
            const sentences = (trimmedText.match(/[^.!?؟]+[.!?؟]+/g) || []).length || (trimmedText ? 1 : 0);
            const avgWordLength = wordsNoEmoji ? Math.round((charsNoSpaceNoEmoji / wordsNoEmoji) * 10) / 10 : 0;

            return { words, wordsNoEmoji, emojiOnlyWords, charsWithSpace, charsNoSpace, charsNoSpaceNoEmoji, spaces, digits, faLetters, enLetters, faWords, enWords, emojiCount, distinctEmojiCount, sentences, avgWordLength };
        }

        // Unified "name your output file" dialog. Every export/download path in
        // the app (TXT/CSV/JSON/MD/PDF/DOCX/image/ZIP/HTML snapshot/share) routes
        // through this before writing to disk, so the person always gets to type
        // their own file name instead of a hardcoded one. Resolves to the chosen,
        // sanitized base name (without extension), or null if the person cancelled
        // — callers must check for null and abort the export without downloading.
        let __filenamePromptSeq = 0;
        function promptFilename(defaultName, ext, opts = {}) {
            return new Promise(resolve => {
                const fa = currentLang === 'fa';
                const safeDefault = sanitizeFilename(defaultName || 'Markhin_Note');
                const title = opts.title || (fa ? '📝 نام فایل خروجی' : '📝 Output file name');
                const desc = opts.desc || (fa ? 'اسم فایلی که دانلود می‌شود را وارد کن.' : 'Choose the name for the downloaded file.');
                const extLabel = ext ? `.${ext}` : '';
                const uid = 'mfp' + (++__filenamePromptSeq);
                let settled = false;
                const modalEl = document.getElementById('advancedModal');

                const finish = (val) => {
                    if (settled) return;
                    settled = true;
                    if (modalEl) modalEl.removeEventListener('click', outsideClick, true);
                    closeAdvancedModal();
                    resolve(val);
                };
                const outsideClick = (e) => { if (e.target === modalEl) finish(null); };
                if (modalEl) modalEl.addEventListener('click', outsideClick, true);

                showAdvanced(`
                    <div class="advanced-head image-export-picker-head">
                        <div><h3 style="margin:0">${title}</h3><p class="markhin-filename-hint">${escapeHtml(desc)}</p></div>
                        <button class="btn-main" type="button" id="${uid}_x">✕</button>
                    </div>
                    <div class="markhin-filename-row">
                        <input type="text" id="${uid}_input" class="markhin-filename-input" value="${escapeHtml(safeDefault)}" maxlength="120" autocomplete="off" spellcheck="false">
                        ${extLabel ? `<span class="markhin-filename-ext">${escapeHtml(extLabel)}</span>` : ''}
                    </div>
                    <div class="markhin-filename-actions">
                        <button class="btn-main" type="button" id="${uid}_cancel">${fa ? 'انصراف' : 'Cancel'}</button>
                        <button class="btn-main image-export-all-btn" type="button" id="${uid}_ok">${fa ? '✔ ذخیره با این نام' : '✔ Save with this name'}</button>
                    </div>
                `);

                setTimeout(() => {
                    const input = document.getElementById(`${uid}_input`);
                    const okBtn = document.getElementById(`${uid}_ok`);
                    const cancelBtn = document.getElementById(`${uid}_cancel`);
                    const xBtn = document.getElementById(`${uid}_x`);
                    if (input) { input.focus(); input.select(); }
                    const confirmChoice = () => finish(sanitizeFilename(input?.value || safeDefault));
                    if (input) input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') { e.preventDefault(); confirmChoice(); }
                        else if (e.key === 'Escape') { e.preventDefault(); finish(null); }
                    });
                    if (okBtn) okBtn.onclick = confirmChoice;
                    if (cancelBtn) cancelBtn.onclick = () => finish(null);
                    if (xBtn) xBtn.onclick = () => finish(null);
                }, 0);
            });
        }

        function createImageExportCard(item) {

                label.style.cssText = 'padding:10px 14px;border:1px solid #ddd;border-radius:10px;margin:10px 0;color:#555;';

        async function canvasToFormatBlob(canvas, format) {
            const wantJpeg = format === 'jpg';
            const mime = wantJpeg ? 'image/jpeg' : 'image/png';
            const quality = wantJpeg ? .92 : undefined;
            const attempt = (src) => new Promise((resolve, reject) => {
                src.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), mime, quality);
            });

            let blob = null;
            try { blob = await attempt(canvas); } catch (e) { blob = null; }

            // Some browsers/WebViews silently ignore the requested MIME on
            // toBlob and hand back PNG bytes even though 'image/jpeg' was
            // asked for — no error is thrown, so the export looks
            // successful but the saved file is actually PNG data with a
            // .jpg name. Detect that mismatch and re-encode.
            if (wantJpeg && (!blob || blob.type !== mime)) {
                // JPEG can't hold transparency; flatten onto a white
                // background first in case that's part of why encoding
                // to JPEG was being skipped.
                const flat = document.createElement('canvas');
                flat.width = canvas.width; flat.height = canvas.height;
                const fctx = flat.getContext('2d');
                fctx.fillStyle = '#fff';
                fctx.fillRect(0, 0, flat.width, flat.height);
                fctx.drawImage(canvas, 0, 0);

                try { blob = await attempt(flat); } catch (e) { /* keep trying */ }

                if (!blob || blob.type !== mime) {
                    // toDataURL has more consistent cross-browser MIME
                    // handling than toBlob; use it as a last-resort path.
                    try {
                        const dataUrl = flat.toDataURL(mime, quality);
                        if (dataUrl && dataUrl.indexOf(`data:${mime}`) === 0) {
                            const res = await fetch(dataUrl);
                            blob = await res.blob();
                        }
                    } catch (e) { /* fall through */ }
                }
            }

            if (!blob) throw new Error('Canvas conversion failed');
            return blob;
        }

        async function renderNoteToImage(item, format) {
            const normalized = format === 'jpg' ? 'jpg' : 'png';
            // Renderer 1: html2canvas, with a real fallback if the renderer itself fails.
            if (window.html2canvas) {
                const host = document.createElement('div');
                host.style.cssText = 'position:fixed;left:-100000px;top:0;width:1000px;background:#fff;z-index:-1;contain:layout paint;';
                const card = createImageExportCard(item);
                host.appendChild(card); document.body.appendChild(host);
                try {
                    if (document.fonts?.ready) await document.fonts.ready.catch(() => {});
                    const images = Array.from(card.querySelectorAll('img'));
                    await Promise.all(images.map(img => new Promise(resolve => {
                        if (img.complete) return resolve();
                        img.addEventListener('load', resolve, {once:true}); img.addEventListener('error', resolve, {once:true});
                        setTimeout(resolve, 1800);
                    })));
                    const canvas = await html2canvas(card, {
                        // Bumped from a cap of 2x — 2x devicePixelRatio still looked
                        // soft/unclear once shared through apps (WhatsApp, Telegram,
                        // etc.) that re-compress images on send. Rendering at a higher
                        // source resolution keeps the shared copy legible after that.
                        scale: Math.min(3, Math.max(1.5, window.devicePixelRatio || 1.5)),
                        backgroundColor:'#fff', useCORS:true, allowTaint:false, logging:false, imageTimeout:3500,
                        removeContainer:true, foreignObjectRendering:false
                    });
                    return await canvasToFormatBlob(canvas, normalized);
                } catch (e) { console.warn('html2canvas export failed; using native canvas fallback', e); }
                finally { host.remove(); }
            }
            // Renderer 2: native canvas. No external library required.
            const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
            const width = 1400, pad = 90, titleSize = 46, bodySize = 28, lineH = 44;
            const text = buildExportText(item);
            const chars = Math.max(28, Math.floor((width - pad*2) / (bodySize * 0.56)));
            const lines = [];
            String(text).split(/\r?\n/).forEach(par => {
                if (!par) { lines.push(''); return; }
                let rest = par;
                while (rest.length > chars) { let cut = rest.lastIndexOf(' ', chars); if (cut < Math.floor(chars*.55)) cut=chars; lines.push(rest.slice(0,cut)); rest=rest.slice(cut).trimStart(); }
                lines.push(rest);
            });
            const height = Math.max(500, pad + 90 + lines.length * lineH + pad);
            canvas.width=width; canvas.height=height;
            ctx.fillStyle='#fff'; ctx.fillRect(0,0,width,height);
            ctx.fillStyle='#111'; ctx.textAlign=currentLang==='fa'?'right':'left'; ctx.direction=currentLang==='fa'?'rtl':'ltr';
            const x=currentLang==='fa'?width-pad:pad;
            ctx.font=`800 ${titleSize}px Arial, sans-serif`; ctx.fillText(item.name || 'Markhin Note',x,pad+titleSize);
            ctx.font=`${bodySize}px Arial, sans-serif`; let y=pad+125;
            for(const line of lines){ctx.fillText(line,x,y);y+=lineH;}
            return await canvasToFormatBlob(canvas, normalized);
        }

        function openImageExportPicker(format) {

                    if(ok){ for(const item of items){ try{ const b=await renderNoteToImage(item,normalized); await robustDownload(b,`${sanitizeFilename(item.name||'Markhin_Note')}.${normalized}`,normalized==='jpg'?'image/jpeg':'image/png'); await new Promise(r=>setTimeout(r,120)); }catch(e){console.warn(e);} } }

        async function downloadAllPDF() {

        let __docxEnginePromise = null;

        function loadScriptOnce(src) {
            return new Promise((resolve, reject) => {
                const existing = Array.from(document.scripts).find(x => x.src === src);
                if (existing && window.docx) return resolve(window.docx);
                const script = document.createElement('script');
                script.src = src;
                script.async = true;
                script.onload = () => window.docx ? resolve(window.docx) : reject(new Error('DOCX script loaded but global engine was not created'));
                script.onerror = () => reject(new Error('Could not load ' + src));
                document.head.appendChild(script);
            });
        }

        async function ensureDOCXEngine() {
            if (window.docx && window.docx.Document && window.docx.Packer) return window.docx;
            if (__docxEnginePromise) return __docxEnginePromise;
            const urls = [
                'https://cdn.jsdelivr.net/npm/docx@9.5.1/build/index.umd.js',
                'https://unpkg.com/docx@9.5.1/build/index.umd.js',
                'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js',
                'https://unpkg.com/docx@8.5.0/build/index.umd.js'
            ];
            __docxEnginePromise = (async () => {
                let lastError = null;
                for (const url of urls) {
                    try {
                        const engine = await loadScriptOnce(url);
                        if (engine && engine.Document && engine.Packer) return engine;
                    } catch (e) { lastError = e; }
                }
                throw lastError || new Error('DOCX engine unavailable');
            })();
            try { return await __docxEnginePromise; }
            catch (e) { __docxEnginePromise = null; throw e; }
        }

        // ---------- DOCX rich-content conversion ----------
        // Previously DOCX export stripped everything down to plain text lines
        // and never marked Persian notes as RTL. This walks each note's real
        // HTML and rebuilds bold/italic/underline/strikethrough, headings,
        // bullet/numbered lists, blockquotes, hyperlinks and embedded images
        // as proper DOCX content, with correct RTL/right-alignment for Farsi
        // notes. If anything throws mid-conversion, that single note falls
        // back safely to plain text (matching the old behavior) so one bad
        // note can't break the whole export.

        function mu_docxIsRTL(item) {
            const sample = `${item?.name || ''} ${item?.text || ''}`;
            const rtlChars = (sample.match(/[\u0590-\u08FF]/g) || []).length;
            const ltrChars = (sample.match(/[A-Za-z]/g) || []).length;
            if (!rtlChars && !ltrChars) return currentLang === 'fa';
            return rtlChars >= ltrChars;
        }

        function mu_docxLoadImageDims(src) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve({ w: img.naturalWidth || 320, h: img.naturalHeight || 200 });
                img.onerror = () => resolve({ w: 320, h: 200 });
                img.src = src;
            });
        }

        async function mu_docxImageBytes(src) {
            if (/^data:/i.test(src)) {
                const match = /^data:([^;]+);base64,(.*)$/.exec(src);
                if (!match) return null;
                const binary = atob(match[2]);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return { bytes, mime: match[1] };
            }
            if (/^https?:/i.test(src)) {
                const res = await fetch(src);
                if (!res.ok) throw new Error('image fetch failed');
                const buf = await res.arrayBuffer();
                return { bytes: new Uint8Array(buf), mime: res.headers.get('content-type') || 'image/png' };
            }
            return null;
        }

        function mu_docxImageType(mime) {
            if (/jpeg|jpg/i.test(mime)) return 'jpg';
            if (/gif/i.test(mime)) return 'gif';
            if (/bmp/i.test(mime)) return 'bmp';
            if (/svg/i.test(mime)) return 'svg';
            return 'png';
        }

        async function mu_docxRunsFromInline(node, engine, fmt) {
            const { TextRun, ExternalHyperlink } = engine;
            const runs = [];
            if (node.nodeType === Node.TEXT_NODE) {
                if (node.textContent) runs.push(new TextRun({ text: node.textContent, bold: fmt.bold, italics: fmt.italics, underline: fmt.underline ? {} : undefined, strike: fmt.strike }));
                return runs;
            }
            if (node.nodeType !== Node.ELEMENT_NODE) return runs;
            const tag = node.tagName;
            if (tag === 'BR') { runs.push(new TextRun({ text: '', break: 1 })); return runs; }
            if (tag === 'BUTTON') return runs;
            if (node.classList && node.classList.contains('img-toolbar')) return runs;
            const childFmt = { ...fmt };
            if (tag === 'B' || tag === 'STRONG') childFmt.bold = true;
            if (tag === 'I' || tag === 'EM') childFmt.italics = true;
            if (tag === 'U') childFmt.underline = true;
            if (tag === 'S') childFmt.strike = true;
            if (tag === 'A') {
                const href = node.getAttribute('href');
                let inner = [];
                for (const c of node.childNodes) inner.push(...await mu_docxRunsFromInline(c, engine, { ...childFmt, underline: true }));
                if (!inner.length) inner = [new TextRun(node.textContent || href || '')];
                if (href && ExternalHyperlink) runs.push(new ExternalHyperlink({ children: inner, link: href }));
                else runs.push(...inner);
                return runs;
            }
            for (const c of node.childNodes) runs.push(...await mu_docxRunsFromInline(c, engine, childFmt));
            return runs;
        }

        async function mu_docxImageParagraph(imgEl, engine, rtl) {
            const { Paragraph, ImageRun, AlignmentType, TextRun } = engine;
            const src = imgEl.getAttribute('src') || '';
            try {
                const data = await mu_docxImageBytes(src);
                if (!data) throw new Error('unsupported image source');
                const dims = await mu_docxLoadImageDims(src);
                const maxW = 500;
                let w = dims.w, h = dims.h;
                if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
                return new Paragraph({
                    alignment: AlignmentType.CENTER,
                    children: [new ImageRun({ type: mu_docxImageType(data.mime), data: data.bytes, transformation: { width: w, height: h } })]
                });
            } catch (err) {
                console.error('DOCX image embed failed, using placeholder:', err);
                return new Paragraph({
                    alignment: rtl ? AlignmentType.RIGHT : undefined,
                    bidirectional: rtl || undefined,
                    children: [new TextRun({ text: currentLang === 'fa' ? '[تصویر بارگذاری نشد]' : '[image could not be embedded]', italics: true })]
                });
            }
        }

        async function mu_htmlToDocxBlocks(html, engine, rtl) {
            const { Paragraph, TextRun, HeadingLevel, AlignmentType } = engine;
            const template = document.createElement('template');
            template.innerHTML = String(html || '');
            const blocks = [];
            const align = rtl ? AlignmentType.RIGHT : undefined;
            const bidi = rtl || undefined;
            const blockTags = new Set(['P','DIV','UL','OL','BLOCKQUOTE','PRE','IMG','H1','H2','H3','H4','H5','H6','AUDIO']);

            async function paragraphFromInline(nodes, opts = {}) {
                let runs = [];
                for (const n of nodes) runs.push(...await mu_docxRunsFromInline(n, engine, {}));
                if (!runs.length) runs = [new TextRun('')];
                blocks.push(new Paragraph({
                    children: runs,
                    alignment: opts.alignment !== undefined ? opts.alignment : align,
                    bidirectional: bidi,
                    heading: opts.heading
                }));
            }

            async function walkList(listEl, depth) {
                const items = Array.from(listEl.children).filter(c => c.tagName === 'LI');
                let n = 1;
                for (const li of items) {
                    const inlineNodes = Array.from(li.childNodes).filter(c => !(c.nodeType === Node.ELEMENT_NODE && ['UL','OL'].includes(c.tagName)));
                    let runs = [];
                    if (listEl.tagName === 'OL') runs.push(new TextRun(`${n}. `));
                    for (const c of inlineNodes) runs.push(...await mu_docxRunsFromInline(c, engine, {}));
                    if (!runs.length) runs = [new TextRun('')];
                    const paraOpts = {
                        children: runs,
                        alignment: align,
                        bidirectional: bidi,
                        indent: rtl ? { right: 420 + depth * 420 } : { left: 420 + depth * 420 }
                    };
                    if (listEl.tagName === 'UL') paraOpts.bullet = { level: depth };
                    blocks.push(new Paragraph(paraOpts));
                    n++;
                    const nested = Array.from(li.children).filter(c => ['UL','OL'].includes(c.tagName));
                    for (const nestedList of nested) await walkList(nestedList, depth + 1);
                }
            }

            async function walk(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    if (node.textContent.trim()) await paragraphFromInline([node]);
                    return;
                }
                if (node.nodeType !== Node.ELEMENT_NODE) return;
                const tag = node.tagName;
                if (tag === 'BUTTON') return;
                if (node.classList && node.classList.contains('img-toolbar')) return;
                if (tag === 'IMG') { blocks.push(await mu_docxImageParagraph(node, engine, rtl)); return; }
                if (tag === 'AUDIO' || (node.classList && node.classList.contains('audio-wrapper'))) {
                    await paragraphFromInline([document.createTextNode(currentLang === 'fa' ? '🎵 فایل صوتی' : '🎵 Audio file')]);
                    return;
                }
                if (tag === 'BLOCKQUOTE') {
                    let runs = [];
                    for (const c of node.childNodes) {
                        if (c.nodeType === Node.ELEMENT_NODE && ['P','DIV'].includes(c.tagName)) {
                            if (runs.length) runs.push(new TextRun({ text: '', break: 1 }));
                            for (const cc of c.childNodes) runs.push(...await mu_docxRunsFromInline(cc, engine, { italics: true }));
                        } else {
                            runs.push(...await mu_docxRunsFromInline(c, engine, { italics: true }));
                        }
                    }
                    if (!runs.length) runs = [new TextRun('')];
                    blocks.push(new Paragraph({
                        children: runs,
                        alignment: align,
                        bidirectional: bidi,
                        indent: rtl ? { right: 420 } : { left: 420 },
                        border: rtl
                            ? { right: { color: '888888', space: 8, style: 'single', size: 12 } }
                            : { left: { color: '888888', space: 8, style: 'single', size: 12 } }
                    }));
                    return;
                }
                if (tag === 'PRE' || tag === 'CODE') {
                    const lines = (node.textContent || '').split(/\n/);
                    for (const line of lines) blocks.push(new Paragraph({ children: [new TextRun({ text: line, font: 'Consolas' })], alignment: align, bidirectional: bidi }));
                    return;
                }
                if (tag === 'UL' || tag === 'OL') { await walkList(node, 0); return; }
                if (/^H[1-6]$/.test(tag)) {
                    const map = { 1: HeadingLevel.HEADING_1, 2: HeadingLevel.HEADING_2, 3: HeadingLevel.HEADING_3, 4: HeadingLevel.HEADING_4, 5: HeadingLevel.HEADING_5, 6: HeadingLevel.HEADING_6 };
                    await paragraphFromInline(Array.from(node.childNodes), { heading: map[tag[1]] || HeadingLevel.HEADING_3 });
                    return;
                }
                if (tag === 'P' || tag === 'DIV' || tag === 'SPAN') {
                    const hasBlockChild = Array.from(node.children).some(c => blockTags.has(c.tagName));
                    if (hasBlockChild) { for (const c of node.childNodes) await walk(c); }
                    else { await paragraphFromInline(Array.from(node.childNodes)); }
                    return;
                }
                await paragraphFromInline([node]);
            }

            for (const node of template.content.childNodes) await walk(node);
            if (!blocks.length) blocks.push(new Paragraph({ children: [new TextRun('')] }));
            return blocks;
        }

        async function createDOCXBlob(items) {
            const engine = await ensureDOCXEngine();
            const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType } = engine;
            const children = [];
            for (let index = 0; index < items.length; index++) {
                const item = items[index];
                const rtl = mu_docxIsRTL(item);
                if (index > 0) children.push(new Paragraph({ pageBreakBefore: true, children: [new TextRun('')] }));
                children.push(new Paragraph({
                    heading: HeadingLevel.HEADING_1,
                    alignment: rtl ? AlignmentType.RIGHT : undefined,
                    bidirectional: rtl || undefined,
                    children: [new TextRun(String(item.name || 'Markhin Note'))]
                }));
                if (item.folder) {
                    children.push(new Paragraph({
                        alignment: rtl ? AlignmentType.RIGHT : undefined,
                        bidirectional: rtl || undefined,
                        children: [new TextRun({ text: `${currentLang === 'fa' ? 'پوشه' : 'Folder'}: ${item.folder}`, italics: true })]
                    }));
                }
                try {
                    const blocks = await mu_htmlToDocxBlocks(item.html, engine, rtl);
                    children.push(...blocks);
                } catch (err) {
                    console.error('DOCX rich conversion failed, falling back to plain text for note:', item.name, err);
                    const text = getTxtContent(item.id, item);
                    String(text).split(/\n/).forEach(line => children.push(new Paragraph({
                        alignment: rtl ? AlignmentType.RIGHT : undefined,
                        bidirectional: rtl || undefined,
                        children: [new TextRun(line)]
                    })));
                }
            }
            const doc = new Document({ sections: [{ properties: {}, children }] });
            return await Packer.toBlob(doc);
        }

        document.addEventListener('keydown', (event) => {

            const typing = target && (target.matches?.('input, textarea, [contenteditable="true"]'));

        // Unified, resilient download pipeline.
        // Every export in the app (TXT / PDF / DOCX / images / HTML / ZIP …) now
        // funnels through robustDownload(), which tries several real download
        // methods in order and only gives up after ALL of them fail. Previously
        // some exports (TXT, PDF, DOCX) used a single-method helper with no
        // fallback and no failure reporting, so a blocked download could look
        // like it "succeeded" (a success toast appeared) while nothing was
        // actually saved. That bug is fixed: triggerDownload() now shares the
        // same fallback chain and its promise must be awaited/caught by callers.
        let __downloadLock = false;
        async function robustDownload(blob, filename, mime) {
            const safeName = sanitizeFilename(filename || 'download') || 'download';

            // Method 0 (Telegram only): a plain blob-anchor click (Method 1 below) is
            // exactly the thing that silently fails inside Telegram's in-app browser —
            // it fires with no error, but nothing gets saved. So when we detect Telegram,
            // try the two methods that actually work there FIRST: the native share sheet,
            // then reopening this page in the user's real browser (see the block above).
            if (IS_TELEGRAM) {
                try {
                    if (navigator.share && typeof File !== 'undefined') {
                        const file = new File([blob], safeName, {type: mime || blob.type || 'application/octet-stream'});
                        if (!navigator.canShare || navigator.canShare({files:[file]})) {
                            await navigator.share({title:safeName, files:[file]});
                            return 'share';
                        }
                    }
                } catch (e) {
                    if (e?.name === 'AbortError') return 'cancelled';
                    console.warn('Telegram share attempt failed, trying browser bridge…', e);
                }
                try {
                    if (await tgOpenInSystemBrowser(blob, safeName, mime || blob.type)) {
                        showToast(currentLang === 'fa'
                            ? '📥 دانلود در مرورگر گوشی باز شد؛ اگر باز نشد، دوباره امتحان کن.'
                            : '📥 Download opened in your phone\u2019s browser.', 3200);
                        return 'telegram-bridge';
                    }
                } catch (e) { console.warn('Telegram browser-bridge attempt failed', e); }
                // Both Telegram-specific methods were unavailable/too large — fall
                // through to the generic chain below as a last resort.
            }

            // Method 1: normal Blob-anchor download. Fast, silent, and works on
            // the vast majority of desktop/mobile browsers — tried first so the
            // common case stays a simple, unobtrusive download to the user's
            // Downloads folder.
            let url = null;
            try {
                url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = safeName; a.rel = 'noopener';
                a.style.display = 'none';
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => { try { URL.revokeObjectURL(url); } catch (_) {} }, 30000);
                return 'blob';
            } catch (e) { if (url) try { URL.revokeObjectURL(url); } catch (_) {} console.warn('Anchor download failed, trying alternatives…', e); }

            // Method 2: File System Access API where supported — lets the user
            // pick exactly where to save.
            try {
                if (window.showSaveFilePicker && !/Android/i.test(navigator.userAgent)) {
                    const ext = String(safeName).split('.').pop().toLowerCase();
                    const types = [{ description: mime || 'File', accept: {[mime || 'application/octet-stream']:[`.${ext}`]} }];
                    const handle = await window.showSaveFilePicker({ suggestedName: safeName, types });
                    const writable = await handle.createWritable();
                    await writable.write(blob); await writable.close();
                    return 'filesystem';
                }
            } catch (e) { if (e?.name === 'AbortError') return 'cancelled'; console.warn('File picker fallback failed', e); }

            // Method 3: native OS share/save sheet. Especially useful on Android when
            // the browser blocks automatic downloads from local HTML files.
            try {
                if (navigator.share && typeof File !== 'undefined') {
                    const file = new File([blob], safeName, {type: mime || blob.type || 'application/octet-stream'});
                    if (!navigator.canShare || navigator.canShare({files:[file]})) {
                        await navigator.share({title:safeName, files:[file]});
                        return 'share';
                    }
                }
            } catch (e) { if (e?.name === 'AbortError') return 'cancelled'; console.warn('Share fallback failed', e); }

            // Method 4: open the file in a new tab for manual Save/Download.
            try {
                url = URL.createObjectURL(blob);
                const w = window.open(url, '_blank', 'noopener');
                if (w) { setTimeout(() => { try { URL.revokeObjectURL(url); } catch (_) {} }, 60000); return 'open'; }
                URL.revokeObjectURL(url);
            } catch (e) { console.warn('Open fallback failed', e); }

            // Method 5: legacy Microsoft Blob saver (older Edge/IE-like environments).
            try {
                if (navigator.msSaveOrOpenBlob) { navigator.msSaveOrOpenBlob(blob, safeName); return 'msSaveOrOpenBlob'; }
            } catch (e) { console.warn('Legacy blob saver failed', e); }

            // Method 6: data URL anchor for smaller files.
            if (blob.size < 12 * 1024 * 1024) {
                try {
                    const dataUrl = await new Promise((resolve, reject) => {
                        const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(blob);
                    });
                    const a = document.createElement('a'); a.href = dataUrl; a.download = safeName; a.style.display='none';
                    document.body.appendChild(a); a.click(); a.remove(); return 'data';
                } catch (e) { console.warn('Data URL fallback failed', e); }
            }

            // Method 7: last-resort — copy plain-text content to the clipboard so
            // text exports are never fully lost even if every download method above
            // is blocked by the browser/OS.
            try {
                if (navigator.clipboard?.writeText && /^text\//.test(mime || blob.type || '')) {
                    const text = await blob.text();
                    await navigator.clipboard.writeText(text);
                    return 'clipboard';
                }
            } catch (e) { console.warn('Clipboard fallback failed', e); }

            throw new Error('No browser download method succeeded');
        }

        // Back-compat wrapper: every previous call site (TXT/PDF/DOCX exports)
        // now goes through the same full fallback chain as image/PDF/ZIP exports.
        // Callers MUST await this and handle rejection — a thrown error means the
        // export genuinely could not be saved by any method.
        async function triggerDownload(content, filename, contentType) {
            const blob = content instanceof Blob ? content : new Blob([content], { type: contentType });
            const name = sanitizeFilename(filename || 'download') || 'download';
            return robustDownload(blob, name, contentType || blob.type);
        }

        let __zipEnginePromise = null;
        function loadExternalScript(src, test) {
            return new Promise((resolve, reject) => {
                const existing = Array.from(document.scripts).find(x => x.src === src);
                if (existing && (!test || test())) return resolve(true);
                const script = document.createElement('script'); script.src = src; script.async = true;
                script.onload = () => test && !test() ? reject(new Error('Loaded but engine missing: '+src)) : resolve(true);
                script.onerror = () => reject(new Error('Failed: '+src));
                document.head.appendChild(script);
            });
        }
        async function ensureZipEngine() {
            if (window.JSZip) return window.JSZip;
            if (__zipEnginePromise) return __zipEnginePromise;
            const urls = [
                'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
                'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
                'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'
            ];
            __zipEnginePromise = (async () => {
                let last;
                for (const u of urls) { try { await loadExternalScript(u, () => !!window.JSZip); if (window.JSZip) return window.JSZip; } catch(e) { last=e; } }
                throw last || new Error('ZIP engine unavailable');
            })();
            try { return await __zipEnginePromise; } catch(e) { __zipEnginePromise=null; throw e; }
        }

        async function buildZipRobust(files) {
            const JSZipCtor = await ensureZipEngine();
            const zip = new JSZipCtor();
            let added = 0, skipped = 0;
            for (const file of (Array.isArray(files) ? files : [])) {
                // A broken/unsupported export must NEVER abort the rest of the ZIP.
                try {
                    if (!file || !file.name || file.data == null) { skipped++; continue; }
                    zip.file(String(file.name), file.data);
                    added++;
                } catch (e) {
                    skipped++;
                    console.warn('ZIP entry skipped:', file?.name, e);
                }
            }
            if (!added) throw new Error('No exportable files could be added to ZIP');
            // STORE is more memory-friendly on phones and avoids CPU spikes; DEFLATE is used only for text.
            const hasLargeBinary = (Array.isArray(files) ? files : []).some(f => f?.data instanceof Blob && f.data.size > 2 * 1024 * 1024);
            const blob = await zip.generateAsync({ type:'blob', compression: hasLargeBinary ? 'STORE' : 'DEFLATE', compressionOptions:{level:4}, streamFiles:true });
            try { blob.__markhinAdded = added; blob.__markhinSkipped = skipped; } catch (_) {}
            return blob;
        }

                        : `This will replace ALL current notes and folders (${categories.length} notes) with the contents of this backup file and cannot be undone. Continue?`;
                    if (!confirm(confirmMsg)) return;

                    // note itself) kept those fields in a separate advancedMeta blob — apply

                    if (data.advancedMeta && typeof data.advancedMeta === 'object') {

        function csvEscape(value) {

            // them to a single space — RFC 4180 allows CRLF/LF inside a quoted
            // CSV field, Excel/Sheets render it as a wrapped line in the same
            // cell, and parseCSV() below already reads embedded newlines back
            // correctly on import.
            return `"${String(value ?? '').replace(/"/g, '""').replace(/\r\n?/g, '\n')}"`;
        }

        function buildStructuredExport(type, items) {
            const safeItems = Array.isArray(items) ? items : [];
            if (type === 'json') {
                const folderSet = [...new Set(safeItems.map(i => i.folder).filter(Boolean))];
                // Time Capsule/Ghost Note/Decay fields live directly on each note object
                // now, so they're already included below via the `...i` spread — no
                // separate metadata blob to assemble.
                // Re-derive text the same way TXT/MD export do: from the live editor
                // when the note is open, otherwise from the saved HTML. item.text is
                // only kept in sync while a note is open, so using it as-is here could
                // export stale text with different (or missing) blank lines/spacing.
                const jsonItems = safeItems.map(i => ({ ...i, text: getTxtContent(i.id, i) }));
                return JSON.stringify({ categories: jsonItems, folders: [DEFAULT_FOLDER, ...folderSet.filter(f => f !== DEFAULT_FOLDER)] }, null, 2);
            }
            if (type === 'md') {
                const out = safeItems.map((item, index) => {
                    const folder = item.folder ? `\n> Folder: ${markdownEscape(item.folder)}\n` : '';
                    return `# ${index + 1}. ${markdownEscape(item.name)}${folder}\n\n${htmlToMarkdown(item.html, item.text)}`;
                }).join('\n\n---\n\n');
                return '# Markhin Note\n\n' + out + '\n';
            }
            if (type === 'txt') {
                return safeItems.map((item,index) => `========================================\n${index+1}. ${item.name}${item.folder ? ` [Folder: ${item.folder}]` : ''}\n========================================\n${getTxtContent(item.id,item).replace(/\n+$/,'')}\n`).join('\n');
            }
            const rows = [['ID','Name','Folder','Text','Tags','Pinned','Favorite','FontFamily','FontSize'], ...safeItems.map(item => [item.id, item.name, item.folder || '', getTxtContent(item.id, item) || '', (item.tags||[]).join('; '), item.pinned ? '1' : '0', item.favorite ? '1' : '0', item.fontFamily || '', item.fontSize || ''])];
            return '\ufeff' + rows.map(row => row.map(csvEscape).join(',')).join('\r\n');
        }

        function getStructuredExtension(type) { return {json:'json',csv:'csv',md:'md',txt:'txt'}[type] || type; }
        function getStructuredMime(type) { return {json:'application/json;charset=utf-8',csv:'text/csv;charset=utf-8',md:'text/markdown;charset=utf-8',txt:'text/plain;charset=utf-8'}[type] || 'application/octet-stream'; }

        function parseCSV(text) {
            const rows = [];
            let row = [], field = '', quoted = false;
            const input = String(text ?? '').replace(/^\ufeff/, '');
            for (let i = 0; i < input.length; i++) {
                const ch = input[i];
                if (ch === '"') {
                    if (quoted && input[i + 1] === '"') { field += '"'; i++; }
                    else quoted = !quoted;
                } else if (ch === ',' && !quoted) {
                    row.push(field); field = '';
                } else if ((ch === '\n' || ch === '\r') && !quoted) {
                    if (ch === '\r' && input[i + 1] === '\n') i++;
                    row.push(field); field = '';
                    if (row.some(v => v !== '')) rows.push(row);
                    row = [];
                } else { field += ch; }
            }
            if (field !== '' || row.length) {
                row.push(field);
                if (row.some(v => v !== '')) rows.push(row);
            }
            return rows;
        }

        function importCSV(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const rows = parseCSV(String(e.target.result || ''));
                    if (rows.length < 2) throw new Error('empty');
                    let added = 0;
                    rows.slice(1).forEach((cols, index) => {
                        if (!cols.length || cols.length < 4) return;
                        const name = cols[1].trim();
                        const folder = cols[2].trim();
                        if (!name) return;
                        // Columns 4-8 (Tags/Pinned/Favorite/FontFamily/FontSize) are optional, so
                        // older 4-column CSV exports still import fine.
                        const tags = typeof cols[4] === 'string' ? cols[4].split(/[;,]/).map(t => t.trim()).filter(Boolean) : [];
                        const pinned = cols[5] === '1' || String(cols[5] || '').toLowerCase() === 'true';
                        const favorite = cols[6] === '1' || String(cols[6] || '').toLowerCase() === 'true';
                        const fontFamily = typeof cols[7] === 'string' ? cols[7].trim() : '';
                        const fontSize = Number(cols[8]) || undefined;
                        categories.push(normalizeCategory({
                            id: `${Date.now()}_${index}_${Math.random().toString(36).slice(2,8)}`,
                            name, folder: folder === 'undefined' ? '' : folder,
                            text: cols[3], html: sanitizeHtml(cols[3]), history: [],
                            lastEdited: new Date().toUTCString(),
                            tags, pinned, favorite, fontFamily, fontSize
                        }, index));
                        if (folder && folder !== 'undefined' && folder !== DEFAULT_FOLDER && !folders.includes(folder)) folders.push(folder);
                        added++;
                    });
                    saveToLocalStorage(); saveFoldersToLocalStorage(); renderApp();
                    showToast(currentLang === 'fa' ? `${added} یادداشت وارد شد.` : `${added} notes imported.`);
                } catch (_) {
                    alert(currentLang === 'fa' ? 'خطا در خواندن CSV.' : 'Failed to read CSV.');
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsText(file);
        }

        function markdownEscape(text) {
            return String(text ?? '').replace(/\\/g, '\\\\').replace(/([`*_{}\[\]<>])/g, '\\$1');
        }

        function htmlToMarkdown(html, fallbackText) {
            const box = document.createElement('div');
            box.innerHTML = sanitizeHtml(html || '');
            box.querySelectorAll('.img-toolbar, .audio-wrapper button').forEach(el => el.remove());
            box.querySelectorAll('br').forEach(el => el.replaceWith('\n'));
            box.querySelectorAll('strong,b').forEach(el => el.replaceWith('**' + el.textContent + '**'));
            box.querySelectorAll('em,i').forEach(el => el.replaceWith('*' + el.textContent + '*'));
            box.querySelectorAll('s').forEach(el => el.replaceWith('~~' + el.textContent + '~~'));
            box.querySelectorAll('a').forEach(el => el.replaceWith('[' + el.textContent + '](' + (el.getAttribute('href') || '') + ')'));
            box.querySelectorAll('img').forEach(el => el.replaceWith('![' + (el.getAttribute('alt') || '') + '](' + (el.getAttribute('src') || '') + ')'));
            const text = (box.innerText ?? box.textContent ?? '').replace(/\u00a0/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
            return text || String(fallbackText ?? '').trim();
        }

        async function buildExportBundle(selected = {}, chosenZipName = null) {
            const items=getExportableCategories(); if(!items.length)return;
            const btn=document.getElementById('btnExportBundle'), old=btn?.innerHTML;
            try {
                if(btn){btn.disabled=true;btn.innerHTML='⏳ ساخت بسته...';}
                const files=[];
                let skipped=0;
                // Every export is isolated: if one format fails, the remaining formats continue.
                const addExport = async (name, producer) => {
                    try {
                        const data = await producer();
                        if (data == null) throw new Error('empty export');
                        files.push({name, data});
                        return true;
                    } catch (e) {
                        skipped++;
                        console.warn('Bundle export skipped:', name, e);
                        return false;
                    }
                };

                if(selected.json) await addExport('markhin_backup.json', async () => JSON.stringify({categories:categories.map(i=>({...i,text:getTxtContent(i.id,i)})),folders},null,2));
                if(selected.csv) await addExport('markhin_data.csv', async () => '\ufeff'+[['ID','Name','Folder','Text','Tags','Pinned','Favorite','FontFamily','FontSize'],...items.map(i=>[i.id,i.name,i.folder||'',getTxtContent(i.id,i)||'',(i.tags||[]).join('; '),i.pinned?'1':'0',i.favorite?'1':'0',i.fontFamily||'',i.fontSize||''])].map(r=>r.map(csvEscape).join(',')).join('\r\n'));
                if(selected.md) await addExport('markhin_notes.md', async () => '# Markhin Note\n\n'+items.map((item,index)=>`# ${index+1}. ${markdownEscape(item.name)}\n\n${htmlToMarkdown(item.html,item.text)}`).join('\n\n---\n\n'));
                if(selected.txt) await addExport('markhin_notes.txt', async () => items.map((item,index)=>`========================================\n${index+1}. ${item.name}${item.folder?` [Folder: ${item.folder}]`:''}\n========================================\n${getTxtContent(item.id,item).replace(/\n+$/,'')}\n`).join('\n'));

                if(selected.docx) await addExport(items.length===1?`${sanitizeFilename(items[0].name)}.docx`:'Markhin_Note_All_Notes.docx', () => createDOCXBlob(items));
                if(selected.pdf) await addExport(items.length===1?`${sanitizeFilename(items[0].name)}.pdf`:'Markhin_Note_All_Notes.pdf', () => createPDFBlob(items));

                // Images are also isolated one-by-one. A failed image does not stop other images/formats.
                for(let i=0;i<items.length;i++){
                    for(const fmt of ['png','jpg']){
                        if(selected[fmt]) await addExport(`${fmt.toUpperCase()}/${String(i+1).padStart(3,'0')}_${sanitizeFilename(items[i].name||`note_${i+1}`)}.${fmt}`, () => renderNoteToImage(items[i],fmt));
                    }
                    if(selected.png || selected.jpg) await new Promise(r=>setTimeout(r,0));
                }
                if(selected.readme) await addExport('README.txt', async () => 'Markhin Note complete export bundle. Includes every format that could be generated successfully; failed formats are skipped automatically.\n');

                if(!files.length) throw new Error('No files available for ZIP');
                let method = 'zip';
                let totalSkipped = skipped;
                try {
                    const zipBlob=await buildZipRobust(files);
                    method=await robustDownload(zipBlob,`${chosenZipName || ('Markhin_Note_Bundle_' + Date.now())}.zip`,'application/zip');
                    totalSkipped += Number(zipBlob.__markhinSkipped || 0);
                } catch (zipErr) {
                    // If ZIP creation itself is unavailable, do not throw away successful exports.
                    console.warn('ZIP creation/download failed; falling back to individual files.', zipErr);
                    let individualFailed = 0;
                    for (const file of files) {
                        try {
                            const dataBlob = file.data instanceof Blob ? file.data : new Blob([file.data], {type:'application/octet-stream'});
                            const ext = String(file.name).split('.').pop().toLowerCase();

        function importTextFile(event) {

                    }

                    alert(currentLang === 'fa' ? 'خواندن فایل متنی انجام نشد.' : 'Could not import text file.');

        function markdownToSafeHtml(md) {
            let text = escapeHtml(String(md ?? '')).replace(/\r\n?/g,'\n');
            text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>').replace(/^## (.+)$/gm, '<h2>$1</h2>').replace(/^# (.+)$/gm, '<h1>$1</h1>');
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/`([^`]+)`/g, '<code>$1</code>');
            text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
            return text.replace(/\n/g,'<br>');
        }

        async function exportFullHTML() {
            const fa = currentLang === 'fa';
            const exportBtn = document.getElementById('btnExportHtml');
            const now0 = new Date();
            const pad0 = n => String(n).padStart(2, '0');
            const defaultStamp = `${now0.getFullYear()}-${pad0(now0.getMonth() + 1)}-${pad0(now0.getDate())}_${pad0(now0.getHours())}-${pad0(now0.getMinutes())}`;
            const chosenName = await promptFilename(`Markhin-Snapshot-${defaultStamp}`, 'html', {
                desc: fa ? 'نام فایل بکاپ کامل HTML (شامل همه یادداشت‌ها).' : 'Name for the full HTML snapshot backup file.'
            });
            if (chosenName === null) return;
            if (exportBtn) exportBtn.disabled = true;
            try {
                // Work on a detached clone of the page so the live app/session on screen is
                // never touched by the cleanup below.
                const docClone = document.documentElement.cloneNode(true);

                // If this file is itself a previously exported snapshot that got reopened and
                // is now being re-exported, drop its old seed script first so seed scripts
                // don't pile up on every re-export.
                docClone.querySelectorAll('script[data-markhin-seed]').forEach(el => el.remove());

                // Close any modal/overlay that happens to be open right now and clear
                // transient "mode" states, so the downloaded snapshot always opens clean and
                // idle instead of frozen mid-interaction (a stuck modal, delete-mode still on,
                // a leftover AI answer, etc).
                const advModal = docClone.querySelector('#advancedModal');
                if (advModal) advModal.style.display = 'none';
                const gameModal = docClone.querySelector('#gameModal');
                if (gameModal) gameModal.style.display = 'none';
                const btnContainer = docClone.querySelector('#buttonsContainer');
                if (btnContainer) btnContainer.classList.remove('note-delete-mode');
                const bodyClone = docClone.querySelector('body');
                if (bodyClone) bodyClone.classList.remove('glitching');
                const qaResp = docClone.querySelector('#qaResponse');
                if (qaResp) { qaResp.style.display = 'none'; qaResp.innerHTML = ''; }
                const aiAnswerBox = docClone.querySelector('#muAiAnswerBox');
                if (aiAnswerBox) aiAnswerBox.remove();

                const stamp = defaultStamp;

                // A distinct tab title makes it easy to tell downloaded snapshots apart from
                // the live app (and from each other) when several are open at once.
                const titleEl = docClone.querySelector('title');
                if (titleEl) titleEl.textContent = `Markhin Snapshot ${stamp}`;

                // The original page is missing a doctype in its captured markup, which makes
                // a reopened snapshot render in quirks mode; add it back explicitly.
                let fullHtml = '<!DOCTYPE html>\n' + docClone.outerHTML;

                const categoriesJson = JSON.stringify(categories).replace(/</g, '\\u003c').replace(/>/g, '\\u003e').replace(/&/g, '\\u0026');
                const foldersJson = JSON.stringify(folders.filter(f => f !== DEFAULT_FOLDER)).replace(/</g, '\\u003c').replace(/>/g, '\\u003e').replace(/&/g, '\\u0026');
                // Time Capsule / Ghost Note / Decay now live directly on each note object
                // (see categoriesJson above), so there's no separate metadata blob left
                // to seed here — the snapshot carries everything in one key.
                let dataScript = `
                    <script data-markhin-seed="1">
                        window.addEventListener('DOMContentLoaded', () => {
                            localStorage.setItem('app_categories_v13', '${categoriesJson.replace(/'/g, "\\u0027")}');
                            localStorage.setItem('app_folders_v13', '${foldersJson.replace(/'/g, "\\u0027")}');
                        });
                    <\/script>
                `;
                fullHtml = fullHtml.replace('</body>', dataScript + '</body>');

                const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
                // Was a raw anchor+blob click with no fallback — inside Telegram's in-app
                // browser that click fires without error yet saves nothing, so it looked
                // "successful" while the file never reached the device. Routed through
                // robustDownload() so it gets the same Telegram share/browser-bridge and
                // fallback chain as every other export.
                await robustDownload(blob, `${chosenName}.html`, 'text/html;charset=utf-8');

                showToast(fa ? '✅ خروجی HTML با موفقیت ذخیره شد.' : '✅ HTML export saved successfully.');
            } catch (err) {
                showToast((fa ? '⚠️ خطا در خروجی HTML: ' : '⚠️ HTML export error: ') + (err.message || String(err)), 3200);
            } finally {
                if (exportBtn) exportBtn.disabled = false;
            }
        }

        function formatRemaining(ms){

        function purgeExpiredGhosts(){
            const now=Date.now();
            const expiredIds = categories.filter(item=>item.ghostUntil && Number(item.ghostUntil)<=now).map(item=>item.id);
            if(!expiredIds.length) return false;
            expiredIds.forEach(id=>{
                const item = categories.find(c=>c.id===id); if(!item) return;
                // A Ghost Note is meant to actually disappear once its timer runs
                // out — route it through the same recoverable Cemetery a normal
                // delete uses, instead of a silent "archived" flag with no way
                // back, so a forgotten or accidental Ghost timer is never a
                // permanent loss.
                archiveToCemetery(item);
                categories = categories.filter(c=>c.id!==id);
                if(activeOpenId===id) activeOpenId=null;
            });
            saveToLocalStorage();
            return true;

                const level=days<7?0:days<30?1:days<90?2:3;
                if(Number(item.decayLevel||0)!==level){item.decayLevel=level;changed=true;}
            });
            if(changed) saveToLocalStorage();
            return changed;
        }

        function openKnowledgeGraph(){

        +'<article>'+sanitizeHtml(item.html||escapeHtml(item.text||''))+'</article>';
}

window.shareNoteAs=async function(id, format){
    const item=categories.find(x=>x.id===id); if(!item) return;
    const fa=currentLang==='fa';
    closeAdvancedModal();
    const chosenName = await promptFilename(item.name, format, {
        desc: fa ? 'نام فایلی که به اشتراک گذاشته یا دانلود می‌شود.' : 'Name for the file that will be shared or downloaded.'
    });
    if (chosenName === null) return;
    // PDF/DOCX/Image all take a moment to build (DOCX in particular loads its
    // engine from a CDN on first use) — without this the button looked dead
    // for a few seconds and it was easy to think the option was broken.
    const preparingMsg = {
        pdf: fa?'در حال ساخت PDF...':'Building PDF...',
        docx: fa?'در حال آماده‌سازی DOCX...':'Preparing DOCX...',
        png: fa?'در حال ساخت تصویر...':'Building image...'
    }[format];
    if (preparingMsg) showToast(preparingMsg, 4000);
    try{
        let file;
        if(format==='txt'){
            file=new File([getTxtContent(id,item)], chosenName+'.txt', {type:'text/plain'});
        } else if(format==='md'){
            file=new File(['# '+markdownEscape(item.name)+'\n\n'+htmlToMarkdown(item.html,item.text)], chosenName+'.md', {type:'text/markdown'});
        } else if(format==='html'){
            file=new File([buildShareableHtml(item)], chosenName+'.html', {type:'text/html'});
        } else if(format==='pdf'){
            if(!window.html2canvas||!window.jspdf?.jsPDF){ alert(fa?'موتور PDF در دسترس نیست. اتصال اینترنت را بررسی کن.':'PDF engine unavailable. Check your internet connection.'); return; }
            const blob=await createPDFBlob([item]);
            file=new File([blob], chosenName+'.pdf', {type:'application/pdf'});
        } else if(format==='docx'){
            const blob=await createDOCXBlob([item]);
            file=new File([blob], chosenName+'.docx', {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
        } else if(format==='png'){
            const blob=await renderNoteToImage(item,'png');
            file=new File([blob], chosenName+'.png', {type:'image/png'});
        }
        if(!file) return;
        // The previous version treated any navigator.share() failure as fatal.
        // But share() can fail for reasons that have nothing to do with the file
        // being bad — the target app the person picked rejecting a DOCX, a
        // flaky share-sheet handoff, etc. — cases where the plain download
        // (which was already confirmed reliable for DOCX/PDF elsewhere in the
        // app) would have worked fine. Now a failed share falls back to that
        // same reliable download instead of giving up.
        let delivered = false;
        if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
            try{
                await navigator.share({title:item.name, files:[file]});
                delivered = true;
            }catch(shareErr){
                if(shareErr?.name==='AbortError') return; // user cancelled the share sheet — not an error
                console.warn('navigator.share failed, falling back to download:', shareErr);
            }
        }
        if(!delivered){
            await robustDownload(file, file.name, file.type);
            showToast(fa?'این فرمت به‌صورت مستقیم قابل اشتراک‌گذاری نبود؛ فایل دانلود شد.':'This format could not be shared directly; the file was downloaded instead.', 3200);
        }
    }catch(e){
        if(e?.name!=='AbortError'){
            console.error('shareNoteAs error:', e);
            alert(fa?'اشتراک‌گذاری انجام نشد. دوباره امتحان کن.':'Sharing failed. Please try again.');
        }
    }
};

window.createPDFBlob=function(items){return (async()=>{if(!window.html2canvas||!window.jspdf?.jsPDF)throw new Error('PDF engine unavailable');const host=document.createElement('div');host.style.cssText='position:fixed;left:-100000px;top:0;width:900px;z-index:-1';document.body.appendChild(host);const pdf=new jspdf.jsPDF({orientation:'p',unit:'mm',format:'a4',compress:true});try{for(let i=0;i<items.length;i++){const item=items[i];const card=createImageExportCard(item);card.style.cssText+=';background:#ffffff;color:#111111;border:1px solid #dddddd;border-radius:18px;padding:40px;font-family:'+(item.fontFamily||'')+';font-size:'+(item.fontSize||18)+'px;';host.appendChild(card);await document.fonts?.ready?.catch?.(()=>{});const canvas=await html2canvas(card,{scale:Math.min(2,window.devicePixelRatio||1.5),backgroundColor:'#ffffff',useCORS:true,logging:false});host.innerHTML='';const maxW=194,maxH=281;let y=0;let first=true;while(y<canvas.height){if(!first||i>0)pdf.addPage();first=false;const slicePx=Math.floor(canvas.width*maxH/maxW);const h=Math.min(slicePx,canvas.height-y);const sc=document.createElement('canvas');sc.width=canvas.width;sc.height=h;sc.getContext('2d').drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);pdf.addImage(sc.toDataURL('image/jpeg',.92),'JPEG',8,8,maxW,h*maxW/canvas.width,undefined,'FAST');y+=h;}}return pdf.output('blob')}finally{host.remove()}})()};

function markhinDash_showList(kind, value){
    const fa=currentLang==='fa';
    const notes=markhinDash_notes();
    let list, title;
    if(kind==='tag'){ list=notes.filter(x=>(x.tags||[]).includes(value)); title=`# ${escapeHtml(value)}`; }
    else if(kind==='pinned'){ list=notes.filter(x=>x.pinned); title=`📌 ${fa?'یادداشت‌های پین‌شده':'Pinned notes'}`; }
    else if(kind==='favorite'){ list=notes.filter(x=>x.favorite); title=`⭐ ${fa?'علاقه‌مندی‌ها':'Favorites'}`; }
    else if(kind==='locked'){ list=notes.filter(x=>x.password); title=`🔒 ${fa?'قفل‌شده‌ها':'Locked notes'}`; }
    else if(kind==='fake'){ list=notes.filter(x=>x.fakeContent); title=`🎭 ${fa?'محتوای فریب‌دهنده':'Decoy content'}`; }
    else if(kind==='ghost'){ list=notes.filter(markhinDash_isGhostActive); title=`👻 ${fa?'Ghost Note های فعال':'Active Ghost Notes'}`; }
    else if(kind==='capsule'){ list=notes.filter(markhinDash_isCapsuleActive); title=`⏳ ${fa?'کپسول‌های زمانی فعال':'Active Time Capsules'}`; }
    else if(kind==='folder'){ list=notes.filter(x=>(x.folder||'')===value); title=`📁 ${escapeHtml(value||(fa?'بدون پوشه':'No folder'))}`; }
    else { list=notes; title=fa?'همه یادداشت‌ها':'All notes'; }

    list=list.slice().sort((a,b)=>(Number(b.pinned)-Number(a.pinned))||(Number(b.favorite)-Number(a.favorite))||((Date.parse(b.lastEdited)||0)-(Date.parse(a.lastEdited)||0)));

    const bodyHtml=list.length
        ? `<div class="markhin-smart-results" style="max-height:60vh">${list.map(x=>markhinDash_noteRowHtml(x)).join('')}</div>`
        : `<div class="markhin-smart-empty">${fa?'یادداشتی پیدا نشد.':'No notes found.'}</div>`;

    showAdvanced(markhinDash_headHtml(title, true)+`<div style="margin:2px 0 10px;font-size:11px;opacity:.6">${fa?'تعداد':'Count'}: ${list.length}</div>`+bodyHtml);
    document.getElementById('advancedCard')?.classList.add('kg-wide');
    markhinDash_bindRows(document.getElementById('advancedCard'));
}
