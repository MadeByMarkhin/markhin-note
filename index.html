                + '- After any operation, succeeded or not, report back briefly and plainly, with no technical jargon.\n'
                + '- For comparing notes or "what do these have in common", call compare_notes first and then write the actual comparison yourself from the data it returns (common tags, common words, same folder or not); for overall stats or which notes are pinned/favorite, use get_dashboard_stats.\n'
                + '- When you need the full content of more than one note (e.g. "summarize everything in folder X" or "compare these three"), call get_notes once with the whole list instead of calling get_note repeatedly; when creating several new notes at once, use bulk_create_notes instead of multiple create_note calls. When the user asks whether they have duplicate/overlapping notes or wants their vault "cleaned up", call find_duplicate_notes to get candidates, then suggest merge_notes or delete_note based on the result — never merge or delete anything yourself without the user\'s explicit confirmation.\n'
                + '- Only the recent part of this conversation is directly visible to you each turn, not its full history. If the user refers to something from earlier in this same chat that you cannot see above — "what was my first message to you", "what did we talk about at the start", "what did you say about X earlier" — never guess or claim you don\'t know; always call get_chat_history first (mode "first" for the earliest messages, "search" for a specific topic, "range" for a specific slice) and answer from what it actually returns. If the user has cleared this conversation before, the tool correctly returns nothing from before that point — in that case tell them honestly that the earlier conversation was cleared and is not available, rather than inventing anything.\n'
                + '- When the user refers to "the Nth message I sent you", "the third thing I gave you", "that message where I said X earlier", or similar, they mean the Nth message the user themselves sent (role: user). But when they say "the thing you told me", "the second message you sent", "that answer you gave earlier", or similar, they mean the Nth message you yourself (role: assistant) sent earlier in this same conversation — tell these two apart carefully ("I sent/gave you" = user, "you said/your reply" = assistant). Either way, find it by calling get_chat_history with mode "first" and a large enough count (or mode "range" if needed), then, among the results, count only the ones with the relevant role (user or assistant) in order until you reach message N, and use that exact message\'s text (not a summary or a guess) as the basis for whatever comes next. If the same request is multi-step — e.g. "turn it into a note, put it in folder Y, then archive it" — carry out every step in sequence with no pause and no extra questions: create_note (with content set to that message\'s text and folder set to Y in the same call, since create_note creates/places the folder itself), then archive_note with archived:true; finish with just a brief summary of what was done.\n'
                + '- When the question has nothing to do with notes, just answer from your general knowledge — no need to use a tool.\n'
                + mobileBrevityEn
                + styleRuleEn
                + webSearchRuleEn
                + '\n'
                + (referencedFullText ? ('The full, unabridged text of the note(s) the user\'s current question appears to directly name — this is the definitive, complete version; base your answer on exactly this, not the shorter preview list below and not a guess:\n' + referencedFullText + '\n\n') : '')
                + (notesContext ? ('The user\'s current unlocked notes (this is only a preview/summary for context — each note\'s text may not be complete, and is cut off wherever the text itself marks it as such; for any precise operation, or any question that truly needs a note\'s full content, always call get_note/get_notes/read_all_notes with the id instead of relying on this summary alone):\n' + notesContext) : 'The user has no notes yet (or all of them are locked).');

        // Send as much of the stored conversation as we actually keep
        // around (mAiSave() persists the last 60 turns) instead of an
        // arbitrary shorter slice, so the model keeps real memory of
        // earlier parts of a longer conversation rather than losing them
        // after only ~20 exchanges — unless contextScale is shrinking
        // things for a low-rate-limit provider, in which case fewer turns
        // go out too.
        const historyCount = Math.max(4, Math.round(60 * contextScale));
        const convo = [{ role: 'system', content: sys }].concat(
            mAiHistory.filter(function(m){ return !m.synthetic; }).slice(-historyCount).map(function(m){
                // If this message was sent as a reply (via the ↩ button),
                // let the model see what it was quoting too — not just
                // display it — by prefixing a short quoted-context line
                // onto the content actually sent. The stored/displayed
                // m.content itself is left untouched.
                if(m.replyTo && m.replyTo.preview){
                    const qLabel = fa ? 'در پاسخ به' : 'In reply to';
                    return { role: m.role, content: '[' + qLabel + ': "' + m.replyTo.preview + '"]\n' + m.content };
                }
                return { role: m.role, content: m.content };
            })
        );

        const turnMaxTokens = Math.max(500, Math.round(4096 * contextScale));
        const closingMaxTokens = Math.max(350, Math.round(3000 * contextScale));

            let finalText = '';
            const maxSteps = 15;
            for(let step = 0; step < maxSteps; step++){
                mAiStreamText = '';
                const res = await MarkhinAI.chat(convo, { maxTokens: turnMaxTokens, tools: MAI_TOOLS, onDelta: mAiOnDelta });
                const resText = (res && res.text) || '';
                const calls = (res && res.toolCalls) || [];
                if(!calls.length){
                    finalText = resText.trim();
                    break;
                }
                convo.push({ role: 'assistant', content: resText, toolCalls: calls });
                for(const call of calls){
                    const result = await mAiExecuteTool(call.name, call.input);
                    convo.push({ role: 'tool_result', toolCallId: call.id, name: call.name, content: JSON.stringify(result) });
                }
                if(step === maxSteps - 1){
                    const closingPrompt = fa
                        ? 'بر اساس نتایج ابزارهای بالا، الان یک پاسخ نهایی و کوتاه به کاربر بده (بدون فراخوانی ابزار دیگر).'
                        : 'Based on the tool results above, give the user a final, concise answer now (do not call any more tools).';
                    mAiStreamText = '';
                    const closing = await MarkhinAI.chat(convo.concat([{ role:'user', content: closingPrompt }]), { maxTokens: closingMaxTokens, onDelta: mAiOnDelta });
                    finalText = String(closing || '').trim();
                }
            }
            return finalText;
        };

        // Try the normal full-size context first; if the provider rejects
        // it specifically for being too large for its rate limit (see
        // mu_looksLikeTooLargeError), shrink the context and try again —
        // up to 2 extra times — instead of just showing the user a raw
        // "413 / tokens per minute" error on the very first message.
        let finalText = '';
        let contextScale = 1;
        let lastErr = null;
        for(let attemptNum = 0; attemptNum < 3; attemptNum++){
            try {
                finalText = await runAiTurn(contextScale);
                lastErr = null;
                if(finalText && finalText.trim()) break;
                // Genuinely empty completion with no error thrown — some
                // providers occasionally do this (a safety-filter hiccup,
                // a stream that closed with nothing in it, etc). Retry
                // like a transient failure instead of accepting it and
                // permanently recording a blank turn; only give up and
                // fall through to the placeholder once attempts run out.
                if(attemptNum < 2) continue;
                break;
            } catch(err){
                lastErr = err;
                if(attemptNum < 2 && mu_looksLikeTooLargeError(err)){
                    contextScale = mu_nextContextScale(contextScale, err);
                    continue;
                }
                throw err;
            }
        }
        if(lastErr) throw lastErr;

            mAiStreamText = '';
            if(mAiMyGen === mAiGen){
            const mAiGotEmpty = !finalText || !finalText.trim();
            mAiHistory.push({ id: mAiNextId(), role: 'assistant', synthetic: mAiGotEmpty, content: finalText || (fa ? '(پاسخ خالی دریافت شد)' : '(received an empty response)') });
            /* Deterministic, app-generated notice — not left up to the model to
               remember to mention. Appears every time the question touches a
               locked note's title, telling the person exactly what to tap.
               Marked synthetic so it's shown to the user but never replayed
               back to the model as if it were the model's own prior turn —
               see the convo builder above. */
            if(relevantLocked.length){
                const names = relevantLocked.map(n => n.name).filter(Boolean).join(fa ? '، ' : ', ');
                mAiHistory.push({ id: mAiNextId(), role: 'assistant', synthetic: true, content: fa
                    ? `🔒 این سوال به یادداشت قفل «${names}» هم مربوط به نظر می‌رسه، ولی چون رمزش رو ندارم توی جوابم لحاظش نکردم. برای بازش‌کردن، روی دکمه 🔒 بالای همین چت بزن و رمزش رو وارد کن، بعد دوباره همین سوال رو از من بپرس.`
                    : `🔒 This question also looks related to the locked note "${names}", but I couldn't use it since I don't have its password. Tap the 🔒 button above this chat to unlock it, then ask me again.` });
            }
            mAiSave();
            }
        } catch(err){
            mAiStreamText = '';
            if(mAiMyGen === mAiGen){
            const errMsg = mu_looksLikeTooLargeError(err)
                ? (fa
                    ? '⚠️ حتی بعد از این‌که برنامه خودکار حجم یادداشت‌ها/تاریخچه ارسالی را چند بار کم کرد، باز هم این درخواست برای سقف نرخ (توکن در دقیقه) این ارائه‌دهنده/مدل بزرگ بود. یا یک مدل/ارائه‌دهنده با سقف بالاتر انتخاب کن، یا تعداد/حجم یادداشت‌هایت را برای این گفتگو کمتر کن. جزئیات فنی: ' + (err && err.message || String(err))
                    : "⚠️ Even after the app automatically trimmed how much note/history context it sent (several times), this request was still too large for this provider/model's rate limit. Either pick a model/provider with a higher limit, or reduce how many notes are involved in this chat. Technical detail: " + (err && err.message || String(err)))
                : '⚠️ ' + (fa ? 'خطا: ' : 'Error: ') + (err && err.message || String(err));
            mAiHistory.push({ id: mAiNextId(), role: 'assistant', content: errMsg });
            mAiSave();
            }
        } finally {
            // Runs whether the request succeeded or failed, and whether
            // it resolved normally or (like a synchronous bug in the setup
            // code above) threw immediately: this is what guarantees the
            // "typing…" indicator and the ability to send another message
            // can never get stuck.
            mAiStreamText = '';
            mAiPending--;
            mAiRender();
            // No re-focus here on purpose — see the blur() above; the keyboard
            // should stay down until the person taps the input themselves.
        }
    };

    /* Keep the header subtitle in sync whenever the provider/API key is
       changed from the shared AI settings modal (opened from the ⚙️
       button here, or from the per-note AI tools). */
    if(typeof window.mu_saveAiSettings === 'function'){
        const mAiBaseSave = window.mu_saveAiSettings;
        window.mu_saveAiSettings = function(){ mAiBaseSave(); mAiUpdateSub(); };
    }
    if(typeof window.mu_clearAiSettings === 'function'){
        const mAiBaseClear = window.mu_clearAiSettings;
        window.mu_clearAiSettings = function(){ mAiBaseClear(); mAiUpdateSub(); };
    }
})();
</script>

</body>
