<script>
(function(){

/* =========================================================================
   1) SAFE TRANSLATE
   Only the plain text of the note is sent to Google Translate and replaced.
   Images and audio (.img-drag-wrapper / .audio-wrapper) are left completely
   untouched, in their original spot, instead of being wiped out.
   ========================================================================= */
function mu2_isPreservedMedia(node){
    return node.nodeType === 1 && (
        node.classList?.contains('img-drag-wrapper') ||
        node.classList?.contains('audio-wrapper')
    );
}

window.translateText = async function(id, sourceLang, targetLang){
    const t = i18n[currentLang];
    const fa = currentLang === 'fa';
    const textEl = document.getElementById(`text-${id}`);
    if (!textEl) return;

    const children = Array.from(textEl.childNodes);
    const hasMedia = children.some(mu2_isPreservedMedia);

    // Group the note into runs: media nodes stand alone (never touched),
    // everything else is grouped into consecutive "translatable" runs.
    const runs = [];
    let cur = null;
    children.forEach(node => {
        if (mu2_isPreservedMedia(node)) {
            runs.push({ preserve: true, node });
            cur = null;
        } else {
            if (!cur) { cur = { preserve: false, nodes: [] }; runs.push(cur); }
            cur.nodes.push(node);
        }
    });

    const textRuns = runs.filter(r => !r.preserve);
    textRuns.forEach(run => {
        const tmp = document.createElement('div');
        run.nodes.forEach(n => tmp.appendChild(n.cloneNode(true)));
        run.sourceText = tmp.textContent.trim();
    });

    const anyText = textRuns.some(r => r.sourceText);
    if (!anyText) {
        alert(t.noTextToTranslate);
        return;
    }

    if (hasMedia) {
        const warnMsg = fa
            ? 'فقط متن این یادداشت ترجمه می‌شود؛ تصاویر و صداهای داخل آن دست‌نخورده و سرجایشان باقی می‌مانند. ادامه می‌دهید؟'
            : 'Only the text of this note will be translated; any images or audio inside it stay untouched and in place. Continue?';
        if (!confirm(warnMsg)) return;
    }

    showToast(t.translating, 2500);

    try {
        for (const run of textRuns) {
            if (!run.sourceText) { run.translated = ''; continue; }
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(run.sourceText)}`;
            const response = await fetch(url);
            const data = await response.json();
            if (!data || !data[0]) throw new Error('bad-response');
            run.translated = data[0].map(item => item[0]).join('');
        }

        // Apply translations in place; media runs are skipped entirely.
        runs.forEach(run => {
            if (run.preserve || !run.nodes.length) return;
            const anchor = run.nodes[0];
            const parent = anchor.parentNode;
            if (!parent) return;
            parent.insertBefore(document.createTextNode(run.translated || ''), anchor);
            run.nodes.forEach(n => n.remove());
        });

        const item = categories.find(c => c.id === id);
        if (item) {
            item.html = textEl.innerHTML;
            item.text = textWithVisualSpacing(textEl).replace(/\u00a0/g, ' ');
            item.lastEdited = new Date().toUTCString();
            saveToLocalStorage();
        }
        showToast(fa ? '✅ ترجمه انجام شد.' : '✅ Translation complete.', 1800);
    } catch (err) {
        alert(t.serverError);
    }
};

/* =========================================================================
   2) MOVE IMAGE WITHIN / BETWEEN NOTES
   Dropping an image inside the SAME note now repositions it at the drop
   point instead of being ignored; dropping into another note still moves
   it there as before.
   ========================================================================= */
function mu2_dropTarget(container, clientY){
    const kids = Array.from(container.children);
    for (const child of kids){
        const rect = child.getBoundingClientRect();
        if (clientY < rect.top + rect.height / 2) return child;
    }
    return null;
}

window.dropImage = function(ev, categoryId){
    ev.preventDefault();
    const draggedId = ev.dataTransfer.getData('text/plain');
    const draggedEl = document.getElementById(draggedId);
    const textBox = document.getElementById(`text-${categoryId}`);
    if (!draggedEl || !textBox) return;

    const sourceBox = draggedEl.closest('.text-box');
    const sameBox = sourceBox === textBox;
    const target = mu2_dropTarget(textBox, ev.clientY);

    if (target === draggedEl) return;
    if (target) textBox.insertBefore(draggedEl, target);
    else textBox.appendChild(draggedEl);

    if (!sameBox) {
        const sourceId = sourceBox?.id?.startsWith('text-') ? sourceBox.id.slice(5) : null;
        if (sourceId) autosaveCategory(sourceId);
    }
    saveCategory(categoryId);
};

/* =========================================================================
   3) RESIZE + CROP TOOLS FOR IMAGES
   Resize sets the <img width> attribute (already preserved by sanitizeHtml
   and by CSS updated to honor it), so it survives save/reload. A
   ResizeObserver also picks up manual corner-drag resizing (desktop) and
   syncs it back into that same attribute so it persists the same way.
   ========================================================================= */
const MU2_MIN_W = 60, MU2_MAX_W = 1000;

function mu2_currentWidth(img, wrapper){
    const attr = parseInt(img.getAttribute('width') || '', 10);
    if (attr > 0) return attr;
    const rect = wrapper.getBoundingClientRect();
    return rect.width || 260;
}

function mu2_applyWidth(wrapper, img, w){
    w = Math.max(MU2_MIN_W, Math.min(MU2_MAX_W, Math.round(w)));
    img.setAttribute('width', String(w));
}

function mu2_resizeImage(wrapperId, categoryId, factor){
    const wrapper = document.getElementById(wrapperId);
    const img = wrapper?.querySelector('img');
    if (!img) return;
    mu2_applyWidth(wrapper, img, mu2_currentWidth(img, wrapper) * factor);
    if (categoryId) autosaveCategory(categoryId);
}

function mu2_observeResize(wrapper, categoryId){
    if (wrapper.__mu2Observed || typeof ResizeObserver === 'undefined') return;
    wrapper.__mu2Observed = true;
    const img = wrapper.querySelector('img');
    if (!img) return;
    const ro = new ResizeObserver(() => {
        const w = wrapper.clientWidth;
        if (!w) return;
        const attr = parseInt(img.getAttribute('width') || '', 10);
        if (Math.abs((attr || 0) - w) < 3) return; // ignore our own writes / no real change
        img.setAttribute('width', String(Math.max(MU2_MIN_W, Math.min(MU2_MAX_W, Math.round(w)))));
        clearTimeout(wrapper.__mu2SaveT);
        wrapper.__mu2SaveT = setTimeout(() => { if (categoryId) autosaveCategory(categoryId); }, 500);
    });
    ro.observe(wrapper);
}

let mu2CropperInstance = null;

window.mu2_openCrop = function(wrapperId, categoryId){
    const wrapper = document.getElementById(wrapperId);
    const img = wrapper?.querySelector('img');
    if (!img || typeof Cropper === 'undefined') return;
    const fa = currentLang === 'fa';

    showAdvanced(`
        <div class="advanced-head"><h3>✂️ ${fa ? 'برش عکس' : 'Crop Image'}</h3><button class="btn-main" onclick="mu2_cancelCrop()">✕</button></div>
        <div style="max-height:56vh; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.25); border-radius:10px; overflow:hidden;">
            <img id="mu2CropImg" src="${img.src}" style="max-width:100%; display:block;">
        </div>
        <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
            <button class="btn-main" onclick="mu2_setCropAspect(0)">${fa ? 'آزاد' : 'Free'}</button>
            <button class="btn-main" onclick="mu2_setCropAspect(1)">1:1</button>
            <button class="btn-main" onclick="mu2_setCropAspect(1.777)">16:9</button>
            <button class="btn-main" onclick="mu2_setCropAspect(1.333)">4:3</button>
        </div>
        <div style="display:flex; gap:8px; margin-top:12px;">
            <button class="btn-main btn-save-prominent" onclick="mu2_confirmCrop('${wrapperId}','${categoryId}')">✅ ${fa ? 'اعمال برش' : 'Apply Crop'}</button>
            <button class="btn-main" onclick="mu2_cancelCrop()">↩ ${fa ? 'انصراف' : 'Cancel'}</button>
        </div>
    `);
    document.getElementById('advancedCard')?.classList.add('kg-wide');

    setTimeout(() => {
        const cropImg = document.getElementById('mu2CropImg');
        if (!cropImg) return;
        if (mu2CropperInstance) mu2CropperInstance.destroy();
        mu2CropperInstance = new Cropper(cropImg, { viewMode: 1, autoCropArea: 0.9, background: false });
    }, 60);
};

window.mu2_setCropAspect = function(ratio){
    mu2CropperInstance?.setAspectRatio(ratio || NaN);
};

window.mu2_cancelCrop = function(){
    mu2CropperInstance?.destroy();
    mu2CropperInstance = null;
    closeAdvancedModal();
};

window.mu2_confirmCrop = function(wrapperId, categoryId){
    if (!mu2CropperInstance) return;
    const canvas = mu2CropperInstance.getCroppedCanvas({ maxWidth: 2000, maxHeight: 2000 });
    if (canvas) {
        const wrapper = document.getElementById(wrapperId);
        const img = wrapper?.querySelector('img');
        if (img) {
            img.src = canvas.toDataURL('image/png');
            img.removeAttribute('width');
        }
        if (categoryId) saveCategory(categoryId);
        showToast(currentLang === 'fa' ? '✅ برش اعمال شد.' : '✅ Crop applied.', 1800);
    }
    mu2CropperInstance.destroy();
    mu2CropperInstance = null;
    closeAdvancedModal();
};

/* =========================================================================
   4) WIRE THE NEW TOOLBAR BUTTONS INTO EVERY IMAGE WRAPPER
   Wraps the two functions that build/re-attach an image's toolbar so the
   new buttons (and the drag-start fix, and the resize observer) are added
   consistently whether the image was just uploaded or is being re-rendered
   after a save/reload.
   ========================================================================= */
function mu2_enhanceWrapper(wrapper, categoryId){
    if (!wrapper || wrapper.__mu2Enhanced) { mu2_observeResize(wrapper, categoryId); return; }
    wrapper.__mu2Enhanced = true;
    const fa = currentLang === 'fa';
    const img = wrapper.querySelector('img');
    const toolbar = wrapper.querySelector('.img-toolbar');
    if (!img || !toolbar) return;

    wrapper.title = fa ? 'برای جابجا کردن بکِش' : 'Drag to move';

    // Fix the drag handle: it's a JS property, not an HTML attribute, so it
    // must be re-set every time the note is rendered from saved HTML.
    wrapper.setAttribute('draggable', 'true');
    wrapper.ondragstart = (e) => e.dataTransfer.setData('text/plain', wrapper.id);

    // Make sure "download" always grabs the live image (important after a crop).
    const existingDownloadBtn = toolbar.querySelector('button');
    if (existingDownloadBtn) {
        existingDownloadBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); downloadImage(img.src); };
    }

    const smallerBtn = document.createElement('button');
    smallerBtn.type = 'button'; smallerBtn.className = 'img-btn';
    smallerBtn.innerHTML = '➖';
    smallerBtn.title = fa ? 'کوچک‌تر' : 'Smaller';
    smallerBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); mu2_resizeImage(wrapper.id, categoryId, 0.85); };

    const biggerBtn = document.createElement('button');
    biggerBtn.type = 'button'; biggerBtn.className = 'img-btn';
    biggerBtn.innerHTML = '➕';
    biggerBtn.title = fa ? 'بزرگ‌تر' : 'Bigger';
    biggerBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); mu2_resizeImage(wrapper.id, categoryId, 1.15); };

    const cropBtn = document.createElement('button');
    cropBtn.type = 'button'; cropBtn.className = 'img-btn';
    cropBtn.innerHTML = '✂️';
    cropBtn.title = fa ? 'برش عکس' : 'Crop';
    cropBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); mu2_openCrop(wrapper.id, categoryId); };

    toolbar.appendChild(smallerBtn);
    toolbar.appendChild(biggerBtn);
    toolbar.appendChild(cropBtn);

    mu2_observeResize(wrapper, categoryId);
}

const mu2_baseCreateDraggableImageElement = window.createDraggableImageElement;
window.createDraggableImageElement = function(imgSrc, categoryId){
    const wrapper = mu2_baseCreateDraggableImageElement(imgSrc, categoryId);
    mu2_enhanceWrapper(wrapper, categoryId);
    return wrapper;
};

const mu2_baseAttachWrapperEvents = window.attachWrapperEvents;
window.attachWrapperEvents = function(categoryId){
    mu2_baseAttachWrapperEvents(categoryId);
    const textBox = document.getElementById(`text-${categoryId}`);
    textBox?.querySelectorAll('.img-drag-wrapper').forEach(wrapper => {
        wrapper.__mu2Enhanced = false; // toolbar was just rebuilt by the base function
        mu2_enhanceWrapper(wrapper, categoryId);
    });
};

})();
</script>

<script>
/* =========================================================================
   5) PASTE-AS-PLAIN-TEXT FOR NOTE TEXT BOXES
   Pasting from outside (Word, a website, another app) brings along the
   source's own inline styles — color:#000, a tiny font-size, a different
   font-family — which override the theme's color/font on the .text-box
   and make the pasted chunk unreadable (black text, wrong size) even
   though everything typed by hand looks fine. This strips that inline
   styling on paste so pasted text always matches the current theme,
   exactly like text typed directly into the note.
   ========================================================================= */
(function(){
    function mu3_handleTextBoxPaste(e){
        const box = e.target && e.target.closest && e.target.closest('.text-box[contenteditable="true"]');
        if (!box) return;
        const cd = e.clipboardData || window.clipboardData;
        if (!cd) return;
        const text = cd.getData('text/plain');
        // No text on the clipboard (e.g. a copied screenshot/image) — let the
        // browser's normal paste handle that case untouched.
        if (!text) return;

        e.preventDefault();

        if (document.queryCommandSupported && document.queryCommandSupported('insertText')) {
            document.execCommand('insertText', false, text);
        } else {
            const sel = window.getSelection();
            if (!sel || !sel.rangeCount) return;
            const range = sel.getRangeAt(0);
            range.deleteContents();
            range.insertNode(document.createTextNode(text));
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
            box.dispatchEvent(new Event('input', { bubbles: true }));
        }
    }
    document.addEventListener('paste', mu3_handleTextBoxPaste);
})();
</script>

<!-- =========================================================================
     MARKHIN AI — full-screen general-purpose chat page.
     Opens directly into the conversation (never an API-key gate first).
     Provider / API-key selection lives inside this page, behind the ⚙️
     button, reusing the existing MarkhinAI provider system (any OpenAI-
     compatible service, Anthropic-style, or a fully custom endpoint).
     ========================================================================= -->
<div id="markhinAiChatOverlay" class="markhin-ai-chat-overlay">
    <div class="mAi-header">
        <div class="mAi-header-title">
            <div class="mAi-orb">🤖</div>
            <div class="mAi-header-text">
                <div class="mAi-header-name">MARKHIN AI</div>
                <div class="mAi-header-sub" id="markhinAiChatSub" onclick="mu_openAiSettingsModal()">…</div>
            </div>
        </div>
        <div class="mAi-header-actions">
            <button class="mAi-icon-btn" id="qaLockBtn" onclick="promptUnlockQa()" title="مدیریت قفل یادداشت‌ها برای MARKHIN AI" aria-label="قفل یادداشت‌ها">🔒</button>
            <button class="mAi-icon-btn" id="muAiSettingsBtn" onclick="mu_openAiSettingsModal()" title="تنظیمات هوش مصنوعی" aria-label="تنظیمات">⚙️</button>
            <button class="mAi-icon-btn" onclick="markhinAiChat_clear()" title="پاک کردن گفتگو" aria-label="پاک کردن">🗑️</button>
            <button class="mAi-icon-btn mAi-close-btn" onclick="closeMarkhinAIChat()" title="بستن" aria-label="بستن">✕</button>
        </div>
    </div>

    <div id="mAiLockNotice" class="markhin-ai-lock-notice" style="display:none"></div>

    <div id="markhinAiChatMessages" class="mAi-messages"></div>

    <div id="mAiReplyBar" class="mAi-reply-bar"></div>

    <div class="mAi-inputbar">
        <textarea id="markhinAiChatInput" class="mAi-input" rows="1"
                  placeholder="پیام خود را بنویس..."
                  oninput="markhinAiChat_autosize(this)"
                  onkeydown="markhinAiChat_onKeydown(event)"></textarea>
        <button class="mAi-send-btn" id="markhinAiChatSendBtn" onclick="markhinAiChat_send()" title="ارسال" aria-label="ارسال">➤</button>
    </div>
</div>

<script>
(function(){
    /* ---------------------------------------------------------------
       State: a single general-purpose conversation that also has read
       access to the user's (unlocked) notes as extra context — this used
       to be split into two separate features (this chat for general
       knowledge, plus a standalone notes-only "Ask" box). The Ask box has
       been removed; MARKHIN AI now covers both jobs itself. Persisted
       locally so the conversation survives closing/reopening the page
       (not tied to any one note).
       --------------------------------------------------------------- */
    const MAI_HISTORY_KEY = 'markhinAiChatHistory_v1';
    let mAiHistory = [];
    // Number of replies currently in flight (0, 1, or more — the user
    // is always allowed to send another message even while a previous
    // one is still being answered). The "typing…" bubble is rendered
    // from this counter every time mAiRender() runs (rather than being a
    // one-off DOM node appended by hand), so closing and reopening the
    // chat mid-reply always shows the right state instead of
    // losing/duplicating the indicator, and it can never get stuck at
    // "still sending" — see the finally block in markhinAiChat_send.
    let mAiPending = 0;
    // Bumped every time the conversation is cleared. Each in-flight
    // request captures this value before it starts; if the value has
    // changed by the time that request finishes, the user cleared the
    // chat in the meantime, so the (now stale) reply is dropped instead
    // of reappearing in the conversation the user just emptied.
    let mAiGen = 0;
    // Holds whatever text has streamed in so far for the reply currently in
    // flight, so mAiRender() can show it live (a typewriter effect) instead
    // of just three static dots until the whole answer is ready. Cleared
    // before the request starts and once the final message lands in
    // mAiHistory — see markhinAiChat_send() and mAiRender() below.
    let mAiStreamText = '';
    try { mAiHistory = JSON.parse(localStorage.getItem(MAI_HISTORY_KEY) || '[]'); if(!Array.isArray(mAiHistory)) mAiHistory = []; } catch(e){ mAiHistory = []; }

    /* ---------------------------------------------------------------
       Reply-to-message feature: every message (assistant or the
       user's own) gets a stable id so a later message can reference
       it. mAiNextId() mints new ones; the loop right after backfills
       ids onto conversations that were saved before this feature
       existed, so old chats keep working with it immediately.
       mAiReplyTarget holds whatever message is currently "queued" as
       the thing being replied to (set by tapping the ↩ button on a
       bubble, cleared by sending or by the ✕ on the reply bar).
       --------------------------------------------------------------- */
    let mAiIdSeq = 0;
    function mAiNextId(){ mAiIdSeq++; return 'm' + Date.now().toString(36) + mAiIdSeq.toString(36); }
    mAiHistory.forEach(function(m){ if(!m.id) m.id = mAiNextId(); });
    let mAiReplyTarget = null; // { id, role, preview } | null

    // Cap for how many turns are kept in storage at all. This used to be
    // 60, which meant anything older (e.g. the user's very first message)
    // was permanently gone — not just left out of the model's context —
    // long before a long-running conversation would realistically end.
    // Raised so the full conversation genuinely persists until the user
    // clears it themselves (markhinAiChat_clear), which is the only thing
    // that should make earlier turns unrecoverable.
    const MAI_HISTORY_STORE_CAP = 4000;
    function mAiSave(){
        try { localStorage.setItem(MAI_HISTORY_KEY, JSON.stringify(mAiHistory.slice(-MAI_HISTORY_STORE_CAP))); } catch(e){}
    }

    function mAiFormat(t){
        let s = escapeHtml(t == null ? '' : String(t));
        s = s.replace(/```([\s\S]*?)```/g, (m, c) => '<span class="mAi-code">' + c.replace(/\n/g, '<br>') + '</span>');
        s = s.replace(/`([^`\n]+)`/g, '<code class="mAi-inline-code">$1</code>');
        s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
        s = s.replace(/\n/g, '<br>');
        return s;
    }

    function mAiUpdateSub(){
        const el = document.getElementById('markhinAiChatSub');
        if(!el) return;
        const fa = currentLang === 'fa';
        if(MarkhinAI.isConfigured()){
            const p = MarkhinAI.getActiveProvider();
            el.textContent = (fa ? '🟢 متصل به ' : '🟢 Connected to ') + (p ? p.name : '');
            el.classList.remove('mAi-sub-off');
        } else {
            el.textContent = fa ? '⚠️ برای شروع، کلید API را تنظیم کن' : '⚠️ Tap to set your API key';
            el.classList.add('mAi-sub-off');
        }
    }
    window.markhinAiChat_updateSub = mAiUpdateSub;

    /* Shows/hides the small banner under the header that tells the person
       when one or more locked notes are being kept out of MARKHIN AI's
       notes context (mirrors what the old standalone Ask box used to show
       above its answer box). The 🔒 button in the header — same element,
       same promptUnlockQa()/updateLockBtnState() logic as before — is how
       they grant/revoke access; this banner just reflects current state. */
    function mAiUpdateLockNotice(){
        const el = document.getElementById('mAiLockNotice');
        if(!el || typeof categories === 'undefined') return;
        const fa = currentLang === 'fa';
        const excluded = categories.filter(c=>!c.isDecoy && isNoteLocked(c) && !unlockedQaIds.includes(c.id)).length;
        if(excluded > 0){
            el.style.display = 'block';
            el.innerHTML = '🔒 ' + (fa
                ? `${excluded} یادداشت قفل به MARKHIN AI داده نشده — فقط یادداشت‌های بدون رمز در دسترسش هستند. برای اینکه یادداشت قفلی هم در دسترس MARKHIN AI باشد، از دکمه 🔒 بالای همین چت بازش کن.`
                : `${excluded} locked note(s) are withheld from MARKHIN AI — only unlocked notes are visible to it. Unlock a note with the 🔒 button above to give it access.`);
        } else {
            el.style.display = 'none';
        }
    }
    window.mu_updateAiLockNotice = mAiUpdateLockNotice;

    // Short, single-line preview of a message's text, used both in the
    // quote block inside a reply bubble and in the reply bar above the
    // input while composing. Collapses whitespace/newlines so a
    // multi-line message doesn't blow up the one-line preview.
    function mAiPreviewOf(text){
        const s = String(text == null ? '' : text).replace(/\s+/g, ' ').trim();
        return s.length > 120 ? s.slice(0, 120) + '…' : s;
    }

    function mAiRenderReplyBar(){
        const bar = document.getElementById('mAiReplyBar');
        if(!bar) return;
        const fa = currentLang === 'fa';
        if(!mAiReplyTarget){
            bar.style.display = 'none';
            bar.innerHTML = '';
            return;
        }
        const label = mAiReplyTarget.role === 'user'
            ? (fa ? 'پاسخ به پیام خودت' : 'Replying to yourself')
            : (fa ? 'پاسخ به MARKHIN AI' : 'Replying to MARKHIN AI');
        bar.style.display = 'flex';
        bar.innerHTML =
            '<div class="mAi-reply-bar-content">' +
                '<div class="mAi-reply-bar-label">' + escapeHtml(label) + '</div>' +
                '<div class="mAi-reply-bar-text">' + escapeHtml(mAiReplyTarget.preview) + '</div>' +
            '</div>' +
            '<button class="mAi-reply-bar-close" onclick="mAi_cancelReply()" title="' + (fa ? 'لغو پاسخ' : 'Cancel reply') + '" aria-label="' + (fa ? 'لغو پاسخ' : 'Cancel reply') + '">✕</button>';
    }

    // Tapping the ↩ on any bubble (own message or MARKHIN AI's) queues
    // it as the reply target; the actual attachment happens when the
    // user sends their next message (see markhinAiChat_send).
    window.mAi_replyTo = function(id){
        const msg = mAiHistory.find(function(m){ return m.id === id; });
        if(!msg) return;
        mAiReplyTarget = { id: msg.id, role: msg.role, preview: mAiPreviewOf(msg.content) };
        mAiRenderReplyBar();
        const input = document.getElementById('markhinAiChatInput');
        if(input) input.focus();
    };

    window.mAi_cancelReply = function(){
        mAiReplyTarget = null;
        mAiRenderReplyBar();
    };

    // Tapping a quote block inside a message jumps back to (and briefly
    // highlights) the original message it was replying to, in case
    // that message has scrolled out of view.
    window.mAi_scrollToMsg = function(id){
        const box = document.getElementById('markhinAiChatMessages');
        if(!box) return;
        const el = box.querySelector('[data-mid="' + CSS.escape(id) + '"]');
        if(!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('mAi-msg-highlight');
        setTimeout(function(){ el.classList.remove('mAi-msg-highlight'); }, 1200);
    };

    function mAiRender(){
        const box = document.getElementById('markhinAiChatMessages');
        if(!box) return;
        const fa = currentLang === 'fa';
        if(!mAiHistory.length){
            box.innerHTML =
                '<div class="mAi-welcome">' +
                    '<div class="mAi-welcome-orb">🤖</div>' +
                    '<div class="mAi-welcome-title">MARKHIN AI</div>' +
                    '<div class="mAi-welcome-text">' + (fa
                        ? 'یک دستیار هوش مصنوعی واقعی — بر پایه دانش عمومی و متصل به هر ارائه‌دهنده‌ای که خودت انتخاب کنی. علاوه بر پاسخ‌گویی، مستقیماً به برنامه‌ات هم دسترسی دارد: می‌تواند یادداشت پیدا کند و متن کاملش را بخواند، بسازد، تغییر نام دهد، کپی بگیرد، به پوشه‌ای منتقل کند، تگ بزند، آرشیو/پین/فیوریت کند، کپسول زمانی یا Ghost Note رویش تنظیم کند، چند یادداشت را ترکیب کند، و با تأیید خودت حذف کند. هر سوالی داری یا هر کاری با یادداشت‌هات، همینجا بگو.'
                        : 'A real general-purpose AI assistant — powered by whichever provider you connect. Beyond answering questions, it has direct access to your app: it can find notes and read their full content, create them, rename them, duplicate them, move them into folders, tag them, archive/pin/favorite them, arm a Time Capsule or Ghost Note timer on them, merge several notes together, and delete them with your confirmation. Ask it anything, or just tell it what to do with your notes.') + '</div>' +
                '</div>';
            return;
        }
        let html = mAiHistory.map(function(m){
            const cls = m.role === 'user' ? 'mAi-user' : 'mAi-assistant';
            const quoteHtml = m.replyTo
                ? ('<div class="mAi-quote" onclick="mAi_scrollToMsg(\'' + m.replyTo.id + '\')">' +
                        '<div class="mAi-quote-label">' + (m.replyTo.role === 'user' ? (fa ? 'خودت' : 'You') : 'MARKHIN AI') + '</div>' +
                        '<div class="mAi-quote-text">' + escapeHtml(m.replyTo.preview) + '</div>' +
                   '</div>')
                : '';
            const replyBtn = '<button class="mAi-reply-btn" onclick="mAi_replyTo(\'' + m.id + '\')" title="' + (fa ? 'پاسخ' : 'Reply') + '" aria-label="' + (fa ? 'پاسخ' : 'Reply') + '">↩</button>';
            return '<div class="mAi-msg ' + cls + '" data-mid="' + m.id + '">' + replyBtn + '<div class="mAi-bubble">' + quoteHtml + mAiFormat(m.content) + '</div></div>';
        }).join('');
        if(mAiPending > 0){
            if(mAiStreamText){
                // Partial text has started arriving — show it live, with a
                // small blinking cursor so it still reads as "in progress"
                // rather than a finished, possibly cut-off message.
                html += '<div class="mAi-msg mAi-assistant"><div class="mAi-bubble">' + mAiFormat(mAiStreamText) + '<span class="mAi-cursor">▍</span></div></div>';
            } else {
                html += '<div class="mAi-msg mAi-assistant"><div class="mAi-bubble mAi-typing"><span></span><span></span><span></span></div></div>';
            }
        }
        box.innerHTML = html;
        box.scrollTop = box.scrollHeight;
    }

    window.openMarkhinAIChat = function(){
        const ov = document.getElementById('markhinAiChatOverlay');
        if(!ov) return;
        ov.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        mAiUpdateSub();
        mAiUpdateLockNotice();
        mAiRender();
        mAiRenderReplyBar();
        mAiSyncViewport();
        // Deliberately NOT auto-focusing the input here: focusing it would pop
        // the mobile keyboard open the instant the chat page opens. The keyboard
        // should only appear once the person actually taps the input themselves.
    };

    /* ---------------------------------------------------------------
       Keep the chat page glued to the real visible area, not the
       device's full height. Mobile keyboards don't resize the page —
       they just cover the bottom of it — so without this, a fixed
       "100vh" chat page ends up with its input bar (and the tail of
       the messages) hidden behind the keyboard, or the keyboard
       visibly overlapping the last message. window.visualViewport
       reports the space actually left after the keyboard opens, so we
       resize/reposition the overlay to match it live.
       --------------------------------------------------------------- */
    function mAiSyncViewport(){
        const ov = document.getElementById('markhinAiChatOverlay');
        if(!ov || ov.style.display === 'none' || !window.visualViewport) return;
        const vv = window.visualViewport;
        ov.style.height = vv.height + 'px';
        ov.style.top = vv.offsetTop + 'px';
        const box = document.getElementById('markhinAiChatMessages');
        if(box) box.scrollTop = box.scrollHeight;
    }
    if(window.visualViewport){
        window.visualViewport.addEventListener('resize', mAiSyncViewport);
        window.visualViewport.addEventListener('scroll', mAiSyncViewport);
    }

    window.closeMarkhinAIChat = function(){
        const ov = document.getElementById('markhinAiChatOverlay');
        if(ov){
            ov.style.display = 'none';
            // Clear the inline height/top set by mAiSyncViewport so the overlay
            // goes back to filling the full screen next time it's opened.
            ov.style.height = '';
            ov.style.top = '';
        }
        document.body.style.overflow = '';
    };

    window.markhinAiChat_clear = function(){
        const fa = currentLang === 'fa';
        if(mAiHistory.length && !confirm(fa ? 'کل گفتگو پاک شود؟' : 'Clear the entire conversation?')) return;
        mAiHistory = [];
        mAiStreamText = '';
        // Also drop any message queued via the ↩ reply button — it would
        // otherwise point at a message that no longer exists.
        mAiReplyTarget = null;
        // Invalidate any reply still in flight so it cannot land back in
        // the conversation that was just cleared once it finishes.
        mAiGen++;
        mAiSave();
        mAiRender();
        mAiRenderReplyBar();
    };

    window.markhinAiChat_autosize = function(el){
        if(!el) return;
        el.style.height = 'auto';
        el.style.height = Math.min(140, el.scrollHeight) + 'px';
    };

    window.markhinAiChat_onKeydown = function(e){

    /* A note's context (every unlocked note's text, plus recent chat
       history) is sent along with every message so the model can actually
       use it — but some providers (very commonly free/low tiers, like
       Groq's default org limits) cap how many tokens can be sent per
       minute, well below what a vault full of notes adds up to. Rather
       than just showing the user a raw "413 / tokens per minute" error,
       markhinAiChat_send below detects this specific failure and
       automatically retries with a smaller slice of notes/history — see
       mu_nextContextScale for how much smaller. */
    function mu_looksLikeTooLargeError(err){
        const msg = String((err && err.message) || err || '');
        return /\b413\b/.test(msg)
            || /tokens per minute|too large|too long|context_length_exceeded|context window|maximum context length|request too large|payload too large|reduce (the|your) (length|prompt|message)/i.test(msg);
    }

    // Picks how much smaller to make the next attempt's note/history
    // budget. When the provider's error message states an exact limit and
    // how much was requested (Groq's "Limit 8000, Requested 15408" style),
    // aim for ~65% of that ratio so there's real headroom left for the
    // reply itself and the tool definitions, which also count against the
    // same per-minute limit but aren't reflected in that ratio. Without
    // parseable numbers, just cut hard and try again.
    function mu_nextContextScale(scale, err){
        const msg = String((err && err.message) || err || '');
        const m = msg.match(/limit\D{0,10}(\d[\d,]*)\D+requested\D{0,10}(\d[\d,]*)/i);
        if(m){
            const limit = parseInt(m[1].replace(/,/g,''), 10);
            const requested = parseInt(m[2].replace(/,/g,''), 10);
            if(limit > 0 && requested > 0){
                const target = (limit / requested) * 0.65;
                return Math.max(0.06, Math.min(scale * 0.6, target));
            }
        }
        return Math.max(0.12, scale * 0.35);
    }

    /* Locked note content is never readable without its password, so
       relevance can only be judged from what's visible while locked: the
       note's title. A rough word-overlap check against the query is good
       enough to decide whether to mention the note at all. */
    function mAiFindRelevantLockedNotes(query){
        if(typeof categories === 'undefined') return [];
        const q = normalizeText(query);
        if(!q) return [];
        return categories.filter(c => !c.isDecoy && isNoteLocked(c) && !unlockedQaIds.includes(c.id)).filter(c => {
            const name = normalizeText(c.name || '');
            if(!name) return false;
            if(q.includes(name)) return true;
            return name.split(' ').some(w => w.length >= 3 && q.includes(w));
        });
    }

    ];

    /* Resolves a model-supplied note reference (an id, an exact title, or a
       loose/partial title) to an actual note object. Never returns a decoy
       note (a locked note's fake front); locked-ness itself is checked
       separately by callers via mAiIsLockedForAi() so the "not found" vs
       "it's locked" messages stay distinct for the user. */
    function mAiResolveNote(ref){
        if(typeof categories === 'undefined' || !ref) return null;
        const items = categories.filter(c => !c.isDecoy);
        let item = items.find(c => c.id === ref);
        if(item) return item;
        const norm = normalizeText(String(ref));
        if(!norm) return null;
        item = items.find(c => normalizeText(c.name || '') === norm);
        if(item) return item;
        /* Fuzzy fallback. Several notes can legitimately share the same
           substring (e.g. "خرید" matches both "لیست خرید" and "لیست خرید
           قدیمی"), and just grabbing whichever happened to come first in
           array order — the old behavior — meant the AI could silently act
           on the wrong note with no way for anyone to notice until after
           the fact. Score every partial match instead, so the most likely
           intended note wins on purpose: a whole-word match beats a
           mid-word substring, a name whose length is closer to what the
           user actually typed beats a much longer/shorter one, and the
           most recently edited note wins any remaining tie (it's the one
           most likely to be on the user's mind right now). */
        const candidates = items.filter(c => {
            const n = normalizeText(c.name || '');
            return n && (n.includes(norm) || norm.includes(n));
        });
        if(!candidates.length) return null;
        if(candidates.length === 1) return candidates[0];
        const scored = candidates.map(c => {
            const n = normalizeText(c.name || '');
            let score = 0;
            if(n.split(' ').includes(norm)) score += 5;
            if(n.startsWith(norm)) score += 2;
            score -= Math.abs(n.length - norm.length) * 0.05;
            return { c, score, t: Date.parse(c.lastEdited || '') || 0 };
        });
        scored.sort((a, b) => (b.score - a.score) || (b.t - a.t));
        return scored[0].c;
    }

    /* Matches a folder name against the app's real folder list the same
       way a person would recognize it — ignoring case, extra spaces, and
       Arabic/Persian letter variants (ي vs ی, ك vs ک, etc.) via
       normalizeText. Every place that lets the AI create-or-use a folder
       used to compare with plain folders.includes(name), which is exact
       string equality: the model saying "کار" when the real folder is
       "Kar " (trailing space) or "کاری" would silently spawn a duplicate
       folder instead of filing into the one the user meant. Returns the
       folder's real, already-stored spelling so callers keep using it
       consistently instead of whatever variant the model happened to type. */
    function mAiFindExistingFolder(name){
        if(typeof folders === 'undefined' || !name) return null;
        const norm = normalizeText(String(name));
        if(!norm) return null;
        return folders.find(f => normalizeText(f) === norm) || null;
    }

    function mAiIsLockedForAi(item){
        return isNoteLocked(item) && !unlockedQaIds.includes(item.id);
    }

    /* Runs one tool call and performs the real app action, returning a
       small JSON-able result object that gets fed back to the model as a
       tool_result. Every mutating branch reuses the app's own
       saveToLocalStorage()/renderApp()/showToast() so an AI-driven change
       looks and behaves exactly like a manual one (same persistence, same
       on-screen toast, same live re-render). */
    async function mAiExecuteTool(toolName, input){
        input = input || {};
        const fa = currentLang === 'fa';
        const notFound = { ok:false, error: fa ? 'یادداشتی با این مشخصات پیدا نشد.' : 'No matching note was found.' };
        const locked = { ok:false, error: fa ? 'این یادداشت قفل است و در دسترس نیست؛ کاربر باید اول از دکمه 🔒 بازش کند.' : 'This note is locked and unavailable; the user needs to unlock it via the 🔒 button first.' };
        try {
            switch(toolName){
                case 'find_notes': {
                    const qn = normalizeText(String(input.query || '').trim());
                    const base = categories.filter(c => !c.isDecoy && (!isNoteLocked(c) || unlockedQaIds.includes(c.id)));
                    let list = base;
                    if(qn){
                        // First try a plain substring match (fast path for clean queries).
                        list = base.filter(c => {
                            const name = normalizeText(c.name || '');
                            const body = normalizeText(mu_notePlainText(c) || '');
                            const tags = (c.tags || []).some(t => normalizeText(t).includes(qn));
                            return name.includes(qn) || body.includes(qn) || tags;
                        });
                        /* Fuzzy fallback: the query may itself carry the user's typos
                           (misspelled note title, swapped/dropped letters, sloppy
                           spacing) relayed almost verbatim by the model, so an exact
                           substring match can legitimately find nothing even though a
                           note clearly matches. Score every note by term overlap,
                           allowing each search word to match a near-miss substring
                           (same trick used by the app's own fuzzy in-note search), and
                           fall back to whatever scores reasonably instead of reporting
                           "not found". */
                        if(!list.length){
                            const terms = qn.split(/\s+/).filter(Boolean);
                            if(terms.length){
                                const scored = base.map(c => {
                                    const hay = normalizeText([c.name, mu_notePlainText(c), c.folder, (c.tags||[]).join(' ')].join(' '));
                                    let score = 0;
                                    terms.forEach(term => {
                                        if(hay.includes(term)) score += 3;
                                        else if([...hay].some((_, i) => hay.slice(i, i + term.length).includes(term.slice(0, Math.max(2, term.length - 1))))) score += 1;
                                    });
                                    return { c, score };
                                }).filter(x => x.score >= Math.max(1, terms.length));
                                scored.sort((a, b) => b.score - a.score);
                                list = scored.map(x => x.c);
                            }
                        }
                    }
                    return { ok:true, data: list.slice(0, 30).map(c => ({
                        id: c.id, name: c.name, folder: c.folder || '', tags: c.tags || [],
                        pinned: !!c.pinned, favorite: !!c.favorite, archived: !!c.archived,
                        snippet: mu_notePlainText(c).slice(0, 180)
                    })) };
                }
                case 'create_note': {
                    const name = String(input.name || '').trim();
                    if(!name) return { ok:false, error: fa ? 'نام یادداشت لازم است.' : 'A note name is required.' };
                    const contentText = String(input.content || '');
                    let folderName = String(input.folder || '').trim();
                    if(folderName && folderName !== DEFAULT_FOLDER){
                        const existing = mAiFindExistingFolder(folderName);
                        if(existing){ folderName = existing; }
                        else { folders.push(folderName); saveFoldersToLocalStorage(); }
                    } else {
                        folderName = '';
                    }
                    const id = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
                    // contentText may carry lightweight markdown (**bold**, *italic*,
                    // `code`, # headings, > quotes, - lists, [text](url)) that the model
                    // was told it can use — render it to real formatted HTML instead of
                    // dumping it as escaped plain text with the markers still visible.
                    const html = mdToHtml(contentText);
                    const newCategory = normalizeCategory({ id, name, folder: folderName, text: contentText, html, lastEdited: new Date().toUTCString() }, categories.length);
                    categories.push(newCategory);
                    saveToLocalStorage();
                    renderApp(newCategory.id);
                    showToast(fa ? '🤖 یادداشت «' + name + '» ساخته شد' : '🤖 Note "' + name + '" created');
                    return { ok:true, data:{ id:newCategory.id, name:newCategory.name, folder:newCategory.folder } };
                }
                case 'edit_note_content': {
                    const item = mAiResolveNote(input.note);
                    if(!item) return notFound;
                    if(mAiIsLockedForAi(item)) return locked;
                    const newText = String(input.content == null ? '' : input.content);
                    const mode = String(input.mode || 'replace').toLowerCase();
                    const newHtml = mdToHtml(newText);
                    if(mode === 'append'){
                        item.text = (item.text || '') + (item.text ? '\n' : '') + newText;
                        item.html = (item.html || '') + newHtml;
                    } else {
                        item.text = newText;
                        item.html = newHtml;
                    }
                    item.lastEdited = new Date().toUTCString();
                    saveToLocalStorage();
                    renderApp(item.id);
                    showToast(fa ? '🤖 یادداشت «' + item.name + '» ویرایش شد' : '🤖 Note "' + item.name + '" updated');
                    return { ok:true, data:{ id:item.id, name:item.name } };
                }
                case 'rename_note': {
                    const item = mAiResolveNote(input.note);
                    if(!item) return notFound;
                    if(mAiIsLockedForAi(item)) return locked;
                    const newName = String(input.new_name || '').trim();
                    if(!newName) return { ok:false, error: fa ? 'نام جدید لازم است.' : 'A new name is required.' };
                    const oldName = item.name;
                    item.name = newName;
                    saveToLocalStorage();
                    renderApp(activeOpenId);
                    showToast(fa ? '✏️ تغییر نام به: ' + newName : '✏️ Renamed to: ' + newName);
                    return { ok:true, data:{ id:item.id, old_name:oldName, new_name:newName } };
                }
                case 'move_note_to_folder': {
                    const item = mAiResolveNote(input.note);
                    if(!item) return notFound;
                    if(mAiIsLockedForAi(item)) return locked;
                    let folderName = String(input.folder || '').trim();
                    const isNone = !folderName || folderName === DEFAULT_FOLDER || normalizeText(folderName) === normalizeText('none') || normalizeText(folderName) === normalizeText('هیچ');
                    if(isNone){
                        item.folder = '';
                    } else {
                        const existing = mAiFindExistingFolder(folderName);
                        if(existing){ folderName = existing; }
                        else { folders.push(folderName); saveFoldersToLocalStorage(); }
                        item.folder = folderName;
                    }
                    saveToLocalStorage();
                    renderApp(activeOpenId);
                    showToast(fa ? '📁 یادداشت جابجا شد' : '📁 Note moved');
                    return { ok:true, data:{ id:item.id, folder:item.folder } };
                }
                case 'tag_note': {
                    const item = mAiResolveNote(input.note);
                    if(!item) return notFound;
                    if(mAiIsLockedForAi(item)) return locked;
                    ensureItem(item);
                    let tags = Array.isArray(item.tags) ? item.tags.slice() : [];
                    const add = Array.isArray(input.add_tags) ? input.add_tags : [];
                    const remove = Array.isArray(input.remove_tags) ? input.remove_tags : [];
                    add.forEach(t => { t = String(t || '').trim(); if(t && !tags.some(x => normalizeText(x) === normalizeText(t))) tags.push(t); });
                    if(remove.length) tags = tags.filter(t => !remove.some(r => normalizeText(String(r || '')) === normalizeText(t)));
                    item.tags = tags;
                    saveToLocalStorage();
                    renderApp(activeOpenId);
                    showToast(fa ? '🏷️ برچسب‌ها بروزرسانی شد' : '🏷️ Tags updated');
                    return { ok:true, data:{ id:item.id, tags:item.tags } };
                }
                case 'set_pinned': {
                    const item = mAiResolveNote(input.note);
                    if(!item) return notFound;
                    if(mAiIsLockedForAi(item)) return locked;
                    ensureItem(item);
                    item.pinned = !!input.pinned;
                    saveToLocalStorage();
                    renderApp(activeOpenId);
                    showToast(item.pinned ? (fa ? '📌 پین شد' : '📌 Pinned') : (fa ? '📌 پین برداشته شد' : '📌 Unpinned'));
                    return { ok:true, data:{ id:item.id, pinned:item.pinned } };
                }
                case 'set_favorite': {
                    const item = mAiResolveNote(input.note);
                    if(!item) return notFound;
                    if(mAiIsLockedForAi(item)) return locked;
                    ensureItem(item);
                    item.favorite = !!input.favorite;
                    saveToLocalStorage();
                    renderApp(activeOpenId);
                    showToast(item.favorite ? (fa ? '⭐ به فیوریت اضافه شد' : '⭐ Added to favorites') : (fa ? '⭐ از فیوریت حذف شد' : '⭐ Removed from favorites'));
                    return { ok:true, data:{ id:item.id, favorite:item.favorite } };
                }
                case 'archive_note': {
                    const item = mAiResolveNote(input.note);
                    if(!item) return notFound;
                    if(mAiIsLockedForAi(item)) return locked;
                    ensureItem(item);
                    const archived = !!input.archived;
                    item.archived = archived;
                    if(archived && activeOpenId === item.id) activeOpenId = null;
                    saveToLocalStorage();
                    renderApp(activeOpenId);
                    showToast(archived ? (fa ? '📦 بایگانی شد' : '📦 Archived') : (fa ? '📦 از بایگانی بازگردانده شد' : '📦 Restored from archive'));
                    return { ok:true, data:{ id:item.id, archived:item.archived } };
                }
                case 'merge_notes': {
                    const refs = Array.isArray(input.notes) ? input.notes : [];
                    const items = refs.map(r => mAiResolveNote(r)).filter(Boolean);
                    if(items.length < 2) return { ok:false, error: fa ? 'حداقل دو یادداشت معتبر لازم است.' : 'At least two valid notes are required.' };
                    if(items.some(it => mAiIsLockedForAi(it))) return locked;
                    const mergedName = String(input.new_name || '').trim() || items.map(i => i.name).join(' + ');
                    const mergedHtml = items.map(it => '<h3>' + escapeHtml(it.name) + '</h3>' + (it.html || escapeHtml(it.text || ''))).join('<hr>');
                    const mergedText = items.map(it => '## ' + it.name + '\n' + (it.text || mu_notePlainText(it))).join('\n\n---\n\n');
                    const id = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
                    const newCategory = normalizeCategory({ id, name: mergedName, folder: items[0].folder || '', text: mergedText, html: mergedHtml, lastEdited: new Date().toUTCString() }, categories.length);
                    categories.push(newCategory);
                    let deletedIds = [];
                    if(input.delete_originals){
                        const names = items.map(i => i.name).join(fa ? '، ' : ', ');
                        const confirmMsg = fa
                            ? `آیا ${items.length} یادداشت اصلی (${names}) بعد از ترکیب حذف شوند؟ (بعداً از بخش گورستان قابل بازیابی خواهند بود)`
                            : `Delete the ${items.length} original notes (${names}) now that they've been merged? (They can be restored later from the Cemetery.)`;
                        if(confirm(confirmMsg)){
                            deletedIds = items.map(i => i.id);
                            // Same Cemetery bug as delete_note: archive each original
                            // before removing it so "delete the originals after merging"
                            // is recoverable too, matching what the AI tells the user.
                            items.forEach(it => archiveToCemetery(it));
                            categories = categories.filter(c => !deletedIds.includes(c.id));
                            if(deletedIds.includes(activeOpenId)) activeOpenId = null;
                        }
                    }
                    saveToLocalStorage();
                    renderApp(newCategory.id);
                    showToast(fa ? '🔗 یادداشت‌ها ترکیب شدند' : '🔗 Notes merged');
                    return { ok:true, data:{ id:newCategory.id, name:newCategory.name, deleted_original_ids:deletedIds } };
                }
                case 'delete_note': {
                    const item = mAiResolveNote(input.note);
                    if(!item) return notFound;
                    if(mAiIsLockedForAi(item)) return locked;
                    const confirmMsg = fa
                        ? `آیا مطمئنی می‌خواهی یادداشت «${item.name}» حذف شود؟ (بعداً از بخش گورستان قابل بازیابی خواهد بود)`
                        : `Are you sure you want to delete the note "${item.name}"? (It can be restored later from the Cemetery.)`;
                    if(!confirm(confirmMsg)){
                        return { ok:false, cancelled:true, error: fa ? 'کاربر حذف را در پنجره تأیید لغو کرد.' : 'The user cancelled the deletion in the confirmation dialog.' };
                    }
                    // Bug fix: this used to remove the note straight from `categories`
                    // without ever calling archiveToCemetery(), unlike the app's own
                    // delete button (deleteCategory()) — so an AI-driven delete was
                    // silently unrecoverable even though the AI tells the user every
                    // deletion lands in the Cemetery. Route it through the same path.
                    archiveToCemetery(item);
                    categories = categories.filter(c => c.id !== item.id);
                    if(activeOpenId === item.id) activeOpenId = null;
                    saveToLocalStorage();
                    renderApp();
                    showToast(fa ? '🗑️ یادداشت حذف شد' : '🗑️ Note deleted');
                    return { ok:true, data:{ id:item.id, name:item.name } };
                }
                case 'set_theme': {
                    if(typeof themes === 'undefined' || !themes.length) return { ok:false, error: fa ? 'فهرست تم‌ها در دسترس نیست.' : 'Theme list is unavailable.' };
                    const wanted = normalizeText(String(input.theme || '').trim());
                    if(!wanted) return { ok:false, error: fa ? 'نام تم لازم است.' : 'A theme name is required.' };
                    let idx = themes.findIndex(t => normalizeText(t.id) === wanted || normalizeText(t.nameFa) === wanted || normalizeText(t.nameEn) === wanted);
                    if(idx < 0) idx = themes.findIndex(t => normalizeText(t.id).includes(wanted) || normalizeText(t.nameFa).includes(wanted) || normalizeText(t.nameEn).includes(wanted) || wanted.includes(normalizeText(t.id)));
                    if(idx < 0){
                        return { ok:false, error: fa
                            ? 'تمی با این نام پیدا نشد. تم‌های موجود: ' + themes.map(t => t.nameFa).join('، ')
                            : 'No matching theme found. Available themes: ' + themes.map(t => t.nameEn).join(', ') };
                    }
                    applyTheme(idx);
                    try{ localStorage.setItem('app_theme_index_v13', idx); }catch(e){}
                    const applied = themes[idx];
                    showToast(fa ? '🎨 تم به «' + applied.nameFa + '» تغییر کرد' : '🎨 Theme switched to "' + applied.nameEn + '"');
                    return { ok:true, data:{ theme: applied.id, nameFa: applied.nameFa, nameEn: applied.nameEn } };
                }
                case 'set_language': {
                    const wanted = String(input.language || '').trim().toLowerCase();
                    if(wanted !== 'fa' && wanted !== 'en') return { ok:false, error: fa ? 'زبان باید fa یا en باشد.' : 'language must be "fa" or "en".' };
                    if(currentLang !== wanted) toggleLanguage();
                    return { ok:true, data:{ language: currentLang } };
                }
                case 'export_notes': {
                    const format = String(input.format || '').toLowerCase();
                    const structuredFormats = ['json','csv','md','txt'];
                    const imageFormats = ['png','jpg'];
                    if(![...structuredFormats, 'pdf', 'docx', ...imageFormats].includes(format)){
                        return { ok:false, error: fa ? 'فرمت خروجی نامعتبر است.' : 'Invalid export format.' };
                    }
                    let items, singleItem = null;
                    if(input.note){
                        singleItem = mAiResolveNote(input.note);
                        if(!singleItem) return notFound;
                        if(mAiIsLockedForAi(singleItem)) return locked;
                        items = [singleItem];
                    } else {
                        if(imageFormats.includes(format)){
                            return { ok:false, error: fa ? 'برای خروجی تصویر باید یک یادداشت مشخص کنی.' : 'Image export needs a specific note.' };
                        }
                        items = getExportableCategories();
                    }
                    if(!items.length) return { ok:false, error: fa ? 'یادداشتی برای خروجی وجود ندارد.' : 'There are no notes to export.' };
                    const now = new Date();
                    const pad2 = n => String(n).padStart(2, '0');
                    const stamp = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}_${pad2(now.getHours())}-${pad2(now.getMinutes())}`;
                    const defaultBase = singleItem ? sanitizeFilename(singleItem.name) : `Markhin_Export_${stamp}`;
                    const chosenName = sanitizeFilename(String(input.filename || '').trim() || defaultBase);
                    try {
                        if(structuredFormats.includes(format)){
                            const ext = getStructuredExtension(format);
                            const mime = getStructuredMime(format);
                            const blob = new Blob([buildStructuredExport(format, items)], { type: mime });
                            await robustDownload(blob, `${chosenName}.${ext}`, mime);
                        } else if(format === 'pdf'){
                            if(window.html2canvas && window.jspdf?.jsPDF){
                                const blob = await createPDFBlob(items);
                                await robustDownload(blob, `${chosenName}.pdf`, 'application/pdf');
                            } else if(typeof exportPDFPrint === 'function'){
                                exportPDFPrint(items, chosenName);
                            } else {
                                return { ok:false, error: fa ? 'ساخت PDF در دسترس نیست.' : 'PDF export is unavailable.' };
                            }
                        } else if(format === 'docx'){
                            const blob = await createDOCXBlob(items);
                            await robustDownload(blob, `${chosenName}.docx`, blob.type || 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
                        } else if(imageFormats.includes(format)){
                            const blob = await renderNoteToImage(items[0], format);
                            await robustDownload(blob, `${chosenName}.${format}`, format === 'jpg' ? 'image/jpeg' : 'image/png');
                        }
                        showToast(fa ? '📤 خروجی آماده شد و دانلود شروع شد.' : '📤 Export is ready — the download has started.');
                        return { ok:true, data:{ format, count: items.length, filename: chosenName } };
                    } catch(e){
                        console.error('AI export error:', e);
                        return { ok:false, error: fa ? 'ساخت فایل خروجی انجام نشد.' : 'Building the export file failed.' };
                    }
                }
                case 'open_app_view': {
                    const view = String(input.view || '').toLowerCase();
                    if(view === 'knowledge_graph' && typeof openKnowledgeGraph === 'function'){ openKnowledgeGraph(); return { ok:true, data:{ view } }; }
                    if(view === 'cemetery' && typeof openCemetery === 'function'){ openCemetery(); return { ok:true, data:{ view } }; }
                    if(view === 'random_portal' && typeof openRandomPortal === 'function'){ openRandomPortal(); return { ok:true, data:{ view } }; }
                    return { ok:false, error: fa ? 'این بخش در دسترس نیست.' : 'That view is unavailable.' };
                }
                case 'compare_notes': {
                    const refs = Array.isArray(input.notes) ? input.notes : [];
                    if(refs.length < 2) return { ok:false, error: fa ? 'حداقل به دو یادداشت نیاز است.' : 'At least two notes are required.' };
                    const items = [];
                    for(const ref of refs){
                        const it = mAiResolveNote(ref);
                        if(!it) return { ok:false, error: (fa ? 'یادداشتی با این مشخصات پیدا نشد: ' : 'No matching note found: ') + ref };
                        if(mAiIsLockedForAi(it)) return { ok:false, error: (fa ? 'این یادداشت قفل است: ' : 'This note is locked: ') + (it.name || ref) };
                        items.push(it);
                    }
                    const MAI_STOPWORDS = new Set(['است','این','آن','برای','با','که','را','در','از','به','و','یا','هم','هست','بود','شد','می','های','ها','یک','چه','اگر','ولی','اما','the','and','or','a','an','is','are','was','were','to','of','in','on','for','with','that','this','it','as','be','by']);
                    function mAiSignificantWords(text){
                        const norm = normalizeText(text || '');
                        return new Set(norm.split(/\s+/).filter(w => w.length >= 3 && !MAI_STOPWORDS.has(w)));
                    }
                    const perNote = items.map(it => {
                        const text = mu_notePlainText(it) || '';
                        return {
                            id: it.id, name: it.name, folder: it.folder || '', tags: it.tags || [],
                            pinned: !!it.pinned, favorite: !!it.favorite, archived: !!it.archived,
                            wordCount: text.trim() ? text.trim().split(/\s+/).length : 0,
                            charCount: text.length,
                            lastEdited: it.lastEdited || '',
                            words: mAiSignificantWords(text + ' ' + it.name)
                        };
                    });
                    let common = perNote[0].words;
                    for(let i = 1; i < perNote.length; i++){ common = new Set([...common].filter(w => perNote[i].words.has(w))); }
                    let commonTags = new Set((perNote[0].tags || []).map(t => normalizeText(t)));
                    for(let i = 1; i < perNote.length; i++){
                        const tagSet = new Set((perNote[i].tags || []).map(t => normalizeText(t)));
                        commonTags = new Set([...commonTags].filter(t => tagSet.has(t)));
                    }
                    const sameFolder = perNote.every(n => n.folder && n.folder === perNote[0].folder) ? perNote[0].folder : null;
                    return { ok:true, data:{
                        notes: perNote.map(n => ({ id:n.id, name:n.name, folder:n.folder, tags:n.tags, pinned:n.pinned, favorite:n.favorite, archived:n.archived, wordCount:n.wordCount, charCount:n.charCount, lastEdited:n.lastEdited })),
                        commonSignificantWords: [...common].slice(0, 40),
                        commonTags: [...commonTags],
                        sameFolder
                    } };
                }
                case 'get_dashboard_stats': {
                    const all = categories.filter(c => !c.isDecoy && (!isNoteLocked(c) || unlockedQaIds.includes(c.id)));
                    const activeList = all.filter(c => !isArchived(c));
                    const archivedList = all.filter(c => isArchived(c));
                    const pinned = activeList.filter(c => c.pinned).map(c => ({ id:c.id, name:c.name, folder:c.folder || '' }));
                    const favorite = activeList.filter(c => c.favorite).map(c => ({ id:c.id, name:c.name, folder:c.folder || '' }));
                    const folderCounts = {};

                        if(totalChars >= CHAR_BUDGET){ truncatedVault = true; break; }
                        let piece = mu_notePlainText(c) || '';
                        if(totalChars + piece.length > CHAR_BUDGET){
                            piece = piece.slice(0, Math.max(0, CHAR_BUDGET - totalChars));

                    } };

                        if(folderName && folderName !== DEFAULT_FOLDER){
                            const existingFolder = mAiFindExistingFolder(folderName);
                            if(existingFolder){ folderName = existingFolder; }
                            else { folders.push(folderName); }
                        } else {
                            folderName = '';
                        }
                        const id = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;

                        categories.push(newCategory);
                        created.push({ id:newCategory.id, name:newCategory.name, folder:newCategory.folder });
                    });

                    function mAiWordsFD(text){
                        const norm = normalizeText(text || '');
                        return new Set(norm.split(/\s+/).filter(w => w.length >= 3 && !MAI_STOPWORDS_FD.has(w)));
                    }
                    const pool = categories.filter(c => !c.isDecoy && !isArchived(c) && (!isNoteLocked(c) || unlockedQaIds.includes(c.id)));
                    let threshold = Number(input.min_similarity);
                    if(!Number.isFinite(threshold) || threshold <= 0 || threshold > 1) threshold = 0.5;
                    const prepped = pool.map(c => ({ item:c, words: mAiWordsFD((mu_notePlainText(c) || '') + ' ' + c.name) })).filter(p => p.words.size >= 3);

                        for(let j = i + 1; j < prepped.length; j++){

                            if(!inter) continue;
                            const union = new Set([...a, ...b]).size;
                            const sim = union ? inter / union : 0;
                            if(sim >= threshold){
                                pairs.push({
                                    a: { id: prepped[i].item.id, name: prepped[i].item.name },
                                    b: { id: prepped[j].item.id, name: prepped[j].item.name },
                                    similarity: Math.round(sim * 100) / 100
                                });
                            }
                        }
                    }
                    pairs.sort((x, y) => y.similarity - x.similarity);
                    return { ok:true, data:{ pairs: pairs.slice(0, 30), scanned_notes: prepped.length } };
                }
                case 'get_chat_history': {

                    // — not the shorter slice actually sent as live context for

                    const full = mAiHistory;

                    const capCount = function(n){ const v = Math.round(Number(n)); return Math.max(1, Math.min(20, Number.isFinite(v) && v > 0 ? v : 1)); };
                    function pack(list){
                        return list.map(function(m){
                            return { index: full.indexOf(m), role: m.role, content: String(m.content == null ? '' : m.content).slice(0, 800) };
                        });
                    }
                    let results;

                        results = pack(full.slice(0, capCount(input.count)));

                        results = pack(full.slice(-capCount(input.count)));
                    } else if(mode === 'range'){
                        let start = Math.round(Number(input.start));
                        if(!Number.isFinite(start) || start < 0) start = 0;
                        let end = Math.round(Number(input.end));
                        if(!Number.isFinite(end) || end <= start) end = start + 10;
                        results = pack(full.slice(start, Math.min(end, full.length)));
                    } else if(mode === 'search'){
                        const q = normalizeText(String(input.query || ''));
                        if(!q) return { ok:false, error: fa ? 'برای جستجو باید عبارتی وارد کنی.' : 'A search query is required for "search" mode.' };
                        results = pack(full.filter(function(m){ return normalizeText(String(m.content || '')).includes(q); })).slice(0, 20);
                    } else {
                        return { ok:false, error: 'mode must be one of: first, last, range, search' };
                    }
                    return { ok:true, data:{ total_messages: full.length, results: results } };
                }
                default:
                    return { ok:false, error: 'Unknown tool: ' + toolName };
            }
        } catch(e){
            return { ok:false, error: String((e && e.message) || e) };
        }
    }

ags and content, and looking up older parts of this very conversation that are no longer in your current context (e.g. the user\'s very first message)';
