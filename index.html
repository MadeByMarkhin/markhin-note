<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#03101c" id="mAiThemeColorMeta">
    <meta name="color-scheme" content="dark">
    <title>مدیریت اطلاعات و حساب‌ها</title>
    <!-- Telegram Mini App load-speed fix: these two web-font stylesheets used
         to be @import'd inside the <style> block below, which forces the
         browser to fetch and parse them before it can finish building the
         page's CSSOM at all — i.e. first paint waits on two external font
         hosts. Loading them as <link> tags with the classic
         media="print" -> onload="this.media='all'" swap keeps them fully
         non-blocking: the page paints immediately with fallback fonts, then
         swaps to the real ones the instant they're ready. preconnect opens
         the connections to both font hosts in parallel while the rest of the
         head is still being read, shaving off the DNS/TLS handshake time. -->
    <link rel="preconnect" href="https://fonts.cdnfonts.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/cyberpunk" media="print" onload="this.media='all';window.__muFontSwapRestore&&window.__muFontSwapRestore();">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Orbitron:wght@700&family=Cinzel:wght@700&family=Share+Tech+Mono&family=Creepster&family=Poller+One&family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&family=Pacifico&display=swap" media="print" onload="this.media='all';window.__muFontSwapRestore&&window.__muFontSwapRestore();">
    <script>
        /* Bug fix (page/options "jump" once a web font finishes loading):
           the two <link> tags above intentionally load fonts non-blocking
           (media="print" -> onload swap) so first paint isn't delayed on a
           slow connection — see the comment further down explaining why.
           The tradeoff is that when a font DOES finish loading a moment
           later, the swap can change text metrics across the page (the
           body's base font is one of these), reflowing button rows and
           shifting page height right as a person may already be scrolling
           — exactly the "jump" this app has been reported to have. Unlike
           renderApp()/applyTheme() elsewhere in this file, which already
           capture and restore scroll position around their own DOM
           changes, this font swap previously had no such protection.
           This function gives it the same protection: whichever font
           link finishes loading calls this, and it puts the viewport
           back where the person had it, after giving the browser two
           frames to settle the new layout. Harmless if called twice
           (once per font link). */
        window.__muFontSwapRestore = function(){
            var y = window.scrollY || window.pageYOffset || 0;
            requestAnimationFrame(function(){
                requestAnimationFrame(function(){
                    window.scrollTo(0, y);
                });
            });
        };
    </script>
    <noscript>
        <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/cyberpunk">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Orbitron:wght@700&family=Cinzel:wght@700&family=Share+Tech+Mono&family=Creepster&family=Poller+One&family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&family=Pacifico&display=swap">
    </noscript>
    <style>

        /* Instant, jank-free theme switching. Dozens of elements across the
           app (buttons, cards, panels, inputs) use --transition-smooth,
           which is "all 0.35s" — great for hover/press feedback, but every
           one of those elements also reads --bg-gradient/--panel-bg/
           --card-bg/--text-color, which ALL change the moment a theme class
           swaps on <body>. That means dozens of elements animate every one
           of their color/border/shadow properties at once, which is exactly
           the "کندی و اختلال" (lag/jitter) a theme switch used to cause,
           especially inside Telegram's in-app WebView. applyTheme() below
           adds this class for one frame around the swap so the new theme
           applies instantly instead of visibly transitioning in, then
           removes it so normal hover/press transitions keep working
           afterwards. */
        body.theme-switching, body.theme-switching * {
            transition: none !important;
        }

        :root {
            /* Every theme in this app is a dark background, so we force the
               browser's native UI (and — most importantly — the on-screen
               keyboard) into its dark variant everywhere. Browsers give web
               pages no way to recolor the system keyboard to an arbitrary
               theme color (no such API exists); the closest real control is
               choosing between its built-in light/dark skins via
               color-scheme, so it never flashes a mismatched white keyboard
               over any of the dark themes below. */
            color-scheme: dark;
            --bg-gradient: radial-gradient(circle at top, #002b49 0%, #000814 100%);
            --panel-bg: rgba(0, 180, 216, 0.03);
            --panel-border: rgba(72, 202, 228, 0.12);
            --card-bg: rgba(3, 25, 44, 0.8);
            --text-color: #90e0ef;
            --btn-bg-fallback: rgba(255, 255, 255, 0.05);
            --transition-smooth: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            --border-radius-main: 14px;
            --border-radius-sm: 8px;
            --spacing-xs: 8px;
            --spacing-sm: 12px;
            --spacing-md: 16px;
            --spacing-lg: 20px;
        }

        /* Scroll-jump fix (applies to every theme): any fixed-position element
           that overlaps scrolling content — the decorative animated layers
           below, and the always-visible corner controls — has to be promoted
           to its own GPU compositing layer, or mobile WebViews (this is most
           visible inside Telegram's in-app browser) can repaint/misplace it
           for a single frame every time the page scrolls, which reads as the
           whole page "jumping". transform:translateZ(0) plus will-change is
           what forces that dedicated layer. */
        body.theme-oceanic::before, body.theme-oceanic::after,
        body.theme-cloudy::before,
        body.theme-aurora::before, body.theme-aurora::after,
        body.theme-phantom::before, body.theme-phantom::after,
        body.theme-aurora-phantom::before, body.theme-aurora-phantom::after,
        .top-right-controls {
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform;
        }

        /* Scroll black-flash fix. Every theme's ::before/::after is a full-viewport
           position:fixed layer with a heavy filter:blur() AND a continuously running
           CSS animation (oceanCaustics/auroraDrift/phantomDrift/twinkle/bubbles etc).
           Re-blurring a full-screen layer on every animation tick is already expensive;
           doing it *while the page is also scrolling* is what was showing up as a
           flash of solid black — the WebView (this is worst inside Telegram's in-app
           browser) drops frames under that combined GPU load and briefly presents an
           unpainted compositor layer instead of the real pixels. A small scroll
           listener (further down, next to the drag-reorder code) toggles this class
           on <body> for the duration of any scroll (including
           the manual auto-scroll used while drag-reordering notes/folders) and removes
           it ~150ms after the last scroll event. Freezing the animation and dropping
           the blur for that short window costs nothing visually — the drift is slow
           and nobody is looking at it while actively scrolling — but it removes the
           exact GPU spike that was causing the flash. */
        body.mu-scrolling[class*="theme-"]::before,
        body.mu-scrolling[class*="theme-"]::after {
            animation-play-state: paused !important;
            filter: none !important;
            /* Keep the fixed layer painted; removing/recompositing it while a
               fast fling is in progress can expose a black compositor frame. */
        }
        /* backdrop-filter is at least as expensive as the theme blur above, and
           .content-container.show is on-screen for most of the time someone is
           actually using the app (any time a note is open), not just briefly like
           a modal — so it was a second, independent source of the same scroll
           repaint spike. Dropping it for the same short scrolling window removes
           that cost too, with no visible difference since it's imperceptible
           mid-scroll. (This used to be widened to every element on the page, to
           chase a report of buttons rendering blank — but removing blur from a
           large surface like .control-panel for the ~150ms scroll-settle window
           means it visibly pops back in after every scroll, which is worse: a
           new, very noticeable jump on every single scroll. Kept scoped to just
           these two contained elements instead.) */
        body.mu-scrolling .content-container.show,
        body.mu-scrolling .qa-response-box {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
        /* Respect the OS-level "reduce motion" setting some people turn on
           specifically because animated UI causes them discomfort or performance
           trouble on their device — honor it by turning the same decorative
           layers fully static instead of just pausing them during scroll. */
        @media (prefers-reduced-motion: reduce) {
            body[class*="theme-"]::before, body[class*="theme-"]::after {
                animation: none !important;
            }
        }

        /* Themes with Enhanced Aesthetics & Animations */
        /* Oceanic — deep-sea gradient with drifting sunlit caustics and a
           slow stream of rising bubbles, for a more immersive underwater vibe. */
        body.theme-oceanic {
            --bg-gradient: linear-gradient(165deg, #014f79 0%, #01324f 30%, #012036 60%, #00121f 100%) !important;
            --panel-bg: rgba(72, 202, 228, 0.05) !important;
            --panel-border: rgba(144, 224, 239, 0.22) !important;
            --card-bg: rgba(2, 22, 39, 0.85) !important;
            --text-color: #ade8f4 !important;
            text-shadow: 0 1px 3px rgba(0, 10, 22, 0.55) !important;
        }
        body.theme-oceanic::before {
            /* Sunlight filtering down through water: soft glowing patches that
               drift and breathe slowly, like caustic light on the seabed. */
            content: "";
            position: fixed;
            /* Inset trimmed from -20% now that the drift keyframes below no
               longer rotate/scale this layer (see oceanCaustics) — without
               rotation there's no need for extra margin to hide the layer's
               edge swinging into view, so the painted/blurred area (and the
               GPU cost, which scales with that area) shrinks by roughly a
               third for the same visual effect. */
            top: -8%; left: -8%; right: -8%; bottom: -8%;
            background:
                radial-gradient(ellipse 55% 32% at 22% 8%, rgba(173, 232, 244, 0.16) 0%, transparent 60%),
                radial-gradient(ellipse 45% 30% at 78% 18%, rgba(0, 180, 216, 0.14) 0%, transparent 60%),
                radial-gradient(ellipse 60% 38% at 55% 55%, rgba(2, 62, 138, 0.22) 0%, transparent 65%),
                radial-gradient(ellipse 50% 30% at 30% 95%, rgba(0, 119, 182, 0.16) 0%, transparent 60%);
            /* Blur radius trimmed further (9px -> 6px -> 4px across two passes):
               repaint cost of a full-viewport blur scales with the square of the
               radius, so this is a meaningful GPU saving for a layer that's
               redrawn every animation frame, with a difference that's basically
               invisible at this softness level. */
            filter: blur(4px);
            pointer-events: none;
            z-index: -1;
            contain: paint;
            animation: oceanCaustics 20s ease-in-out infinite alternate;
        }
        /* Trimmed to translate + opacity only (no scale/rotate): a filtered
           (blurred) layer that's only translated stays a single pre-rasterized
           GPU layer the compositor just slides around every frame — free.
           Adding scale or rotate on top of a blur forces the browser to
           re-rasterize the layer at points during the animation, which is
           the actual expensive part. Visually near-identical drift. */
        @keyframes oceanCaustics {
            0%   { transform: translate3d(0, 0, 0); }
            50%  { transform: translate3d(-2%, 2%, 0); }
            100% { transform: translate3d(2%, -1.5%, 0); }
        }
        body.theme-oceanic::after {
            /* A gentle stream of bubbles rising from the bottom of the screen. */
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background-repeat: no-repeat;
            /* Stop count trimmed from 7 to 4: background-position keyframes
               can't be handed off to the compositor the way transform/opacity
               can, so every tick repaints this whole fixed layer — fewer
               gradient stops means less to recompute per repaint, for a bubble
               stream that reads the same at a glance. */
            background-image:
                radial-gradient(circle 3px at 12% 0%, rgba(202, 240, 248, .55), transparent 65%),
                radial-gradient(circle 4px at 38% 0%, rgba(202, 240, 248, .4), transparent 65%),
                radial-gradient(circle 2.5px at 62% 0%, rgba(202, 240, 248, .5), transparent 65%),
                radial-gradient(circle 3px at 86% 0%, rgba(202, 240, 248, .4), transparent 65%);
            background-position:
                12% 108%, 38% 118%, 62% 110%, 86% 116%;
            contain: paint;
            animation: oceanBubbles 16s linear infinite;
            opacity: .8;
        }
        @keyframes oceanBubbles {
            0%   { background-position: 12% 108%, 38% 118%, 62% 110%, 86% 116%; }
            100% { background-position: 10% -15%, 34% -20%, 60% -12%, 84% -18%; }
        }

        body.theme-spider {
            --bg-gradient: radial-gradient(circle, #1a001d 0%, #050008 100%) !important;
            --panel-bg: rgba(186, 85, 211, 0.04) !important;
            --panel-border: rgba(186, 85, 211, 0.22) !important;
            --card-bg: rgba(10, 2, 15, 0.85) !important;
            --text-color: #e9a3ff !important;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.65) !important;
        }

        body.theme-galaxy {
            --bg-gradient: radial-gradient(ellipse at bottom, #0d1d31 0%, #0c0d13 100%) !important;
            --panel-bg: rgba(255, 217, 102, 0.03) !important;
            --panel-border: rgba(255, 217, 102, 0.2) !important;
            --card-bg: rgba(5, 10, 20, 0.85) !important;
            --text-color: #ffd966 !important;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6) !important;
        }

        body.theme-cloudy {
            --bg-gradient: linear-gradient(160deg, #3a4557 0%, #202836 45%, #0d1117 100%) !important;
            --panel-bg: rgba(226, 232, 240, 0.045) !important;
            --panel-border: rgba(203, 213, 225, 0.22) !important;
            --card-bg: rgba(20, 26, 36, 0.85) !important;
            --text-color: #eef2f7 !important;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5) !important;
        }
        body.theme-cloudy::before {
            content: "";
            position: fixed;
            top: -8%; left: -10%; right: -10%; bottom: -8%;
            background:
                radial-gradient(ellipse 42% 18% at 20% 20%, rgba(226, 232, 240, 0.16) 0%, transparent 70%),
                radial-gradient(ellipse 38% 16% at 65% 12%, rgba(203, 213, 225, 0.13) 0%, transparent 70%),
                radial-gradient(ellipse 50% 20% at 85% 35%, rgba(226, 232, 240, 0.1) 0%, transparent 70%),
                radial-gradient(ellipse 45% 18% at 30% 62%, rgba(148, 163, 184, 0.1) 0%, transparent 70%);
            filter: blur(4px);

            contain: paint;
            animation: cloudDrift 42s linear infinite alternate;
        }
        @keyframes cloudDrift {

        }

        body.theme-dreamy {
            --bg-gradient: linear-gradient(135deg, #2b1055 0%, #4c3f91 100%) !important;
            --panel-bg: rgba(255, 255, 255, 0.05) !important;
            --panel-border: rgba(255, 192, 203, 0.25) !important;

            --text-color: #ffd6e2 !important;

        }

        body.theme-cyberpunk {
            --bg-gradient: linear-gradient(135deg, #0a0015 0%, #15002b 100%) !important;
            --panel-bg: rgba(0, 240, 255, 0.04) !important;
            --panel-border: rgba(0, 240, 255, 0.25) !important;
            --card-bg: rgba(5, 0, 15, 0.85) !important;
            --text-color: #4ff5ff !important;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.65) !important;
        }

        body.theme-love {
            --bg-gradient: radial-gradient(circle, #3a0010 0%, #0f0004 100%) !important;
            --panel-bg: rgba(255, 77, 109, 0.04) !important;
            --panel-border: rgba(255, 77, 109, 0.22) !important;
            --card-bg: rgba(20, 2, 7, 0.85) !important;
            --text-color: #ff92a8 !important;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6) !important;
        }

        /* Snowy — a cold moonlit night palette. The animated drifting-snowflake
           layers were removed on request (they were also the main source of
           the fixed-layer scroll-jump bug on this theme): body.theme-snowy is
           now just a static color palette, same as the other non-animated
           themes below. */
        body.theme-snowy {
            --bg-gradient: linear-gradient(180deg, #0a1628 0%, #060d1a 55%, #030712 100%) !important;
            --panel-bg: rgba(224, 242, 254, 0.045) !important;
            --panel-border: rgba(186, 230, 253, 0.2) !important;
            --card-bg: rgba(8, 14, 26, 0.85) !important;
            --text-color: #e0f2fe !important;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5) !important;
        }
        /* Rainy — a dark stormy sky palette. The animated falling-rain layers
           and lightning-flash keyframes were removed on request (they were
           also the main source of the fixed-layer scroll-jump bug on this
           theme): body.theme-rainy is now just a static color palette, same
           as the other non-animated themes below. */
        body.theme-rainy {
            --bg-gradient: linear-gradient(180deg, #0d1420 0%, #070c16 55%, #02040a 100%) !important;
            --panel-bg: rgba(148, 163, 184, 0.04) !important;
            --panel-border: rgba(148, 163, 184, 0.2) !important;
            --card-bg: rgba(15, 23, 42, 0.85) !important;
            --text-color: #a8d8ff !important;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55) !important;
        }

        body.theme-autumn {
            --bg-gradient: radial-gradient(circle, #2b1200 0%, #0d0500 100%) !important;
            --panel-bg: rgba(234, 88, 12, 0.04) !important;
            --panel-border: rgba(249, 115, 22, 0.18) !important;
            --card-bg: rgba(20, 8, 2, 0.85) !important;
            --text-color: #fdba74 !important;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6) !important;
        }

        body.theme-anonymous {
            --bg-gradient: #0c0c0c !important;
            --panel-bg: rgba(255, 255, 255, 0.015) !important;
            --panel-border: rgba(255, 255, 255, 0.08) !important;
            --card-bg: rgba(20, 20, 20, 0.85) !important;
            --text-color: #ffffff !important;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5) !important;
        }

        body.theme-terminal {
            --bg-gradient: radial-gradient(circle at center, #051605 0%, #000000 100%) !important;
            --panel-bg: rgba(0, 255, 65, 0.025) !important;
            --panel-border: rgba(0, 255, 65, 0.18) !important;
            --card-bg: rgba(0, 10, 2, 0.85) !important;
            --text-color: #4dff85 !important;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6) !important;
        }

        body.theme-darkweb {
            --bg-gradient: radial-gradient(circle, #150000 0%, #020000 100%) !important;
            --panel-bg: rgba(255, 0, 0, 0.025) !important;
            --panel-border: rgba(255, 0, 0, 0.18) !important;
            --card-bg: rgba(10, 0, 0, 0.9) !important;
            --text-color: #ff6b6b !important;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.65) !important;
        }

        body.theme-acid {
            --bg-gradient: #020a02 !important;
            --panel-bg: rgba(204, 255, 0, 0.025) !important;
            --panel-border: rgba(204, 255, 0, 0.18) !important;
            --card-bg: rgba(3, 15, 3, 0.85) !important;
            --text-color: #d9ff5c !important;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6) !important;
        }

        /* Aurora — layered ribbons of northern-lights color drifting across a
           starry night sky, with a gentle twinkle for extra depth. */
        body.theme-aurora {
            --bg-gradient: linear-gradient(160deg, #030d14 0%, #051826 40%, #030d12 75%, #01080d 100%) !important;
            --panel-bg: rgba(94, 255, 200, 0.04) !important;
            --panel-border: rgba(120, 255, 214, 0.22) !important;
            --card-bg: rgba(4, 20, 24, 0.85) !important;
            --text-color: #8dffd8 !important;
            text-shadow: 0 1px 3px rgba(0, 10, 12, 0.55) !important;
        }
        body.theme-aurora::before {
            content: "";
            position: fixed;
            /* Inset trimmed — see the oceanic ::before comment above; the
               drift keyframes below no longer rotate/scale this layer, so it
               no longer needs a large margin to hide its edges swinging into
               view, shrinking the blurred area substantially. */
            top: -8%; left: -8%; right: -8%; bottom: -8%;
            background:
                radial-gradient(ellipse 65% 22% at 15% 10%, rgba(125, 255, 208, 0.22) 0%, transparent 62%),
                radial-gradient(ellipse 55% 18% at 55% 22%, rgba(140, 120, 255, 0.18) 0%, transparent 62%),
                radial-gradient(ellipse 60% 20% at 85% 12%, rgba(80, 200, 255, 0.16) 0%, transparent 62%),
                radial-gradient(ellipse 70% 26% at 40% 88%, rgba(94, 255, 200, 0.1) 0%, transparent 65%);
            filter: blur(5px);
            pointer-events: none;
            z-index: -1;
            contain: paint;
            animation: auroraDrift 18s ease-in-out infinite alternate;
        }
        /* Trimmed to translate + opacity only — see the oceanCaustics comment
           above for why dropping rotate/scaleY from a blurred layer's
           animation is the actual GPU win, not just the blur radius. */
        @keyframes auroraDrift {
            0%   { transform: translate3d(0, 0, 0); }
            50%  { transform: translate3d(2.5%, -3%, 0); }
            100% { transform: translate3d(-2.5%, 2.5%, 0); }
        }
        body.theme-aurora::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            contain: paint;
            /* Star count trimmed from 8 to 5 — this layer isn't blurred so the
               stops themselves are cheap, but it still repaints every twinkle
               tick, so fewer stops is a direct per-frame saving. */
            background-image:
                radial-gradient(circle 1px at 15% 18%, rgba(255, 255, 255, .8), transparent 100%),
                radial-gradient(circle 1.5px at 48% 25%, rgba(255, 255, 255, .7), transparent 100%),
                radial-gradient(circle 1px at 78% 30%, rgba(255, 255, 255, .65), transparent 100%),
                radial-gradient(circle 1.5px at 90% 15%, rgba(255, 255, 255, .5), transparent 100%),
                radial-gradient(circle 1px at 58% 50%, rgba(255, 255, 255, .45), transparent 100%);
            animation: auroraTwinkle 6s ease-in-out infinite alternate;
        }
        @keyframes auroraTwinkle {
            0%   { opacity: .5; }
            50%  { opacity: 1; }
            100% { opacity: .6; }
        }

        /* Phantom — a haunted purple-blue mist that drifts through the dark,
           with a faint pulsing glow like something watching from the shadows. */
        body.theme-phantom {
            --bg-gradient: radial-gradient(circle at 50% 8%, #2b1250 0%, #140a28 40%, #05020a 75%, #000 100%) !important;
            --panel-bg: rgba(168, 85, 247, 0.04) !important;
            --panel-border: rgba(192, 132, 252, 0.25) !important;
            --card-bg: rgba(12, 5, 22, 0.9) !important;
            --text-color: #d8b4fe !important;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6) !important;
        }
        body.theme-phantom::before {
            content: "";
            position: fixed;
            top: -8%; left: -8%; right: -8%; bottom: -8%;
            background:
                radial-gradient(ellipse 50% 30% at 20% 25%, rgba(168, 85, 247, .16) 0%, transparent 62%),
                radial-gradient(ellipse 45% 28% at 80% 65%, rgba(59, 130, 246, .12) 0%, transparent 62%),
                radial-gradient(ellipse 55% 32% at 55% 90%, rgba(139, 92, 246, .1) 0%, transparent 65%);
            filter: blur(6px);
            pointer-events: none;
            z-index: -1;
            contain: paint;
            animation: phantomDrift 22s ease-in-out infinite alternate;
        }
        /* Trimmed to translate + opacity only — see the oceanCaustics comment
           above; dropping scale from a blurred layer's animation is what
           avoids re-rasterizing it mid-drift. */
        @keyframes phantomDrift {
            0%   { transform: translate3d(0, 0, 0); }
            50%  { transform: translate3d(-2.5%, -2%, 0); }
            100% { transform: translate3d(2.5%, 2%, 0); }
        }
        body.theme-phantom::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            contain: paint;
            background: radial-gradient(circle 220px at 50% 35%, rgba(216, 180, 254, .18), transparent 70%);
            animation: phantomPulse 7s ease-in-out infinite;
        }
        @keyframes phantomPulse {
            0%, 100% { opacity: .5; transform: scale(1); }
            50%      { opacity: .6; transform: scale(1.15); }
        }

        /* Aurora Phantom — a hybrid of the two: a violet "watching" glow (from
           Phantom) sitting over a deep aurora night sky, with drifting mist
           ribbons that blend both themes' color palettes and a faint twinkle
           of stars (from Aurora). Kept to the same two animated layers as
           every other theme above — the extra "watching eye" glow is folded
           into the static --bg-gradient instead of its own animated layer, so
           this doesn't cost any more GPU than either theme did alone. */
        body.theme-aurora-phantom {
            --bg-gradient: radial-gradient(circle at 50% 8%, rgba(123, 74, 226, 0.55) 0%, transparent 32%),
                           radial-gradient(circle at 50% 10%, #24123f 0%, #0d1f2e 40%, #030c14 72%, #000 100%) !important;
            --panel-bg: rgba(131, 170, 223, 0.045) !important;
            --panel-border: rgba(156, 193, 233, 0.24) !important;
            --card-bg: rgba(8, 12, 23, 0.88) !important;
            --text-color: #bad2ef !important;
            text-shadow: 0 1px 4px rgba(10, 5, 20, 0.6) !important;
        }
        body.theme-aurora-phantom::before {
            content: "";
            position: fixed;
            top: -8%; left: -8%; right: -8%; bottom: -8%;
            background:
                radial-gradient(ellipse 55% 20% at 20% 15%, rgba(125, 255, 208, 0.16) 0%, transparent 62%),
                radial-gradient(ellipse 50% 26% at 78% 60%, rgba(168, 85, 247, 0.14) 0%, transparent 62%),
                radial-gradient(ellipse 55% 22% at 50% 90%, rgba(80, 200, 255, 0.1) 0%, transparent 65%);
            filter: blur(5px);
            pointer-events: none;
            z-index: -1;
            contain: paint;
            animation: auroraPhantomDrift 20s ease-in-out infinite alternate;
        }
        @keyframes auroraPhantomDrift {
            0%   { transform: translate3d(0, 0, 0); }
            50%  { transform: translate3d(-2.5%, -2.5%, 0); }
            100% { transform: translate3d(2.5%, 2%, 0); }
        }
        body.theme-aurora-phantom::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            contain: paint;
            background-image:
                radial-gradient(circle 1px at 18% 20%, rgba(255, 255, 255, .75), transparent 100%),
                radial-gradient(circle 1.5px at 50% 15%, rgba(216, 180, 254, .7), transparent 100%),
                radial-gradient(circle 1px at 80% 28%, rgba(255, 255, 255, .6), transparent 100%),
                radial-gradient(circle 1.5px at 88% 55%, rgba(141, 255, 216, .55), transparent 100%),
                radial-gradient(circle 1px at 58% 48%, rgba(255, 255, 255, .45), transparent 100%);
            animation: auroraTwinkle 6s ease-in-out infinite alternate;
        }

        /* Static dark fallback so the very first paint (before any JS runs)
           never shows the browser's default white. Real browsers repaint
           this to match the active theme exactly via mu_syncHtmlBg() below,
           but this covers the gap before that JS executes. */
        html {
            background: #000814;
            min-height: 100%;
        }

        html, body {
            /* Scroll-anchoring off: this page's DOM changes constantly (notes/
               folders re-rendered, tool rows inserted, feature panels added a
               tick after open) while the person may already be scrolled deep
               into the page. The browser's scroll-anchoring heuristic reacts to
               those changes by picking an element to "anchor" the viewport to
               and silently adjusting scrollTop to keep it in place — but with
               this much going on, it regularly guesses wrong, which shows up as
               the page visibly jumping right after a scroll settles. Turning
               it off makes scroll position purely a function of what the user
               did, never something the browser corrects on our behalf. */
            overflow-anchor: none;
            /* Without this, a mobile rubber-band overscroll bounce at the
               top/bottom of the page reveals whatever is behind the
               document — here, <html>'s background — for the duration of
               the bounce. That's the "white flash at the bottom + theme
               jump" bug: disabling the bounce removes the visible gap
               entirely instead of just trying to color-match it. */
            overscroll-behavior-y: none;
            overscroll-behavior-x: none;
        }

        body {
            isolation: isolate;
            font-family: 'Share Tech Mono', sans-serif;
            /* Base spacing plus the device's safe-area insets (notch, Dynamic Island,
               home-indicator, and — inside Telegram — its own edge chrome), so fixed/near-edge
               UI (corner controls, toast, modals) never sits under them. viewport-fit=cover
               above is what makes env(safe-area-inset-*) resolve to a real value instead of 0. */
            padding: calc(var(--spacing-sm) + env(safe-area-inset-top))
                     calc(var(--spacing-sm) + env(safe-area-inset-right))
                     calc(var(--spacing-sm) + env(safe-area-inset-bottom))
                     calc(var(--spacing-sm) + env(safe-area-inset-left));
            background: var(--bg-gradient);
            color: var(--text-color);
            /* 100vh is unreliable inside Telegram's in-app WebView (it changes as Telegram's
               own header/keyboard show or hide, leaving dead space or clipped content).
               --app-1vh is kept in sync with Telegram's real usable height by mu_setAppVh()
               below; plain 100vh is just the pre-JS/non-Telegram fallback. */
            min-height: 100vh;
            min-height: calc(var(--app-1vh, 1vh) * 100);
            text-align: center;
            box-sizing: border-box;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        p, span, h1, h2, h3, label, input, select, option, textarea, button, div {
            color: var(--text-color);
        }

        /* Responsive Header Navigation */
        .header-nav {

        .brand-logo {
            font-family: 'Share Tech Mono', monospace;
            padding: 2px 5px;
            user-select: none;
            unicode-bidi: bidi-override;
            direction: ltr;
            /* Was `transition: var(--transition-smooth)` (all 0.35s), which meant the
               logo's *color* animated in over 350ms on every theme change while the
               rest of the page (body's color has no transition) switched instantly —
               making the logo visibly lag behind. Scope the transition to just the
               properties the hover/typing effects use, so color changes instantly
               with everything else. */
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1),
                        text-shadow 0.35s cubic-bezier(0.25, 0.8, 0.25, 1),
                        font-size 0.35s cubic-bezier(0.25, 0.8, 0.25, 1),

        }
        @keyframes evilPortalGlitch {
            0%, 74%, 100% { transform: translate(0) skewX(0); filter: none; }
            75% { transform: translate(-3px,1px) skewX(-2deg); filter: contrast(1.35) saturate(1.5) hue-rotate(-18deg); }
            76% { transform: translate(4px,-1px) skewX(2deg); filter: contrast(1.7) saturate(1.8) hue-rotate(12deg); }
            77% { transform: translate(-2px,0) skewX(-1deg); filter: brightness(.72) contrast(1.8); }
            78% { transform: translate(2px,2px) skewX(1deg); filter: brightness(1.2) contrast(1.6) saturate(2); }
            79% { transform: translate(0); filter: none; }
        }
        @keyframes evilSlices {
            0%, 55%, 100% { opacity: 0; clip-path: inset(0 0 100% 0); transform: translateX(0); }
            58% { opacity: .95; clip-path: inset(8% 0 72% 0); transform: translateX(-4px); }
            61% { opacity: .7; clip-path: inset(48% 0 28% 0); transform: translateX(5px); }
            64% { opacity: .9; clip-path: inset(76% 0 8% 0); transform: translateX(-3px); }
            67% { opacity: 0; }
        }
        @keyframes evilFlicker {
            0%, 62%, 100% { opacity: 0; }
            63% { opacity: .85; }
            64% { opacity: .12; }
            65% { opacity: .65; }
            66% { opacity: .05; }

        .btn-main, .custom-btn {

               opaque flat background keeps the same look without that cost. */
            background: rgba(0, 0, 0, 0.4);
            padding: 9px 14px;

        .content-container {
            display: none;

            margin: var(--spacing-sm) auto;
            /* Transparent instead of --card-bg: a solid/blurred fill here
               reads as the whole page brightening the moment a note opens.

            background: transparent;

/* Smoothness pass: reduce layout thrashing while keeping the existing visual design. */
/* NOTE: this rule used to also force transform:translateZ(0);backface-visibility:hidden
   on every one of these selectors, to pre-promote them to their own GPU
   compositing layer. On Telegram's in-app Android WebView that backfired badly:
   promoting a text-containing element to its own layer can leave that layer's
   text unrasterized on first paint, so the button/card shows as an empty box
   with no label — the "options render blank, then appear once I tap/scroll"
   bug, because tapping/scrolling triggers a state change that forces the
   layer to repaint and only then draws the text. Dropping the forced layer
   promotion helped but didn't fully fix it: contain:layout paint below has
   the same failure mode on the same WebView builds — the "paint" part of
   that containment also isolates the element into its own paint-invalidation
   boundary, and on the affected builds that boundary can be left unpainted
   (buttons rendering blank/missing) until something else forces a repaint —
   which is exactly the still-reported bug, now on the export buttons
   specifically (they're the ones furthest down the paint order, so most
   likely to be mid-render when this happens). contain:layout alone still
   gets the "don't let this element's layout affect its siblings" win (the
   actual goal of this smoothness pass) without the paint-containment
   boundary that's causing the blank/missing-until-interaction bug. */
.note-card,.category-card,.btn-main,.custom-btn,.image-export-choice,.advanced-modal,.modal-content{contain:layout;}

/* =========================================================================
   Sticky header nav: pins the top bar (logo, arcade button, MARKHIN AI
   button, theme/language controls) to the top of the screen while
   scrolling, turning it into a real navigation bar.

   position: sticky (not fixed) on purpose: fixed pulls the element out of
   the document flow, collapsing the space it used to take up and forcing
   the next element up to fill the gap — that's the classic way this kind
   of change introduces a jump or overlap bug. sticky leaves the header
   exactly where it already is until scrolling would carry it off-screen,
   then locks it there — no other element needs to move, so there is
   nothing left that can shift or overlap.

   `top` is set to the exact same offset as the body's own top padding
   (spacing-sm + the safe-area inset used everywhere else in this file),
   so the header locks in at the identical spot it already occupies on
   load. That means zero visual jump the moment it "sticks" — it just
   stops scrolling away.

   z-index 100 sits above ordinary scrolling content (folders/notes/tags
   in this file top out around z-index 20-30) but well below every modal
   and overlay (settings/advanced modals, the MARKHIN AI chat, drop zone,
   move menu, etc. all use 9998+), so opening any of those still correctly
   covers the header as before.

   position: sticky still works as the containing block for the
   absolutely-positioned MARKHIN AI button inside this bar
   (.markhin-ai-header-btn), exactly like the position: relative it
   replaces just above — that button keeps centering correctly whether
   the header is currently stuck or not. */
.header-nav {
  position: -webkit-sticky !important;
  position: sticky !important;
  top: calc(var(--spacing-sm) + env(safe-area-inset-top, 0px)) !important;
  z-index: 100 !important;
}
</style>

<body class="theme-oceanic">
<script>
// Apply the saved theme class immediately, before the rest of the page renders.
// Previously the whole app (and the theme with it) only initialized on
// window.onload, which waits for every external resource (web fonts, CDN
// scripts) to finish loading. On a slow connection that could take seconds,
// during which the page sat in the default Oceanic theme and then visibly
// snapped to the user's real theme once everything finished loading.
// Keeps <html>'s background pixel-matched to <body>'s active theme
// gradient. Custom properties like --bg-gradient are set on body per
// theme class, and they only cascade DOWN to body's descendants — never
// up to html, body's own ancestor — so html can't just read the same
// variable. Instead we copy body's resolved (computed) background onto
// html directly, right after every theme switch.
window.mu_syncHtmlBg = function(){
    try{
        requestAnimationFrame(function(){
            var cs = getComputedStyle(document.body);
            document.documentElement.style.backgroundImage = cs.backgroundImage;
            // body's --bg-gradient is applied through the `background` shorthand
            // with only a gradient value, so its resolved backgroundColor is
            // always transparent — copying that onto <html> wipes out the
            // opaque #000814 fallback the CSS above sets, leaving <html> with
            // NO solid color under its gradient image. Under the heavy GPU
            // load of a fast fling (the themed blur/animation layers this file
            // already pauses via .mu-scrolling), the compositor can skip
            // repainting that gradient image for a frame during a rubber-band
            // bounce; with backgroundColor transparent there was nothing left
            // to show but the WebView's native black canvas underneath — that
            // was the black flash on a fast scroll/fling, worst scrolling up
            // fast enough to bounce past the top. Only ever overwrite html's
            // background-color with a real, non-transparent value so there's
            // always an opaque color to fall back to.
            var bg = cs.backgroundColor;
            if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') {
                document.documentElement.style.backgroundColor = bg;
            }
        });
    }catch(e){}
};

(function(){

        var saved = localStorage.getItem('app_theme_index_v13');
        if (saved === null) return;
        var idx = parseInt(saved, 10);
        if (!Number.isFinite(idx) || idx < 0) return;
        var classes = ['theme-oceanic','theme-phantom','theme-aurora','theme-aurora-phantom','theme-spider','theme-galaxy','theme-cloudy','theme-dreamy','theme-cyberpunk','theme-love','theme-snowy','theme-rainy','theme-autumn','theme-anonymous','theme-terminal','theme-darkweb','theme-acid'];
        var cls = classes[idx];
        if (cls && cls !== 'theme-oceanic') {
            document.body.classList.remove('theme-oceanic');
            document.body.classList.add(cls);
        }
    }catch(e){}
    window.mu_syncHtmlBg();
})();
</script>

        // تمام فانکشن‌ها و منطق برنامه کاملاً حفظ شده‌اند

        /* =====================================================================
           TELEGRAM MINI APP — DOWNLOAD FIX
           ---------------------------------------------------------------------
           Telegram's in-app browser (the WebView Telegram itself renders Mini
           Apps in — on Android/iOS, not Telegram Desktop) silently swallows most
           normal download methods: clicking an <a download> on a blob:/data: URL
           fires no error at all, it just doesn't save anything. window.open() and
           Telegram.WebApp.openLink() are also restricted to real http(s) URLs —
           Telegram blocks blob:/data: there too, by design (see Telegram's own
           bug tracker: non-http(s) schemes don't work in anchor href, window.open,
           or openLink inside Mini Apps).
           Since this app has no backend to host generated files at a real URL,
           the two things that DO reliably work here are:
             1) Reopening THIS SAME PAGE in the user's system browser (Chrome/
                Safari) via Telegram.WebApp.openLink(), with the file's data
                packed into the URL's hash fragment. Because it's a genuine
                https:// URL (just with extra data after the #), Telegram allows
                it — and once that page loads in a *real* browser tab, a normal
                download works exactly the way it always has, because the tab is
                no longer restricted by Telegram's WebView. This is a real save
                to the device, so robustDownload() tries it FIRST.
             2) navigator.share() — the native OS share sheet. This is a real
                browser API (not a Telegram link handler) and works fine on
                native Telegram for iOS/Android, but it hands the file to
                another app rather than downloading it — so it's only used as
                a fallback when (1) can't be attempted (e.g. the file is over
                TG_BRIDGE_MAX_BLOB_BYTES) or throws.
           robustDownload() below tries these first whenever we detect we're
           inside Telegram, before falling back to the older methods (which are
           kept as a last resort for Telegram Desktop, where the WebView is more
           capable and this often isn't even necessary).
           ===================================================================== */
        const TG = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
        const IS_TELEGRAM = !!TG || /Telegram/i.test(navigator.userAgent || '');
        try { TG && TG.ready && TG.ready(); TG && TG.expand && TG.expand(); } catch (_) {}
        // Stops Telegram's own "swipe down to minimize the mini app" gesture from
        // competing with normal in-app scrolling/dragging (note lists, the drawing
        // canvas, game swipes) — without this, a vertical touch-move inside the app
        // can get intercepted by Telegram itself instead of reaching the page,
        // which is exactly the kind of thing that makes touch feel laggy/unreliable.
        // Feature-detected + try/catch like the other TG.* calls here, since older
        // Telegram clients simply won't have this method.
        try { TG && TG.disableVerticalSwipes && TG.disableVerticalSwipes(); } catch (_) {}

        /* ---- real usable viewport height (fixes wasted/clipped space in Telegram) ----
           Plain 100vh inside Telegram's in-app WebView is unreliable: it doesn't track
           Telegram's own collapsing header, safe areas, or the keyboard, so the page can
           either leave blank space at the bottom or get cut off. TG.viewportStableHeight
           (when available) is Telegram's own answer to "how tall is my usable area right
           now" — we mirror it into a CSS var every time it changes, and body/#gameModal
           above consume that var instead of vh. Outside Telegram this just tracks
           window.innerHeight, which also happens to fix the classic mobile-browser
           address-bar 100vh jump for free. */
        function mu_setAppVh(){

        /* ---- blend Telegram's native header/background with the app instead of leaving

        // Cap on how much file data we'll try to hand off through the URL hash.
        // There's no hard spec limit, but very long URLs risk being truncated or
        // rejected by the OS-level "open externally" call, so we stay well under
        // where that starts becoming a real risk.
        const TG_BRIDGE_MAX_BLOB_BYTES = 3 * 1024 * 1024;

        // Reopens this page in the user's real browser with `blob` waiting to be
        // downloaded there. Returns true if the handoff was launched (not a
        // guarantee the user completed it), false if it couldn't be attempted.
        async function tgOpenInSystemBrowser(blob, filename, mime) {
            if (!IS_TELEGRAM || !blob) return false;
            if (blob.size > TG_BRIDGE_MAX_BLOB_BYTES) return false;
            try {
                const dataUrl = await new Promise((resolve, reject) => {
                    const r = new FileReader();
                    r.onload = () => resolve(r.result);
                    r.onerror = reject;
                    r.readAsDataURL(blob);
                });
                const base = location.href.split('#')[0];
                const bridgeUrl = base + '#tgdl=' + encodeURIComponent(dataUrl) + '&tgname=' + encodeURIComponent(filename || 'download');
                if (TG && TG.openLink) {
                    TG.openLink(bridgeUrl, { try_instant_view: false });
                } else {
                    window.open(bridgeUrl, '_blank');
                }
                return true;
            } catch (e) {
                console.warn('Telegram system-browser bridge failed', e);
                return false;
            }
        }

        // If this page was just reopened by the bridge above — i.e. it's now
        // running in a normal browser tab outside Telegram — immediately deliver
        // the waiting file for real and show a small confirmation screen.
        (function tgHandleIncomingDownload() {
            const hash = location.hash || '';
            const m = /[#&]tgdl=([^&]+)/.exec(hash);
            if (!m) return;
            try {
                const dataUrl = decodeURIComponent(m[1]);
                const nameMatch = /[#&]tgname=([^&]+)/.exec(hash);
                const name = nameMatch ? decodeURIComponent(nameMatch[1]) : 'download';
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = name;
                document.body.appendChild(a);
                a.click();
                a.remove();
                try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
                const fa = !/^en/i.test(navigator.language || '');
                const box = document.createElement('div');
                box.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#03192c;color:#90e0ef;font-family:Tahoma,sans-serif;text-align:center;padding:24px;direction:' + (fa ? 'rtl' : 'ltr') + ';';
                const safeName = String(name).replace(/[<>&]/g, '');
                box.innerHTML = '<div><div style="font-size:40px;margin-bottom:12px">✅</div><div style="font-size:16px;line-height:1.9">' +
                    (fa ? ('دانلود فایل «' + safeName + '» شروع شد.<br>حالا می‌توانید این تب را ببندید و به تلگرام برگردید.')
                         : ('The download for “' + safeName + '” has started.<br>You can close this tab and go back to Telegram now.')) +
                    '</div></div>';
                document.body.appendChild(box);
            } catch (e) { console.warn('Incoming Telegram download bridge failed', e); }
        })();

        /* =====================================================================
           TELEGRAM CLOUD STORAGE — cross-device text backup
           ---------------------------------------------------------------------
           Right now every note lives only in this browser's localStorage — tied
           to one device, and gone if Telegram ever clears WebView storage.
           Telegram.WebApp.CloudStorage keeps small pieces of data attached to
           the user's account and synced across every device they open this
           Mini App from. Its hard limits: at most 1024 keys, each value up to
           4096 characters — nowhere near enough for embedded base64 images (a
           single photo can be hundreds of KB), so this backs up note TEXT and
           metadata only; images always stay local-only on the device that has
           them. The JSON payload is split across as many small `mk_c{n}` keys
           as needed, with an `mk_meta` key describing how many chunks exist.
           This is a manual backup/restore via Dashboard → ☁️ Cloud Backup, not
           silent auto-merging — so it can never quietly overwrite a newer local
           edit with a stale cloud copy. Auto-backup (scheduleCloudBackup) only
           ever *pushes* the latest data up; pulling back down always requires
           the person to tap Restore and confirm.
           ===================================================================== */
        const hasCloudStorage = !!(TG && TG.CloudStorage);
        const CLOUD_CHUNK_SIZE = 3500; // safely under Telegram's 4096-char/value limit
        const CLOUD_META_KEY = 'mk_meta';
        const CLOUD_CHUNK_PREFIX = 'mk_c';

        function cloudGetItem(key) {
            return new Promise((resolve) => {
                try { TG.CloudStorage.getItem(key, (err, val) => resolve(err ? null : val)); }
                catch (e) { resolve(null); }
            });
        }
        function cloudGetItems(keys) {
            return new Promise((resolve) => {
                if (!keys.length) { resolve({}); return; }
                try { TG.CloudStorage.getItems(keys, (err, vals) => resolve(err ? {} : (vals || {}))); }
                catch (e) { resolve({}); }
            });
        }
        function cloudSetItem(key, value) {
            return new Promise((resolve) => {
                try { TG.CloudStorage.setItem(key, value, (err, ok) => resolve(!err && ok !== false)); }
                catch (e) { resolve(false); }
            });
        }
        function cloudRemoveItems(keys) {
            return new Promise((resolve) => {
                if (!keys.length) { resolve(true); return; }
                try { TG.CloudStorage.removeItems(keys, (err, ok) => resolve(!err)); }
                catch (e) { resolve(false); }
            });
        }

        // Strips embedded <img> markup (the one thing that can make a note huge)
        // so the rest of its text/metadata has a real shot at fitting the cloud
        // budget. Images are never part of the cloud backup — only a placeholder
        // note that one lived in this spot, so restoring text elsewhere doesn't
        // silently lose the fact that an image used to be there.
        function cloudStripImages(html) {
            const placeholder = currentLang === 'fa' ? '[تصویر — فقط روی همین دستگاه]' : '[image — this device only]';
            return String(html || '')
                .replace(/<div class="img-drag-wrapper"[\s\S]*?<\/div>\s*(<\/div>)?/g, placeholder)
                .replace(/<img[^>]*>/g, placeholder);
        }

        async function cloudBuildPayload() {
            // Most-recently-edited notes first, so if we run out of budget it's
            // the oldest/least-touched notes left out, not the one being worked on.
            const sorted = categories.slice().sort((a, b) => (Date.parse(b.lastEdited) || 0) - (Date.parse(a.lastEdited) || 0));
            let included = sorted.map(item => {
                const persisted = getPersistedCategory(item);
                return {
                    id: persisted.id, name: persisted.name, folder: persisted.folder,
                    text: persisted.text, html: cloudStripImages(persisted.html),
                    encrypted: persisted.encrypted, hint: persisted.hint,
                    tags: persisted.tags, pinned: persisted.pinned, favorite: persisted.favorite,
                    lastEdited: persisted.lastEdited
                };
            });
            const totalNotes = included.length;
            const customFolders = folders.filter(f => f !== DEFAULT_FOLDER);
            let skipped = 0;
            let json = JSON.stringify({ v: 1, ts: Date.now(), folders: customFolders, notes: included });
            const budget = CLOUD_CHUNK_SIZE * 900; // stay well under Telegram's 1024-key ceiling
            while (json.length > budget && included.length > 1) {
                included = included.slice(0, -1);
                skipped++;
                json = JSON.stringify({ v: 1, ts: Date.now(), folders: customFolders, notes: included });
            }
            return { json, skipped, totalNotes };
        }

        let __cloudBackupTimer = null;
        function scheduleCloudBackup() {
            if (!IS_TELEGRAM || !hasCloudStorage) return;
            clearTimeout(__cloudBackupTimer);
            __cloudBackupTimer = setTimeout(() => { cloudBackupNow().catch(e => console.warn('Cloud backup failed', e)); }, 3000);
        }

        async function cloudBackupNow() {
            if (!hasCloudStorage) return { ok: false, reason: 'unavailable' };
            const { json, skipped, totalNotes } = await cloudBuildPayload();
            const chunks = [];
            for (let i = 0; i < json.length; i += CLOUD_CHUNK_SIZE) chunks.push(json.slice(i, i + CLOUD_CHUNK_SIZE));

            const prevMetaRaw = await cloudGetItem(CLOUD_META_KEY);
            const prevMeta = prevMetaRaw ? safeParseJSON(prevMetaRaw, null) : null;
            const prevCount = (prevMeta && prevMeta.n) || 0;

            for (let i = 0; i < chunks.length; i++) {
                const ok = await cloudSetItem(CLOUD_CHUNK_PREFIX + i, chunks[i]);
                if (!ok) return { ok: false, reason: 'write-failed' };
            }
            // Clean up leftover chunk keys from a previous, larger backup.
            if (prevCount > chunks.length) {
                const stale = [];
                for (let i = chunks.length; i < prevCount; i++) stale.push(CLOUD_CHUNK_PREFIX + i);
                await cloudRemoveItems(stale);
            }
            const meta = { n: chunks.length, ts: Date.now(), notes: totalNotes - skipped, skipped };
            await cloudSetItem(CLOUD_META_KEY, JSON.stringify(meta));
            return { ok: true, meta };
        }

        async function cloudRestore() {
            if (!hasCloudStorage) return null;
            const metaRaw = await cloudGetItem(CLOUD_META_KEY);
            const meta = metaRaw ? safeParseJSON(metaRaw, null) : null;
            if (!meta || !meta.n) return null;
            const keys = []; for (let i = 0; i < meta.n; i++) keys.push(CLOUD_CHUNK_PREFIX + i);
            const parts = await cloudGetItems(keys);
            const json = keys.map(k => parts[k] || '').join('');
            const data = safeParseJSON(json, null);
            if (!data || !Array.isArray(data.notes)) return null;
            return { meta, data };
        }

        /* Markhin note encryption: password -> PBKDF2-SHA-256 -> AES-256-GCM.
         * Passwords are never persisted. Locked-note text/html are persisted only as
         * base64-encoded salt/iv/ciphertext. Decryption keys exist only in this tab.
         */
        const NOTE_CRYPTO_VERSION = 1;
        const NOTE_KDF_ITERATIONS = 250000;
        const NOTE_KDF_HASH = 'SHA-256';
        const NOTE_AES_ALGORITHM = 'AES-GCM';
        const NOTE_AES_KEY_BITS = 256;
        const NOTE_SALT_BYTES = 16;
        const NOTE_IV_BYTES = 12;
        const noteSessionKeys = new Map();

        function noteBytesToBase64(bytes) {
            let binary = '';
            const chunk = 0x8000;
            for (let i = 0; i < bytes.length; i += chunk) {
                binary += String.fromCharCode(...bytes.subarray(i, Math.min(i + chunk, bytes.length)));
            }
            return btoa(binary);
        }

        function noteBase64ToBytes(value) {
            const binary = atob(String(value || ''));
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        async function noteDeriveKey(password, salt) {
            if (!window.crypto?.subtle) throw new Error('Web Crypto API is unavailable.');
            const material = await crypto.subtle.importKey(
                'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: NOTE_KDF_ITERATIONS, hash: NOTE_KDF_HASH },
                material,
                { name: NOTE_AES_ALGORITHM, length: NOTE_AES_KEY_BITS },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptNotePayload(password, html, text) {
            const salt = crypto.getRandomValues(new Uint8Array(NOTE_SALT_BYTES));
            const iv = crypto.getRandomValues(new Uint8Array(NOTE_IV_BYTES));
            const key = await noteDeriveKey(password, salt);
            const plaintext = new TextEncoder().encode(JSON.stringify({ html: String(html || ''), text: String(text || '') }));
            const ciphertext = await crypto.subtle.encrypt({ name: NOTE_AES_ALGORITHM, iv }, key, plaintext);
            return {
                v: NOTE_CRYPTO_VERSION,
                alg: NOTE_AES_ALGORITHM,
                kdf: 'PBKDF2',
                hash: NOTE_KDF_HASH,
                iterations: NOTE_KDF_ITERATIONS,
                salt: noteBytesToBase64(salt),
                iv: noteBytesToBase64(iv),
                ciphertext: noteBytesToBase64(new Uint8Array(ciphertext))
            };
        }

        async function decryptNotePayload(password, encrypted) {
            if (!encrypted || encrypted.v !== NOTE_CRYPTO_VERSION) throw new Error('Unsupported encrypted note format.');
            if (encrypted.alg !== NOTE_AES_ALGORITHM || encrypted.kdf !== 'PBKDF2' || encrypted.hash !== NOTE_KDF_HASH || encrypted.iterations !== NOTE_KDF_ITERATIONS) {
                throw new Error('Unsupported encrypted note parameters.');
            }
            const salt = noteBase64ToBytes(encrypted.salt);
            const iv = noteBase64ToBytes(encrypted.iv);
            const ciphertext = noteBase64ToBytes(encrypted.ciphertext);
            const key = await noteDeriveKey(password, salt);
            const plaintext = await crypto.subtle.decrypt({ name: NOTE_AES_ALGORITHM, iv }, key, ciphertext);
            return JSON.parse(new TextDecoder().decode(plaintext));
        }


        async function createEncryptedExport(item) {
            if (!item || !isNoteLocked(item)) throw new Error('Note is not encrypted.');
            const passwordInput = await promptNotePassword(
                item,
                currentLang === 'fa' ? 'برای ساخت خروجی رمزنگاری‌شده، رمز فعلی یادداشت را وارد کنید.' : 'Enter the current note password to create the encrypted export.'
            );
            if (passwordInput === null) throw new Error('Export cancelled.');
            const password = passwordInput.trim();
            if (!password || !await unlockNote(item, password)) throw new Error('Wrong password.');
            const persisted = getPersistedCategory(item);
            const encrypted = await encryptNotePayload(password, item.html || '', item.text || '');
            const envelope = {
                format: 'markhin-encrypted-note',
                version: 1,
                exportedAt: new Date().toISOString(),
                note: {
                    id: persisted.id, name: persisted.name, folder: persisted.folder || '',
                    hint: persisted.hint || '', tags: persisted.tags || [],
                    pinned: !!persisted.pinned, favorite: !!persisted.favorite,
                    fontFamily: persisted.fontFamily || '', fontSize: persisted.fontSize || undefined,
                    encrypted
                }
            };
            return new Blob([JSON.stringify(envelope, null, 2)], {type:'application/vnd.markhin.encrypted+json;charset=utf-8'});
        }

        async function exportLockedAwareSingle(item, chosenName, normalProducer, normalExt, normalMime) {
            if (isNoteLocked(item)) {
                const blob = await createEncryptedExport(item);
                await robustDownload(blob, `${chosenName}.mne.json`, blob.type);
                return true;
            }
            const data = await normalProducer();
            const blob = data instanceof Blob ? data : new Blob([data], {type: normalMime});
            await robustDownload(blob, `${chosenName}.${normalExt}`, normalMime);
            return true;
        }

        function isEncryptedExportFile(file) {
            return /\.mne\.json$/i.test(file?.name || '') || String(file?.type || '').includes('application/vnd.markhin.encrypted');
        }

        function isNoteLocked(item) {
            return !!(item && item.encrypted && item.encrypted.ciphertext && item.encrypted.salt && item.encrypted.iv);
        }

        function getPersistedCategory(item) {
            const copy = { ...item };
            // Never serialize the transient password or decrypted plaintext of a locked note.
            delete copy.password;
            if (isNoteLocked(item)) {
                copy.text = '';
                copy.html = '';
                copy.isDecoy = false;
            }
            return copy;
        }

        function serializeCategoriesForStorage() {
            return categories.map(getPersistedCategory);
        }

        async function unlockNote(item, password) {
            if (!isNoteLocked(item)) return false;
            try {
                const payload = await decryptNotePayload(String(password), item.encrypted);
                item.html = String(payload.html || '');
                item.text = String(payload.text || '');
                item.isDecoy = false;
                noteSessionKeys.set(item.id, String(password));
                return true;
            } catch (_) {
                return false;
            }
        }

        function clearDecryptedNote(item) {
            if (!item) return;
            item.text = '';
            item.html = '';
            item.isDecoy = false;
            noteSessionKeys.delete(item.id);
        }

        async function migrateLegacyPasswordNotes() {
            let changed = false;
            for (const item of categories) {
                if (!item || typeof item.password !== 'string' || !item.password) continue;
                // Legacy notes had plaintext password + plaintext content. Convert them once
                // and immediately remove the password/content from the persisted shape.
                const pass = item.password.trim();
                if (!pass) { delete item.password; continue; }
                item.encrypted = await encryptNotePayload(pass, item.html || '', item.text || '');
                delete item.password;
                item.isDecoy = false;
                clearDecryptedNote(item);
                changed = true;
            }
            if (changed) saveToLocalStorage();
        }

        /*
         * Normalizes a raw category/note object coming from localStorage, a JSON backup,
         * or a Full HTML snapshot into the complete, current note shape. This is the single
         * place responsible for keeping a note's data intact — every field the app can set
         * on a note (base fields + Tags/Pin/Favorite/Fake Note/Font/Size + advanced-system
         * fields) must be listed here, or it will be lost on refresh/import.
         */
        function normalizeCategory(item, index) {
            const src = item && typeof item === 'object' ? item : {};
            return {
                id: String(src.id ?? `${Date.now()}_${index}_${Math.random().toString(36).slice(2,7)}`),
                name: String(src.name ?? `Note ${index + 1}`),
                folder: typeof src.folder === 'string' ? src.folder : '',
                text: String(src.text ?? ''),
                html: String(src.html ?? src.text ?? ''),
                lastEdited: src.lastEdited ? String(src.lastEdited) : '',
                // Legacy `password` is read only long enough for one-time migration on startup.
                password: typeof src.password === 'string' ? src.password : '',
                encrypted: src.encrypted && typeof src.encrypted === 'object' ? { ...src.encrypted } : null,
                hint: typeof src.hint === 'string' ? src.hint : '',
                isDecoy: false,
                // Advanced-system fields (Time Capsule / Ghost Note / Decay).
                // These now live directly on the note itself instead of a second
                // localStorage key that had to be kept in sync by hand — one source
                // of truth, and any backup/snapshot/import that carries the note
                // automatically carries these too.
                unlockAt: src.unlockAt ?? '',
                ghostUntil: src.ghostUntil ?? '',
                decayLevel: Number(src.decayLevel || 0),
                decayManual: !!src.decayManual,
                // Feature-pack fields: Tags / Pin / Favorite / Fake Note / Font / Size.
                tags: Array.isArray(src.tags) ? src.tags.filter(Boolean).map(String) : [],
                pinned: !!src.pinned,
                favorite: !!src.favorite,
                archived: !!src.archived,
                order: Number(src.order) || 0,
                fakeContent: typeof src.fakeContent === 'string' ? src.fakeContent : '',
                fontFamily: typeof src.fontFamily === 'string' ? src.fontFamily : '',
                fontSize: Number(src.fontSize) || 13
            };
        }

        // Was window.onload, which waits for every external resource (web fonts,
        // CDN scripts) to finish before the app becomes usable. DOMContentLoaded
        // fires as soon as the DOM itself is parsed — everything this function
        // touches (localStorage, page elements) is ready by then — so the app
        // starts noticeably faster, especially on a slow connection.
        document.addEventListener('DOMContentLoaded', async function() {
            /* Bug fix ("options jump" / "page jump" while the app is still
               starting up): this handler is async and yields at the
               "await migrateLegacyPasswordNotes()" below. A person can
               already be scrolling during that gap (they just opened the
               app — scrolling immediately is normal), and everything this
               handler renders afterwards (folders, notes, the AI-settings
               gear button — see mu_injectUiControls() near the bottom of
               this function) used to land on the page piecemeal, at
               whatever scroll position the person had reached by then.
               Capturing scrollY here, before any of that runs, and
               restoring it once everything has been rendered (see
               restoreStartupScroll() below) keeps the person's scroll
               position stable through the whole startup sequence instead
               of letting it drift as content is added. */
            const startupScrollY = window.scrollY || window.pageYOffset || 0;
            const restoreStartupScroll = () => {
                window.scrollTo(0, startupScrollY);
                requestAnimationFrame(() => window.scrollTo(0, startupScrollY));
            };

            const savedLang = localStorage.getItem('app_lang_v15');
            if (savedLang === 'fa' || savedLang === 'en') currentLang = savedLang;

            DEFAULT_FOLDER = i18n[currentLang].allFolders;
            folders = [DEFAULT_FOLDER];

            const savedData = localStorage.getItem('app_categories_v13');
            const savedFolders = localStorage.getItem('app_folders_v13');
            const savedThemeIdx = localStorage.getItem('app_theme_index_v13');

            if (savedData) {
                const parsed = safeParseJSON(savedData, []);
                categories = Array.isArray(parsed) ? parsed : [];
            }
            categories = categories.filter(item => item && typeof item === 'object').map((item, index) => normalizeCategory(item, index));
            categories.forEach(item => {
                if (isNoteLocked(item)) { item.html = ''; item.text = ''; }
                else item.html = sanitizeHtml(item.html || item.text || '');
            });
            await migrateLegacyPasswordNotes();

            if (savedFolders) {
                const parsedFolders = safeParseJSON(savedFolders, []);
                const customF = Array.isArray(parsedFolders) ? parsedFolders
                    .filter(f => typeof f === 'string' && f.trim() && f !== "همه" && f !== "All")
                    .map(f => f.trim()) : [];
                folders = [DEFAULT_FOLDER, ...[...new Set(customF)]];
            }

            if (savedThemeIdx !== null) {
                currentThemeIndex = parseInt(savedThemeIdx, 10) || 0;
            }

            /* A stale currentFolder (e.g. "Favorites" left over from a
               previous session, or a folder that no longer exists) used to
               only get corrected by a SECOND, separate DOMContentLoaded
               listener further down — and because this handler is async and
               yields at the "await migrateLegacyPasswordNotes()" above, that
               second listener could actually run BEFORE this one reached
               this point, rendering once with incomplete data (folders
               still just the default, custom folders not loaded yet) and
               then again a moment later once this handler finished — the
               exact "options arrive late / folders don't show up" jank this
               app was reported to have. Doing the correction here, in the
               same handler, right before the one-and-only renderApp() call
               below, means there is only ever one render at startup and it
               already has the final, correct data. */
            if (!Array.isArray(folders)) folders = [];
            if (!folders.includes(DEFAULT_FOLDER)) folders.unshift(DEFAULT_FOLDER);
            if (currentFolder === '__FAVORITES__' || !folders.includes(currentFolder)) currentFolder = DEFAULT_FOLDER;

            applyLanguageUI();
            applyTheme(currentThemeIndex);
            renderApp();
            /* Dashboard button: this used to only get added inside the
               window 'load' handler further down, which waits for every web
               font and external script to finish — on a slow connection
               that's a very visible delay after the rest of the UI is
               already interactive. Adding it here too (addTopControls()
               guards against duplicates) makes it appear at the same time as
               everything else; the later 'load' call becomes a harmless
               no-op. */
            addTopControls();
            /* AI-settings gear button: this used to only be added by a
               separate, independently-timed DOMContentLoaded listener
               (mu_injectUiControls, defined further down). Because that was
               a second, unrelated listener rather than part of this
               function's single render pass, its gear button could pop into
               the "هوش مصنوعی / پرسش" row a moment after this handler had
               already rendered everything else — nudging that row and the
               "ورودی‌ها"/"خروجی‌ها" boxes below it down by its width right
               after the person had already started scrolling. That
               separate listener is still registered (harmless no-op, same
               idempotent guard) as a fallback, but calling it here means it
               normally runs as part of this one startup render instead of
               as a visible extra step afterwards. */
            if (typeof mu_injectUiControls === 'function') mu_injectUiControls();
            updateLockBtnState();
            restoreStartupScroll();
        });

            if (searchDebounceTimer) clearTimeout(searchDebounceTimer);

        function updateLockBtnState() {

        async function promptUnlockQa() {
            const lockedItems = categories.filter(isNoteLocked);

            if (lockedItems.length === 0) {

                showAdvanced(`

                        : 'This button manages which locked notes the AI is allowed to use when you use "Ask". Password-protected notes are excluded from AI answers by default, so their content isn\'t read without permission. Once you lock a note, you can come back here, enter its password, and temporarily allow it to be included in Ask searches too.<br><br>There are currently no locked notes, so there is nothing to manage yet.'}</p>
                `);
                return;
            }

            let promptStr = "وضعیت قفل یادداشت‌ها برای بخش پرسش:\n";
            lockedItems.forEach((item, index) => {
                const isUnlocked = unlockedQaIds.includes(item.id);
                promptStr += `${index + 1}: ${item.name} [${isUnlocked ? 'باز 🔓' : 'قفل 🔒'}]\n`;
            });
            promptStr += "\nشماره یادداشتی که می‌خواهید وضعیت قفل آن را تغییر دهید وارد کنید:";

            const userChoice = await promptStyledText({

                targetItem = lockedItems[choiceNum - 1];

        let lastGoodStorageSnapshot = null;
        function saveToLocalStorage() {
            try {
                const payload = JSON.stringify(serializeCategoriesForStorage());
                localStorage.setItem('app_categories_v13', payload);
                lastGoodStorageSnapshot = payload;
                scheduleCloudBackup();
                return true;
            } catch (error) {
                if (lastGoodStorageSnapshot) {
                    try { localStorage.setItem('app_categories_v13', lastGoodStorageSnapshot); } catch (_) {}
                }
                showToast(currentLang === 'fa' ? '⚠️ ذخیره‌سازی ناموفق بود — فضای مرورگر پر است. یک بکاپ (JSON) بگیر و چند یادداشت/تصویر حجیم را حذف کن.' : '⚠️ Save failed — browser storage is full. Export a backup (JSON) and remove a few large notes/images.', 4200);
                return false;
