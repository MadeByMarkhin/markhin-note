        function applyTheme(index) {
            if (!themes.length) return;
            currentThemeIndex = Math.max(0, Math.min(Number(index) || 0, themes.length - 1));
            const activeTheme = themes[currentThemeIndex];

            // Turn off every transition for one frame so the new theme's
            // colors apply instantly instead of every button/card/panel
            // animating its own background/border/text-color separately —
            // that simultaneous animation across dozens of elements was the
            // source of the lag/jitter on switch. Re-enabled two frames
            // later (after the browser has actually painted the new theme),
            // so normal hover/press transitions keep working right after.
            document.body.classList.add('theme-switching');
            themes.forEach(t => document.body.classList.remove(t.class));
            document.body.classList.add(activeTheme.class);
            if (window.mu_syncHtmlBg) window.mu_syncHtmlBg();

            document.getElementById('themeEmoji').innerText = activeTheme.emoji;
            document.getElementById('themeLabel').innerText = currentLang === 'fa' ? activeTheme.nameFa : activeTheme.nameEn;

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    document.body.classList.remove('theme-switching');
                });
            });
        }

        function renderApp(openId = activeOpenId) {
            /* The list/content render intentionally rebuilds DOM nodes. On mobile
               WebViews that can make the browser pick a new scroll anchor, so a
               tap/cancel can look like the whole page jumped. Preserve only the
               viewport position here; application data and feature state stay
               untouched.
               When a note is open, restoring the exact same *absolute* scrollY
               isn't enough on its own: switching UI language (or anything else
               that changes label lengths — folder tabs, note-button titles,
               section headers) changes how tall everything above the open note
               is. The old scrollY can then land on a completely different part
               of the page, which reads as the note closing / the page jumping
               back to the top. So on top of restoring scrollY, anchor on the
               open note's own box: remember how far down the viewport it sat
               before the rebuild, then nudge the scroll after rebuilding so it
               lands in that exact same spot again, however much the content
               above it just grew or shrank. */
            const scrollY = window.scrollY || window.pageYOffset || 0;
            const activeEl = document.activeElement;
            const activeId = activeEl && activeEl.id ? activeEl.id : '';
            const prevBox = openId ? document.getElementById('container-' + openId) : null;
            const prevBoxTop = prevBox ? prevBox.getBoundingClientRect().top : null;
            // If a box for this note already existed (and was showing) before
            // this render, the note isn't newly opening — it's just being
            // rebuilt in place — so its box shouldn't replay the "just
            // opened" animation. Note callers (handleCategoryClick etc.)
            // already flip the `activeOpenId` variable itself before calling
            // renderApp, so that variable can't tell fresh-open apart from
            // already-open here; the previous DOM box's own state can.
            const wasAlreadyShowing = !!(prevBox && prevBox.classList.contains('show'));
            const visible = getVisibleCategories();
            activeOpenId = openId && visible.some(item => item.id === openId) ? openId : null;
            mu_reopenNoAnimId = (activeOpenId && wasAlreadyShowing) ? activeOpenId : null;
            renderFolders();
            renderButtons(visible);
            renderContents(visible);
            updateLockBtnState();

            const restore = () => {
                const newBox = activeOpenId ? document.getElementById('container-' + activeOpenId) : null;
                if (newBox && prevBoxTop !== null) {
                    const delta = newBox.getBoundingClientRect().top - prevBoxTop;
                    window.scrollTo(0, (window.scrollY || window.pageYOffset || 0) + delta);
                } else {
                    window.scrollTo(0, scrollY);
                }
                if (activeId) {
                    const next = document.getElementById(activeId);
                    if (next && next !== document.activeElement) {
                        try { next.focus({preventScroll:true}); } catch (_) {}
                    }
                }
            };
            restore();
            requestAnimationFrame(restore);
            // Extra later passes: per-note tools (formatting row, tags field,
            // AI buttons) get appended a tick later via setTimeout(0) elsewhere,
            // and on mobile, dismissing the on-screen keyboard (e.g. a focused
            // note's text field losing focus to the tapped control) can trigger
            // its own native scroll jump slightly after that. Re-anchoring a
            // couple more times over the next moment catches both without
            // any visible harm on runs where nothing shifts.
            setTimeout(restore, 120);
            setTimeout(restore, 350);
            if (window.visualViewport) {
                const vv = window.visualViewport;
                let vvCalls = 0;
                const onVvResize = () => {
                    restore();
                    if (++vvCalls >= 3) vv.removeEventListener('resize', onVvResize);
                };
                vv.addEventListener('resize', onVvResize);
                setTimeout(() => vv.removeEventListener('resize', onVvResize), 1000);
            }
        }

        function escapeHtml(string) {
            return String(string || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function normalizeText(value) {
            return String(value ?? '')
                .toLocaleLowerCase('fa')
                .replace(/[يى]/g, 'ی')
                .replace(/ك/g, 'ک')
                .replace(/ۀ/g, 'ه')
                .replace(/‌/g, ' ')
                .replace(/[۰-۹]/g, d => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))
                .replace(/\s+/g, ' ')
                .trim();
        }

        function showToast(message, duration = 1800) {

            if (!toast) return;

            showToast.timer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        function safeParseJSON(value, fallback) {
            try {

                return parsed ?? fallback;
            } catch (_) {

        function sanitizeHtml(html) {
            const template = document.createElement('template');
            template.innerHTML = String(html ?? '');
            const allowedTags = new Set(['B','STRONG','I','EM','U','S','BR','P','DIV','SPAN','UL','OL','LI','BLOCKQUOTE','PRE','CODE','A','IMG','AUDIO','BUTTON']);
            const walker = document.createTreeWalker(template.content, NodeFilter.SHOW_ELEMENT);
            const elements = [];
            while (walker.nextNode()) elements.push(walker.currentNode);

            elements.forEach(el => {
                if (!allowedTags.has(el.tagName)) {
                    el.replaceWith(document.createTextNode(el.textContent || ''));
                    return;
                }
                [...el.attributes].forEach(attr => {
                    const name = attr.name.toLowerCase();
                    const value = attr.value.trim();
                    const common = ['class','id','contenteditable','draggable','aria-label'];
                    const keep = common.includes(name) ||
                        (el.tagName === 'A' && ['href','target','rel'].includes(name)) ||
                        (el.tagName === 'IMG' && ['src','alt','width','height'].includes(name)) ||
                        (el.tagName === 'AUDIO' && ['src','controls'].includes(name)) ||
                        (el.tagName === 'BUTTON' && name === 'type');
                    if (name.startsWith('on') || !keep) el.removeAttribute(attr.name);
                    if (name === 'href' && !/^(https?:|mailto:)/i.test(value)) el.removeAttribute(attr.name);
                    if (name === 'src' && !/^(https?:|data:image\/|data:audio\/)/i.test(value)) el.removeAttribute(attr.name);
                });
                if (el.tagName === 'A') {
                    el.setAttribute('target', '_blank');
                    el.setAttribute('rel', 'noopener noreferrer');
                }
                if (el.tagName === 'IMG') {
                    el.setAttribute('draggable', 'true');
                }
            });
            return template.innerHTML;
        }

        async function toggleAudioRecording(id) {
            if (activeRecId && activeRecId !== id) {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                return;
            }
            if (activeRecId === id) {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
                return;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('دستگاه/مرورگر شما از ضبط صدا پشتیبانی نمی‌کند.');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                const mimeCandidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
                const mimeType = mimeCandidates.find(type => window.MediaRecorder?.isTypeSupported?.(type));
                mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
                activeRecId = id;
                renderContents();

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder?.mimeType || 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        insertAudioToNote(id, e.target.result);
                    };
                    reader.readAsDataURL(audioBlob);
                    
                    stream.getTracks().forEach(track => track.stop());
                    activeRecId = null;
                    renderContents();
                };

                mediaRecorder.start();
            } catch (err) {
                alert('دسترسی به میکروفون داده نشد.');
            }
        }

        function insertAudioToNote(id, audioBase64) {
            const textBox = document.getElementById(`text-${id}`);
            if (!textBox) return;

            const wrapper = document.createElement('div');
            wrapper.className = 'audio-wrapper';
            wrapper.contentEditable = 'false';

            const audioEl = document.createElement('audio');
            audioEl.controls = true;
            audioEl.src = audioBase64;

            const delBtn = document.createElement('button');
            delBtn.className = 'img-btn';
            delBtn.innerText = '✖';
            delBtn.onclick = () => {
                if (confirm(i18n[currentLang].confirmDelete)) {
                    wrapper.remove();
                    saveCategory(id);
                }
            };

            wrapper.appendChild(audioEl);
            wrapper.appendChild(delBtn);
            textBox.appendChild(wrapper);
            saveCategory(id);
        }

        // Polyfill for older WebViews (notably some Telegram in-app browser
        // builds lag behind Chrome) that don't yet support ctx.roundRect(),
        // used by the game graphics below.
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                this.beginPath();
                this.moveTo(x + r.tl, y);
                this.lineTo(x + w - r.tr, y);
                this.arcTo(x + w, y, x + w, y + r.tr, r.tr);
                this.lineTo(x + w, y + h - r.br);
                this.arcTo(x + w, y + h, x + w - r.br, y + h, r.br);
                this.lineTo(x + r.bl, y + h);
                this.arcTo(x, y + h, x, y + h - r.bl, r.bl);
                this.lineTo(x, y + r.tl);
                this.arcTo(x, y, x + r.tl, y, r.tl);
                this.closePath();
                return this;
            };
        }

        function openGameMenu() {

        function backToGameMenu() {

        function closeGame() {
            document.getElementById('gameModal').style.display = 'none';
            document.getElementById('gameCard').classList.remove('gc-playing');
            clearGameEvents();
            mAiGameTelegramChrome(false);
        }

        // Adapts Telegram's native chrome to the game modal's lifetime:
        //  - expand() so the modal actually gets the full available height
        //    instead of Telegram's collapsed default view.
        //  - disableVerticalSwipes() (Bot API 7.7+) so Telegram's own
        //    swipe-down-to-minimize gesture can't fire while the player is
        //    dragging/swiping on the canvas to steer Snake.
        //  - BackButton takes over the hardware/gesture back action so it
        //    steps out of the game (play -> menu -> closed) instead of
        //    closing the whole Mini App by mistake.
        // Everything is feature-detected and no-ops instantly outside Telegram.
        function mAiGameBackHandler() {
            const playing = document.getElementById('gamePlayArea').style.display === 'flex';
            if (playing) backToGameMenu(); else closeGame();
        }
        function mAiGameTelegramChrome(active) {
            if (!TG) return;
            try {
                if (active) {
                    TG.expand && TG.expand();
                    if (typeof TG.disableVerticalSwipes === 'function') TG.disableVerticalSwipes();
                    if (TG.BackButton) {
                        TG.BackButton.onClick(mAiGameBackHandler);
                        TG.BackButton.show();
                    }
                } else {
                    if (typeof TG.enableVerticalSwipes === 'function') TG.enableVerticalSwipes();
                    if (TG.BackButton) {
                        TG.BackButton.offClick(mAiGameBackHandler);
                        TG.BackButton.hide();
                    }
                }
            } catch (_) {}
        }

        // Small wrapper so every haptic call site stays one line and never
        // throws on clients (or plain browsers) that lack the API.
        function mAiGameHaptic(kind) {
            if (!TG || !TG.HapticFeedback) return;
            try {
                if (kind === 'error') TG.HapticFeedback.notificationOccurred('error');
                else TG.HapticFeedback.impactOccurred(kind || 'light');
            } catch (_) {}
        }

        function clearGameEvents() {
            if (currentGameInterval) {
                clearInterval(currentGameInterval);
                currentGameInterval = null;
            }
            if (gameStopFn) {
                try { gameStopFn(); } catch (_) {}
                gameStopFn = null;
            }
            gamePaused = false;
            hideGameOverlay('gamePauseOverlay');
            hideGameOverlay('gameOverOverlay');
            gameAborter.abort();
            gameAborter = new AbortController();
        }

        /* ---------------- shared fullscreen-game helpers ---------------- */

        function showGameOverlay(id) { document.getElementById(id)?.classList.add('show'); }
        function hideGameOverlay(id) { document.getElementById(id)?.classList.remove('show'); }

        function markhinGameBestScore(key, score) {
            const storageKey = 'markhin_game_best_' + key;
            let best = 0;
            try { best = parseInt(localStorage.getItem(storageKey) || '0', 10) || 0; } catch (_) {}
            if (score > best) {
                best = score;
                try { localStorage.setItem(storageKey, String(best)); } catch (_) {}
            }
            return best;
        }

        // Sizes the canvas to fill its wrapper, backed by real device pixels
        // (so it stays crisp full-screen on high-DPI phones) while all game
        // logic keeps working in plain CSS-pixel coordinates. Both games now
        // call this with mode 'fill' so the arena uses the whole area under
        // the top bar, edge to edge; 'square' is kept for any future game
        // that wants a centered square arena instead. Returns the logical
        // {width, height} to draw with.
        function fitGameCanvas(canvas, mode) {
            const wrap = document.getElementById('gameCanvasWrap');
            const rect = wrap.getBoundingClientRect();
            let w = Math.max(1, Math.floor(rect.width));
            let h = Math.max(1, Math.floor(rect.height));
            if (mode === 'square') {
                const side = Math.max(120, Math.min(w, h));
                w = side; h = side;
            }
            const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            return { width: w, height: h, ctx };
        }

        // Wires the game-over card once per game and returns a function that
        // reveals it with the final score. Handles the Telegram-in-app-browser
        // issue where native alert()/confirm() can be blocked or look jarring —
        // this in-canvas overlay works everywhere and lets the player restart
        // or return to the menu with a single tap.
        function presentGameOver(scoreVal, bestKey, titleText, onRestart) {
            gamePaused = true;
            const best = markhinGameBestScore(bestKey, scoreVal);
            const fa = currentLang === 'fa';
            document.getElementById('goTitle').textContent = titleText;
            document.getElementById('goScoreText').textContent = (fa ? 'امتیاز: ' : 'Score: ') + scoreVal;
            document.getElementById('goBestText').textContent = (fa ? 'رکورد: ' : 'Best: ') + best;
            const restartBtn = document.getElementById('btnGoRestart');
            const menuBtn = document.getElementById('btnGoMenu');
            restartBtn.onclick = () => { hideGameOverlay('gameOverOverlay'); onRestart(); };
            menuBtn.onclick = () => { hideGameOverlay('gameOverOverlay'); backToGameMenu(); };
            showGameOverlay('gameOverOverlay');
        }

        // Auto-pause when the tab/app is backgrounded (Telegram Mini Apps and
        // mobile browsers both suspend timers/rAF then resume with a huge
        // elapsed gap, which used to make the bird "teleport" through pipes
        // or the snake skip several cells the instant you came back — this
        // shows a pause card instead and only resumes on a deliberate tap).
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && document.getElementById('gamePlayArea').style.display === 'flex' && !gamePaused) {
                gamePaused = true;
                showGameOverlay('gamePauseOverlay');
            }
        });
        document.getElementById('gamePauseOverlay').addEventListener('click', () => {
            if (gamePaused) {
                gamePaused = false;
                hideGameOverlay('gamePauseOverlay');
            }
        });

        // Re-fit the canvas on rotation/resize instead of leaving it stretched
        // or letter-boxed at the old dimensions — restarts the current game
        // cleanly rather than trying to reflow mid-run state. Hooked to both
        // the normal browser resize event AND Telegram's own 'viewportChanged'
        // event, since Telegram can change the usable height (expanding,
        // collapsing, safe-area shifts) without ever firing a window resize.
        function mAiGameScheduleRefit() {
            const playing = document.getElementById('gamePlayArea').style.display === 'flex';
            if (!playing) return;
            clearTimeout(gameResizeTimer);
            gameResizeTimer = setTimeout(() => {
                if (window.__markhinActiveGame === 'snake') startNeonSnake();
                else if (window.__markhinActiveGame === 'flappy') startCyberFlappy();
            }, 200);
        }
        window.addEventListener('resize', mAiGameScheduleRefit);
        try { TG && TG.onEvent && TG.onEvent('viewportChanged', mAiGameScheduleRefit); } catch (_) {}

        function enterGamePlayMode() {
            document.getElementById('gameSelectMenu').style.display = 'none';
            // Was 'block': #gamePlayArea's CSS is display:flex so its two
            // children (.game-topbar and .game-canvas-wrap, which has
            // flex:1 1 auto) stack and the canvas area stretches to fill
            // every remaining pixel. Overriding it to 'block' here broke
            // that flex layout, so .game-canvas-wrap only took its natural
            // content height and left an empty, untouchable strip at the
            // bottom of the screen — exactly the dead zone being reported.
            document.getElementById('gamePlayArea').style.display = 'flex';
            document.getElementById('gameCard').classList.add('gc-playing');
            hideGameOverlay('gameOverOverlay');
            hideGameOverlay('gamePauseOverlay');
            gamePaused = false;
        }

        /* ---------------------------- Neon Snake ---------------------------- */

        function startNeonSnake() {
            window.__markhinActiveGame = 'snake';
            const fa = currentLang === 'fa';
            enterGamePlayMode();
            document.getElementById('gameTitleActive').innerText = 'NEON SNAKE';
            document.getElementById('gameDescActive').innerText = fa
                ? 'با کلیدهای جهت‌نما یا کشیدن دست، مار را هدایت کن!'
                : 'Steer with arrow keys or swipe!';

            clearGameEvents();
            const canvas = document.getElementById('cyberCanvas');
            // Was 'square' — that centered a small square arena inside the
            // tall play area and left big empty bars above/below it (the
            // "game is just a little patch" issue). 'fill' uses the entire
            // area under the top bar instead, same as Flappy already did.
            const { width, height, ctx } = fitGameCanvas(canvas, 'fill');

            // Aim for a comfortably touch-friendly grid rather than a fixed
            // pixel size, so the arena scales with the actual screen.
            const targetCols = 20;
            const gridSize = Math.max(14, Math.floor(width / targetCols));
            const cols = Math.floor(width / gridSize);
            const rows = Math.floor(height / gridSize);
            const boardW = cols * gridSize, boardH = rows * gridSize;
            const offsetX = (width - boardW) / 2, offsetY = (height - boardH) / 2;

            const startX = Math.floor(cols / 2) * gridSize;
            const startY = Math.floor(rows / 2) * gridSize;
            let snake = [{x: startX, y: startY}, {x: startX - gridSize, y: startY}, {x: startX - gridSize * 2, y: startY}];
            let dx = gridSize, dy = 0;

            // The grid lines are completely static for the lifetime of this board
            // (nothing about them ever changes frame to frame), so re-stroking every
            // single line 60 times a second was pure wasted canvas work — it's now
            // rendered once to an off-screen canvas and just blitted with a single
            // drawImage() per frame instead, which is dramatically cheaper. Rendered
            // at the same device-pixel resolution as the main canvas so it stays
            // just as crisp on high-DPI screens.
            const gridDpr = Math.min(window.devicePixelRatio || 1, 2.5);
            const gridCanvas = document.createElement('canvas');
            // Math.max(1, ...) guards against the wrapper briefly reporting a
            // 0×0 rect (e.g. right as the game view is still being laid out) —
            // a 0-sized canvas throws InvalidStateError the moment drawImage()
            // tries to blit it later, which is what was crashing the game.
            gridCanvas.width = Math.max(1, Math.round(boardW * gridDpr));
            gridCanvas.height = Math.max(1, Math.round(boardH * gridDpr));
            const gctx = gridCanvas.getContext('2d');
            gctx.setTransform(gridDpr, 0, 0, gridDpr, 0, 0);
            gctx.strokeStyle = 'rgba(255,255,255,0.05)';
            gctx.lineWidth = 1;
            for (let x = 0; x <= boardW; x += gridSize) { gctx.beginPath(); gctx.moveTo(x, 0); gctx.lineTo(x, boardH); gctx.stroke(); }
            for (let y = 0; y <= boardH; y += gridSize) { gctx.beginPath(); gctx.moveTo(0, y); gctx.lineTo(boardW, y); gctx.stroke(); }
            // A short input queue (instead of a single "next direction") makes
            // fast swipes/keys register correctly instead of being silently
            // dropped or occasionally allowing a same-tick reversal into the
            // snake's own neck.
            let inputQueue = [];
            let food = {x: 0, y: 0};
            let stepMs = 130;
            let ended = false;
            gameScore = 0;
            document.getElementById('gameScore').innerText = (fa ? 'امتیاز: ' : 'Score: ') + gameScore;

            function queueDir(ndx, ndy) {
                const last = inputQueue.length ? inputQueue[inputQueue.length - 1] : {x: dx, y: dy};
                if (ndx === -last.x && ndy === -last.y) return; // no 180° reversals
                if (ndx === last.x && ndy === last.y) return;
                if (inputQueue.length >= 2) inputQueue.shift();
                inputQueue.push({x: ndx, y: ndy});
            }

            function spawnFood() {
                let attempts = 0;
                do {
                    food.x = Math.floor(Math.random() * cols) * gridSize;
                    food.y = Math.floor(Math.random() * rows) * gridSize;
                    attempts++;
                } while (snake.some(part => part.x === food.x && part.y === food.y) && attempts < 200);
            }
            spawnFood();

            window.addEventListener('keydown', (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
                if (e.key === 'ArrowUp') queueDir(0, -gridSize);
                if (e.key === 'ArrowDown') queueDir(0, gridSize);
                if (e.key === 'ArrowLeft') queueDir(-gridSize, 0);
                if (e.key === 'ArrowRight') queueDir(gridSize, 0);
            }, { signal: gameAborter.signal });

            let touchStartX = null, touchStartY = null;
            // Bound to the wrapper (the whole area under the top bar), not
            // just the canvas, so every tap/swipe there steers the snake —
            // per the request that anything except the top bar should count
            // as game input. The .game-overlay-panel check lets taps on the
            // pause/game-over cards (and their buttons) reach those cards
            // normally instead of being eaten as a swipe.
            const snakeWrap = document.getElementById('gameCanvasWrap');

            snakeWrap.addEventListener('touchstart', e => {
                if (e.target.closest('.game-overlay-panel')) return;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                e.preventDefault();
            }, { passive: false, signal: gameAborter.signal });

            snakeWrap.addEventListener('touchmove', e => {
                if (e.target.closest('.game-overlay-panel')) return;
                if (touchStartX === null || touchStartY === null) return;
                let diffX = e.touches[0].clientX - touchStartX;
                let diffY = e.touches[0].clientY - touchStartY;

                // Lowered from 20 to 14px so a quick flick registers sooner —
                // part of making touch control feel more responsive.
                if (Math.abs(diffX) > 14 || Math.abs(diffY) > 14) {
                    if (Math.abs(diffX) > Math.abs(diffY)) {
                        queueDir(diffX > 0 ? gridSize : -gridSize, 0);
                    } else {
                        queueDir(0, diffY > 0 ? gridSize : -gridSize);
                    }
                    // Re-baseline from the current finger position instead of
                    // clearing it: clearing meant every turn after the first
                    // required lifting the finger and touching down again, so a
                    // single continuous drag could only ever steer once. Now the
                    // same unbroken swipe can curve through several turns in a
                    // row, which is what makes touch steering actually feel like
                    // dragging the snake instead of tapping out directions.
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }
                e.preventDefault();
            }, { passive: false, signal: gameAborter.signal });

            function endSnake() {
                if (ended) return;
                ended = true;
                mAiGameHaptic('error');
                presentGameOver(gameScore, 'snake', fa ? '🐍 بازی تمام شد!' : '🐍 Game over!', startNeonSnake);
            }

            let raf = null, lastTick = 0, acc = 0;
            function loop(ts) {
                raf = requestAnimationFrame(loop);
                if (gamePaused || ended) { lastTick = ts; return; }
                if (!lastTick) lastTick = ts;
                // Clamp the elapsed time so a throttled/backgrounded tab can't
                // dump a multi-second gap into the accumulator and force the
                // snake to jump several cells (and straight through walls) the
                // instant the tab becomes visible again.
                let dt = Math.min(ts - lastTick, 250);
                lastTick = ts;
                acc += dt;

                while (acc >= stepMs) {
                    acc -= stepMs;
                    if (inputQueue.length) {
                        const next = inputQueue.shift();
                        dx = next.x; dy = next.y;
                    }
                    let head = {x: snake[0].x + dx, y: snake[0].y + dy};

                    if (head.x < 0 || head.x >= boardW || head.y < 0 || head.y >= boardH) {
                        endSnake();
                        return;
                    }

                    const ateFood = (head.x === food.x && head.y === food.y);
                    const bodyToCheck = ateFood ? snake : snake.slice(0, -1);
                    for (let i = 0; i < bodyToCheck.length; i++) {
                        if (head.x === bodyToCheck[i].x && head.y === bodyToCheck[i].y) {
                            endSnake();
                            return;
                        }
                    }

                    snake.unshift(head);
                    if (ateFood) {
                        gameScore += 10;
                        document.getElementById('gameScore').innerText = (fa ? 'امتیاز: ' : 'Score: ') + gameScore;
                        if (gameScore % 50 === 0) stepMs = Math.max(70, stepMs - 6);
                        mAiGameHaptic('light');
                        spawnFood();
                    } else {
                        snake.pop();
                    }
                }

                // -------- draw --------
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, width, height);

                ctx.save();
                ctx.translate(offsetX, offsetY);

                if (boardW > 0 && boardH > 0) ctx.drawImage(gridCanvas, 0, 0, boardW, boardH);

                const pulse = 1 + Math.sin(ts / 180) * 0.12;
                const fs = (gridSize - 2) * pulse;
                const fOff = ((gridSize - 2) - fs) / 2;
                ctx.fillStyle = '#ff0055';
                ctx.shadowBlur = 14;
                ctx.shadowColor = '#ff0055';
                ctx.beginPath();
                ctx.roundRect(food.x + 1 + fOff, food.y + 1 + fOff, fs, fs, 5);
                ctx.fill();

                // Glow (shadowBlur) is one of the most expensive things a canvas can
                // do per shape, and it used to be applied to every single body
                // segment — fine for a short snake, but the cost multiplies with
                // length and was the main reason the game visibly slowed down the
                // longer a run went on. Keeping the glow on just the head (the part
                // that actually needs to draw the eye) while the body fills flat
                // keeps the neon look with a small, constant per-frame cost
                // regardless of how long the snake gets.
                ctx.shadowColor = '#00f0ff';
                snake.forEach((part, index) => {
                    const t = index / Math.max(1, snake.length - 1);
                    ctx.fillStyle = index === 0 ? '#c4fbff' : `hsl(${188 + t * 20}, 100%, ${62 - t * 22}%)`;
                    ctx.shadowBlur = index === 0 ? 14 : 0;
                    ctx.beginPath();
                    ctx.roundRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2, 5);
                    ctx.fill();
                });
                ctx.shadowBlur = 0;
                ctx.restore();
            }
            raf = requestAnimationFrame(loop);
            gameStopFn = () => { if (raf) cancelAnimationFrame(raf); };
        }

        function startCyberFlappy() {
            window.__markhinActiveGame = 'flappy';
            const fa = currentLang === 'fa';
            enterGamePlayMode();
            document.getElementById('gameTitleActive').innerText = 'CYBER FLAPPY';
            document.getElementById('gameDescActive').innerText = fa
                ? 'برای پرش لمس کن یا کلید Space را بزن!'
                : 'Tap or press Space to fly!';

            clearGameEvents();
            const canvas = document.getElementById('cyberCanvas');
            const { width, height, ctx } = fitGameCanvas(canvas, 'fill');

            const birdX = Math.max(50, width * 0.18);
            const birdR = Math.max(10, Math.min(20, height * 0.026));
            const gravity = height * 0.0016;
            const jump = -height * 0.021;
            const pipeW = Math.max(46, width * 0.11);
            const pixelGap = width * 0.6;

            // Progressive-but-always-passable difficulty: speed and gap size
            // both move along an asymptotic curve (pipesPassed / (pipesPassed + K))
            // instead of a hard linear ramp to a nearby cap. That means the
            // game keeps getting harder pipe after pipe, but the increments
            // shrink over time and the values approach a fixed ceiling/floor
            // they never cross — so no matter how far a run goes, the next
            // pipe is always a little harder than the last but never becomes
            // literally unbeatable.
            const baseGapH = Math.max(140, height * 0.3);
            const minGapH = Math.max(baseGapH * 0.6, birdR * 7.5, pipeW);
            const basePipeSpeed = Math.max(2.4, width * 0.0045);
            const maxPipeSpeedGain = basePipeSpeed * 1.3;
            const difficultyRamp = 12; // pipes to reach ~50% of the way to max difficulty
            let pipesPassed = 0;
            function currentDifficulty() { return pipesPassed / (pipesPassed + difficultyRamp); }
            function currentGapH() { return baseGapH - (baseGapH - minGapH) * currentDifficulty(); }

            let pipeSpeed = basePipeSpeed;

            let birdY = height / 2, birdVy = 0;
            let pipes = [];
            let ended = false;
            let distSinceSpawn = 0;
            gameScore = 0;
            document.getElementById('gameScore').innerText = (fa ? 'امتیاز: ' : 'Score: ') + gameScore;

            function triggerJump() { if (!gamePaused && !ended) { birdVy = jump; mAiGameHaptic('light'); } }

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') { triggerJump(); e.preventDefault(); }
            }, { signal: gameAborter.signal });

            // Bound to the wrapper (whole area under the top bar), not just
            // the canvas, and skipping taps on the pause/game-over overlay so
            // those cards' own buttons still work normally.
            const flappyWrap = document.getElementById('gameCanvasWrap');

            flappyWrap.addEventListener('mousedown', (e) => {
                if (e.target.closest('.game-overlay-panel')) return;
                triggerJump(); e.preventDefault();
            }, { signal: gameAborter.signal });

            flappyWrap.addEventListener('touchstart', (e) => {
                if (e.target.closest('.game-overlay-panel')) return;
                triggerJump(); e.preventDefault();
            }, { passive: false, signal: gameAborter.signal });

            function endFlappy() {
                if (ended) return;
                ended = true;
                mAiGameHaptic('error');
                presentGameOver(gameScore, 'flappy', fa ? '🚀 برخورد کردی!' : '🚀 Crashed!', startCyberFlappy);
            }

            let raf = null, lastTs = 0;
            function loop(ts) {
                raf = requestAnimationFrame(loop);
                if (gamePaused || ended) { lastTs = ts; return; }
                if (!lastTs) lastTs = ts;
                // Cap dt like Snake does — otherwise a backgrounded tab lets
                // gravity accumulate for the whole time it was hidden and the
                // bird instantly plunges through the floor the moment you
                // switch back, which used to feel like an unfair, sudden death.
                const dt = Math.min((ts - lastTs) / 16.67, 3);
                lastTs = ts;

                birdVy += gravity * dt;
                birdY += birdVy * dt;

                ctx.clearRect(0, 0, width, height);
                const bg = ctx.createLinearGradient(0, 0, 0, height);
                bg.addColorStop(0, '#050505');
                bg.addColorStop(1, '#0a0a14');
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, width, height);

                distSinceSpawn += pipeSpeed * dt;
                if (distSinceSpawn >= pixelGap) {
                    distSinceSpawn = 0;
                    const gapH = currentGapH();
                    const topRange = Math.max(20, height - gapH - height * 0.16);
                    const topH = Math.floor(Math.random() * topRange) + height * 0.08;
                    pipes.push({ x: width, top: topH, bottom: height - topH - gapH, passed: false });
                }

                ctx.fillStyle = '#00ff66';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ff66';
                for (const p of pipes) {
                    p.x -= pipeSpeed * dt;
                    ctx.fillRect(p.x, 0, pipeW, p.top);
                    ctx.fillRect(p.x, height - p.bottom, pipeW, p.bottom);

                    if (!p.passed && p.x + pipeW < birdX) {
                        p.passed = true;
                        pipesPassed++;
                        gameScore += 5;
                        document.getElementById('gameScore').innerText = (fa ? 'امتیاز: ' : 'Score: ') + gameScore;
                        pipeSpeed = basePipeSpeed + maxPipeSpeedGain * currentDifficulty();
                    }

                    if (birdX + birdR > p.x && birdX - birdR < p.x + pipeW) {
                        if (birdY - birdR < p.top || birdY + birdR > height - p.bottom) {
                            endFlappy();
                        }
                    }
                }
                ctx.shadowBlur = 0;
                pipes = pipes.filter(p => p.x > -pipeW - 5);

                if (birdY - birdR > height || birdY + birdR < 0) {
                    endFlappy();
                }

                ctx.beginPath();
                const tilt = Math.max(-0.5, Math.min(0.9, birdVy / (height * 0.02)));
                ctx.save();
                ctx.translate(birdX, birdY);
                ctx.rotate(tilt * 0.5);
                ctx.beginPath();
                ctx.arc(0, 0, birdR, 0, Math.PI * 2);
                ctx.fillStyle = '#00f0ff';
                ctx.shadowBlur = 14;
                ctx.shadowColor = '#00f0ff';
                ctx.fill();
                ctx.restore();
                ctx.shadowBlur = 0;
            }
            raf = requestAnimationFrame(loop);
            gameStopFn = () => { if (raf) cancelAnimationFrame(raf); };
        }

        function initCanvas(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            if (canvas.dataset.ready !== '1') {
                canvasStates[id] = {
                    isDrawing: false,
                    startX: 0,
                    startY: 0,
                    snapshot: null,
                    history: [],
                    maxHistory: 20
                };
                canvas.dataset.ready = '1';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                saveCanvasState(id);
            }

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function startDraw(e) {
                const st = canvasStates[id];
                st.isDrawing = true;
                const pos = getPos(e);
                st.startX = pos.x;
                st.startY = pos.y;

                ctx.beginPath();
                ctx.moveTo(st.startX, st.startY);
                st.snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            }

            function moveDraw(e) {
                const st = canvasStates[id];
                if (!st.isDrawing) return;
                const pos = getPos(e);

                const modeEl = document.getElementById(`draw-mode-${id}`);
                const colorEl = document.getElementById(`draw-color-${id}`);
                const sizeEl = document.getElementById(`draw-size-${id}`);
                const mode = modeEl?.value || 'draw';
                const color = colorEl?.value || '#000000';
                const size = Math.max(1, Math.min(100, parseInt(sizeEl?.value, 10) || 3));

                ctx.lineWidth = size;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (mode === 'draw') {
                    ctx.strokeStyle = color;
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                } else if (mode === 'eraser') {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                } else if (mode === 'rect' || mode === 'circle') {
                    ctx.putImageData(st.snapshot, 0, 0);
                    ctx.strokeStyle = color;
                    ctx.beginPath();

                    if (mode === 'rect') {
                        ctx.strokeRect(st.startX, st.startY, pos.x - st.startX, pos.y - st.startY);
                    } else if (mode === 'circle') {
                        const radius = Math.sqrt(Math.pow(pos.x - st.startX, 2) + Math.pow(pos.y - st.startY, 2));
                        ctx.arc(st.startX, st.startY, radius, 0, 2 * Math.PI);
                        ctx.stroke();
                    }
                }
            }

            function stopDraw() {
                const st = canvasStates[id];
                if (st && st.isDrawing) {
                    st.isDrawing = false;
                    ctx.closePath();
                    saveCanvasState(id);
                }
            }

            canvas.onmousedown = startDraw;
            canvas.onmousemove = moveDraw;
            canvas.onmouseup = stopDraw;
            canvas.onmouseleave = stopDraw;

            canvas.ontouchstart = (e) => { e.preventDefault(); startDraw(e); };
            canvas.ontouchmove = (e) => { e.preventDefault(); moveDraw(e); };
            canvas.ontouchend = (e) => { e.preventDefault(); stopDraw(); };
            canvas.ontouchcancel = (e) => { e.preventDefault(); stopDraw(); };
        }

        function saveCanvasState(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const st = canvasStates[id];
            if (!st) return;

            if (st.history.length >= st.maxHistory) st.history.shift();
            st.history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        }

        function undoCanvas(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const st = canvasStates[id];

            if (st && st.history.length > 1) {
                st.history.pop();
                ctx.putImageData(st.history[st.history.length - 1], 0, 0);
            }
        }

            if (canvas) {

        function resizeCanvas(id) {
            const canvas = document.getElementById(`canvas-${id}`);

            const ctx = canvas.getContext('2d');

            const wInput = document.getElementById(`draw-w-${id}`);
            const hInput = document.getElementById(`draw-h-${id}`);

            const oldWidth = canvas.width;
            const oldHeight = canvas.height;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = oldWidth;
            tempCanvas.height = oldHeight;
            tempCanvas.getContext('2d').drawImage(canvas, 0, 0);

            const width = Math.max(120, Math.min(1200, parseInt(wInput?.value, 10) || 350));
            const height = Math.max(80, Math.min(900, parseInt(hInput?.value, 10) || 180));
            if (wInput) wInput.value = width;
            if (hInput) hInput.value = height;
            canvas.width = width;
            canvas.height = height;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(tempCanvas, 0, 0, oldWidth, oldHeight, 0, 0, width, height);

            const st = canvasStates[id];
            if (st) st.history = [];
            saveCanvasState(id);
        }

        async function translateText(id, sourceLang, targetLang) {
            const t = i18n[currentLang];
            const textEl = document.getElementById(`text-${id}`);
            if (!textEl) return;

            const sourceText = textEl.textContent.trim();
            if (!sourceText) {
                alert(t.noTextToTranslate);
                return;
            }

            // Translating rewrites the note as plain translated text, so anything that
            // isn't plain text — images, audio, drawings, tables, links — would be lost
            // in the process. Only ask when the note actually has any of that.
            if (textEl.querySelector('img,audio,canvas,table,a')) {
                const warnMsg = currentLang === 'fa'
                    ? 'ترجمه، تصاویر/صدا/جدول/لینک داخل این یادداشت را حذف می‌کند و فقط متن ساده‌ی ترجمه‌شده باقی می‌ماند. ادامه می‌دهید؟'
                    : 'Translating will remove any images, audio, tables, or links in this note, leaving only the translated plain text. Continue?';
                if (!confirm(warnMsg)) return;
            }

            const originalContent = textEl.innerHTML;
            // Snapshot the pre-translation state as its own undo checkpoint —
            // this is what lets Undo step back to exactly "before translation"
            // even if the debounced autosave hadn't captured it yet.
            mu_historyInit(id, originalContent);
            mu_historyPush(id, originalContent);
            textEl.innerText = t.translating;

            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(sourceText)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data && data[0]) {
                    let translatedText = data[0].map(item => item[0]).join('');
                    textEl.innerText = translatedText;
                    
                    const item = categories.find(c => c.id === id);
                    if (item) {
                        item.html = textEl.innerHTML;
                        // textContent drops <br> line breaks entirely; use the same
                        // attached-clone extraction as everywhere else so the saved
                        // text keeps the translated line breaks.
                        item.text = textWithVisualSpacing(textEl).replace(/\u00a0/g, ' ');

                        item.lastEdited = new Date().toUTCString();

                        saveToLocalStorage();
                    }
                    // Second checkpoint: the translated result. Undo now goes
                    // translated -> original in one click; Redo goes back forward.
                    mu_historyPush(id, textEl.innerHTML);
                } else {
                    alert(t.translationError);
                    textEl.innerHTML = originalContent;
                }
            } catch (error) {
                alert(t.serverError);
                textEl.innerHTML = originalContent;
            }
        }

        async function downloadImage(imgSrc) {
            const chosenName = await promptFilename(`drawing_${Date.now()}`, 'png', {
                desc: currentLang === 'fa' ? 'نام فایل تصویر ذخیره‌شده.' : 'Name for the saved image file.'
            });
            if (chosenName === null) return;
            const fileName = `${chosenName}.png`;
            // Fast path: plain anchor click on the data URL (works almost everywhere
            // EXCEPT inside Telegram's in-app browser, where this click fires with no
            // error yet saves nothing — so it must never be trusted as "done" there).
            if (!IS_TELEGRAM) {
                try {
                    const a = document.createElement('a');
                    a.href = imgSrc;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { a.remove(); }, 100);
                    return;
                } catch (e) { console.warn('Direct image download failed, trying alternatives…', e); }
            }
            // Fallback / Telegram path: convert to a real Blob and run the full download
            // chain (Telegram share/browser bridge, File System Access / Share / new tab /
            // legacy saver / data URL).
            try {
                const res = await fetch(imgSrc);
                const blob = await res.blob();
                await robustDownload(blob, fileName, blob.type || 'image/png');
            } catch (e) {
                console.error(e);
                alert(currentLang === 'fa' ? 'دانلود تصویر انجام نشد. دوباره امتحان کن.' : 'The image download failed. Please try again.');
            }
        }

        function toggleVisibility(id) {
            const t = i18n[currentLang];
            const item = categories.find(c => c.id === id);
            if (!item) return;
            const textEl = document.getElementById(`text-${id}`);
            // Masking/unmasking swaps the full note text for a short fixed
            // placeholder (or back), which changes the box's height a lot.
            // scrollTop never moves on its own when that happens, so the
            // sudden height change shifts everything below the note up or
            // down under a fixed viewport — that's what reads as the page
            // "jumping down" instead of just toggling the note in place.
            // Recording the note's on-screen position beforehand and
            // correcting the scroll by however much it moved keeps it
            // pinned exactly where the person was looking.
            const anchorEl = document.getElementById(`container-${id}`) || textEl;
            const beforeTop = anchorEl ? anchorEl.getBoundingClientRect().top : null;
            hiddenState[id] = !hiddenState[id];
            if (hiddenState[id]) {
                textEl.innerText = generateMask();
                textEl.classList.add('masked');
                textEl.setAttribute('contenteditable', 'false');
            } else {
                textEl.innerHTML = item.isDecoy ? sanitizeHtml(item.fakeContent || t.unauthorized) : sanitizeHtml(item.html || item.text || '');
                textEl.classList.remove('masked');
                textEl.setAttribute('contenteditable', (!item.isDecoy).toString());
                setTimeout(() => attachWrapperEvents(id), 50);
            }
            if (anchorEl && beforeTop !== null) {
                const afterTop = anchorEl.getBoundingClientRect().top;
                const delta = afterTop - beforeTop;
                if (delta) window.scrollBy(0, delta);
            }
        }

        /* ---------------------------------------------------------------
           Robust per-note text Undo/Redo history.
           Replaces the old browser document.execCommand('undo'/'redo'),
           which only tracks the browser's own native contenteditable
           input events — it has no idea about *programmatic* content
           changes like Google/AI translation, AI-summary insertion,
           image/table/drawing insertion, etc. Those changes would either
           not be undoable at all, or would silently corrupt the native
           undo stack. This keeps one small linear history per note
           (a plain array of full innerHTML snapshots + a position
           pointer), fed from every place that actually changes a note's
           content, so Undo/Redo works reliably no matter *how* the
           change happened.
           --------------------------------------------------------------- */
        window.__muHistory = window.__muHistory || {};
        const MU_HISTORY_LIMIT = 60;

        function mu_historyInit(id, html) {
            if (!window.__muHistory[id]) {
                window.__muHistory[id] = { stack: [html], index: 0 };
                mu_updateUndoRedoButtons(id);
            }
        }

        function mu_historyPush(id, html) {
            let h = window.__muHistory[id];
            if (!h) { window.__muHistory[id] = { stack: [html], index: 0 }; mu_updateUndoRedoButtons(id); return; }
            if (h.stack[h.index] === html) return; // no real change, skip
            // A new change after some Undo(s) discards the old redo branch —
            // standard undo/redo behavior.
            h.stack = h.stack.slice(0, h.index + 1);
            h.stack.push(html);
            if (h.stack.length > MU_HISTORY_LIMIT) h.stack.shift();
            h.index = h.stack.length - 1;
            mu_updateUndoRedoButtons(id);
        }

        function mu_updateUndoRedoButtons(id) {
            const h = window.__muHistory[id];
            const undoBtn = document.getElementById('mu-undo-' + id);
            const redoBtn = document.getElementById('mu-redo-' + id);
            if (undoBtn) undoBtn.disabled = !h || h.index <= 0;
            if (redoBtn) redoBtn.disabled = !h || h.index >= h.stack.length - 1;
        }

        function mu_applyHistoryState(id) {
            const h = window.__muHistory[id];
            const textEl = document.getElementById('text-' + id);
            const item = categories.find(c => c.id === id);
            if (!h || !textEl || !item) return;
            textEl.innerHTML = h.stack[h.index];
            item.html = textEl.innerHTML;
            item.text = textWithVisualSpacing(textEl).replace(/\u00a0/g, ' ');
            item.lastEdited = new Date().toUTCString();
            saveToLocalStorage();
            mu_updateUndoRedoButtons(id);
        }

        window.mu_undoText = function (id) {
            const h = window.__muHistory[id];
            const fa = currentLang === 'fa';
            if (!h || h.index <= 0) { showToast(fa ? 'چیزی برای بازگشت نیست.' : 'Nothing to undo.'); return; }
            h.index--;
            mu_applyHistoryState(id);
            showToast(fa ? '↶ یک مرحله بازگشت.' : '↶ Stepped back.');
        };

        window.mu_redoText = function (id) {
            const h = window.__muHistory[id];
            const fa = currentLang === 'fa';
            if (!h || h.index >= h.stack.length - 1) { showToast(fa ? 'چیزی برای جلو رفتن نیست.' : 'Nothing to redo.'); return; }
            h.index++;
            mu_applyHistoryState(id);
            showToast(fa ? '↷ یک مرحله جلو رفت.' : '↷ Stepped forward.');
        };

        async function saveCategory(id) {
            const item = categories.find(c => c.id === id);
            if (!item || item.isDecoy || hiddenState[id]) return;
            const textEl = document.getElementById(`text-${id}`);
            if (!textEl) return;

            const cleanHtml = sanitizeHtml(textEl.innerHTML);
            // Use the same rendered (attached) extraction as textWithVisualSpacing()
            // instead of a detached clone's innerText — a detached clone isn't
            // rendered, so its innerText silently collapses blank lines and <br>s.
            const cleanText = textWithVisualSpacing(textEl).replace(/\u00a0/g, ' ');
            const changed = cleanHtml !== String(item.html || '');
            item.html = cleanHtml;
            item.text = cleanText;

            if (isNoteLocked(item)) {
                const sessionPassword = noteSessionKeys.get(item.id);
                if (!sessionPassword) {
                    alert(currentLang === 'fa' ? 'برای ویرایش این یادداشت ابتدا آن را باز کنید.' : 'Unlock this note before editing it.');
                    return;
                }
                try {
                    item.encrypted = await encryptNotePayload(sessionPassword, item.html, item.text);
                } catch (error) {
                    console.error(error);
                    alert(currentLang === 'fa' ? 'رمزگذاری مجدد یادداشت انجام نشد.' : 'The note could not be re-encrypted.');
                    return;
                }
            }

            if (changed) {
                item.lastEdited = new Date().toUTCString();
                mu_historyPush(id, cleanHtml);
            }

            saveToLocalStorage();
            renderApp(id);
        }

        async function autosaveCategory(id) {
            const item = categories.find(c => c.id === id);
            const textEl = document.getElementById(`text-${id}`);
            if (!item || !textEl || item.isDecoy || hiddenState[id]) return;
            const cleanHtml = sanitizeHtml(textEl.innerHTML);
            if (cleanHtml === String(item.html || '')) return;
            item.html = cleanHtml;
            mu_historyPush(id, cleanHtml);
            // This fires on every pause while typing (every 700ms), so unlike
            // saveCategory() it deliberately skips textWithVisualSpacing()'s
            // clone/off-screen-mount/letter-spacing pass — that work is only
            // needed for exports and was making every keystroke pause noticeably
            // choppy. textEl is already live and on-screen here, so innerText
            // alone already reflects the real line breaks/spacing correctly;
            // the accurate (but heavier) extraction still runs on explicit save.
            item.text = (textEl.innerText || textEl.textContent || '').replace(/\u00a0/g, ' ');
            if (isNoteLocked(item)) {
                const sessionPassword = noteSessionKeys.get(item.id);
                if (!sessionPassword) return;
                try {
                    item.encrypted = await encryptNotePayload(sessionPassword, item.html, item.text);
                } catch (error) {
                    console.error(error);
                    return;
                }
            }
            item.lastEdited = new Date().toUTCString();
            saveToLocalStorage();
        }

        let autosaveTimer = null;

        function flushActiveEditorSave() {
            if (autosaveTimer) {
                clearTimeout(autosaveTimer);
                autosaveTimer = null;
            }
            if (activeOpenId) autosaveCategory(activeOpenId);
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') flushActiveEditorSave();
        });
        window.addEventListener('beforeunload', flushActiveEditorSave);

        document.addEventListener('input', (event) => {
            const textBox = event.target.closest?.('.text-box');
            if (!textBox || !textBox.id.startsWith('text-')) return;
            // Contenteditable divs often leave a stray <br> (or similar empty markup) behind
            // after the user deletes everything they typed, which stops the CSS :empty
            // placeholder from coming back. Collapse those cases to a truly empty element
            // so the placeholder reappears exactly when the note is actually empty.
            if (!textBox.textContent.trim() && !textBox.querySelector('img,table,canvas,iframe,video,audio')) {
                if (textBox.innerHTML !== '') textBox.innerHTML = '';
            }
            const id = textBox.id.slice(5);
            clearTimeout(autosaveTimer);
            autosaveTimer = setTimeout(() => autosaveCategory(id), 700);
        });

        async function copyCategory(id) {
            const t = i18n[currentLang];
            const item = categories.find(c => c.id === id);
            if (!item) return;
            const textToCopy = item.isDecoy ? (item.fakeContent || t.unauthorized) : (item.text || item.html || '');
            // Telegram's in-app WebView (and some browser contexts) exposes
            // navigator.clipboard but then rejects the actual writeText() call
            // (no Permissions-Policy: clipboard-write for the embedding
            // iframe, or no secure-context grant) — same class of silent
            // WebView restriction documented elsewhere in this file for
            // downloads. Previously that rejection fell straight into the
            // catch block below, which alerted the same "copied" success
            // message anyway — so the note's text never actually reached the
            // clipboard, but the user was told it had. Now a Clipboard API
            // failure retries with the older execCommand('copy') technique
            // (which several WebViews still allow) before giving up for real.
            let copied = false, lastErr = null;
            if (navigator.clipboard?.writeText) {
                try { await navigator.clipboard.writeText(textToCopy); copied = true; }
                catch (e) { lastErr = e; }
            }
            if (!copied) {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = textToCopy; ta.style.position = 'fixed'; ta.style.opacity = '0';
                    document.body.appendChild(ta); ta.focus(); ta.select();
                    copied = document.execCommand('copy');
                    ta.remove();
                } catch (e) { lastErr = e; }
            }
            if (copied) showToast(t.copied);
            else alert((t.copyFailed || (fa_currentLangIsFa() ? '❌ کپی انجام نشد.' : '❌ Copy failed.')) + (lastErr ? '\n' + (lastErr.message || lastErr) : ''));
        }
        function fa_currentLangIsFa(){ return currentLang === 'fa'; }

        /* Deletes all of a note's text content after a single confirm().
           The pre-clear content is checkpointed into the same per-note
           undo/redo history used everywhere else in the file (see the
           "Robust per-note text Undo/Redo history" block above), so
           pressing the ↩️ Undo button right after is the recovery path if
           this was pressed by mistake — no separate "are you sure" state
           or trash/cemetery mechanism needed on top of the confirm(). */
        async function clearNoteText(id) {
            const item = categories.find(c => c.id === id);
            const fa = currentLang === 'fa';
            if (!item) return;
            if (item.isDecoy || hiddenState[id]) {
                showToast(fa ? 'ابتدا یادداشت را نمایش بده.' : 'Unhide the note first.');
                return;
            }
            const textEl = document.getElementById('text-' + id);
            if (!textEl) return;
            if (!textEl.textContent.trim() && !textEl.querySelector('img,table,canvas,iframe,video,audio')) {
                showToast(fa ? 'این یادداشت از قبل خالی است.' : 'This note is already empty.');
                return;
            }
            const warnMsg = fa
                ? 'کل متن این یادداشت پاک شود؟ در صورت پشیمانی می‌توانی با دکمه واگرد (↩️) آن را برگردانی.'
                : 'Delete all the text in this note? You can bring it back with the ↩️ Undo button if you change your mind.';
            if (!confirm(warnMsg)) return;

            const preClearHtml = textEl.innerHTML;
            mu_historyInit(id, preClearHtml);
            mu_historyPush(id, preClearHtml);

            textEl.innerHTML = '';
            item.html = '';
            item.text = '';
            item.lastEdited = new Date().toUTCString();

                const sessionPassword = noteSessionKeys.get(item.id);
                if (sessionPassword) {
                    try { item.encrypted = await encryptNotePayload(sessionPassword, '', ''); }

                }
            }

        }
        window.clearNoteText = clearNoteText;

        // Extract text for TXT export while preserving real line breaks and whitespace.
        // textContent collapses structural breaks between div/p elements, so innerText is
        // preferred when the note is currently rendered in the editor.
        //
        // NOTE: this used to also approximate the note editor's cosmetic
        // letter-spacing (.text-box's default 0.15px) by inserting a real
        // Unicode hair-space character between every single character of
        // the text, so the exported file would "look" equally spaced out.
        // That's removed. No feature in this app ever sets a deliberate,
        // meaningful letter-spacing on real note content — the only things
        // that had non-zero letter-spacing were tiny cosmetic UI defaults —
        // so it never preserved anything users actually asked for, while
        // corrupting every export: inserting any character between two
        // letters breaks Arabic/Persian's cursive joining forms, so joined
        // Persian/Farsi text came out as isolated, disconnected letters,
        // and note text with a bigger incidental letter-spacing (e.g. a
        // masked/placeholder style) came out completely scrambled.
        function textWithVisualSpacing(root) {
            const clone = root.cloneNode(true);
            clone.querySelectorAll('.img-toolbar, .audio-wrapper button').forEach(el => el.remove());

            // innerText only reproduces real line breaks (Enter → new line, a
            // second Enter → blank line, Shift+Enter → soft break) when the
            // element is actually rendered with layout. A detached clone is
            // NOT rendered, so browsers quietly fall back to something close
            // to textContent instead — which drops every blank line and <br>,
            // exactly the "line breaks/spacing not preserved" bug reported.
            // Fix: mount the clone off-screen but still attached + laid out,
            // so innerText (and getComputedStyle below) match the editor
            // exactly, then tear the host down again.
            const liveStyle = getComputedStyle(root);
            const host = document.createElement('div');
            // NOTE: do not set visibility:hidden here. innerText (used below)
            // returns an empty string for any element inside a
            // visibility:hidden ancestor in real browsers, even though the
            // element is still laid out. Positioning far off-screen keeps it
            // invisible to the user without breaking innerText — this was
            // the actual cause of TXT exports coming out empty.
            host.style.cssText = 'position:fixed;left:-99999px;top:0;pointer-events:none;z-index:-1;';
            host.style.width = (root.clientWidth || root.offsetWidth || 600) + 'px';
            host.style.whiteSpace = liveStyle.whiteSpace || 'pre-wrap';
            host.style.fontSize = liveStyle.fontSize;
            host.style.fontFamily = liveStyle.fontFamily;
            host.style.lineHeight = liveStyle.lineHeight;
            host.style.direction = liveStyle.direction;
            host.appendChild(clone);
            document.body.appendChild(host);

            try {
                return clone.innerText ?? clone.textContent ?? '';
            } finally {
                host.remove();
            }
        }

        // Converts saved note HTML to plain text without depending on the
        // note being live-rendered on screen. Deliberately simple (no
        // computed-style/letter-spacing work, which only makes sense for an
        // element actually laid out in the page) so it can't throw and turn
        // an export into a failed download.
        function htmlToPlainText(html) {
            try {
                const container = document.createElement('div');
                container.innerHTML = sanitizeHtml(html || '');
                container.querySelectorAll('br').forEach(el => el.replaceWith('\n'));
                container.querySelectorAll('p,div,li,blockquote,tr,h1,h2,h3,h4,h5,h6').forEach(el => {
                    el.insertAdjacentText('afterend', '\n');
                });
                const raw = container.textContent || '';
                return raw
                    .replace(/\u00a0/g, ' ')
                    .replace(/[ \t]+\n/g, '\n')
                    .replace(/\n{3,}/g, '\n\n')
                    .trim();
            } catch (e) {
                // Absolute last resort: strip tags with a regex so a
                // rendering hiccup never blocks the download entirely.
                console.warn('htmlToPlainText fallback used:', e);
                return String(html || '')
                    .replace(/<(br|\/p|\/div|\/li)[^>]*>/gi, '\n')
                    .replace(/<[^>]*>/g, ' ')
                    .replace(/[ \t]+/g, ' ')
                    .replace(/\n{3,}/g, '\n\n')
                    .trim();
            }
        }

        function getTxtContent(id, item) {
            const textEl = document.getElementById(`text-${id}`);
            if (textEl) {
                try {
                    return textWithVisualSpacing(textEl)
                        .replace(/\u00a0/g, ' ')
                        .replace(/\r\n/g, '\n')
                        .replace(/\r/g, '\n');
                } catch (e) {
                    console.warn('Live text extraction failed, falling back to saved HTML:', e);
                }
            }
            // The note isn't currently open (no live DOM element for it —
            // only the open note is rendered), or the live extraction above
            // failed. Build the text straight from the saved HTML instead of
            // falling back to item.text, which is only kept in sync while a
            // note is open and edited — for every closed note it's
            // stale/empty, which is why bulk/bundle TXT exports previously
            // contained only the titles.
            const html = item?.html;
            if (html) return htmlToPlainText(html);
            return String(item?.text ?? '');
        }
