    return `<div class="advanced-head">
        <h3>${title}</h3>
        <button class="btn-main" onclick="${closeAction}">✕</button>
    </div>`;
}

function markhinDash_showList(kind, value){
    const fa=currentLang==='fa';
    const notes=markhinDash_notes();
    let list, title;
    if(kind==='tag'){ list=notes.filter(x=>(x.tags||[]).includes(value)); title=`# ${escapeHtml(value)}`; }
    else if(kind==='pinned'){ list=notes.filter(x=>x.pinned); title=`📌 ${fa?'یادداشت‌های پین‌شده':'Pinned notes'}`; }
    else if(kind==='favorite'){ list=notes.filter(x=>x.favorite); title=`⭐ ${fa?'علاقه‌مندی‌ها':'Favorites'}`; }
    else if(kind==='locked'){ list=notes.filter(x=>isNoteLocked(x)); title=`🔒 ${fa?'قفل‌شده‌ها':'Locked notes'}`; }
    else if(kind==='fake'){ list=notes.filter(x=>x.fakeContent); title=`🎭 ${fa?'محتوای فریب‌دهنده':'Decoy content'}`; }
    else if(kind==='ghost'){ list=notes.filter(markhinDash_isGhostActive); title=`👻 ${fa?'Ghost Note های فعال':'Active Ghost Notes'}`; }
    else if(kind==='capsule'){ list=notes.filter(markhinDash_isCapsuleActive); title=`⏳ ${fa?'کپسول‌های زمانی فعال':'Active Time Capsules'}`; }
    else if(kind==='folder'){ list=notes.filter(x=>(x.folder||'')===value); title=`📁 ${escapeHtml(value||(fa?'بدون پوشه':'No folder'))}`; }
    else if(kind==='archived'){ list=allItems().filter(isArchived); title=`📦 ${fa?'بایگانی':'Archive'}`; }
    else { list=notes; title=fa?'همه یادداشت‌ها':'All notes'; }

    list=list.slice().sort((a,b)=>(Number(b.pinned)-Number(a.pinned))||(Number(b.favorite)-Number(a.favorite))||((Date.parse(b.lastEdited)||0)-(Date.parse(a.lastEdited)||0)));

    const isArchiveView=(kind==='archived');
    const rowOpts=isArchiveView?{actionLabel:(fa?'↩ بازگرداندن':'↩ Restore')}:{};
    const archiveActionsHtml=isArchiveView
        ? `<div style="margin:2px 0 10px"><button class="btn-main image-export-all-btn" type="button" onclick="markhinDash_pickNoteToArchive()">${fa?'➕ افزودن یادداشت به بایگانی':'➕ Add note to archive'}</button></div>`
        : '';
    const bodyHtml=list.length
        ? `<div class="markhin-smart-results" style="max-height:60vh">${list.map(x=>markhinDash_noteRowHtml(x,rowOpts)).join('')}</div>`
        : `<div class="markhin-smart-empty">${isArchiveView?(fa?'بایگانی خالی است.':'The archive is empty.'):(fa?'یادداشتی پیدا نشد.':'No notes found.')}</div>`;

    showAdvanced(markhinDash_headHtml(title, !isArchiveView)+archiveActionsHtml+`<div style="margin:2px 0 10px;font-size:11px;opacity:.6">${fa?'تعداد':'Count'}: ${list.length}</div>`+bodyHtml);
    document.getElementById('advancedCard')?.classList.add('kg-wide');
    markhinDash_bindRows(document.getElementById('advancedCard'), isArchiveView ? {
        onRowAction:(id)=>{ toggleArchiveNote(id); markhinDash_showList('archived'); },
        onRowClick:(id)=>{ toggleArchiveNote(id); markhinDash_openNote(id); }
    } : {});
}
window.markhinDash_showList=markhinDash_showList;

function markhinDash_pickNoteToArchive(){
    const fa=currentLang==='fa';

    document.getElementById('advancedCard')?.classList.add('kg-wide');
    markhinDash_bindRows(document.getElementById('advancedCard'), {
        onRowAction:(id)=>{ toggleArchiveNote(id); markhinDash_pickNoteToArchive(); },
        onRowClick:(id)=>{ toggleArchiveNote(id); markhinDash_pickNoteToArchive(); }

        ? tags.map(t=>{const c=tagCounts[t];const ratio=c/maxTagCount;const size=(11+ratio*9).toFixed(1);const op=(0.6+ratio*0.4).toFixed(2);
            return `<span class="markhin-tag markhin-dash-tag" style="font-size:${size}px;opacity:${op}" onclick="markhinDash_showList('tag',${JSON.stringify(t)})">#${escapeHtml(t)} <small>${c}</small></span>`;}).join('')
        : `<span style="opacity:.5;font-size:11px">${fa?'هنوز تگی ثبت نشده.':'No tags yet.'}</span>`;

        ? recent.map(x=>markhinDash_noteRowHtml(x,{metaLabel:new Date(Date.parse(x.lastEdited)||Date.now()).toLocaleDateString(fa?'fa-IR':'en-US')})).join('')
        : `<div class="markhin-smart-empty">${fa?'یادداشتی وجود ندارد.':'No notes yet.'}</div>`;

        ? `<div class="markhin-smart-item" data-id="${escapeHtml(longest.id)}"><b>🏆 ${escapeHtml(longest.name||'')}</b><div class="snippet">${fa?'طولانی‌ترین یادداشت':'Longest note'} — ${markhinDash_wordCount(longest)} ${fa?'کلمه':'words'}</div></div>`
        : '';

    showAdvanced(markhinDash_headHtml(`📊 ${fa?'داشبورد Markhin Note':'Markhin Note Dashboard'}`,false)+
        `<div class="markhin-dashboard-grid">${heroGrid}</div>`+
        `<p class="dna-section-title" style="margin-top:16px">${fa?'میانبرها':'Quick filters'}</p>`+
        `<div class="markhin-dashboard-grid">${actionGrid}</div>`+
        (IS_TELEGRAM && hasCloudStorage ? `<div style="margin-top:16px"><button class="btn-main" style="width:100%" onclick="markhinDash_showCloudPanel()">☁️ ${fa?'بکاپ Cloud تلگرام':'Telegram Cloud Backup'}</button></div>` : '')+
        `<p class="dna-section-title" style="margin-top:16px">${fa?'ابر تگ‌ها — روی هرکدام بزن':'Tag cloud — tap to filter'}</p>`+

async function markhinDash_showCloudPanel(){

        `<div id="cloudPanelBody" style="font-size:12.5px;line-height:1.9">${fa?'در حال بررسی...':'Checking...'}</div>`);
    const metaRaw = await cloudGetItem(CLOUD_META_KEY);
    const meta = metaRaw ? safeParseJSON(metaRaw, null) : null;
    const body = document.getElementById('cloudPanelBody');
    if (!body) return;
    const info = meta
        ? (fa ? `آخرین بکاپ: ${new Date(meta.ts).toLocaleString('fa-IR')}<br>یادداشت‌های پشتیبان‌گیری‌شده: ${meta.notes}${meta.skipped?` (⚠️ ${meta.skipped} یادداشت به‌دلیل محدودیت فضا رد شد)`:''}`
             : `Last backup: ${new Date(meta.ts).toLocaleString()}<br>Notes backed up: ${meta.notes}${meta.skipped?` (⚠️ ${meta.skipped} skipped — over the size limit)`:''}`)
        : (fa ? 'هنوز هیچ بکاپی در Cloud تلگرام ثبت نشده.' : 'No cloud backup yet.');
    body.innerHTML = `<p>${info}</p>` +
        `<p style="opacity:.7">${fa?'⚠️ فقط متن و اطلاعات یادداشت‌ها بکاپ می‌شود؛ تصاویر فقط روی همین دستگاه می‌مانند و در بکاپ نیستند. این بکاپ بین همه‌ی دستگاه‌هایی که همین ربات را در تلگرام باز کنی مشترک است.':'⚠️ Only note text/metadata is backed up here — images stay on this device and are not included. This backup is shared across every device where you open this bot in Telegram.'}</p>` +
        `<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">` +
        `<button class="btn-main btn-save-prominent" onclick="markhinDash_cloudBackupClick()">📤 ${fa?'بکاپ الان':'Backup now'}</button>` +
        `<button class="btn-main" onclick="markhinDash_cloudRestoreClick()" ${meta?'':'disabled'}>📥 ${fa?'بازیابی از Cloud':'Restore from cloud'}</button>` +
        `</div>`;
}

async function markhinDash_cloudBackupClick(){
    const fa=currentLang==='fa';
    showToast(fa?'در حال بکاپ‌گیری...':'Backing up...', 1500);

            : `✅ Backed up ${res.meta.notes} notes to Telegram Cloud.${res.meta.skipped?` (${res.meta.skipped} skipped)`:''}`, 3200);

        showToast(fa?'⚠️ بکاپ‌گیری انجام نشد. دوباره امتحان کن.':'⚠️ Backup failed. Please try again.', 3200);

async function markhinDash_cloudRestoreClick(){
    const fa=currentLang==='fa';
    const result = await cloudRestore();
    if (!result) { showToast(fa?'بکاپی برای بازیابی پیدا نشد.':'No backup found to restore.', 2600); return; }
    const ok = confirm(fa
        ? `${result.data.notes.length} یادداشت متنی از Cloud تلگرام بازیابی می‌شود.\nیادداشت‌هایی که همین‌جا هم وجود دارند (با شناسه یکسان) فقط در صورتی به‌روزرسانی می‌شوند که نسخه‌ی Cloud جدیدتر باشد؛ تصاویرشان دست‌نخورده می‌ماند. یادداشت‌های جدید اضافه می‌شوند. ادامه می‌دهی؟`
        : `${result.data.notes.length} text notes will be restored from Telegram Cloud.\nNotes that already exist here (same id) are only updated if the cloud copy is newer — their images are left untouched. New notes are added. Continue?`);
    if (!ok) return;

    let updated = 0, added = 0;
    result.data.notes.forEach(cloudItem => {
        const local = categories.find(c => c.id === cloudItem.id);
        if (local) {
            if ((Date.parse(cloudItem.lastEdited) || 0) > (Date.parse(local.lastEdited) || 0)) {
                local.name = cloudItem.name; local.folder = cloudItem.folder;
                local.tags = cloudItem.tags;
                local.pinned = cloudItem.pinned; local.favorite = cloudItem.favorite; local.archived = !!cloudItem.archived;
                local.lastEdited = cloudItem.lastEdited;
                if (isNoteLocked(cloudItem)) {
                    // Never let a cloud restore replace encrypted content with an
                    // empty/plaintext representation. The encrypted envelope is the
                    // authoritative content for locked notes.
                    local.encrypted = { ...cloudItem.encrypted };
                    local.hint = cloudItem.hint || '';
                    local.text = ''; local.html = ''; local.isDecoy = false;
                    noteSessionKeys.delete(local.id);
                    unlockedQaIds = unlockedQaIds.filter(id => id !== local.id);
                } else {
                    local.encrypted = null;
                    local.text = cloudItem.text;
                    // Only take the cloud HTML if the local note has no images of its
                    // own to lose — otherwise keep the local copy (with its images).
                    if (!/<img|img-drag-wrapper/.test(local.html || '')) local.html = sanitizeHtml(cloudItem.html || cloudItem.text || '');
                }
                updated++;
            }
        } else {
            const restored = normalizeCategory(Object.assign({}, cloudItem, { history: [] }), categories.length);
            if (isNoteLocked(restored)) { restored.text = ''; restored.html = ''; restored.isDecoy = false; }
            else restored.html = sanitizeHtml(restored.html || restored.text || '');
            categories.push(restored);
            added++;
        }
    });
    (result.data.folders || []).forEach(f => { if (f && !folders.includes(f)) folders.push(f); });
    saveToLocalStorage(); saveFoldersToLocalStorage();
    showToast(fa ? `✅ بازیابی انجام شد — ${added} یادداشت جدید، ${updated} یادداشت به‌روزرسانی شد.` : `✅ Restored — ${added} new, ${updated} updated.`, 3600);
    closeAdvancedModal();
    renderApp();
}
window.markhinDash_cloudRestoreClick = markhinDash_cloudRestoreClick;

})();

<script>
(function(){
'use strict';

/* ---------- small utilities ---------- */
function mu_norm(s){ return (typeof normalizeText==='function') ? normalizeText(s) : String(s||'').toLowerCase(); }

function mu_lev(a,b){
    a=a||''; b=b||'';
    if(a===b) return 0;
    const al=a.length, bl=b.length;
    if(!al) return bl;
    if(!bl) return al;
    if(Math.abs(al-bl) > 8) return 99;
    let prev = new Array(bl+1);
    for(let j=0;j<=bl;j++) prev[j]=j;
    for(let i=1;i<=al;i++){
        const cur=[i];
        for(let j=1;j<=bl;j++){
            const cost = a[i-1]===b[j-1] ? 0 : 1;
            cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
        }
        prev=cur;
    }
    return prev[bl];
}

function mu_termScore(hay, term){
    if(!term) return 0;
    if(hay.includes(term)) return term.length>=4 ? 4 : 3;
    const words = hay.split(/\s+/);
    let best = 0;
    for(const w of words){
        if(!w) continue;
        if(w.length>=3 && (w.startsWith(term) || term.startsWith(w))){ best=Math.max(best,2); continue; }
        const tol = term.length<=4 ? 1 : (term.length<=7 ? 2 : 3);
        const dist = mu_lev(w, term);
        if(dist<=tol) best = Math.max(best, 2 - dist*0.4);
    }
    return best;
}

function mu_fieldScore(text, terms, weight){
    const hay = mu_norm(text||'');
    if(!hay) return 0;
    let s=0;
    terms.forEach(term=>{ s += mu_termScore(hay, term); });
    return s*weight;
}

function mu_parseQuery(raw){
    const tokens = String(raw||'').trim().split(/\s+/).filter(Boolean);
    const filters=[]; const textTerms=[];
    tokens.forEach(tok=>{
        let m;
        if((m=tok.match(/^tag:(.+)$/i))) filters.push({type:'tag', val:mu_norm(m[1])});
        else if((m=tok.match(/^folder:(.+)$/i))) filters.push({type:'folder', val:mu_norm(m[1])});
        else if((m=tok.match(/^is:(pinned|favorite|fav|locked)$/i))) filters.push({type:'is', val:(m[1].toLowerCase()==='fav'?'favorite':m[1].toLowerCase())});
        else textTerms.push(mu_norm(tok));
    });
    return {filters, textTerms};
}

function mu_matchesFilters(item, filters){
    return filters.every(f=>{
        if(f.type==='tag') return (item.tags||[]).some(t=>mu_norm(t).includes(f.val));
        if(f.type==='folder') return mu_norm(item.folder||'').includes(f.val);
        if(f.type==='is'){
            if(f.val==='pinned') return !!item.pinned;
            if(f.val==='favorite') return !!item.favorite;
            if(f.val==='locked') return !!isNoteLocked(item);
        }
        return true;
    });
}

function mu_scoreItem(item, textTerms){
    if(!textTerms.length) return 1;
    let score=0;
    score += mu_fieldScore(item.name, textTerms, 6);
    score += mu_fieldScore((item.tags||[]).join(' '), textTerms, 4);
    score += mu_fieldScore(item.folder, textTerms, 2);
    if(!isNoteLocked(item)) score += mu_fieldScore(item.text||item.html||'', textTerms, 1);
    return score;
}

function mu_buildFuzzyRegexSource(term){
    term = String(term||'').trim(); if(!term) return '';
    const map = { 'ی':'[یيى]','ي':'[یيى]','ى':'[یيى]','ک':'[کك]','ك':'[کك]','ه':'[هة]','ة':'[هة]' };
    let out='';
    for(const ch of term){
        if(/\s/.test(ch)){ out += '\\s+'; continue; }
        const esc = ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        out += map[ch] || esc;
    }
    return out;
}

function mu_highlightInNode(root, terms){
    if(!root || !terms || !terms.length) return null;
    root.querySelectorAll('mark.markhin-hit').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
    root.normalize();
    const parts = terms.map(mu_buildFuzzyRegexSource).filter(Boolean);
    if(!parts.length) return null;
    let regex;
    try{ regex = new RegExp('('+parts.join('|')+')','gi'); }catch(e){ return null; }
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
    let firstMark=null;
    nodes.forEach(node=>{
        const text = node.nodeValue;
        regex.lastIndex=0;
        if(!regex.test(text)) return;
        regex.lastIndex=0;
        const frag = document.createDocumentFragment();
        let last=0, m;
        while((m=regex.exec(text))){
            if(m.index>last) frag.appendChild(document.createTextNode(text.slice(last,m.index)));
            const mark=document.createElement('mark'); mark.className='markhin-hit'; mark.textContent=m[0];
            frag.appendChild(mark);
            if(!firstMark) firstMark=mark;
            last=m.index+m[0].length;
            if(m.index===regex.lastIndex) regex.lastIndex++;
        }
        if(last<text.length) frag.appendChild(document.createTextNode(text.slice(last)));
        node.parentNode.replaceChild(frag,node);
    });
    return firstMark;
}

function mu_highlightPlain(text, terms){
    let safe = escapeHtml(text||'');
    if(!terms || !terms.length) return safe;
    const parts = terms.map(mu_buildFuzzyRegexSource).filter(Boolean);
    if(!parts.length) return safe;
    try{ const re=new RegExp('('+parts.join('|')+')','gi'); safe = safe.replace(re,'<mark class="markhin-hit">$1</mark>'); }catch(e){}
    return safe;
}

function mu_queryTerms(raw){
    return String(raw||'').trim().split(/\s+/).filter(t=>t && !/^(tag|folder|is):/i.test(t)).map(mu_norm);
}

/* ---------- force-open a note (respects password, never toggles closed) ---------- */
window.mu_forceOpenNote = mu_forceOpenNote;
async function mu_forceOpenNote(id){
    const item = categories.find(c=>c.id===id);
    if(!item) return false;
    // Search used to be able to open a Time Capsule note before its unlock
    // time, bypassing the lock entirely. Enforce it here too.
    if(item.unlockAt && Date.now() < Number(item.unlockAt)){
        const left = Math.ceil((Number(item.unlockAt)-Date.now())/60000);
        showToast(currentLang==='fa'?`⏳ این Note هنوز قفل زمانی است. ${left} دقیقه مانده.`:`⏳ Time Capsule locked. ${left} minutes left.`);
        return false;
    }
    if(item.unlockAt && Date.now() >= Number(item.unlockAt)){ item.unlockAt=''; saveToLocalStorage(); }
    if(isNoteLocked(item)){
        const pass = await promptNotePassword(item);
        if(pass===null) return false;
        item.isDecoy = !(await unlockNote(item, pass.trim()));
    } else {
        item.isDecoy = false;
    }
    activeOpenId = id;
    renderApp(id);
    return !item.isDecoy;
}

/* ---------- FINAL search override: fuzzy ranking + operators ---------- */
window.getVisibleCategories = function(){
    categories.forEach(c=>{ if(!Array.isArray(c.tags)) c.tags=[]; });
    let visible;
    if(currentFolder==='__FAVORITES__') visible = categories.filter(c=>!!c.favorite);
    else visible = (currentFolder===DEFAULT_FOLDER) ? categories.slice() : categories.filter(c=>c.folder===currentFolder || String(c.folder||'').startsWith(currentFolder+'/'));
    if(typeof isArchived==='function') visible = visible.filter(c=>!isArchived(c));

    const raw = (document.getElementById('searchInput')||{}).value || '';
    const {filters, textTerms} = mu_parseQuery(raw);
    if(filters.length) visible = visible.filter(item=>mu_matchesFilters(item, filters));
    if(!textTerms.length){ categories.forEach(c=>{ c.__mScore=0; }); return visible; }

    const scored = visible.map(item=>({item, score: mu_scoreItem(item, textTerms)}));
    scored.forEach(x=>{ x.item.__mScore = x.score; });
    return scored.filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.item);
};

/* ---------------------------------------------------------------
   Scroll black-flash fix — companion to the body.mu-scrolling CSS
   rule near the top of the stylesheet. Toggles that class on <body>
   for the duration of any scroll and clears it ~150ms after
   scrolling actually stops, which pauses/un-blurs the heavy themed
   background layers for that window instead of repainting them on
   every scroll frame. A native 'scroll' event fires the same way
   whether the page moved because the person swiped OR because the
   drag-reorder code below called window.scrollBy() during auto-
   scroll, so this one listener covers both cases with no extra
   wiring needed on the drag code's side. rAF-throttled so it's at
   most one class toggle per frame, never per raw scroll event
   (which can fire many times per frame on some devices/browsers).
   --------------------------------------------------------------- */
(function(){
    let scrollEndTimer = null;
    let ticking = false;
    function onScrollFrame(){
        ticking = false;
        document.body.classList.add('mu-scrolling');
        clearTimeout(scrollEndTimer);
        scrollEndTimer = setTimeout(() => { document.body.classList.remove('mu-scrolling'); }, 150);
    }
    window.addEventListener('scroll', function(){
        if(ticking) return;
        ticking = true;
        requestAnimationFrame(onScrollFrame);
    }, {passive:true});
})();

/* ---------------------------------------------------------------
   Rubber-band bounce fix. The overscroll-behavior-y/-x:none rules near the
   top of the stylesheet stops the bounce-and-reveal-html's-background
   flash on browsers that honor overscroll-behavior for the document's
   own root scroller — but Telegram's iOS in-app browser is a WKWebView
   that, on a lot of iOS versions, simply doesn't apply it there (it
   still works fine for scrollable divs, just not the page itself).
   Without that, flinging the page hard enough to hit the top or
   bottom edge still bounces past it for an instant, during which
   what's actually on screen is <html>'s own background (near-black)
   peeking out from behind the page — which reads exactly as "a black
   flash that shows up and cuts off", especially on a fast top-of-page
   fling. This only ever intervenes for a single-finger drag that
   would push scroll position past 0 or past the document's max, and
   it explicitly steps aside for anything with its own genuine inner
   scroll area (modals, the horizontal toolbar rows, etc.) plus the
   note drag-reorder flow (which already drives scrolling deliberately
   via window.scrollBy) — every ordinary scroll, including inside
   those areas, is completely unaffected.
   --------------------------------------------------------------- */
(function(){
    let startY = 0;
    document.addEventListener('touchstart', function(e){
        if(e.touches.length !== 1) return;
        startY = e.touches[0].clientY;
    }, {passive:true});
    document.addEventListener('touchmove', function(e){
        if(e.touches.length !== 1) return;
        if(document.body.classList.contains('markhin-dragging-active')) return;
        let node = e.target;
        while(node && node !== document.body){
            if(node.nodeType === 1){
                const cs = getComputedStyle(node);
                const canScrollY = (cs.overflowY === 'auto' || cs.overflowY === 'scroll') && node.scrollHeight > node.clientHeight;
                const canScrollX = (cs.overflowX === 'auto' || cs.overflowX === 'scroll') && node.scrollWidth > node.clientWidth;
                if(canScrollY || canScrollX) return;
            }
            node = node.parentNode;
        }
        const dy = e.touches[0].clientY - startY;
        const doc = document.documentElement;
        const atTop = window.scrollY <= 0;
        const atBottom = Math.ceil(window.scrollY + window.innerHeight) >= doc.scrollHeight;
        if((atTop && dy > 0) || (atBottom && dy < 0)) e.preventDefault();
    }, {passive:false});
})();

/* ---------------------------------------------------------------
   Reordering notes/folders: holding a finger down on a note or folder
   (instead of the old press-and-hold drag) pops up a small floating
   menu with ◀ ▶ buttons next to it — tap one to move that item one
   spot over. Nothing can be moved by an accidental drag anymore.
   moveNoteOrder() and moveFolderOrder() below do the actual reordering
   and persistence; the long-press-to-open-menu behavior is wired up
   further down, right after these two.
   --------------------------------------------------------------- */
window.moveNoteOrder = function(id, dir){
    const rawQuery = (document.getElementById('searchInput')||{}).value || '';
    if(rawQuery.trim()) return; // ordering only applies to the plain, unfiltered list
    const ordered = [...getVisibleCategories()].sort((a,b)=>(Number(b.pinned)-Number(a.pinned))||(Number(b.favorite)-Number(a.favorite))||((Number(a.order)||0)-(Number(b.order)||0)));
    const idx = ordered.findIndex(x=>x.id===id);
    const swapIdx = idx + dir;
    if(idx===-1 || swapIdx<0 || swapIdx>=ordered.length) return;
    const tmp = ordered[idx];
    ordered[idx] = ordered[swapIdx];
    ordered[swapIdx] = tmp;
    ordered.forEach((it,i)=>{ it.order = i; }); // ensureItem() isn't reachable from here (it's scoped to a different IIFE) — order is the only field this needs to touch anyway
    saveToLocalStorage();
    renderButtons();
};

window.moveFolderOrder = function(name, dir){
    const idx = folders.indexOf(name);
    const swapIdx = idx + dir;
    if(idx<=0 || swapIdx<=0 || swapIdx>=folders.length) return; // root folder (index 0) stays pinned first
    const tmp = folders[idx];
    folders[idx] = folders[swapIdx];
    folders[swapIdx] = tmp;
    saveFoldersToLocalStorage();
    renderFolders();
};

/* Press-and-hold -> floating move menu. Pointer Events cover touch, mouse
   and pen in one code path. A short hold is required before the menu opens,
   so an ordinary tap-to-open or a finger-scroll is never mistaken for it. */
(function(){
    const HOLD_MS = 350;
    const MOVE_CANCEL_PX = 10;
    let menuEl = null;
    let suppressClickUntil = 0;

    function closeMenu(){
        if(menuEl){ menuEl.remove(); menuEl = null; }
        document.removeEventListener('pointerdown', onOutsidePointerDown, true);
        window.removeEventListener('scroll', closeMenu, true);
    }
    function onOutsidePointerDown(e){
        if(menuEl && !menuEl.contains(e.target)) closeMenu();
    }

    function openMenu(wrap, onMoveRight, onMoveLeft, axis){
        if(!wrap) return;
        closeMenu();
        const r = wrap.getBoundingClientRect();
        const menu = document.createElement('div');
        menu.className = 'markhin-move-menu' + (axis === 'horizontal' ? ' markhin-move-menu-horizontal' : '');
        document.body.appendChild(menu); // measure after mount so offsetWidth is real
        const above = r.top > 70;
        // Folders sit in a horizontal row, so their move menu uses ◀ ▶ (left/right)
        // instead of the ▲ ▼ (up/down) used for the vertical notes list. The page
        // is RTL, so the flex row's first/lowest-index item renders on the right —
        // moving toward index 0 (the dir:-1 button) visually moves an item right,
        // and moving toward the end (dir:+1) visually moves it left.
        const isHorizontal = axis === 'horizontal';
        const glyphRight = isHorizontal ? '▶' : '▲';
        const glyphLeft = isHorizontal ? '◀' : '▼';
        const labelRightFa = isHorizontal ? 'جابجایی به راست' : 'جابجایی به بالا';
        const labelLeftFa = isHorizontal ? 'جابجایی به چپ' : 'جابجایی به پایین';
        const labelRightEn = isHorizontal ? 'Move right' : 'Move up';
        const labelLeftEn = isHorizontal ? 'Move left' : 'Move down';

        const bUp = document.createElement('button');
        bUp.type='button'; bUp.className='markhin-move-menu-btn'; bUp.textContent=glyphRight;
        bUp.title = currentLang==='fa' ? labelRightFa : labelRightEn;
        bUp.onclick = (e)=>{ e.stopPropagation(); onMoveRight(); closeMenu(); };

        const bDown = document.createElement('button');
        bDown.type='button'; bDown.className='markhin-move-menu-btn'; bDown.textContent=glyphLeft;
        bDown.title = currentLang==='fa' ? labelLeftFa : labelLeftEn;
        bDown.onclick = (e)=>{ e.stopPropagation(); onMoveLeft(); closeMenu(); };

        // In the horizontal (folder) case the two buttons should read in the same
        // left-to-right visual order as the arrows themselves (◀ then ▶), so swap
        // their DOM order there; the vertical (note) case keeps ▲ above ▼ as before.
        if(isHorizontal){ menu.appendChild(bDown); menu.appendChild(bUp); }
        else { menu.appendChild(bUp); menu.appendChild(bDown); }
        const mw = menu.offsetWidth || (isHorizontal ? 88 : 44);
        const mh = menu.offsetHeight || (isHorizontal ? 44 : 88);
        menu.style.left = Math.max(8, Math.min(window.innerWidth - mw - 8, r.left + r.width/2 - mw/2)) + 'px';
        menu.style.top = (above ? (r.top - mh - 10) : (r.bottom + 6)) + 'px';
        menuEl = menu;

        setTimeout(()=>{ document.addEventListener('pointerdown', onOutsidePointerDown, true); }, 0);
        window.addEventListener('scroll', closeMenu, true);
    }

    function makeLongPress(opts){
        let holdTimer = null;
        let heldEl = null;   // the pressed element, kept only to position the menu
        let heldKey = null;  // its stable id/name, captured immediately — never re-read later
        let startX = 0, startY = 0;

        document.addEventListener('pointerdown', function(e){
            const w = e.target.closest('#'+opts.containerId+' '+opts.itemSelector);
            if(!w) return;
            if(opts.isBlocked && opts.isBlocked()) return;
            if(opts.isBlockedTarget && e.target.closest(opts.isBlockedTarget)) return;
            if(opts.isItemBlocked && opts.isItemBlocked(w)) return;
            if(opts.respectSearch){
                const rawQuery = (document.getElementById('searchInput')||{}).value || '';
                if(rawQuery.trim()) return; // reordering only applies to the plain, unfiltered list
            }
            const key = opts.getKey(w);
            if(!key) return;
            heldEl = w; heldKey = key;
            startX = e.clientX; startY = e.clientY;
            clearTimeout(holdTimer);
            holdTimer = setTimeout(()=>{
                if(!heldEl || !heldKey) return;
                if(!document.body.contains(heldEl)) { heldEl = null; heldKey = null; return; } // list re-rendered mid-hold
                const el = heldEl, key = heldKey;
                suppressClickUntil = Date.now() + 400;
                if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(_){} }
                openMenu(el, ()=>opts.onMove(key, -1), ()=>opts.onMove(key, 1), opts.axis);
                heldEl = null; heldKey = null;
            }, HOLD_MS);
        }, {passive:true});

        document.addEventListener('pointermove', function(e){
            if(!heldEl) return;
            if(Math.abs(e.clientX-startX) > MOVE_CANCEL_PX || Math.abs(e.clientY-startY) > MOVE_CANCEL_PX){
                clearTimeout(holdTimer); heldEl = null; heldKey = null;
            }
        }, {passive:true});

        document.addEventListener('pointerup', function(){ clearTimeout(holdTimer); heldEl = null; heldKey = null; });
        document.addEventListener('pointercancel', function(){ clearTimeout(holdTimer); heldEl = null; heldKey = null; });
        window.addEventListener('blur', function(){ clearTimeout(holdTimer); heldEl = null; heldKey = null; });

        // Swallow the click that would otherwise follow opening the menu, so
        // the long-press doesn't also open/toggle the note or folder.
        document.addEventListener('click', function(e){
            if(Date.now() < suppressClickUntil && e.target.closest('#'+opts.containerId+' '+opts.itemSelector)){
                e.stopPropagation();
                e.preventDefault();
            }
        }, true);
    }

    // Notes.
    makeLongPress({
        containerId: 'buttonsContainer',
        itemSelector: '.note-btn-wrap',
        respectSearch: true,
        isBlocked: ()=> window.MarkhinNoteDeleteMode, // delete mode already has its own tap target
        isBlockedTarget: '.note-del-x',
        getKey: (w)=> w.dataset.id,
        onMove: (id, dir) => moveNoteOrder(id, dir)
    });

    // Folders. The "All/همه" root folder always stays pinned first and isn't
    // reorderable, matching the fact that it can't be deleted either. Folders
    // sit in a horizontal row, so their move menu uses ◀ ▶ instead of ▲ ▼.
    makeLongPress({
        containerId: 'foldersContainer',
        itemSelector: '.folder-wrapper',
        respectSearch: false,
        axis: 'horizontal',
        isBlocked: ()=> typeof isDeleteFolderMode !== 'undefined' && isDeleteFolderMode,
        isBlockedTarget: '.close-folder-btn',
        isItemBlocked: (w)=> w.dataset.folder === DEFAULT_FOLDER,
        getKey: (w)=> w.dataset.folder,
        onMove: (name, dir) => moveFolderOrder(name, dir)
    });
})();

/* Cleans an API key value before it's stored or used in a request header.

   ISO-8859-1 byte values, but pasting a key (especially from a Persian/RTL
   keyboard, a messaging app, or certain clipboard managers) can silently
   carry along invisible zero-width/bidi-control characters or an exotic
   unicode space that a text input shows as nothing at all — the field looks
   correct, yet the very next request throws. A real API key is always plain
   printable ASCII, so stripping anything else here (and re-using this before
   every header build) turns a hard crash into a key that simply works, with
   no visible difference to a key that had no such characters to begin with. */

    const original = String(raw == null ? '' : raw);
    let v = original;
    v = v.replace(/[\u200B-\u200F\u202A-\u202E\u2060\uFEFF]/g, '');
    v = v.replace(/[\u00A0\u2000-\u200A\u2028\u2029\u3000]/g, ' ');

// Normalizes whatever the person pasted into Base URL: trims whitespace,

// from a provider's docs) — without this, fetch() throws an opaque
// "Failed to fetch" with no hint about why.
function mu_normalizeBaseUrl(raw){
    let u = String(raw == null ? '' : raw).trim();

    const pathLower = pathNoSlash.toLowerCase();

// Shared fetch for every OpenAI-compatible provider (built-in OpenAI,
// OpenRouter, and any custom one). Its one extra job on top of a plain
// fetch: some OpenAI-compatible servers — notably newer reasoning-style
// endpoints, and some third-party proxies — reject the classic
// "max_tokens" field with a 400 and want "max_completion_tokens" instead.
// Rather than making the user guess which one their provider wants, try
// the normal field first and silently retry once with the other name only
// if the error is actually about that field.
async function mu_fetchOpenAiCompatible(url, headers, body, signal){
    let res = await fetch(url, { method:'POST', headers, body: JSON.stringify(body), signal });
    if(!res.ok){
        const tx = await res.text().catch(()=> '');
        if(res.status === 400 && body.max_tokens != null && /max[_ ]tokens/i.test(tx)){
            const retryBody = Object.assign({}, body);
            delete retryBody.max_tokens;
            retryBody.max_completion_tokens = body.max_tokens;
            const retryRes = await fetch(url, { method:'POST', headers, body: JSON.stringify(retryBody), signal });
            if(retryRes.ok) return retryRes;
            const tx2 = await retryRes.text().catch(()=> '');
            throw new Error(mu_extractApiErrorMessage(retryRes.status, tx2 || tx));
        }
        throw new Error(mu_extractApiErrorMessage(res.status, tx));
    }
    return res;
}

// Pulls the reply text out of an OpenAI-style response body, tolerating
// the handful of shape variations real-world "OpenAI-compatible" servers
// actually send (some put content as an array of parts instead of a plain
// string; some non-chat/legacy-completion servers use choices[0].text;
// a few minimal local servers skip the choices[] wrapper entirely).
function mu_extractOpenAiText(data){
    const choice = data && data.choices && data.choices[0];
    const msg = (choice && choice.message) || {};
    let text = msg.content;
    if(Array.isArray(text)) text = text.map(part => (part && (part.text || part.content)) || '').join('');
    if(typeof text !== 'string' || !text){
        text = (choice && typeof choice.text === 'string' && choice.text)
            || (data && typeof data.output_text === 'string' && data.output_text)
            || (data && data.message && typeof data.message.content === 'string' && data.message.content)
            || (data && typeof data.response === 'string' && data.response)
            || '';
    }
    return String(text || '');
}

const MarkhinAI = window.MarkhinAI = {
    KEY:'markhin_ai_settings_v2',
    OLD_KEY:'markhin_ai_settings_v1',

    _migrateOld(){
        // Bring forward anyone's existing single-provider setup from the old
        // flat format so nobody's saved key silently disappears.
        try{
            const old = safeParseJSON(localStorage.getItem(this.OLD_KEY)||'null', null);
            if(!old || !old.apiKey) return null;
            const s = { activeId:'openai', builtins:{}, customProviders:[] };
            if(old.provider === 'anthropic'){
                s.activeId = 'anthropic';
                s.builtins.anthropic = { apiKey:old.apiKey, model:old.model||'', baseUrl:old.baseUrl||'' };
            } else if(old.provider === 'custom'){
                const id = 'm'+Date.now();
                s.customProviders.push({ id, name:'Custom', format:'openai', apiKey:old.apiKey, model:old.model||'', baseUrl:old.baseUrl||'' });
                s.activeId = 'custom:'+id;
            } else {
                s.activeId = 'openai';
                s.builtins.openai = { apiKey:old.apiKey, model:old.model||'', baseUrl:old.baseUrl||'' };
            }
            this.saveSettings(s);
            return s;
        }catch(e){ return null; }
    },

    getSettings(){
        let s = safeParseJSON(localStorage.getItem(this.KEY)||'null', null);
        if(!s) s = this._migrateOld() || { activeId:'openai', builtins:{}, customProviders:[] };
        if(!s.builtins) s.builtins = {};
        if(!Array.isArray(s.customProviders)) s.customProviders = [];
        if(!s.activeId) s.activeId = 'openai';
        return s;
    },
    saveSettings(s){ try{ localStorage.setItem(this.KEY, JSON.stringify(s)); }catch(e){} },
    clear(){ try{ localStorage.removeItem(this.KEY); localStorage.removeItem(this.OLD_KEY); }catch(e){} },

    // Speaking-style ("لحن") preference — deliberately its own tiny
    // localStorage slot rather than a field on `s` above, so it survives
    // (and is unaffected by) switching, adding, or clearing providers.
    STYLE_KEY:'markhin_ai_style_v1',
    getStyle(){
        try{
            const v = localStorage.getItem(this.STYLE_KEY);
            return (v && MU_AI_STYLES[v]) ? v : 'default';
        }catch(e){ return 'default'; }
    },
    setStyle(id){ try{ localStorage.setItem(this.STYLE_KEY, MU_AI_STYLES[id] ? id : 'default'); }catch(e){} },

    listProviders(){
        const s = this.getSettings();
        const list = Object.keys(MU_AI_BUILTINS).map(id=>({ id, name:MU_AI_BUILTINS[id].label, builtin:true }));
        s.customProviders.forEach(p=> list.push({ id:'custom:'+p.id, name:p.name||'Custom', builtin:false }));
        return list;
    },

    // Resolves the currently-active provider into one flat, ready-to-use config.
    getActiveProvider(s){
        s = s || this.getSettings();
        const id = s.activeId || 'openai';
        if(id.indexOf('custom:') === 0){
            const cp = s.customProviders.find(p => 'custom:'+p.id === id);
            if(!cp) return null;
            return { id, name:cp.name, format:cp.format||'openai', baseUrl:(cp.baseUrl||'').trim(), apiKey:mu_sanitizeApiKeyValue(cp.apiKey||'').value, model:cp.model||'' };
        }
        const preset = MU_AI_BUILTINS[id] || MU_AI_BUILTINS.openai;
        const stored = s.builtins[id] || {};
        return {
            id,
            name: preset.label,
            format: preset.format,
            baseUrl: (stored.baseUrl||'').trim() || preset.defaultBaseUrl,
            apiKey: mu_sanitizeApiKeyValue(stored.apiKey||'').value,
            model: stored.model || preset.defaultModel || ''
        };
    },

    getProviderFields(id){
        // Used by the settings UI to populate the form for whichever
        // provider the person picks from the dropdown.
        const s = this.getSettings();
        if(id.indexOf('custom:') === 0){
            const cp = s.customProviders.find(p => 'custom:'+p.id === id);
            return cp ? { name:cp.name||'', format:cp.format||'openai', apiKey:cp.apiKey||'', model:cp.model||'', baseUrl:cp.baseUrl||'' } : null;
        }
        const preset = MU_AI_BUILTINS[id] || MU_AI_BUILTINS.openai;
        const stored = s.builtins[id] || {};
        return { name:preset.label, format:preset.format, apiKey:stored.apiKey||'', model:stored.model||'', baseUrl:stored.baseUrl||'' };
    },

    // Saves the settings-form fields back for whichever provider is
    // currently selected (a builtin preset or one specific custom entry).
    saveProviderFields(id, fields){
        const s = this.getSettings();
        if(id.indexOf('custom:') === 0){
            const cid = id.slice(7);
            const cp = s.customProviders.find(p => p.id === cid);
            if(cp){
                cp.name = fields.name || cp.name;
                cp.format = fields.format || cp.format || 'openai';
                cp.apiKey = fields.apiKey || '';
                cp.model = fields.model || '';
                cp.baseUrl = fields.baseUrl || '';
            }
        } else {
            s.builtins[id] = { apiKey:fields.apiKey||'', model:fields.model||'', baseUrl:fields.baseUrl||'' };
        }
        s.activeId = id;
        this.saveSettings(s);
    },

    // Adds a brand-new custom provider (any name / any Base URL / any key)
    // and makes it the active one. This is the "add whatever I want" path.
    addCustomProvider(fields){
        const s = this.getSettings();
        const id = 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
        s.customProviders.push({
            id,
            name: (fields.name||'').trim() || ('Custom '+(s.customProviders.length+1)),
            format: fields.format === 'anthropic' ? 'anthropic' : 'openai',
            apiKey: fields.apiKey||'',
            model: fields.model||'',
            baseUrl: (fields.baseUrl||'').trim()
        });
        s.activeId = 'custom:'+id;
        this.saveSettings(s);
        return 'custom:'+id;
    },

    removeCustomProvider(id){
        const s = this.getSettings();
        const cid = id.slice(7);
        s.customProviders = s.customProviders.filter(p => p.id !== cid);
        if(s.activeId === id) s.activeId = 'openai';
        this.saveSettings(s);
    },

    isConfigured(){ const p=this.getActiveProvider(); return !!(p && p.apiKey); },

    /* chat() supports an optional agentic tool-calling mode used by the
       MARKHIN AI chat widget to actually operate on the user's notes
       (search/create/rename/move/tag/pin/favorite/archive/merge/delete),
       on top of its original plain Q&A use (translate/summarize/suggest
       tags — none of which pass opts.tools and so are completely
       unaffected).

       Contract:
       - Call with opts.tools omitted/empty → returns a plain string, exactly
         as before. Every pre-existing caller keeps working unchanged.
       - Call with opts.tools = [{name, description, parameters}] (JSON-Schema
         parameters) → always returns { text, toolCalls } where toolCalls is
         [{id, name, input}] (empty array if the model didn't call anything).

       The `messages` array accepts two extra generic turn shapes on top of
       the normal {role:'system'|'user'|'assistant', content:string}, so the
       calling code never has to know which provider format is in use:
       - { role:'assistant', content, toolCalls:[{id,name,input}] } — an
         assistant turn that invoked tools.
       - { role:'tool_result', toolCallId, name, content } — the result of
         running one of those tool calls. Consecutive tool_result entries are
         grouped as needed per-provider (Anthropic wants them combined into a
         single following user turn; OpenAI wants one 'tool' message each). */
    async chat(messages, opts){
        opts = opts||{};
        const p = this.getActiveProvider();
        const fa = currentLang==='fa';
        if(!p) throw new Error(fa ? 'ارائه‌دهنده انتخاب‌شده پیدا نشد.' : 'Selected provider was not found.');
        if(!p.apiKey) throw new Error(fa ? 'کلید API تنظیم نشده است.' : 'API key is not set.');
        const maxTokens = opts.maxTokens || 500;
        const tools = Array.isArray(opts.tools) && opts.tools.length ? opts.tools : null;
        // opts.onDelta(textSoFar) is an optional live-progress callback used by
        // the chat widget to render the reply word-by-word as it streams in,
        // instead of the whole message popping in at once at the end. Callers
        // that don't pass it (translate/summarize/suggest-tags/etc.) get the
        // exact same one-shot behavior as before — nothing changes for them.
        const onDelta = typeof opts.onDelta === 'function' ? opts.onDelta : null;

        // Without a hard cap, a request that never settles — a dropped
        // connection, or (inside Telegram's in-app browser) the WebView
        // getting backgrounded mid-request — leaves the caller's await
        // suspended forever, which is exactly what left the chat's send
        // button/"typing…" indicator stuck permanently disabled. Aborting
        // after a timeout guarantees this call always resolves or rejects.
        const mAiAbortController = new AbortController();
        // 120s: covers up to 3 attempts (with backoff) when a rate-limit/
        // overload response triggers a retry, not just a single request —
        // and gives slower self-hosted/local models (a custom provider
        // pointed at a CPU-only Ollama server, for instance) enough room
        // to actually finish instead of getting cut off mid-generation.
        const mAiTimeoutId = setTimeout(() => mAiAbortController.abort(), 120000);

        const attempt = async () => {
            const canStream = !!(onDelta && typeof ReadableStream !== 'undefined' && typeof TextDecoder !== 'undefined');
            if(canStream){
                try {
                    return await this._chatRequestStream(messages, opts, p, maxTokens, tools, mAiAbortController.signal, onDelta);
                } catch(streamErr){
                    // Never let an abort (timeout / user cleared the chat) fall
                    // through to a second, now-pointless request.
                    if(streamErr && streamErr.name === 'AbortError') throw streamErr;
                    // Some custom base URLs (older proxies, certain local
                    // servers) don't support Server-Sent Events at all. Rather
                    // than failing the whole reply, fall back to the plain
                    // one-shot request so the user still gets an answer —
                    // just without the live typing effect this once.
                    return await this._chatRequest(messages, opts, p, maxTokens, tools, mAiAbortController.signal);
                }
            }
            return await this._chatRequest(messages, opts, p, maxTokens, tools, mAiAbortController.signal);
        };

        try {
            let lastErr = null;
            // Up to 2 silent retries with growing backoff, but only for
            // failures that are actually worth retrying: a genuine
            // transient network failure (dropped connection — shaky mobile
            // connections inside in-app WebViews drop the odd request), or
            // an HTTP-level rate-limit/overload response (429 "too many
            // requests", 500/502/503/504, or Anthropic's 529 "overloaded")
            // — none of these mean the request itself was wrong, just that
            // the moment was bad. Anything else (401 bad key, 400 bad
            // request, etc.) fails immediately since retrying won't help.
            for(let retryNum = 0; retryNum < 3; retryNum++){
                try {
                    return await attempt();
                } catch(err){
                    lastErr = err;
                    if(err && err.name === 'AbortError') throw err;
                    const msg = String((err && err.message) || err || '');
                    const looksTransient = /Failed to fetch|NetworkError|network error|Load failed|ERR_/i.test(msg);
                    const looksOverloaded = /(^|\D)(408|429|500|502|503|504|529)(\D|$)/.test(msg);
                    if((looksTransient || looksOverloaded) && retryNum < 2){
                        await new Promise(r => setTimeout(r, 500 * Math.pow(2, retryNum)));
                        continue;
                    }
                    throw err;
                }
            }
            throw lastErr;
        } catch(err){
            if(err && err.name === 'AbortError'){
                throw new Error(fa ? 'درخواست بیش از حد طول کشید و لغو شد. دوباره امتحان کن.' : 'The request took too long and was cancelled. Please try again.');
            }
            // Defense in depth: getActiveProvider() already strips characters
            // that break Headers validation, but if one still slipped through
            // (or a provider's own baseUrl/model has an issue), surface a
            // plain-language explanation instead of the raw browser error.
            const rawMsg = String((err && err.message) || err || '');
            if(/non ISO-8859-1|Failed to read the 'headers' property/i.test(rawMsg)){
                throw new Error(fa
                    ? 'کلید API یا یکی از تنظیمات این ارائه‌دهنده شامل کاراکتر نامعتبر است. کلید را دوباره از منبع اصلی کپی و در تنظیمات هوش مصنوعی دوباره وارد/ذخیره کن.'
                    : 'This provider\'s API key (or another setting) contains an invalid character. Copy the key again from its source and re-enter/save it in AI Settings.');
            }
            // A raw "Failed to fetch"/"NetworkError"/"Load failed" almost
            // always means one of: a typo'd Base URL, no internet, or —
            // most commonly with a freshly-added custom provider — the
            // provider's server doesn't send the CORS headers needed to
            // let a browser call it directly at all (this can't be worked
            // around client-side; the provider itself has to allow it).
            // Surfacing that distinction beats leaving the user staring at
            // an unexplained browser-internal string.
            if(/Failed to fetch|NetworkError|Load failed|ERR_/i.test(rawMsg)){
                throw new Error(fa
                    ? 'اتصال به این ارائه‌دهنده برقرار نشد. Base URL را بررسی کن (باید دقیقاً همان چیزی باشد که سرویس مشخص کرده)، اتصال اینترنت را چک کن، و اگر سرور شخصی/کمتر شناخته‌شده است مطمئن شو که اجازه درخواست مستقیم از مرورگر (CORS) را می‌دهد — این محدودیت را برنامه نمی‌تواند دور بزند، فقط خود سرویس می‌تواند فعالش کند.'
                    : "Couldn't connect to this provider. Check the Base URL (it must match exactly what the service documents), check your internet connection, and if this is a personal/less-common server, make sure it allows direct browser requests (CORS) — that restriction can't be worked around from here, only the service itself can enable it.");
            }
            throw err;
        } finally {
            clearTimeout(mAiTimeoutId);
        }
    },

    async _chatRequest(messages, opts, p, maxTokens, tools, signal){
        const fa = currentLang==='fa';
        if(p.format === 'anthropic'){
            const sysMsg = messages.find(m=>m.role==='system');
            const rest = messages.filter(m=>m.role!=='system');
            const aMessages = [];
            rest.forEach(m=>{
                if(m.role === 'tool_result'){
                    const block = { type:'tool_result', tool_use_id:m.toolCallId, content:String(m.content==null?'':m.content) };
                    const last = aMessages[aMessages.length-1];
                    if(last && last.role === 'user' && last.__toolResults) last.content.push(block);
                    else aMessages.push({ role:'user', content:[block], __toolResults:true });
                    return;
                }
                if(m.role === 'assistant' && Array.isArray(m.toolCalls) && m.toolCalls.length){
                    const blocks = [];
                    if(m.content) blocks.push({ type:'text', text:m.content });
                    m.toolCalls.forEach(tc=>blocks.push({ type:'tool_use', id:tc.id, name:tc.name, input:tc.input||{} }));
                    aMessages.push({ role:'assistant', content:blocks });
                    return;
                }
                aMessages.push({ role: m.role==='assistant'?'assistant':'user', content:m.content });
            });
            aMessages.forEach(m=>{ delete m.__toolResults; });
            if(!p.model){
                throw new Error(fa
                    ? 'برای این ارائه‌دهنده باید نام دقیق مدل را در تنظیمات هوش مصنوعی وارد کنی.'
                    : 'Enter the exact model name for this provider in AI Settings.');
            }
            const body = {
                model: p.model,
                max_tokens: maxTokens,
                system: sysMsg ? sysMsg.content : undefined,
                messages: aMessages
            };
            if(tools){
                // The Markhin note-management tools, plus Anthropic's own
                // server-side web_search tool (real Anthropic endpoints
                // only — a custom Anthropic-style proxy that doesn't
                // support it should just ignore the extra tool entry).
                // The model decides on its own when a question needs
                // current info; the actual search and fetch happen on
                // Anthropic's servers, so there's no tool_result
                // round-trip for us to execute here — a
                // web_search_tool_result block just shows up alongside the
                // final text like any other content block.
                body.tools = tools.map(t=>({ name:t.name, description:t.description, input_schema:t.parameters }));
                if(p.id === 'anthropic') body.tools = body.tools.concat([{ type:'web_search_20250305', name:'web_search', max_uses:5 }]);
            }
            const url = mu_joinApiUrl(p.baseUrl || 'https://api.anthropic.com', '/v1/messages');
            const res = await fetch(url, {
                method:'POST',
                headers:{
                    'Content-Type':'application/json',
                    'x-api-key': p.apiKey,
                    'anthropic-version':'2023-06-01',
                    'anthropic-dangerous-direct-browser-access':'true'
                },
                body: JSON.stringify(body),
                signal
            });
            if(!res.ok){ const tx=await res.text().catch(()=> ''); throw new Error('Anthropic ' + mu_extractApiErrorMessage(res.status, tx)); }
            let data;
            try{ data = await res.json(); }
            catch(e){ throw new Error(fa ? 'پاسخ Anthropic معتبر (JSON) نبود — Base URL را بررسی کن.' : 'Anthropic\'s response was not valid JSON — check the Base URL.'); }
            const blocks = data.content || [];
            const text = blocks.filter(b=>b.type==='text').map(b=>b.text||'').join('\n').trim();
            if(!tools) return text;
            const toolCalls = blocks.filter(b=>b.type==='tool_use').map(b=>({ id:b.id, name:b.name, input:b.input||{} }));
            return { text, toolCalls };
        }

        // OpenAI-compatible format — covers OpenAI, OpenRouter, and any
        // custom provider the person added (Groq, Together, DeepSeek,
        // local Ollama servers, etc. all speak this same /chat/completions shape).
        if(!p.baseUrl){
            throw new Error(fa ? 'Base URL برای این ارائه‌دهنده الزامی است.' : 'Base URL is required for this provider.');
        }
        // A missing model name used to silently fall back to "gpt-5-mini"
        // even for a custom provider that has never heard of that model
        // (Groq/DeepSeek/Together/a local server all use their own model
        // names) — that guaranteed a "model not found" error on every
        // single request. Surfacing this up front, in plain language, is
        // far more useful than a cryptic 400 from the provider.
        if(!p.model){
            throw new Error(fa
                ? 'برای این ارائه‌دهنده باید نام دقیق مدل را در تنظیمات هوش مصنوعی وارد کنی (مثلاً llama-3.3-70b-versatile، deepseek-chat، یا هر مدلی که آن سرویس ارائه می‌دهد).'
                : 'Enter the exact model name for this provider in AI Settings (e.g. llama-3.3-70b-versatile, deepseek-chat, or whichever model that service offers).');
        }
        const headers = { 'Content-Type':'application/json', 'Authorization':'Bearer '+p.apiKey };
        if(p.id === 'openrouter'){
            // Recommended (not required) by OpenRouter for attribution — harmless to send.
            headers['HTTP-Referer'] = (typeof location!=='undefined' && location.origin) || 'https://localhost';
            headers['X-Title'] = 'Markhin';
        }
        const oMessages = messages.map(m=>{
            if(m.role === 'tool_result') return { role:'tool', tool_call_id:m.toolCallId, content:String(m.content==null?'':m.content) };
            if(m.role === 'assistant' && Array.isArray(m.toolCalls) && m.toolCalls.length){
                return {
                    role:'assistant',
                    content: m.content || null,
                    tool_calls: m.toolCalls.map(tc=>({ id:tc.id, type:'function', function:{ name:tc.name, arguments: JSON.stringify(tc.input||{}) } }))
                };
            }
            return { role: m.role, content: m.content };
        });
        const body = { model: p.model, max_tokens:maxTokens, messages: oMessages };
        if(tools) body.tools = tools.map(t=>({ type:'function', function:{ name:t.name, description:t.description, parameters:t.parameters } }));
        const url = mu_joinApiUrl(p.baseUrl, '/chat/completions');
        const res = await mu_fetchOpenAiCompatible(url, headers, body, signal);
        let data;
        try{ data = await res.json(); }
        catch(e){ throw new Error(fa ? 'پاسخ ارائه‌دهنده معتبر (JSON) نبود — Base URL یا فرمت API را بررسی کن.' : 'The provider\'s response was not valid JSON — check the Base URL or API format.'); }
        const choice = data.choices && data.choices[0];
        const msg = (choice && choice.message) || {};
        const text = mu_extractOpenAiText(data);
        if(!tools) return text;
        const toolCalls = Array.isArray(msg.tool_calls) ? msg.tool_calls.map(tc=>({
            id: tc.id,
            name: tc.function && tc.function.name,
            input: safeParseJSON((tc.function && tc.function.arguments) || '{}', {})
        })) : [];
        return { text, toolCalls };
    },

    // Dispatches a streaming (Server-Sent Events) request to whichever format
    // the active provider speaks, so callers never need to know the
    // difference — same contract as _chatRequest (plain string with no
    // tools, {text, toolCalls} with tools), just filled in incrementally
    // via onDelta(textSoFar) as the reply arrives instead of all at once.
    async _chatRequestStream(messages, opts, p, maxTokens, tools, signal, onDelta){
        if(p.format === 'anthropic') return await this._chatStreamAnthropic(messages, opts, p, maxTokens, tools, signal, onDelta);
        return await this._chatStreamOpenAI(messages, opts, p, maxTokens, tools, signal, onDelta);
    },

    async _chatStreamAnthropic(messages, opts, p, maxTokens, tools, signal, onDelta){
        const sysMsg = messages.find(m=>m.role==='system');
        const rest = messages.filter(m=>m.role!=='system');
        const aMessages = [];
        rest.forEach(m=>{
            if(m.role === 'tool_result'){
                const block = { type:'tool_result', tool_use_id:m.toolCallId, content:String(m.content==null?'':m.content) };
                const last = aMessages[aMessages.length-1];
                if(last && last.role === 'user' && last.__toolResults) last.content.push(block);
                else aMessages.push({ role:'user', content:[block], __toolResults:true });
                return;
            }
            if(m.role === 'assistant' && Array.isArray(m.toolCalls) && m.toolCalls.length){
                const blocks = [];
                if(m.content) blocks.push({ type:'text', text:m.content });
                m.toolCalls.forEach(tc=>blocks.push({ type:'tool_use', id:tc.id, name:tc.name, input:tc.input||{} }));
                aMessages.push({ role:'assistant', content:blocks });
                return;
            }
            aMessages.push({ role: m.role==='assistant'?'assistant':'user', content:m.content });
        });
        aMessages.forEach(m=>{ delete m.__toolResults; });
        const fa = currentLang==='fa';
        if(!p.model){
            throw new Error(fa
                ? 'برای این ارائه‌دهنده باید نام دقیق مدل را در تنظیمات هوش مصنوعی وارد کنی.'
                : 'Enter the exact model name for this provider in AI Settings.');
        }
        const body = {
            model: p.model,
            max_tokens: maxTokens,
            system: sysMsg ? sysMsg.content : undefined,
            messages: aMessages,
            stream: true
        };
        if(tools){
            // Same native web_search addition as the non-streaming path —
            // see the comment there for why it's real-Anthropic-only.
            body.tools = tools.map(t=>({ name:t.name, description:t.description, input_schema:t.parameters }));
            if(p.id === 'anthropic') body.tools = body.tools.concat([{ type:'web_search_20250305', name:'web_search', max_uses:5 }]);
        }
        const url = mu_joinApiUrl(p.baseUrl || 'https://api.anthropic.com', '/v1/messages');
        const res = await fetch(url, {
            method:'POST',
            headers:{
                'Content-Type':'application/json',
                'x-api-key': p.apiKey,
                'anthropic-version':'2023-06-01',
                'anthropic-dangerous-direct-browser-access':'true'
            },
            body: JSON.stringify(body),
            signal
        });
        if(!res.ok){ const tx=await res.text().catch(()=> ''); throw new Error('Anthropic ' + mu_extractApiErrorMessage(res.status, tx)); }
        if(!res.body || !res.body.getReader) throw new Error('stream-unsupported');
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        let textAcc = '';
        let sawAnyEvent = false;
        const blocks = {};
        while(true){
            const { done, value } = await reader.read();
            if(done) break;
            buf += decoder.decode(value, { stream:true });
            let sep;
            while((sep = buf.indexOf('\n\n')) >= 0){
                const chunk = buf.slice(0, sep);
                buf = buf.slice(sep + 2);
                let dataStr = '';
                chunk.split('\n').forEach(line => { if(line.indexOf('data:') === 0) dataStr += line.slice(5).trim(); });
                if(!dataStr) continue;
                let evt;
                try { evt = JSON.parse(dataStr); } catch(e){ continue; }
                sawAnyEvent = true;
                if(evt.type === 'content_block_start' && evt.content_block){
                    // Only 'text' and 'tool_use' blocks matter to us here —
                    // server-side tool blocks (web_search_tool_use,
                    // web_search_tool_result, etc.) are fully resolved by
                    // Anthropic itself, so they're tracked under their own
                    // real type instead of being lumped in with plain text;
                    // that keeps their internal deltas from ever leaking
                    // into the visible streamed reply.
                    const cbType = evt.content_block.type;
                    if(cbType === 'tool_use'){
                        blocks[evt.index] = { type:'tool_use', id:evt.content_block.id, name:evt.content_block.name, json:'' };
                    } else if(cbType === 'text'){
                        blocks[evt.index] = { type:'text', text:'' };
                    } else {
                        blocks[evt.index] = { type: cbType || 'other', text:'', json:'' };
                    }
                } else if(evt.type === 'content_block_delta' && evt.delta){
                    const b = blocks[evt.index];
                    if(!b) continue;
                    if(evt.delta.type === 'text_delta' && b.type === 'text'){
                        b.text += evt.delta.text || '';
                        textAcc += evt.delta.text || '';
                        if(onDelta) onDelta(textAcc);
                    } else if(evt.delta.type === 'input_json_delta'){
                        b.json += evt.delta.partial_json || '';
                    }
                } else if(evt.type === 'error'){
                    throw new Error('Anthropic: ' + ((evt.error && evt.error.message) || 'stream error'));
                }
            }
        }
        // A custom "Anthropic-style" base URL that doesn't actually speak
        // real Anthropic SSE (a non-streaming-capable proxy that still
        // returned 200, for instance) would otherwise silently produce an
        // empty reply with no error at all. If we never managed to parse a
        // single event out of the whole response, treat it as a stream
        // this provider doesn't actually support — the caller (chat())
        // catches this and transparently retries as a plain, non-streamed
        // request instead of showing the user nothing.
        if(!sawAnyEvent) throw new Error('stream-unsupported');
        const text = textAcc.trim();
        if(!tools) return text;
        const toolCalls = Object.keys(blocks).map(k=>blocks[k]).filter(b=>b.type==='tool_use').map(b=>({ id:b.id, name:b.name, input: safeParseJSON(b.json || '{}', {}) }));
        return { text, toolCalls };
    },

    async _chatStreamOpenAI(messages, opts, p, maxTokens, tools, signal, onDelta){
        const fa = currentLang==='fa';
        if(!p.baseUrl) throw new Error(fa ? 'Base URL برای این ارائه‌دهنده الزامی است.' : 'Base URL is required for this provider.');
        if(!p.model){
            throw new Error(fa
                ? 'برای این ارائه‌دهنده باید نام دقیق مدل را در تنظیمات هوش مصنوعی وارد کنی (مثلاً llama-3.3-70b-versatile، deepseek-chat، یا هر مدلی که آن سرویس ارائه می‌دهد).'
                : 'Enter the exact model name for this provider in AI Settings (e.g. llama-3.3-70b-versatile, deepseek-chat, or whichever model that service offers).');
        }
        const headers = { 'Content-Type':'application/json', 'Authorization':'Bearer '+p.apiKey };
        if(p.id === 'openrouter'){
            headers['HTTP-Referer'] = (typeof location!=='undefined' && location.origin) || 'https://localhost';
            headers['X-Title'] = 'Markhin';
        }
        const oMessages = messages.map(m=>{
            if(m.role === 'tool_result') return { role:'tool', tool_call_id:m.toolCallId, content:String(m.content==null?'':m.content) };
            if(m.role === 'assistant' && Array.isArray(m.toolCalls) && m.toolCalls.length){
                return {
                    role:'assistant',
                    content: m.content || null,
                    tool_calls: m.toolCalls.map(tc=>({ id:tc.id, type:'function', function:{ name:tc.name, arguments: JSON.stringify(tc.input||{}) } }))
                };
            }
            return { role: m.role, content: m.content };
        });
        const body = { model: p.model, max_tokens:maxTokens, messages: oMessages, stream:true };
        if(tools) body.tools = tools.map(t=>({ type:'function', function:{ name:t.name, description:t.description, parameters:t.parameters } }));
        const url = mu_joinApiUrl(p.baseUrl, '/chat/completions');
        const res = await mu_fetchOpenAiCompatible(url, headers, body, signal);
        if(!res.body || !res.body.getReader) throw new Error('stream-unsupported');
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        let textAcc = '';
        let sawAnyEvent = false;
        const toolAcc = {};
        while(true){
            const { done, value } = await reader.read();
            if(done) break;
            buf += decoder.decode(value, { stream:true });
            let nl;
            while((nl = buf.indexOf('\n')) >= 0){
                const line = buf.slice(0, nl).trim();
                buf = buf.slice(nl + 1);
                if(!line || line.indexOf('data:') !== 0) continue;
                const dataStr = line.slice(5).trim();
                if(!dataStr) continue;
                if(dataStr === '[DONE]'){ sawAnyEvent = true; continue; }
                let evt;
                try { evt = JSON.parse(dataStr); } catch(e){ continue; }
                sawAnyEvent = true;
                const choice = evt.choices && evt.choices[0];
                if(!choice) continue;
                const delta = choice.delta || {};
                let deltaText = delta.content;
                if(Array.isArray(deltaText)) deltaText = deltaText.map(part => (part && (part.text||part.content)) || '').join('');
                if(deltaText){
                    textAcc += deltaText;
                    if(onDelta) onDelta(textAcc);
                }
                if(Array.isArray(delta.tool_calls)){
                    delta.tool_calls.forEach(tc=>{
                        const i = tc.index != null ? tc.index : 0;
                        if(!toolAcc[i]) toolAcc[i] = { id:'', name:'', args:'' };
                        if(tc.id) toolAcc[i].id = tc.id;
                        if(tc.function){
                            if(tc.function.name) toolAcc[i].name += tc.function.name;
                            if(tc.function.arguments) toolAcc[i].args += tc.function.arguments;
                        }
                    });
                }
            }
        }
        // Same reasoning as the Anthropic stream: if the response came
        // back 200 OK but we never actually parsed one real SSE event out
        // of it (a provider that ignored stream:true and sent one plain
        // JSON blob, or wrapped chunks in a shape we don't recognize),
        // don't hand the user a silent empty reply — let chat() retry this
        // same request as a plain, non-streamed call instead.
        if(!sawAnyEvent) throw new Error('stream-unsupported');
        const text = textAcc;
        if(!tools) return text;
        const toolCalls = Object.keys(toolAcc).map(k=>toolAcc[k]).filter(t=>t.name).map(t=>({
            id: t.id || ('call_' + Math.random().toString(36).slice(2)),
            name: t.name,
            input: safeParseJSON(t.args || '{}', {})
        }));
        return { text, toolCalls };
    },

    // Queries the provider's own model-listing endpoint so the settings UI
    // can offer a real, clickable list of model ids instead of the person
    // having to copy-paste an exact model string from docs and hope it's
    // spelled right — this is the single most common source of "model not
    // found" errors, so removing the guesswork removes the error at the
    // source. Takes the raw form fields directly (not saved settings) so
    // it works before the person has even hit Save. Anthropic exposes
    // GET /v1/models; every OpenAI-compatible provider (built-in or
    // custom) exposes GET {baseUrl}/models — both used read-only here.
    async fetchModels(fields){
        const fa = currentLang==='fa';
        const apiKey = mu_sanitizeApiKeyValue(fields.apiKey||'').value;
        if(!apiKey) throw new Error(fa ? 'اول یک کلید API وارد کن.' : 'Enter an API key first.');
        const mAiModelsAbort = new AbortController();
        const mAiModelsTimeout = setTimeout(()=>mAiModelsAbort.abort(), 20000);
        try{
            if(fields.format === 'anthropic'){
                const url = mu_joinApiUrl(fields.baseUrl || 'https://api.anthropic.com', '/v1/models');
                const res = await fetch(url, {
                    headers:{
                        'x-api-key': apiKey,
                        'anthropic-version':'2023-06-01',
                        'anthropic-dangerous-direct-browser-access':'true'
                    },
                    signal: mAiModelsAbort.signal
                });
                if(!res.ok){ const tx = await res.text().catch(()=>''); throw new Error('Anthropic ' + mu_extractApiErrorMessage(res.status, tx)); }
                const data = await res.json().catch(()=>({}));
                return (data.data||[]).map(m=>m.id).filter(Boolean);
            }
            if(!fields.baseUrl) throw new Error(fa ? 'اول Base URL را وارد کن.' : 'Enter a Base URL first.');
            const url = mu_joinApiUrl(fields.baseUrl, '/models');
            const res = await fetch(url, { headers:{ 'Authorization':'Bearer '+apiKey }, signal: mAiModelsAbort.signal });
            if(!res.ok){ const tx = await res.text().catch(()=>''); throw new Error(mu_extractApiErrorMessage(res.status, tx)); }
            const data = await res.json().catch(()=>({}));
            const list = Array.isArray(data.data) ? data.data : (Array.isArray(data.models) ? data.models : []);
            return list.map(m=> (typeof m === 'string' ? m : (m.id || m.name || ''))).filter(Boolean);
        } catch(err){
            if(err && err.name === 'AbortError') throw new Error(fa ? 'درخواست فهرست مدل‌ها بیش از حد طول کشید.' : 'Fetching the model list took too long.');
            if(/Failed to fetch|NetworkError|Load failed|ERR_/i.test(String((err&&err.message)||err))){
                throw new Error(fa
                    ? 'این ارائه‌دهنده لیست مدل‌ها را در دسترس نگذاشته یا اجازه دسترسی مستقیم از مرورگر را نمی‌دهد؛ نام مدل را دستی وارد کن.'
                    : "This provider doesn't expose a model list (or doesn't allow direct browser access) — enter the model name manually.");
            }
            throw err;
        } finally {
            clearTimeout(mAiModelsTimeout);
        }
    }
};

function mu_allSearchableItems(){
    return categories.filter(c=> (typeof isArchived!=='function' || !isArchived(c)));
}

function mu_snippet(item, terms){
    if(isNoteLocked(item)) return currentLang==='fa' ? '🔒 یادداشت قفل‌شده' : '🔒 Locked note';
    const plain = (item.text || (item.html ? item.html.replace(/<[^>]+>/g,' ') : '') || '').replace(/\s+/g,' ').trim();
    if(!plain) return '';
    const normPlain = mu_norm(plain);
    let idx=-1;
    for(const term of (terms||[])){ const i=normPlain.indexOf(term); if(i>=0){ idx=i; break; } }
    const start = idx>=0 ? Math.max(0, idx-40) : 0;
    let snippet = plain.slice(start, start+140);
    if(start>0) snippet = '…'+snippet;
    if(start+140<plain.length) snippet += '…';
    return snippet;
}
window.mu_snippet = mu_snippet;

function mu_renderSmartResults(query){
    const box = document.getElementById('muSmartResults'); if(!box) return;
    const {filters, textTerms} = mu_parseQuery(query);
    let items = mu_allSearchableItems();
    if(filters.length) items = items.filter(it=>mu_matchesFilters(it, filters));
    let scored;
    if(textTerms.length) scored = items.map(it=>({item:it, score:mu_scoreItem(it, textTerms)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
    else scored = items.map(it=>({item:it, score:1}));

    if(!scored.length){ box.innerHTML = '<div class="markhin-smart-empty">'+(currentLang==='fa'?'چیزی پیدا نشد.':'Nothing found.')+'</div>'; return; }

    box.innerHTML = scored.slice(0,40).map(({item})=>{
        const snip = mu_snippet(item, textTerms);
        return `<div class="markhin-smart-item" data-id="${escapeHtml(item.id)}">
            <b>${isNoteLocked(item)?'🔒 ':''}${mu_highlightPlain(item.name, textTerms)}</b>
            <div class="snippet">${mu_highlightPlain(snip, textTerms)}</div>
        </div>`;
    }).join('');

    box.querySelectorAll('.markhin-smart-item').forEach(el=>{
        el.onclick = ()=>{ const id=el.dataset.id; closeAdvancedModal(); mu_openAndHighlight(id, textTerms); };
    });
}
window.mu_renderSmartResults = mu_renderSmartResults;

window.mu_onProviderPick = function(value){

    if(modelsBox){ modelsBox.style.display = 'none'; modelsBox.innerHTML = ''; }

// Resolves whichever provider/format is currently selected in the (not

window.mu_fetchAiModelsList = async function(){

/* AI-powered translation of a whole note, using the same configured AI
   provider/API key as AI Summary and AI Tags. Rewrites the note as plain
   translated text (same tradeoff as the existing Google-translate buttons)
   and registers a "Revert to Original" backup the same way they do. */
async function mu_aiTranslateNote(id) {
    const item = categories.find(c => c.id === id); if (!item) return;
    const fa = currentLang === 'fa';
    if (!MarkhinAI.isConfigured()) { mu_openAiSettingsModal(); return; }
    if (isNoteLocked(item) && !unlockedQaIds.includes(id)) { showToast(fa?'ابتدا این یادداشت را از MARKHIN AI (دکمه 🔒) آنلاک کن.':'Unlock this note via the 🔒 button in MARKHIN AI first.'); return; }
    const textEl = document.getElementById('text-' + id);
    if (!textEl) return;
    const sourceText = mu_notePlainText(item).slice(0, 8000);
    if (!sourceText) { showToast(fa?'این یادداشت متنی برای ترجمه ندارد.':'This note has no text to translate.'); return; }

    const target = await mu_pickAiTranslateTarget();
    if (!target) return;

    if (textEl.querySelector('img,audio,canvas,table,a')) {
        const warnMsg = fa
            ? 'ترجمه، تصاویر/صدا/جدول/لینک داخل این یادداشت را حذف می‌کند و فقط متن ساده‌ی ترجمه‌شده باقی می‌ماند. ادامه می‌دهید؟'
            : 'Translating will remove any images, audio, tables, or links in this note, leaving only the translated plain text. Continue?';
        if (!confirm(warnMsg)) return;
    }

    const preTranslateHtml = textEl.innerHTML;
    // Checkpoint the pre-translation state right away, same as regular
    // translate — so Undo reliably steps back to exactly this.
    mu_historyInit(id, preTranslateHtml);
    mu_historyPush(id, preTranslateHtml);
    textEl.innerText = fa ? 'در حال ترجمه با AI... لطفاً شکیبا باشید.' : 'Translating with AI... please wait.';

    const sys = target === 'fa'
        ? 'متن زیر را دقیق و روان به فارسی ترجمه کن. فقط متن ترجمه‌شده را برگردان، بدون هیچ توضیح یا مقدمه‌ای.'
        : 'Translate the following text into fluent, accurate English. Return only the translated text, with no explanation or preamble.';
    try {
        const reply = await MarkhinAI.chat([{role:'system',content:sys},{role:'user',content:sourceText}], {maxTokens:1200});
        if (!reply || !reply.trim()) {
            textEl.innerHTML = preTranslateHtml;
            showToast(fa?'ترجمه‌ای دریافت نشد.':'No translation received.');
            return;
        }
        textEl.innerText = reply.trim();
        item.html = textEl.innerHTML;
        item.text = textWithVisualSpacing(textEl).replace(/\u00a0/g, ' ');
        item.lastEdited = new Date().toUTCString();
        saveToLocalStorage();

        mu_historyPush(id, textEl.innerHTML);
        showToast(fa?'ترجمه با AI انجام شد.':'AI translation done.');
    } catch (err) {
        textEl.innerHTML = preTranslateHtml;
        showToast('⚠️ ' + (err.message || String(err)), 3200);
    }
}

// Exposed on window: this script tag is wrapped in its own IIFE too, so a
